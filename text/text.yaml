      χρῆσθαι μόνον
      δυνατὸς ὃς οἶδε
      τὰς δυνάμεις τῶν
      \col(1)Οὐσιῶν Χρόνου\col(0).
      Ὁ δυνατὸς ὃς
      οἶδε τὰς \col(1)Οὐσίας
      τοῦ Χρόνου\col(0) ὁρᾷ
      ἀσφαλῆ ἀλήθειαν
      διὰ χρόνου καὶ
      τόπου.
      Εἰ δύνασαι
      τοῦτο, \Link
      δύνασαι κωλῦσαι
      τὴν \col(3)Βεράν\col(0)!
      Λαβὲ τοῦτο!

  - name: TX_055b
    index: 0x5b
    text: |-
      \pos(2)\Link, ἡ
      \col(3)Διδυμορόβα\col(0)
      ἐστίν! Ἡ
      \col(3)Διδυμορόβα\col(0)...\stop
      Τίς ἐνόμιζεν
      ὅτι ἡ δεινὴ
      φαρμακὶς
      \col(3)Διδυμορόβα\col(0)
      φανήσεται...
      Τίς ἡ βουλὴ
      αὐτῆς...

  - name: TX_055c
    index: 0x5c
    text: |-
      \pos(2)Πεπλήρωμαι
      λύπης, ὥσπερ
      ἤλπισεν ἡ
      \col(3)Διδυμορόβα\col(0)!
      Ὁ κόσμος
      ἀπόλλυται!\stop
      \jump(TX_0560)
    null_terminator: False

  - name: TX_055f
    index: 0x5f
    text: |-
      \pos(2)\Link,
      οὐκ ὤφειλον
      λέγειν τοῦτο,
      ἀλλά...\stop
      Κόσμος λύπης
      ἐστὶ κόσμος
      ἀπολλύμενος!

  - name: TX_0560
    index: 0x60
    text: |-
      \pos(2)Δεῖ σε κωλῦσαι
      τὴν \col(3)βασίλισσαν
      Ἄμβι\col(0) ἐν τῷ
      \col(3)Μέλανι Πύργῳ\col(0)
      καὶ καταβαλεῖν
      τὴν \col(3)Βεράν\col(0)!
      Δέομαι!

  - name: TX_0561
    index: 0x61
    text: |-
      \pos(2)Τὰ \col(1)Σπέρματα τοῦ
      Ἄνθρακος\col(0) ἐν
      ταύτῃ τῇ \col(1)Πήρᾳ
      Σπερμάτων\col(0)
      δώσουσι φῶς ἐν
      σκοτεινοῖς καὶ
      κατακαύσουσι
      μικρὰ δένδρα ἐκ
      τῆς ὁδοῦ σου.

  - name:
    - TX_0562
    - TX_0563
