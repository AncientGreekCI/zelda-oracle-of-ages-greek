      συμβουλεύειν...\stop
      Ἴσως ἐστί τι
      ἐν τῷ \col(3)Οἴκῳ
      τῆς Ναϋρού\col(4)
      ὃ δύναται
      βοηθῆσαι!
      Διὰ τί οὐκ
      ἀπέρχῃ ἰδεῖν;

  - name:
    - TX_05b2
    - TX_05c2
    index:
    - 0xb2
    - 0xc2
    text: |-
      \Link, ἐκείνη
      ἐστὶν ἡ \col(2)Κινύρα
      τῶν Αἰώνων\col(4)!
      Ἴσως δύνασαι
      χρῆσθαι αὐτῇ
      ἀνοίγειν πύλας
      τοῦ χρόνου καὶ
      πλεῖν δι' αὐτοῦ!\stop
      Τὸ σπήλαιον
      ἔπεσεν ἐν τούτῳ
      τῷ αἰῶνι,
      ἀλλ' ἴσως ἐν
      τῷ παρελθόντι
      δύνασαι εὑρεῖν
      εἴσοδον!

  - name:
    - TX_05b3
    - TX_05c3
    index:
    - 0xb3
    - 0xc3
    text: |-
      \Link!
      Αἰσθάνομαι
      \col(2)Οὐσίαν
      τοῦ Χρόνου\col(4) ἐν
      τῇ \col(3)Μηνειδεῖ
      Νήσῳ\col(4) τῆς νότου
      θαλάσσης!
      Εὑρὲ ὁδὸν ἐκεῖ
      ἀπὸ τοῦ αἰγιαλοῦ
      τῆς πόλεως!

  - name:
    - TX_05b4
    - TX_05c4
    index:
    - 0xb4
    - 0xc4
    text: |-
      \Link! Ἔχεις
      τὸν \col(2)Ἠχοῦντα
      Ὀλολυγμόν\col(4)!
      Ἀλλὰ τὰ πράγματα
      οὐ καλῶς ἔχει.
      Ὁ \col(3)Μέλας Πύργος\col(4)
      ἐγγίζει
      τέλει ἐν τῷ
      παρελθόντι.
      Δεινὰ
      γενήσεται ἐὰν
      μὴ σπεύσῃς.
      Ἀκούω
      \col(2)οὐσίαν\col(4) ἠχοῦσαν
      ἐκ τῶν ὀρέων
      βορειοδυτικῶς
      τῆς \col(3)Πόλεως
      Λύννας\col(4).
      Δύνασαι ἰέναι;

  - name:
    - TX_05b5
    - TX_05c5
    index:
    - 0xb5
    - 0xc5
    text: |-
      Μιμνήσκομαι
      πλεῖον καὶ
      πλεῖον.
      Ἡ ῥάχις πρὸς
      βορρᾶν τοῦ
      \col(3)Οἴκου τῆς
      Ναϋρού\col(4) ὀφείλει
      ἔχειν σχέσιν
      ταῖς \col(2)οὐσίαις\col(4).

  - name:
    - TX_05b6
    - TX_05c6
    index:
    - 0xb6
    - 0xc6
    text: |-
      \Link, τὸ ὄνομά
      σου ἐφάνη ἐν
      παλαιοῖς μύθοις
      τῶν Γορώνων!
      Λέγουσιν περὶ
      μεγάλου δυνατοῦ
      ὃς ἔσωσε
      τοὺς Γόρωνας
      ἐν τῇ ὥρᾳ τῆς
      ἀνάγκης αὐτῶν.
      Τί ἂν τοῦτο
      σημαίνοι;

  - name:
    - TX_05b7
    - TX_05c7
    index:
    - 0xb7
    - 0xc7
    text: |-
      \Link!
      Ἔτι ἀκούω
      \col(2)οὐσίαν\col(4) ἠχοῦσαν
      ἐγγὺς τῆς
      \col(3)Κυλιούσης
      Ῥάχεως\col(4). Ἆ;
      Νομίζω ὅτι
      τις ἦλθεν!

  - name:
    - TX_05b8
    - TX_05c8
    index:
    - 0xb8
    - 0xc8
    text: |-
      \Link! Ἔχω
      ἀγαθὴν
      ἀγγελίαν!!!
      Ἡ \col(3)βασίλισσα
      Ἄμβι\col(4) ἄρτι
      ἐξῆλθεν ἐκ
      τοῦ παλατίου!
      Νῦν ὁ καιρός!\stop
      Ἴσως οὗτός ἐστιν
      ὁ μόνος καιρὸς
      σῶσαι τὴν
      \col(3)Ναϋρού\col(4)!

  - name:
    - TX_05b9
    - TX_05c9
    index:
    - 0xb9
    - 0xc9
    text: |-
      Ἡ σωτηρία τῆς
      \col(3)Ναϋρού\col(4)
      οὐκ ἤρκεσεν...
      Τὰ ἔργα τῆς
      \col(3)Βεράν\col(4)
      ἤλλαξαν
      τὸν κόσμον...
      \Link!
      Οὐ δύναμαι
      ἀκούειν τὴν
      ἐσχάτην \col(2)οὐσίαν\col(4)
      ὅλως...
      Ἀλλὰ δεῖ εἶναί
      που ἐν τῇ
      \col(3)Λαβρύννῃ\col(4).
      Ἐπὶ σοὶ
      ἐλπίζω, \Link.

  - name:
    - TX_05ba
    - TX_05ca
    index:
    - 0xba
    - 0xca
    text: |-
      Εὐχαριστῶ σοι,
      \Link!
      Συνήγαγες
      πάσας τὰς \col(2)Οὐσίας
      τοῦ Χρόνου\col(4)!
      Νῦν δύναμαι
      ποιῆσαί τι ὃ
      βοηθήσει σοι,
      \Link!
      \pos(2)Ἐλθὲ πρός με
      ὅταν αὐξηθῇς!
      Μενῶ σε, οὐδὲν
      μέλει πόσον
      χρόνον!

  - name:
    - TX_05bb
    - TX_05bc
    - TX_05bd
    - TX_05be
    - TX_05bf
    index:
    - 0xbb
    - 0xbc
    - 0xbd
    - 0xbe
    - 0xbf
    text: |-
      Ὁ \Link
      ἐποίησεν.

  - name:
    - TX_05cb
    - TX_05cc
    - TX_05cd
    - TX_05ce
    - TX_05cf
    index:
    - 0xcb
    - 0xcc
    - 0xcd
    - 0xce
    - 0xcf
    text: |-
      Ὁ \Link
      ἐποίησεν.

  - name: TX_05d0
    index: 0xd0
    text: |-
      \pos(2)Οὔ! Οὔ!
      ΕΑΣΑΤΕ ΜΕ!

  - name: TX_05d1
    index: 0xd1
    text: |-
      \pos(2)Ἆ! Οἴμοι!
      Λάβετε αὐτούς!

  - name: TX_05d2
    index: 0xd2
    text: |-
      \pos(2)Βαβαί! Ἦσθα οὕτω
      τολμηρὸς καὶ
      καλός!

  - name: TX_05d3
    index: 0xd3
    text: |-
      Εὐ-εὐχαριστῶ!
      Τίς εἶ;
      \Link! Τί καλὸν
      ὄνομα. Εἰμὶ τὸ
      \col(3)Δένδρον Μακού\col(0).
      Ἦσθα ἀνδρεῖος!
      Ἔλεγον ὅτι ἡ
      Προφῆτις τῶν
      Αἰώνων ἔπεισε
      τὴν \col(3)βασίλισσαν
      Ἄμβι\col(0) κτίσαι
      τὸν \col(3)Μέλανα
      Πύργον\col(0)...
      Ἴσως ἐποίησεν
      αὐτοὺς
      ἐπιθέσθαι μοι.\stop
      Εὐχαριστῶ σοι
      διότι
      ἔσωσάς με!
      Οὐδέποτε
      ἐπιλήσομαι!
      Καὶ ἐπαγγέλλομαι
      ἀποδώσειν σοι
      ὅταν αὐξηθῶ!
      Τοῦτο μόνον
      δύναμαι
      ποιῆσαι νῦν...
      Ἆ-χά!

  - name: TX_05d4
    index: 0xd4
    text: |-
      \pos(2)Ἀγαπητέ!
      ...Ὤ...
      ...ἆ...
      Ὅταν αὐξηθῶ,
      ἔσομαι ἡ
      νύμφη σου!
      Ἆ! Εἶπον τοῦτο!

  - name: TX_05d5
    index: 0xd5
    text: |-
      Ὤ, \Link...

  - name: TX_05d6
    index: 0xd6
    text: |-
      \pos(2)Μέμνησο...
      Ἀποδώσω σοι
      ὅταν αὐξηθῶ!
      Βλέπε ἵνα ἔλθῃς
      πρός με.

  - name: TX_05d7
    index: 0xd7
    text: |-
      Ἀγαπητέ!
      Ἐποίησας! Τοῦτο
      θαυμαστόν ἐστι!
      Νῦν ἡ εἰρήνη
      ὑποστρέψει εἰς
      τὴν \col(3)Λαβρύνναν\col(4)!

- group: 0x06
  data:
  - name: TX_0600
    index: 0x00
    text: |-
      \pos(0)Οἶδα ὅτι
      σκληρόν ἐστιν,
      ἀλλὰ μὴ
      ἀθυμήσῃς. Ἐὰν
      ἔχῃς τὴν ἐλπίδα,
      πέπεισμαι ὅτι
      ὁ πατήρ σου
      παίξει μετὰ σοῦ
      ὡς τὸ πρίν.

  - name: TX_0601
    index: 0x01
    text: |-
      Εὐχαριστῶ σοι
      διότι ἔσωσάς με.
      Τὸ ὄνομά μού
      ἐστι \col(3)Ζέλδα\col(0).
      Σὺ εἶ ὁ \Link,
      ἀληθῶς;
      ᾔδειν εὐθὺς
      ἰδοῦσα.
      Λάβε τοῦτο ὡς
      χάριν διότι
      ἔσωσάς με.

  - name: TX_0602
    index: 0x02
    text: |-
      Ἐξέλθωμεν;

  - name: TX_0603
    index: 0x03
    text: |-
      Λυποῦμαι ὅτι
      ἐποίησά σε
      μεριμνᾶν...
      Ἀλλὰ εἶδον
      τοῦτο...
      Κόσμον πλήρη
      λύπης καὶ
      ἀπογνώσεως...
      Μαρανθέντα!

  - name: TX_0604
    index: 0x04
    text: |-
      \Link,\stop
      τὸ \sym(0x57) ἐπὶ τῆς
      ἀριστερᾶς
      χειρός σου
      σημεῖόν ἐστι
      τοῦ δυνατοῦ.
      Οὐκ ἐάσομεν
      τὴν \col(3)Βεράν\col(0)
      ποιεῖν ὡς
      θέλει! Σὺ
      μόνος δύνασαι
      κωλῦσαι τὴν
      \col(3)Διδυμορόβαν\col(0)
      καὶ σῶσαι τὸν
      κόσμον!\stop
      Δέομαι,
      \Link, δίωξον
      τὸ σκότος
      μακρὰν τῇ
      κραταιᾷ χειρὶ
      σου καὶ φύλαξον
      τὴν γῆν ταύτην!

  - name: TX_0605
    index: 0x05
    text: |-
      Παρέσχον σοι
      πολὺν κόπον.
      Ἀλλ' οὐ δύναμαι
      ἑστάναι ὅτε ὁ
      κόσμος πίπτει
      εἰς τὸ σκότος.
      Δέομαι, σῶσον
      τὴν \col(3)Ναϋρού\col(0)
      ὡς τάχιστα!

  - name: TX_0606
    index: 0x06
    text: |-
      Τὸ σκότος
      οὔπω παρῆλθεν...
      Δεῖ σε κωλῦσαι
      τὴν \col(3)Βεράν\col(0)
      πρὶν τὸ σκότος
      καταπίῃ πάντα!

  - name: TX_0607
    index: 0x07
    text: |-
      Κἀγὼ αἰτῶ τὴν
      βοήθειάν σου.\stop
      Πάντες, οὐ
      μόνον οἱ τούτου
      τοῦ αἰῶνος,
      περιπεσοῦνται
      μεγάλῃ
      ταλαιπωρίᾳ.
      Ἡ \col(3)Ναϋρού\col(0), \col(3)Ἴμπα\col(0)
      καὶ ἐγὼ
      πειράσομεν
      δοῦναι ἰσχὺν
      τῷ λαῷ.
      \Link,
      ἐπὶ σοὶ
      ἐλπίζομεν.

  - name: TX_0608
    index: 0x08
    text: |-
      \pos(2)\Link,
      ἀεὶ ἐλπίζω διὰ
      τὴν ἀσφαλῆ
      ἐπάνοδόν σου.

  - name: TX_0609
    index: 0x09
    text: |-
      ΑΑΑΑΑΑΑΑ!!!

  - name: TX_060a
    index: 0x0a
    text: |-
      Ἠιτησάμην τὴν
      \col(3)Ναϋρού\col(0) ἀγαγεῖν
      με ὧδε. Ἡ \col(3)Ἴμπα\col(0)
      ἐπείρασε
      κωλῦσαί με,
      ἀλλ' οὐ δύναμαι
      ἑστάναι μόνη
      καὶ ποιεῖν
      οὐδέν.

  - name: TX_060b
    index: 0x0b
    text: |-
      Ἄφες με
      ἐπιμελεῖσθαι
      τῶν
      κατοικούντων.
      \Link, δεῖ
      σε ἐπιμελεῖσθαι
      τῆς \col(3)Βεράν\col(0) καὶ
      τοῦ \col(3)Ῥάλφ\col(0)!

- group: 0x07
  data:
  - name: TX_0700
    index: 0x00
    text: |-
      Οἴμοι! Οἴμοι!!!\stop
      Βλέπε ποῦ
      πορεύῃ! Ἄρτι
      ἔπληξας τὴν
      \col(3)Σφένδαμνον\col(0),
      τὴν μαθήτριαν
      τῆς Μεγάλης
      Φαρμακίδος
      Σιρόπης!
      Διὰ σέ, πάντα
      τὰ σκεύη
      ἔπεσεν ἐκ τῆς
      πήρας μου! Ἡ
      Μεγάλη Φαρμακὶς
      ὀργισθήσεται!
      Καὶ δεῖ με
      λαβεῖν τὸ
      \col(1)βιβλίον\col(0). Τίς
      ἂν ἔχοι τοῦτο
      τὸ \col(0x84)\item(0x09)\col(1)βιβλίον\col(0);\stop
      Λοιπόν, τοῦτο
      ὀργίζει με!
      Οὕτως λήψομαι
      καὶ τὰ σά!

  - name: TX_0701
    index: 0x01
    text: |-
      Σὺ πάλιν;\stop
      Διὰ σέ, πάντα
      ἐν τῇ πήρᾳ μου
      ἐξέπτη!
      Δεῖ σε εἶναι
      ἀνδρεῖον ἵνα
      πλήξῃς τὴν
      \col(3)Σφένδαμνον\col(0)
      οὕτως!
      Λήψομαι μόνον
      καὶ τὰ σά!
      Ἰδού!

  - name: TX_0702
    index: 0x02
    text: |-
      Ο-Ι-Μ-Ο-Ι!!!
      Σύ--ΠΑΛΙΝ;
      Ἔχεις τι κατ'
      ἐμοῦ ἤ τί;
      Διὰ σέ, πάντα
      τὰ σκεύη ἐξέπτη
      ἐκ τῆς πήρας
      μου! Λοιπόν,
      λήψομαι καὶ
      τὰ σά!

  - name: TX_0703
    index: 0x03
    text: |-
      Ἆ! Πάντα τὰ
      σκεύη μου ἐξέπτη
      ἐκ τῆς πήρας!
      Λήψομαι καὶ
      ἅτινα ἔρριψας!
      Τοῦτο δείξει
      σοι τί γίνεται
      ὅταν ὀργίσῃς
      τὴν \col(3)Σφένδαμνον\col(0)!

  - name: TX_0704
    index: 0x04
    text: |-
      Οἴμοι...
      Ἦλθες πάλιν;
      Τὰ σκεύη ἐξέπτη
      ἐκ τῆς πήρας
      μου! Δεῖ με
      λαβεῖν καὶ
      ἅτινα ἔρριψας!

  - name: TX_0705
    index: 0x05
    text: |-
      Βλέπομεν
      ἀλλήλους πάλιν!
      Οἶδας τί
      γίνεται! Ὁ
      ταχύτερος νικᾷ.
      Ἕτοιμος..;
      Ἄγε!

  - name: TX_0706
    index: 0x06
    text: |-
      Ἆ χα χα χά! Νῦν
      λυπῇ! Ἔχω
      πλείονα σκεύη
      ἢ πρότερον!
      Ἔρρωσο!

  - name: TX_0707
    index: 0x07
    text: |-
      Σὺ μικρέ--
      Μεμνήσομαι
      τούτου!

  - name: TX_0708
    index: 0x08
    text: |-
      Μμ! Οὐ κακόν!\stop
      Ἀλλὰ τοῦτο
      μόνον λήψῃ
      σήμερον.

  - name: TX_0709
    index: 0x09
    text: |-
      Οἴμοι...\stop
      Βλέπε ποῦ
      περιπατεῖς!
      Ἄρτι ἔπληξας τὴν
      \col(3)Σφένδαμνον\col(0), τὴν
      μαθήτριαν τῆς
      Μεγάλης
      Φαρμακίδος
      Σιρόπης!\stop
      Ὢ τῆς συμφορᾶς!

  - name:
    - TX_070a
    - TX_070b
    index:
    - 0x0a
    - 0x0b
    text: |-
      Τοῦτο
      ἀνταποδίδωσι
      διότι ἔπληξάς
      με! Ἔρρωσο!

  - name: TX_070c
    index: 0x0c
    text: |-
      Ἆ!
      . . . . . . . .\stop
      Ἔρρωσο!\heart

  - name: TX_070d
    index: 0x0d
    text: |-
      Ὦ! Τὸ βιβλίον!

  - name: TX_070e
    index: 0x0e
    text: |-
      Τοῦτό ἐστι τὸ
      \col(0x84)\item(0x09)\col(1)Κατανυκτικὸν
      Βιβλίον\col(0) ὃ δεῖ με
      φέρειν τῇ
      Σιρόπῃ! Διὰ τί
      ἔχεις αὐτό;
      Ἄφες με
      ἀναγνῶναι αὐτό!

  - name: TX_070f
    index: 0x0f
    text: |-
      Τί..;\stop
      Ὤ, οἴμοι...\stop
      .........\stop
      Οὔ! ...........

  - name: TX_0710
    index: 0x10
    text: |-
      Οὐ-ά!\stop
      Ἆ... (φῦ)
      Ὡς κατανυκτικόν!

  - name: TX_0711
    index: 0x11
    text: |-
      Εὐχαριστῶ...
      (φῦ)
      Καλὸν ἦν...
      Λάβε τοῦτο. Ἔστι
      τὸ πρῶτον ὃ
      ἐποίησα.
      Ἡ Σιρόπη
      οὐδέποτε
      ἐπῄνεσέ με
      δι' αὐτό. Ἕξω
      τὸ βιβλίον.

  - name: TX_0712
    index: 0x12
    text: |-
      Οἴμοι...\stop
      Βλέπε ποῦ
      περιπατεῖς!
      Διῆλθον τοῦτον
      τὸν ξένον πόρον
      καὶ ἐπετόμην
      χαίρουσα ὅτε
      συνέβαλές μοι!
      Εἰμὶ \col(3)Σφένδαμνος\col(0),
      μαθήτρια τῆς
      Μεγάλης
      Φαρμακίδος
      Σιρόπης!
      Διὰ τί τοῦτο
      γίνεταί μοι; Ἡ
      Μεγάλη Φαρμακὶς
      τοσοῦτον κακή
      ἐστι. Καὶ
      ἀφείλετό μου τὸ
      \col(1)βιβλίον\col(0)! Ἆρα
      οὐδεὶς ἔχει
      τοῦτο τὸ \col(0x84)\item(0x09)
      \col(1)βιβλίον\col(0);\stop
      Νῦν ἔρχῃ καὶ
      ποιεῖς με ῥῖψαι
      πάντα τὰ
      σκεύη μου!
      Λοιπόν, τοῦτο
      πάνυ ὀργίζει
      με!
      Λήψομαι καὶ
      τὰ σά!

  - name: TX_0713
    index: 0x13
    text: |-
      Οἴμοι...\stop
      Βλέπε ποῦ
      περιπατεῖς!
      Διῆλθον τοῦτον
      τὸν ξένον πόρον
      καὶ ἐπετόμην
      χαίρουσα...
      Τί ποιεῖς
      ὧδε ὅλως;
      Λοιπόν,
      λήψομαι καὶ
      τὰ σά!

- group: 0x08
  data:
  - name: TX_0800
    index: 0x00
    text: |-
      Θέλεις βαλεῖν
      εἰς τὸν σκοπόν;
      10 δραχμαί εἰσι
      μόνον!
        \opt()Ναί \opt()Οὔ

  - name: TX_0801
    index: 0x01
    text: |-
      Δεῖ σοι
      ἐξηγήσεως;
        \opt()Οὔ \opt()Ναί

  - name: TX_0802
    index: 0x02
    text: |-
      Ὡς βούλει...

  - name: TX_0803
    index: 0x03
    text: |-
      Δραχμῶν
      ἐνδεῖ!

  - name: TX_0804
    index: 0x04
    text: |-
      Παῖσον τὰς
      σφαίρας τῷ ξίφει
      πρὸς τοὺς
      σκοπούς. ἕκαστος
      σκοπός ἔχει
      ἄλλον ἀριθμόν.
      Νύμφη   100
      Κυανοῦς  30
      Ἐρυθρὸς -10
      Δαιμόν. -50
      Ἁμαρτία -50
      Τὸ βραβεῖον
      δίδοται κατὰ τὸν
      ἀριθμόν σου μετὰ
      10 βολάς.
      Συνῆκας;
        \opt()Ναί \opt()Οὔ

  - name: TX_0805
    index: 0x05
    text: |-
      Ἄρξωμεν οὖν!
      Ἕτοιμος...

  - name: TX_0806
    index: 0x06
    text: |-
      Μηδέν...
      Οὐαί.

  - name: TX_0807
    index: 0x07
    text: |-
      1 Κυανοῦς...
      30 ἀριθμοί.

  - name: TX_0808
    index: 0x08
    text: |-
      1 Νύμφη...
      100 ἀριθμοί!

  - name: TX_0809
    index: 0x09
    text: |-
      1 Ἐρυθρός...
      -10 ἀριθμοί.

  - name: TX_080a
    index: 0x0a
    text: |-
      1 Δαιμόνιον...
      -50 ἀριθμοί!

  - name: TX_080b
    index: 0x0b
    text: |-
      2 Κυανοῖ...
      60 ἀριθμοί.

  - name: TX_080c
    index: 0x0c
    text: |-
      2 Ἐρυθροί...
      -20 ἀριθμοί.

  - name: TX_080d
    index: 0x0d
    text: |-
      1 Ἐρυθ., 1 Κυαν.
      30 - 10...
      20 ἀριθμοί.

  - name: TX_080e
    index: 0x0e
    text: |-
      1 Κυαν., 1 Νύμφη
      30 + 100...
      130 ἀριθμοί!

  - name: TX_080f
    index: 0x0f
    text: |-
      1 Κυαν., 1 Δαιμ.
      30 - 50...
      -20 ἀριθμοί.

  - name: TX_0810
    index: 0x10
    text: |-
      1 Νύμφη, 1 Ἐρυθ.
      100 - 10...
      90 ἀριθμοί!

  - name: TX_0811
    index: 0x11
    text: |-
      1 Νύμφ., 1 Δαιμ.
      100 - 50...
      50 ἀριθμοί.

  - name: TX_0812
    index: 0x12
    text: |-
      1 Ἐρυθ., 1 Δαιμ.
      -10 - 50...
      -60 ἀριθμοί!

  - name: TX_0813
    index: 0x13
    text: |-
      Τὸ πᾶν ἐστι
      \num1 ἀριθμοί.

  - name: TX_0814
    index: 0x14
    text: |-
      Τὸ πᾶν ἐστι
       \num1 ἀριθμοί.

  - name: TX_0815
    index: 0x15
    text: |-
      350 ἢ πλείονες
      φέρουσι
      \col(1)δακτύλιον\col(0)!

  - name: TX_0816
    index: 0x16
    text: |-
      250 ἢ πλείονες
      φέρουσι
      \col(1)Κάρυον Γασά\col(0)!

  - name: TX_0817
    index: 0x17
    text: |-
      150 ἢ πλείονες
      φέρουσι
      \col(1)30 δραχμάς\col(0)!

  - name: TX_0818
    index: 0x18
    text: |-
      50 ἢ πλείονες
      φέρουσι
      \col(1)καρδίαν\col(0).

  - name: TX_0819
    index: 0x19
    text: |-
      Ἔλαττον 50;
      Πειρῶ πάλιν...

  - name: TX_081a
    index: 0x1a
    text: |-
      Πειρῶ πάλιν διὰ
      10 δραχμάς;
       \opt()Ναί \opt()Οὔ

  - name: TX_081b
    index: 0x1b
    text: |-
      Εὖ γε!
      Λαμβάνεις
      καλὸν γέρας!

  - name: TX_081c
    index: 0x1c
    text: |-
      Πληγή! -50!

- group: 0x09
  data:
  - name: TX_0900
    index: 0x00
    text: ""

  - name: TX_0901
    index: 0x01
    text: |-
      Αἰώνιον Πνεῦμα
      Λαλεῖ διὰ τοῦ
      χρόνου εἰς
      τὴν καρδίαν!

  - name: TX_0902
    index: 0x02
    text: |-
      Ἀρχαῖον Ξύλον
      Λαλεῖ μόνον τὴν
      ἀλήθειαν εἰς ὦτα
      κεκλεισμένα.

  - name: TX_0903
    index: 0x03
    text: |-
      Ἠχῶν Ὀλολυγμός
      Ἠχεῖ μακρὰν διὰ
      τῶν πεδίων ἵνα
      λαλῇ πρὸς τὰς
      ὑπερηφάνους
      καρδίας.

  - name: TX_0904
    index: 0x04
    text: |-
      Φλέγουσα Φλόξ
      Ἀναζωπυρεῖ τὸν
      ζῆλον δυνατοῦ
      ἐντὸς καρδιῶν
      δισταζουσῶν.

  - name: TX_0905
    index: 0x05
    text: |-
      Ἱερὰ Γῆ
      Ἡ θέρμη αὐτῆς
      γινώσκεται ὑπὸ
      πάντων τῶν ἐν γῇ
      ἀναπαυομένων.

  - name: TX_0906
    index: 0x06
    text: |-
      Ἔρημος Κορυφή
      Πνεῦμα ὑψηλὸν ὃ
      μένει βέβαιον
      ἐν καιροῖς
      χαλεποῖς.

  - name: TX_0907
    index: 0x07
    text: |-
      Κυμαίνουσα
      Θάλασσα
      Ἡ ᾠδὴ τῆς
      θαλάσσης ποιεῖ
      κῦμα ὃ φέρει
      τοὺς δυνατοὺς
      εἰς κινδύνους.

  - name: TX_0908
    index: 0x08
    text: |-
      Πίπτων Ἀστήρ\stop
      Τὸ φῶς αὐτοῦ τὸ
      αἰώνιον ὁδηγεῖ
      τὰς ἄλλας
      οὐσίας.

  - name: TX_0909
    index: 0x09
    text: |-
      Ὡρολόγιον
      Φάσματος
      Κουφίζει νόον;

  - name: TX_090a
    index: 0x0a
    text: |-
      Χάρτης
      Καλὸς χάρτης.

  - name: TX_090b
    index: 0x0b
    text: |-
      Δυσώδης Σάκκος
      Σφόδρα δυσώδης.

  - name: TX_090c
    index: 0x0c
    text: |-
      Χρηστὸν Κρέας
      Τὸ ἴδιον οἴκου.

  - name: TX_090d
    index: 0x0d
    text: |-
      Προσωπεῖον Κυνός
      Διὰ φιλόκυνον.

  - name: TX_090e
    index: 0x0e
    text: |-
      Ἁλτήρ
      Ἓν βάρος.

  - name: TX_090f
    index: 0x0f
    text: |-
      Γελοῖος Μύσταξ
      Ξένος πώς...

  - name: TX_0910
    index: 0x10
    text: |-
      Γελοῖον Παίγνιον
      Πάνυ ἀστεῖον.

  - name: TX_0911
    index: 0x11
    text: |-
      Κατανυκτικὸν
      Βιβλίον
      Λόγος λυπηρός.

  - name: TX_0912
    index: 0x12
    text: |-
      Μαγικὴ Κώπη
      Ὄνειρον
      δρομέως.

  - name: TX_0913
    index: 0x13
    text: |-
      Θαλασσία Λύρα
      Ὄζει τῆς
      θαλάσσης.

  - name: TX_0914
    index: 0x14
    text: |-
      Συντριβὲν Ξίφος
      Συντετριμμένον;

  - name: TX_0915
    index: 0x15
    text: |-
      Σπέρμα Μακού
      Ἱερὸν σπέρμα
      καθαίρον τὰ
      πονηρά.

  - name: TX_0916
    index: 0x16
    text: |-
      Κάρυον Γασά
      Φύτευσον ἐν
      τῇ γῇ.

  - name: TX_0917
    index: 0x17
    text: |-
      Μαγικὸς
      Δακτύλιος
      Φέρε ἵνα
      δοκιμάσῃ.

  - name: TX_0918
    index: 0x18
    text: |-
      Πτερύγια τῶν
      Ζώρα
      Πορεύου εἰς τὸν
      αἰγιαλόν.

  - name: TX_0919
    index: 0x19
    text: |-
      Φάρμακον Μαγείας
      Πλήρωσον τὴν
      καρδίαν!

  - name: TX_091a
    index: 0x1a
    text: |-
      Ἄνθος Βόμβου
      Χρῶ εὐλαβῶς!

  - name: TX_091b
    index: 0x1b
    text: |-
      Χειρίδες Ῥίκι
      Φέρε αὐτὰς πρὸς
      τὸν Ῥίκι.

  - name: TX_091c
    index: 0x1c
    text: |-
      Σύμβολον Μέλους
      Ἀνοίγει τὴν
      θύραν!

  - name: TX_091d
    index: 0x1d
    text: |-
      Πυξὶς Δακτυλίων
      Α'
      Χωρεῖ 1
      δακτύλιον.

  - name: TX_091e
    index: 0x1e
    text: |-
      Πυξὶς Δακτυλίων
      Β'
      Χωρεῖ 3
      δακτυλίους.

  - name: TX_091f
    index: 0x1f
    text: |-
      Πυξὶς Δακτυλίων
      Γ'
      Χωρεῖ 5
      δακτυλίους.

  - name: TX_0920
    index: 0x20
    text: |-
      Ξύλινος Θυρεός
      Μικρὸς θυρεός.

  - name: TX_0921
    index: 0x21
    text: |-
      Σιδηροῦς Θυρεός
      Μέγας θυρεός.

  - name: TX_0922
    index: 0x22
    text: |-
      Θυρεὸς τοῦ
      Ἐσόπτρου
      Θυρεὸς
      ἀντανακλῶν.

  - name: TX_0923
    index: 0x23
    text: |-
      Ξύλινον Ξίφος
      Ξίφος δυνατοῦ.

  - name: TX_0924
    index: 0x24
    text: |-
      Εὐγενὲς Ξίφος
      Ἱερὸν ξίφος.

  - name: TX_0925
    index: 0x25
    text: |-
      Κύριον Ξίφος
      Τὸ ξίφος τῶν
      μύθων.

  - name: TX_0926
    index: 0x26
    text: |-
      Βόμβοι
      Σφόδρα
      ἐκρηκτικοί.

  - name: TX_0927
    index: 0x27
    text: |-
      Παλίνδρομον
      Ἀεὶ ὑποστρέφει
      πρὸς σέ.

  - name: TX_0928
    index: 0x28
    text: |-
      Ξίφος τοῦ
      Μεγαγόρωνος
      Ἰσχυρὸν ξίφος
      δυσὶ χερσί.

  - name: TX_0929
    index: 0x29
    text: |-
      Βομβόμυς
      Βόμβος διώκων!

  - name: TX_092a
    index: 0x2a
    text: |-
      Σκαπάνη
      Χρήσιμον σκεῦος.

  - name: TX_092b
    index: 0x2b
    text: |-
      Ψέλιον τῆς
      Δυνάμεως
      Αὐξάνει τὴν
      ἰσχύν.

  - name: TX_092c
    index: 0x2c
    text: |-
      Πτερὸν τοῦ
      Μεγάλου Ὄρνεος
      Καλὸν ἅλμα.

  - name: TX_092d
    index: 0x2d
    text: |-
      Πήρα τῶν
      Σπερμάτων
      Σάκκος διὰ
      σπέρματα.

  - name: TX_092e
    index: 0x2e
    text: |-
      Ξένος Αὐλός
      Σπάνιον ὄργανον.

  - name: TX_092f
    index: 0x2f
    text: |-
      Αὐλὸς τοῦ Ῥίκι
      Αὐλὸς καλῶν
      τὸν Ῥίκι!

  - name: TX_0930
    index: 0x30
    text: |-
      Αὐλὸς τοῦ
      Δημητρίου
      Αὐλὸς καλῶν τὸν
      Δημήτριον!

  - name: TX_0931
    index: 0x31
    text: |-
      Αὐλὸς τοῦ Μούς
      Αὐλὸς καλῶν
      τὸν Μούς!

  - name: TX_0932
    index: 0x32
    text: |-
      Σπέρματα
      Ἄνθρακος
      Φλογερὰ ῥῆξις.

  - name: TX_0933
    index: 0x33
    text: |-
      Σπέρματα Ὀσμῆς
      Θεραπεία ὀσμῆς;

  - name: TX_0934
    index: 0x34
    text: |-
      Σπέρματα Πηγάσου
      Ταχύτης μυθική.

  - name: TX_0935
    index: 0x35
    text: |-
      Σπέρματα θυέλλης
      Ἀνεμώδης ὁδός.

  - name: TX_0936
    index: 0x36
    text: |-
      Σπέρματα
      Μυστηρίου
      Ποιεῖ ἄγνωστα
      ἔργα.

  - name: TX_0937
    index: 0x37
    text: |-
      Σπέρματα
      Ἄνθρακος
      Ῥῆξις πυρός!

  - name: TX_0938
    index: 0x38
    text: |-
      Σπέρματα Ὀσμῆς
      Εὐώδης ῥῆξις!

  - name: TX_0939
    index: 0x39
    text: |-
      Σπέρματα Πηγάσου
      Κλέπτει τάχος;

  - name: TX_093a
    index: 0x3a
    text: |-
      Σπέρματα θυέλλης
      Ἰσχυρὰ πνοή!

  - name: TX_093b
    index: 0x3b
    text: |-
      Σπέρματα
      Μυστηρίου
      Ποιεῖ ἄγνωστα
      ἔργα.

  - name: TX_093c
    index: 0x3c
    text: |-
      Ῥάβδος Σομαρίας
      Ποιεῖ κύβους.

  - name: TX_093d
    index: 0x3d
    text: |-
      Ἄγκιστρον
      Ἀλλαγῆς
      Ἀλλάσσει τόπους
      μετὰ τοῦ σκοποῦ.

  - name: TX_093e
    index: 0x3e
    text: |-
      Μακρὸν Ἄγκιστρον
      Ἀλλάσσει τόπους
      μακρόθεν.

  - name: TX_093f
    index: 0x3f
    text: |-
      Χειρίδες
      Δυνάμεως
      Αἴρουσι μεγάλα.

  - name: TX_0940
    index: 0x40
    text: |-
      Σπερματοβόλος
      Βάλλει σπέρματα
      πανταχοῦ.

  - name: TX_0941
    index: 0x41
    text: |-
      Κινύρα Αἰώνων
      Κινύρα ὁδηγοῦσα
      διὰ τοῦ χρόνου.

  - name: TX_0942
    index: 0x42
    text: |-
      ᾆσμα Ἠχοῦς
      Ἐγείρει τὰς
      πύλας τοῦ
      χρόνου.

  - name: TX_0943
    index: 0x43
    text: |-
      ᾆσμα Ῥευμάτων
      Ἄγει ἐκ τοῦ
      πάλαι εἰς τὸ
      νῦν.

  - name: TX_0944
    index: 0x44
    text: |-
      ᾆσμα Αἰώνων
      Ἄγει ἐλευθέρως
      διὰ τοῦ χρόνου.

  - name: TX_0945
    index: 0x45
    text: |-
      Στολὴ Σειρῆνος
      Τὸ δέρμα τοῦ
      μυθικοῦ θηρίου.

  - name: TX_0946
    index: 0x46
    text: |-
      Σχοινίον Σεβάλ
      Σχοινίον
      ἀπωθοῦν ὕδωρ.

  - name: TX_0947
    index: 0x47
    text: |-
      Πίναξ Νήσου
      Πιστὸς χάρτης
      ναύτου.

  - name: TX_0948
    index: 0x48
    text: |-
      Φυτὸν Ὀσμῆς
      Φέρει καρπὸν
      μακρὸν μετὰ τὴν
      φύτευσιν.

  - name: TX_0949
    index: 0x49
    text: |-
      Σύμβολον
      Ἀδελφότητος
      Σημεῖον διὰ τοὺς
      ἀδελφούς.

  - name: TX_094a
    index: 0x4a
    text: |-
      Κλεὶς Μνημείων
      Κλεὶς μνημείου
      πνεύματος.

  - name: TX_094b
    index: 0x4b
    text: |-
      Κάρυον Τούνι
      Τὸ κάρυον ὃ
      ἰσορροπεῖ
      πάντα.

  - name: TX_094c
    index: 0x4c
    text: |-
      Κλεὶς Στεφάνου
      Κλεὶς ἔχουσα
      σχῆμα στεφάνου.

  - name: TX_094d
    index: 0x4d
    text: |-
      Στηθύνιον Πέτρας
      Γεῦμα χρηστόν.

  - name: TX_094e
    index: 0x4e
    text: |-
      Σκεῦος Γορώνων
      Κειμήλιον.

  - name: TX_094f
    index: 0x4f
    text: |-
      Πόμα Γορώνων
      Δύναμις ἐν ἑνὶ
      πόματι!

  - name: TX_0950
    index: 0x50
    text: |-
      Χυλὸς Πυρός
      Θερμὸν πότον.

  - name: TX_0951
    index: 0x51
    text: |-
      Κλεὶς Σειρῆνος
      Μικρὰ κλεὶς μετὰ
      σχήματος
      σειρῆνος.

  - name: TX_0952
    index: 0x52
    text: |-
      Παλαιὰ Κλεὶς
      Σειρῆνος
      Ἀρχαία κλείς.

  - name: TX_0953
    index: 0x53
    text: |-
      Κλεὶς τῆς
      Βιβλιοθήκης
      Κλεὶς μεγάλης
      γνώσεως.

  - name: TX_0954
    index: 0x54
    text: |-
      Λεπὶς τῶν Ζώρα
      Χάρις τῆς
      θαλάσσης.

  - name: TX_0955
    index: 0x55
    text: |-
      Πλὰξ Λίθου
      Μία ἐκ τεσσάρων.

  - name: TX_0956
    index: 0x56
    text: |-
      Σύστασις
      Ἐπιστολὴ πρὸς
      τὸν χορεύοντα
      Γόρωνα.

  - name: TX_0957
    index: 0x57
    text: |-
      Κλασθὲν Κάρυον
      Τούνι
      Κάρυον δέον
      ἐπανορθώσεως.

  - name: TX_0958
    index: 0x58
    text: |-
      Βιβλίον τῶν
      Σφραγίδων
      Ἀληθὴς δοκιμασία
      θάρρους.

  - name: TX_0959
    index: 0x59
    text: |-
      Κόνις Νυμφῶν
      Κόνις μαγικῶς
      δυνατή.

  - name:
    - TX_095a
    - TX_095b
    - TX_095c
    - TX_095d
    - TX_095e
    - TX_095f
    index:
    - 0x5a
    - 0x5b
    - 0x5c
    - 0x5d
    - 0x5e
    - 0x5f
    text: |-
      Ὀφθαλμὸς Τοκαίων
      Θησαυρὸς τοῦ
      βάθους!

  - name: TX_0960
    index: 0x60
    text: |-
      Πίναξ Σωτηρίας
      Πορεύου εἰς τὸν
      Πίνακα Σωτηρίας.

  - name: TX_0961
    index: 0x61
    text: |-
      Μέρη Καρδίας
      4 ποιοῦσι
      Σκεῦος Καρδίας.

  - name: TX_0962
    index: 0x62
    text: |-
      Μέρη Καρδίας
      3 ἔτι ποιοῦσι
      Σκεῦος Καρδίας.

  - name: TX_0963
    index: 0x63
    text: |-
      Μέρη Καρδίας
      2 ἔτι ποιοῦσι
      Σκεῦος Καρδίας.

  - name: TX_0964
    index: 0x64
    text: |-
      Μέρη Καρδίας
      1 ἔτι ποιεῖ
      Σκεῦος Καρδίας.

  - name: TX_0965
    index: 0x65
    text: |-
      Ὁ νῦν χρόνος
      ἐστὶ τὸ νῦν.

  - name: TX_0966
    index: 0x66
    text: |-
      Ὁ νῦν χρόνος
      ἐστὶ τὸ πάλαι.

- group: 0x0a
  data:
  - name: TX_0a00
    index: 0x00
    text: |-
      \sfx(0xb6)Δεῖ βε ἕψειν
      τὸ δεῖπνον πᾶσι
      τοῖς Τοκαίοις,
      ἀλλ' ἡ ῥίς βου
      βέβυσται. Ἐὰν
      ἕψω, κακῶς
      γεύσεται.

  - name: TX_0a01
    index: 0x01
    text: |-
      Δώσεις αὐτῷ τὸν
      \col(0x84)\item(0x03)\col(1)Δυσώδη Σάκκον\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_0a02
    index: 0x02
    text: |-
      Ἆ; Τί τοῦτό
      ἐστιν;

  - name: TX_0a03
    index: 0x03
    text: |-
      Ῥρρρῆξις!
      ...ὀσφρρρ!

  - name: TX_0a04
    index: 0x04
    text: |-
      \sfx(0xb6)Βαβαί!!!

  - name: TX_0a05
    index: 0x05
    text: |-
      \sfx(0xb6)Φεῦ, φεῦ!\stop
      Ἡ ὀσμὴ αὕτη!!!\stop
      Ὢωωωωω!!!\stop
      Βαβαίιιιι!!!

  - name: TX_0a06
    index: 0x06
    text: |-
      \sfx(0xb6)Τί ἦν τοῦτο;
      Ἡ ῥίς μου
      δάκνει!
      Δυσῶδες ἦν!\stop
      ...;!;
      Δυσῶδες;!;\stop
      Ἡ ὀσμὴ ἐκείνη!
      Ἐκαθάρισε τὴν
      ῥῖνά μου!
      Εὐχαριστῶ!
      Ὁ \col(0x84)\item(0x03) \col(1)σάκκος\col(0)
      ἔλυσέ με!
      Δεῖ μοι ἔχειν!
      Ἀλλάξω σοι
      τι ἀγαθὸν
      ἀντ' αὐτοῦ!

  - name: TX_0a07
    index: 0x07
    text: |-
      \sfx(0xb6)Ὤ! Ἐπιλείπει
      τὰ τοῦ δείπνου!
      Εἶεν.

  - name: TX_0a08
    index: 0x08
    text: |-
      \sfx(0xb6)Ὢ ἡ ῥίς μου...

  - name: TX_0a09
    index: 0x09
    text: |-
      \sfx(0xb6)Δεῖ βε ἰσχυρᾶς
      ὀσβῆς ἵνα
      καθαρίσω τὴν
      ῥῖνά βου.

  - name: TX_0a0a
    index: 0x0a
    text: |-
      \sfx(0xb6)Εὗρον τοῦτο
      παρὰ τῇ θαλάσσῃ.
      Ἦν παρὰ Τοκαίῳ
      μὴ ἔχοντι
      κέρκον. Ὦ! Σὺ
      οὐκ ἔχεις
      κέρκον ὡσαύτως.\stop
      ...Ὤ.
      Ἆρα τοῦτο...\stop
      Ἆ, λάβε τοῦτο.
      Ἐγώ... ἐγὼ οὐ
      χρῄζω αὐτοῦ.

  - name: TX_0a0b
    index: 0x0b
    text: |-
      \sfx(0xb6)Ὦ! Σὺ εἶ ἐκεῖνος
      ὃν ἐγώ...\stop
      Ἆ, χαίρω ὅτι
      ἦλθες.
      Ἐλογιζόμην
      ὅτι ἴσως δεῖ
      με κρυφθῆναι--
      λέγω, ἴσως
      δεῖ με ἀποδοῦναι
      τοῦτό σοι.
      Ἰδού!

  - name: TX_0a0c
    index: 0x0c
    text: |-
      \sfx(0xb6)Τοῦτο μόνον
      ἔλαβον, ἀλλ'
      ἴσως
      ἄλλοι Τοκαῖοι
      ἔλαβον
      πράγματα. Ἀλλ'
      ἴσως οὔ. Ἴσως
      δεῖ σε ζητεῖν
      πέριξ.

  - name: TX_0a0d
    index: 0x0d
    text: |-
      \sfx(0xb6)Πεινῶ!

  - name: TX_0a0e
    index: 0x0e
    text: |-
      \sfx(0xb6)Ὢωω-βαβαί!!!

  - name: TX_0a0f
    index: 0x0f
    text: |-
      \sfx(0xb6)Ἔασόν με!\stop
      Ἐγὼ οὐκ οἶδα
      ...οὐδέν;
      Λέγω ὅτι
      ἀθῷός εἰμι!
      Οὐκ οἶδα
      τίνος ἡ \col(1)σκαπάνη\col(0)
      ἐστίν!

  - name: TX_0a10
    index: 0x10
    text: |-
      \sfx(0xb6)Χαῖρε εἰς τὸ
      Τοκαῖον Ἄγριον,
      τὸ παίγνιον πᾶσι
      τοῖς Τοκαίοις!
      Τὸ ἆθλον
      σήμερον...τοῦτο!

  - name: TX_0a11
    index: 0x11
    text: |-
      Εἰ βούλει τοῦτο,\n
    null_terminator: False

  - name: TX_0a12
    index: 0x12
    text: |-
      παῖξον τὸ
      Τοκαῖον
      Ἄγριον!
      Δεῖ δοῦναι
      10 δραχμάς.
        \opt()Ναί \opt()Οὔ

  - name: TX_0a13
    index: 0x13
    text: |-
      Εἰ βούλει τοῦτο
      \col(1)Φυτὸν Ὀσμῆς\col(0),
      \jump(TX_0a12)
    null_terminator: False

  - name: TX_0a14
    index: 0x14
    text: |-
      Βούλει ἀκοῦσαι
      τοὺς νόμους;
        \opt()Οὔ \opt()Ναί

  - name: TX_0a15
    index: 0x15
    text: |-
      Ἄρξωμεν οὖν!

  - name: TX_0a16
    index: 0x16
    text: |-
      Ἕτοιμος;\stop
      Ἄγε!

  - name: TX_0a17
    index: 0x17
    text: |-
      Φεῦ!

  - name: TX_0a18
    index: 0x18
    text: |-
      Συγχαίρω!\stop
      Λάβε τὸ ἆθλον!

  - name: TX_0a19
    index: 0x19
    text: |-
      Δὸς 10 δραχμὰς
      παῖξαι πάλιν!
        \opt()Ναί \opt()Οὔ

  - name: TX_0a1a
    index: 0x1a
    text: |-
      Εἶεν...
      Ἔρχου αὖθις.

  - name: TX_0a1b
    index: 0x1b
    text: |-
      Οὐκ ἔχεις
      ἱκανὰς δραχμάς!

  - name: TX_0a1c
    index: 0x1c
    text: |-
      \sfx(0xb6)Τοῦτό ἐστι τὸ
      Τοκαῖον Ἄγριον,
      παίγνιον ὑγιέσι
      Τοκαίοις. Οὐ
      παίξεις εἰ μὴ
      αἴρεις κρέας.

  - name: TX_0a1d
    index: 0x1d
    text: |-
      \sfx(0xb6)Οὗτος ὁ μέγας
      ἰχθὺς ἐξεβράσθη!
      Φαίνεται νέος
      καὶ χρηστός!

  - name: TX_0a1e
    index: 0x1e
    text: |-
      \sfx(0xb6)Ὁ ἐρυθρὸς ἰχθὺς
      σφόδρα ἥδιστον
      γεῦμα ἔχει.

  - name: TX_0a1f
    index: 0x1f
    text: |-
      \sfx(0xb6)Εὕρομεν τοῦτον
      τὸν ἰχθὺν τοῦτον
      Πάνυ ποθοῦμεν
      γεύσασθαι τῆς
      ἡδονῆς αὐτοῦ.

  - name: TX_0a20
    index: 0x20
    text: |-
      \sfx(0xb6)Ὦ! Τίνα ἐστὶ τὰ
      ἐρυθρὰ \col(1)σπέρματα\col(0)
      ἅ ἔχεις;
      \col(1)Σπέρματα
      τοῦ Ἄνθρακος\col(0);
      Ὢ ὀνόματος
      καλοῦ!\n
    null_terminator: False

  - name: TX_0a21
    index: 0x21
    text: |-
      Ἀλλάξεις
      \col(1)Σπέρματα
      τοῦ Ἄνθρακος\col(0)
      ἀντὶ
      τοῦ ἰχθύος ἡμῶν;
        \opt()Ναί \opt()Οὐδαμῶς

  - name: TX_0a22
    index: 0x22
    text: |-
      \sfx(0xb6)Ἄρα οἶμαι ὅτι
      οὗτος ὁ ἐρυθρὸς
      ἰχθὺς ἀρκέσει.

  - name: TX_0a23
    index: 0x23
    text: |-
      \sfx(0xb6)Συντίθεμαι!
      Πάνυ ποθῶ
      γεύσασθαι αὐτοῦ!

  - name: TX_0a24
    index: 0x24
    text: |-
      \sfx(0xb6)Κλάκ!
      Μάσα, μάσα!
      ................\stop
      !!!

  - name: TX_0a25
    index: 0x25
    text: |-
      \sfx(0xb6)ΘΕΡΜΟΝ!!!
      ΦΛΕΓΕΙ!

  - name: TX_0a26
    index: 0x26
    text: |-
      Δὸς κρέας ἑκάστῳ
      Τοκαίῳ ὃς τρέχει
      παρ' ἀριστερὰν
      καὶ δεξιάν.
      Ἐὰν δῷς κρέας
      ἑκάστῳ, νικᾷς!
      Ἐὰν παραλίπῃς
      καὶ ἕνα, ἡττᾷ.
      Συνίης;
        \opt()Ναί \opt()Οὔ

  - name: TX_0a27
    index: 0x27
    text: |-
      \pos(2)\sfx(0xb6)Πρῶτον δός μοι
      τὸν \col(1)κρίκον\col(0) μου.
      Εἶτα λήψῃ τὴν
      \col(1)σκαπάνην\col(0) σου.
        \opt()Εἶεν \opt()Οὔπω

  - name: TX_0a28
    index: 0x28
    text: |-
      \pos(2)Ἰδοὺ οὖν
      τὸ σόν.

  - name: TX_0a29
    index: 0x29
    text: |-
      \pos(2)Καθέξω οὖν
      τὸ σόν.

  - name: TX_0a2a
    index: 0x2a
    text: |-
      \sfx(0xb6)Εὗρον ἐκεῖνο τὸ
      \col(1)πτερόν\col(0). Λήψῃ
      αὐτὸ ἀντὶ 10
      \col(1)Σπερμάτων Μυστ.\col(0)

  - name: TX_0a2b
    index: 0x2b
    text: |-
      \pos(2)\call(TX_0a2a)\stop
      10 \col(1)Σπέρματα
      Μυστ.\col(0)
        \opt()Ἄλλαξον \opt()Οὔ

  - name: TX_0a2c
    index: 0x2c
    text: |-
      \pos(2)\call(TX_0a2a)\stop
      Οὐκ ἔχεις
      \col(1)Σπέρματα Μυστ.\col(0);
      Οὐκοῦν ἀλλάξω
      ἀντὶ τῆς σῆς
      \col(1)σκαπάνης\col(0).
        \opt()Ἄλλαξον \opt()Οὔ

  - name: TX_0a2d
    index: 0x2d
    text: |-
      \pos(2)Εἶεν.

  - name: TX_0a2e
    index: 0x2e
    text: |-
      \pos(2)Οὐκ ἔχεις ἱκανὰ
      \col(1)σπέρματα\col(0)!

  - name: TX_0a2f
    index: 0x2f
    text: |-
      \pos(2)Ἔρχου πάλιν εἰ
      βούλει ἀλλάξαι.

  - name: TX_0a30
    index: 0x30
    text: |-
      \pos(2)\sfx(0xb6)Πρῶτον δός μοι
      τὸ \col(1)πτερόν\col(0) μου.
      Εἶτα λήψῃ τὴν
      \col(1)σκαπάνην\col(0) σου.
        \opt()Εἶεν \opt()Οὔπω

  - name: TX_0a31
    index: 0x31
    text: |-
      \pos(2)\sfx(0xb6)Οὗτος ὁ \col(1)κρίκος\col(0)
      ὃν εὗρον. Ἀλλάξω
      αὐτὸν ἀντὶ 10
      \col(1)Σπερμ. Ὀσμῆς\col(0).

  - name: TX_0a32
    index: 0x32
    text: |-
      \pos(2)\call(TX_0a31)\stop\n
    null_terminator: False

  - name: TX_0a3c
    index: 0x3c
    text: |-
      10 \col(1)Σπέρμ. Ὀσμῆς\col(0)
        \opt()Ἄλλαξον \opt()Οὔ

  - name: TX_0a33
    index: 0x33
    text: |-
      \pos(2)\call(TX_0a31)\stop
      Οὐκ ἔχεις
      \col(1)Σπέρματα Ὀσμῆς\col(0);
      Οὐκοῦν ἀλλάξω
      ἀντὶ τῆς σῆς
      \col(1)σκαπάνης\col(0).
        \opt()Ἄλλαξον \opt()Οὔ

  - name: TX_0a34
    index: 0x34
    text: |-
      \pos(2)Οὐκ ἔχεις ἱκανὰ
      \col(1)σπέρματα\col(0)!

  - name: TX_0a35
    index: 0x35
    text: |-
      \pos(2)\sfx(0xb6)Ἀποδώσω σοι τὴν
      \col(1)σκαπάνην\col(0) σου ἐὰν
      ἀποδῷς μοι τὸν
      \col(1)κρίκον\col(0) μου.
        \opt()Εἶεν \opt()Οὔπω

  - name: TX_0a36
    index: 0x36
    text: |-
      \pos(2)\sfx(0xb6)Ἀποδώσω σοι τὴν
      \col(1)σκαπάνην\col(0) σου ἐὰν
      ἀποδῷς μοι τὸ
      \col(1)πτερόν\col(0) μου.
        \opt()Εἶεν \opt()Οὔπω

  - name: TX_0a37
    index: 0x37
    text: |-
      \pos(2)\sfx(0xb6)Ἐὰν βούλῃ τι,
      δυνάμεθα
      ἀλλάξαι.

  - name: TX_0a38
    index: 0x38
    text: |-
      \pos(2)\sfx(0xb6)Οὐδὲν ἄλλο ἔχω
      πρὸς ἀλλαγήν.

  - name: TX_0a39
    index: 0x39
    text: |-
      \pos(2)\sfx(0xb6)Εὗρον τοῦτο τὸ
      \col(1)ξένον ξύλον\col(0) πρὸς
      τῇ ἀκτῇ.
      \jump(TX_0a3c)
    null_terminator: False

  - name: TX_0a3a
    index: 0x3a
    text: |-
      \pos(2)Ἤδη ἔχεις ἕν.\stop
      Οὐ δύναμαι
      δοῦναί σοι ἄλλο.

  - name: TX_0a3b
    index: 0x3b
    text: |-
      Ἔχεις πάντα τὰ
      πράγματά σου!!!

  - name:
    - TX_0a3d
    - TX_0a3e
    - TX_0a3f
    - TX_0a40
    index:
    - 0x3d
    - 0x3e
    - 0x3f
    - 0x40
    text: |-
      \sfx(0xb6)Οὗτος ὁ καλὸς
      κῆπος φυτῶν.
      Λέγουσιν ὅτι
      \col(1)Δένδρον Ὀσμῆς\col(0)
      ἐφυτεύθη ὧδε
      πάλαι. Εἰ εἶχον
      \col(1)φυτόν\col(0), ἂν
      ἐφύτευον ὧδε.

  - name: TX_0a41
    index: 0x41
    text: |-
      \sfx(0xb6)Ὦ! Ἔστι τοῦτο τὸ
      \col(1)Φυτὸν τῆς Ὀσμῆς\col(0);
      Φυτεύσωμεν αὐτό!

  - name: TX_0a42
    index: 0x42
    text: |-
      ...Ἆ;
      Τί πάσχεις;
      Οὐ μέλλει
      αὐξηθῆναι
      εὐθύς.
      Δεῖ πολὺν χρόνον
      πρὶν ἢ τὸ
      \col(1)σπέρμα\col(0) γένηται
      δένδρον. Μὴ
      φοβοῦ.\n
    null_terminator: False

  - name: TX_0a43
    index: 0x43
    text: |-
      Ἐπιμελήσομαι
      αὐτοῦ, οὖν
      ἔρχου πάλιν μετὰ
      πολὺν χρόνον.

  - name: TX_0a44
    index: 0x44
    text: |-
      \sfx(0xb6)Μετὰ μακρὸν
      χρόνον, ἔσται
      μέγα \col(1)Δένδρον
      Ὀσμῆς\col(0) ὧδε.

  - name: TX_0a45
    index: 0x45
    text: |-
      \sfx(0xb6)Τοῦτό ἐστι τὸ
      Μουσεῖον τοῦ
      Τοκαίου Ἀγρίου.
      Χρῄζεις τινός;
        \opt()Ναί \opt()Οὔ

  - name: TX_0a46
    index: 0x46
    text: |-
      \sfx(0xb6)Οὐκοῦν χαῖρε
      τῇ ἐπιδείξει.

  - name: TX_0a47
    index: 0x47
    text: |-
      \sfx(0xb6)Ὦ! Τοῦτό ἐστι τὸ
      \col(1)μυστήριον\col(0) τοῦ
      Τοκαίου Ἀγρίου!
      Νῦν βούλομαι
      ἀνανεῶσαι τὸ
      Τοκαῖον Ἄγριον!
      Βοηθήσεις;
        \opt()Ναί \opt()Οὐδαμῶς

  - name: TX_0a48
    index: 0x48
    text: |-
      \sfx(0xb6)Οὐ συνίημι...

  - name: TX_0a49
    index: 0x49
    text: |-
      \sfx(0xb6)Ἔρχου πάλιν ἐὰν
      βούλῃ ποιεῖν.

  - name: TX_0a4a
    index: 0x4a
    text: |-
      \sfx(0xb6)Τὸ Τοκαῖον
      Ἄγριον
      ἑορτὴ ἦν ἐν τῇ
      \col(3)Μηνειδεῖ Νήσῳ\col(0).
      Οἶδας τοὺς
      νόμους;
        \opt()Ναί \opt()Οὔ

  - name: TX_0a4b
    index: 0x4b
    text: |-
      Δὸς κρέας ἑκάστῳ
      Τοκαίῳ ὃς τρέχει
      παρ' ἀριστερὰν ἢ
      δεξιάν. Ἐὰν δῷς
      κρέας πᾶσι,
      νικᾷς! Ἐὰν δὲ
      παραλίπῃς καὶ
      ἕνα, ἡττᾷ.
      Συνίης;
        \opt()Ναί \opt()Οὔ

  - name: TX_0a4c
    index: 0x4c
    text: |-
      Ἄρξωμεν οὖν!
      Ἐὰν ποιήσῃς εὖ,
      λήψῃ τοῦτο!

  - name: TX_0a4d
    index: 0x4d
    text: |-
      Φεῦ.
      Βούλει παῖξαι
      πάλιν;
        \opt()Ναί \opt()Οὔ

  - name:
    - TX_0a4e
    - TX_0a52
    index:
    - 0x4e
    - 0x52
    text: |-
      Ἔρχου πάλιν
      ἀεί!

  - name: TX_0a4f
    index: 0x4f
    text: |-
      Νικᾷς!
      Ἐτέλεσας τὸ
      Τοκαῖον Ἄγριον!
      Ἰδού! Λάβε
      τοῦτο!

  - name: TX_0a50
    index: 0x50
    text: |-
      \sfx(0xb6)Διδάξω σοι τὸ
      \col(1)μυστήριον\col(0) τοῦ
      φέρειν πλείονας
      \col(1)βόμβους\col(0) ἐν
      τῷ \col(3)Ὁλόδρουμ\col(0).\stop
      \secret1\stop
      Ἔρχου ἐὰν
      ἐπιλάθῃ!

  - name:
    - TX_0a51
    - TX_0a53
    - TX_0a54
    - TX_0a55
    - TX_0a56
    - TX_0a57
    - TX_0a58
    - TX_0a59
    - TX_0a5a
    - TX_0a5b
    - TX_0a5c
    - TX_0a5d
    - TX_0a5e
    - TX_0a5f
    index:
    - 0x51
    - 0x53
    - 0x54
    - 0x55
    - 0x56
    - 0x57
    - 0x58
    - 0x59
    - 0x5a
    - 0x5b
    - 0x5c
    - 0x5d
    - 0x5e
    - 0x5f
    text: |-
      \sfx(0xb6)Βούλει παῖξαι
      τὸ Τοκαῖον
      Ἄγριον;
        \opt()Ναί \opt()Οὔ

  - name: TX_0a60
    index: 0x60
    text: |-
      \sfx(0xb6)Ἦν \col(1)Δένδρον Ὀσμῆς\col(0)
      ὧδε πάλαι.
      Εἰ ἐφύτευες
      \col(1)φυτὸν\col(0) νῦν, ἔδει
      ἂν ἑκατὸν ἔτη
      τοῦ αὐξηθῆναι.

  - name: TX_0a61
    index: 0x61
    text: |-
      \sfx(0xb6)Θὲς \col(1)σπέρματα
      ἀμπέλου\col(0) πρὸς
      ξένοις τείχεσιν
      ἀγαθῆς τύχης
      ἕνεκεν.

  - name: TX_0a62
    index: 0x62
    text: |-
      \sfx(0xb6)Ἔστι τόπος ὡς
      οὗτος ἐν τῷ
      δυτικῷ μέρει
      τῆς νήσου.

  - name: TX_0a63
    index: 0x63
    text: |-
      \sfx(0xb6)Ὁ φύλαξ ἡμῶν
      ἐν τῷ μέσῳ τῆς
      νήσου. Ὅτε ὁ
      ἥλιος ἀναβαίνει
      εἰς τὸν οὐρανόν,
      ἡ θάλασσα
      εἰσέρχεται καὶ
      οὐ δύνασαι
      ἐλθεῖν πρὸς
      αὐτόν.

  - name: TX_0a64
    index: 0x64
    text: |-
      \sfx(0xb6)Ἕν, δύο, τρία!
      Ἆρα τοῦτο πολύ;
      Δεῖ με μαθεῖν
      τοὺς ἀριθμούς.

  - name: TX_0a65
    index: 0x65
    text: |-
      \sfx(0xb6)Ἔστι σκολιὸς
      λαβύρινθος
      ὑποκάτω τῆς
      νήσου. Ἴσως.

  - name: TX_0a66
    index: 0x66
    text: |-
      \sfx(0xb6)Λέγεται ὅτι
      πάλαι, Τοκαῖός
      τις ἄνευ κέρκου
      ἤνοιξε τὸ στόμα
      τοῦ φύλακος
      ἡμῶν.

  - name: TX_0a67
    index: 0x67
    text: |-
      \sfx(0xb6)Τοῦτό ἐστι τὸ
      Μουσεῖον τοῦ
      Τοκαίου Ἀγρίου.
      Ἐπαίζομεν ὧδε
      πάλαι, ἀλλ' οὐ
      νῦν. Οἱ Τοκαῖοι
      παρ' ἀριστερὰν
      καὶ δεξιὰν
      ἀληθεῖς εἰσιν...
      Λέγω φαινομένους
      ὡς ἀληθεῖς.
      Οὐκ
      ἀποκρινοῦνται
      σοι ἐὰν λαλῇς
      αὐτοῖς.

  - name: TX_0a68
    index: 0x68
    text: |-
      \sfx(0xb6)Εὗρον τοῦτο τὸ
      \col(1)ξύλον\col(0) πρὸς τῇ
      θαλάσσῃ. Ξένον
      ἐστίν. Ἔμενον
      ὧδε ἐπὶ πολὺν
      χρόνον, ἀλλ' ὁ
      δεσπότης οὐκ
      ἦλθε λαβεῖν.
      Ἆ, νομίζω ὅτι
      δύνασαι ἔχειν.
      Ἔτριβον αὐτὸ
      ἐπὶ πολλὰ ἔτη,
      ὥστε λαμπρόν
      ἐστιν.

  - name: TX_0a69
    index: 0x69
    text: |-
      \sfx(0xb6)Ἐὰν ἀπαντήσῃς
      τῷ ἀπολέσαντι
      αὐτό, μὴ μνησθῇς
      περὶ ἐμοῦ! Οὐ
      χρῄζω χάριτος.

  - name: TX_0a6a
    index: 0x6a
    text: |-
      \sfx(0xb6)Ὦ! Σύ!
      Ἄκουσόν μου!
      Δεῖ πολὺν χρόνον
      τοῖς δένδροις
      αὐξηθῆναι.
      Ὡσαύτως καὶ
      τῇ ἀμπέλῳ καθ'
      ἧς κατέβης.

  - name: TX_0a6b
    index: 0x6b
    text: |-
      \sfx(0xb6)Δεῖ πολὺν χρόνον
      τοῖς δένδροις
      αὐξηθῆναι.
      Ὡσαύτως καὶ
      τῷ σπέρματι
      τῆς ἀμπέλου.

  - name: TX_0a6c
    index: 0x6c
    text: |-
      \sfx(0xb6)Αὕτη ἐστὶν ἡ
      \col(3)Μηνειδὴς Νῆσος\col(0).
      Οὐδέποτε εἶδον
      Τοκαῖον ὡς σέ.
      Ἔχεις ὦτα. Ἆρα
      εἶ Τοκαῖος
      μακρόωτος;

- group: 0x0b
  data:
  - name: TX_0b00
    index: 0x00
    text: |-
      \pos(0)Τέλος ἦλθέν τις!
      Ἡ στήλη αὕτη
      φράσσει τὴν ὁδόν
      μου εἰς Ἅιδου.
      Ὑποκάτω ὧδέ
      εἰμι, ναί; Χάριν
      ἕξω σοι ἐὰν
      βοηθήσῃς μοι.

  - name: TX_0b01
    index: 0x01
    text: |-
      \pos(2)Ἐκίνησας τὴν
      στήλην μου! Νῦν
      δύναμαι ἀπελθεῖν
      εἰς Ἅιδου. Ἡ
      καρδία μου
      χαίρει ἐπὶ
      τούτῳ!
      Εὐχαριστῶ!

  - name: TX_0b02
    index: 0x02
    text: |-
      \pos(0)Ἐξῆλθες! Ἐπεὶ
      ἀπέρχομαι,
      οὐκέτι
      χρῄζω τούτου.
      Λάβε αὐτό!
      Ἐλπίζω καὶ σὲ
      φθάσαι εἰς
      Ἅιδου ταχέως!

  - name: TX_0b03
    index: 0x03
    text: |-
      Οὐ καλὸν τοῦτο!\stop
      Θέλω ἀγαγεῖν τὰς
      ἐπιστολὰς ἐν
      καιρῷ, ἀλλ' οὐ
      δύναμαι ἐὰν μὴ
      εἰδῶ τὴν ὥραν!

  - name: TX_0b04
    index: 0x04
    text: |-
      Δεῖξον αὐτῷ τὸ
      \col(0x84)\item(0x01)\col(1)Ὡρολόγιον
      Φάσματος\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_0b05
    index: 0x05
    text: |-
      Ἆ; Τίκ, τόκ;
      Δηλοῖ τὴν ὥραν!
      Δίδως μοι τοῦτο
      τὸ ὡρολόγιον;
      Μηδὲν εἴπῃς!
      Πάντως δώσεις!
      Μεγάλη βοήθεια!
      Ἰδοὺ ὁ μισθός
      σου. Νῦν ἄπειμι
      εἰς τὸ ἔργον.
      Φιλεργός εἰμι!

  - name: TX_0b06
    index: 0x06
    text: |-
      Τί σύ...
      Φεῦ!!!

  - name: TX_0b07
    index: 0x07
    text: |-
      Χ-χάρτης! Ἆρα
      ἔχεις χάρτην;

  - name: TX_0b08
    index: 0x08
    text: |-
      Δώσεις αὐτῷ τὸν
      \col(0x84)\item(0x02)\col(1)Χάρτην\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_0b09
    index: 0x09
    text: |-
      Εὖγε!

  - name: TX_0b0a
    index: 0x0a
    text: |-
      Οὐχίιιι!

  - name: TX_0b0b
    index: 0x0b
    text: |-
      Ἆ...

  - name: TX_0b0c
    index: 0x0c
    text: |-
      Λάβε τοῦτο.\sym(0x1c)

  - name: TX_0b0d
    index: 0x0d
    text: |-
      Οὕτω πεινῶ ὥστε
      ἀλγεῖ ἡ γαστήρ.

  - name: TX_0b0e
    index: 0x0e
    text: |-
      ΑΑΑ! ΠΕΙΝΩ!

  - name: TX_0b0f
    index: 0x0f
    text: |-
      Σύγγνωθί μοι.
      Ἐνόμισα ὅτι
      βοηθήσεις μοι.

  - name: TX_0b10
    index: 0x10
    text: |-
      Δώσεις αὐτῷ \col(0x84)\item(0x04)
      \col(1)Χρηστὸν Κρέας;\col(0)
        \opt()Ναί \opt()Οὔ

  - name: TX_0b11
    index: 0x11
    text: |-
      \pos(2)Τί ἐστι τοῦτο;
      Δός μοι αὐτό...
      Βρῶμα τέλος...
      (Μάσα, μάσα)
      ................\stop
      Διὰ τί βλέπεις
      εἰς ἐμέ;
      Ὦ, ΘΕΛΕΙΣ
      τι;

  - name: TX_0b12
    index: 0x12
    text: |-
      \pos(2)Ὡς πλεονέκτης!
      Ὡς πονηρός!
      Οὐκ ἀπελεύσῃ
      ἕως ἂν λάβῃς
      τι;

  - name: TX_0b13
    index: 0x13
    text: |-
      \pos(2)Εἶεν. Λάβε
      τοῦτο.

  - name: TX_0b14
    index: 0x14
    text: |-
      \pos(2)Οὐδ' ἂν ἦν
      χρηστὸν ὅλως!!!

  - name: TX_0b15
    index: 0x15
    text: |-
      \pos(2)Ἆ. Ἐχορτάσθην.
      Εὐχαριστῶ.

  - name: TX_0b16
    index: 0x16
    text: |-
      Ἐγώ εἰμι ἡ
      \col(3)Μαμάμου Ἰάν\col(0), ἡ
      πρώτη τροφὸς ἐν
      τῇ πόλει. Ὁ κύων
      μου καλλίων ἐστὶ
      τοῦ κυνὸς
      ἐκείνου! Πολὺ
      καλλίων! Ἀλλὰ
      δειλός ἐστιν.

  - name: TX_0b17
    index: 0x17
    text: |-
      Οἶδας τρόπον
      καλὸν κρύψαι τὸ
      πρόσωπον αὐτοῦ;

  - name: TX_0b18
    index: 0x18
    text: |-
      Ἰδού!!! Τοῦτο τὸ
      \col(0x84)\item(0x05) \col(1)προσωπεῖον\col(0)!!!
      Ἁρμόζει τῷ κυνί
      μου καλῶς!
      Δός μοι ἐκεῖνο
      τὸ \col(0x84)\item(0x05) \col(1)προσωπεῖον\col(0)!\stop
      Δώσεις αὐτῇ τὸ
      \col(0x84)\item(0x05) \col(1)Προσωπεῖον
      Κυνός\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_0b19
    index: 0x19
    text: |-
      Καλὸς παῖς!
      Ἄξιος εἶ τοῦ
      παιγνίου ᾧ ὁ
      κύων μου ἔπαιζε!

  - name: TX_0b1a
    index: 0x1a
    text: |-
      Τί ἐστιν, ὦ παῖ;
      Ἓν μόνον εἶχον
      ἐξ ἀρχῆς!

  - name: TX_0b1b
    index: 0x1b
    text: |-
      Αἰῖῖ!
      Κακὲ παῖ! Σίγα!

  - name: TX_0b1c
    index: 0x1c
    text: |-
      Νῦν ὁ κύων τῆς
      \col(3)Μαμάμου Ἰὰν\col(0)
      κάλλιστός ἐστιν!
      Ἆ ἆ ἆ ἆ ἆ!

  - name: TX_0b1d
    index: 0x1d
    text: |-
      Κλῖνον δεξιά...
      Κλῖνον
      ἀριστερά...
      Κινήθητι ἀριστ.,
      κλῖνον δεξιά...
      Κινήθητι δεξιά,
      κλῖνον ἀριστ....
      Λεπτός εἰμι...
      Εἴθε ἠδυνάμην
      ἀλλάξαι...

  - name: TX_0b1e
    index: 0x1e
    text: |-
      Οἶδα!
      Γυμνάσομαι!
      Πλὴν...
      ἕνα μόνον ἔχω
      \col(1)Ἁλτῆρα\col(0)...

  - name: TX_0b1f
    index: 0x1f
    text: |-
      Γυμνάζειν μίαν
      χεῖρα κατὰ
      καιρόν... Παρά
      τὸν νόμον μου...
      Ἐὰν μὴ δύνωμαι
      ἀμφοτέρας ἅμα...

  - name: TX_0b20
    index: 0x20
    text: |-
      Κλῖνον ἀριστ....
      Κλῖνον δεξιά...

  - name: TX_0b21
    index: 0x21
    text: |-
      Βλέπει ἀτενῶς
      εἰς τὸν σὸν
      \col(0x84)\item(0x06) \col(1)Ἁλτῆρα\col(0)...
      Δώσεις αὐτῷ τὸν
      \col(0x84)\item(0x06) \col(1)Ἁλτῆρα\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_0b22
    index: 0x22
    text: |-
      Τοῦτό ἐστιν...
      Ὃ ἤθελον...
      Νῦν αἴρω,
      αἴρω, αἴρω...
      Ἕξω πάσας τὰς
      κόρας νῦν...

  - name: TX_0b23
    index: 0x23
    text: |-
      Λεπτός εἰμι...
      Οὐ δύναμαι
      δοῦναί σοι πολύ.
      Ἆ... Οἶδα.\stop
      Ῥρρρῆξις!\stop
      Δεῖ γυμνάζεσθαι!

  - name: TX_0b24
    index: 0x24
    text: |-
      Λαβεῖν κόρας...
      Λαβεῖν κόρας...

  - name: TX_0b25
    index: 0x25
    text: |-
      Χρέμψ!

  - name: TX_0b26
    index: 0x26
    text: |-
      ;;;

  - name: TX_0b27
    index: 0x27
    text: |-
      Ἔα!

  - name: TX_0b28
    index: 0x28
    text: |-
      Ὤ... θερμόν!

  - name: TX_0b29
    index: 0x29
    text: |-
      Φεῦ!

  - name: TX_0b2a
    index: 0x2a
    text: |-
      Ἰλιγγιῶ!

  - name: TX_0b2b
    index: 0x2b
    text: |-
      Τ-τί;!;

  - name: TX_0b2c
    index: 0x2c
    text: |-
      Ποῖον τραγάλιον
      οὐδέποτε ἐν
      καιρῷ ἔρχεται;;;\stop
      Τὸ βραδύ-γλυκυ!
      Οὐχὶ γλυκὺ
      παίγνιόν ἐστιν;

  - name: TX_0b2d
    index: 0x2d
    text: |-
      Χρῄζω τινὸς ὃ
      ποιήσει αὐτοὺς
      γελᾶν. Ἆρα
      \col(1)ψευδὴς μύσταξ\col(0)
      ὠφελήσει;

  - name: TX_0b2e
    index: 0x2e
    text: |-
      Θέλω μόνον
      ποιεῖν αὐτοὺς
      γελᾶν. Πάντως
      ἔστι ῥᾳδία ὁδός.

  - name: TX_0b2f
    index: 0x2f
    text: |-
      Δώσεις αὐτῷ τὸν
      \col(0x84)\item(0x07)\col(1)Γελοῖον
      Μύστακα\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_0b30
    index: 0x30
    text: |-
      Ὡς γελοῖος
      \col(1)μύσταξ\col(0)!
      Θαυμαστός ἐστιν!
      Εἶεν, ἑταῖρε,
      διδάξω σε τὸ
      γελοιότατον
      παίγνιον! Εἶεν.\stop
      Ἰδού!

  - name: TX_0b31
    index: 0x31
    text: |-
      Ὁ βίος τοῦ
      μίμου οὐκ ἔστι
      ῥᾴδιος!

  - name: TX_0b32
    index: 0x32
    text: |-
      Πῶς δοκεῖ σοι ὁ
      \col(1)μύσταξ\col(0) μου;

  - name: TX_0b33
    index: 0x33
    text: |-
      Ὡς ποθῶ τὴν
      ὀσμὴν καὶ τὸν
      ἦχον θαλάσσης...

  - name: TX_0b34
    index: 0x34
    text: |-
      Ἐν ταῖς ἡμέραις
      μου ἤμην ὁ
      ἄριστος μουσικὸς
      τῶν Ζώρα. Εἰ
      εἶχον ὄργανον,
      ἀνέζων ἂν τὴν
      νεότητά μου.

  - name: TX_0b35
    index: 0x35
    text: |-
      Δώσεις αὐτῷ τὴν
      \col(0x84)\item(0x0b)\col(1)Θαλασσίαν
      Λύραν\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_0b36
    index: 0x36
    text: |-
      Ἡ \col(1)Λύρα\col(0) αὕτη ἔχει
      τὸ πνεῦμα τῆς
      θαλάσσης! Ἡ
      ὀσμή! Ὁ ἦχος!
      Καλῶς ποιεῖς
      τιμῶν τοὺς
      πρεσβυτέρους!
      Βλέπω ὅτι ὁδὸν
      πορεύῃ. Δώσω
      σοι παλαιόν τι.
      Τοῦτό ἐστι τὸ
      \col(1)Ξίφος τοῦ Ἥρωος\col(0)
      ὃ μέγας δυνατὸς
      ἔδωκε τοῖς
      πατράσι μου
      πάλαι!

  - name: TX_0b37
    index: 0x37
    text: |-
      ...Τί φῄς;
      Συντέτριπται..;
      ...Χρέμψ!\stop
      Ἆ! Ὡς καλὸς
      ἦχος!

  - name: TX_0b38
    index: 0x38
    text: |-
      Διὰ τί ὀσφραίνο-
      μαι θαλάσσης
      ὧδε;

  - name: TX_0b39
    index: 0x39
    text: |-
      Ἆ! Ὡς ἡδύ! Οὐδὲ
      θέλω λογίζεσθαι
      περὶ
      \col(1)Συντριβέντων
      Ξιφῶν\col(0), οἶδας;\stop
      ...Οὐχί!!!
      Λέγω, ἔχω τὴν
      δύναμιν ἰᾶσθαι
      πάντα, διὸ δεῖ
      με ποιῆσαι αὐτό.

  - name: TX_0b3a
    index: 0x3a
    text: |-
      Ὢ τῆς ταραχῆς...\stop
      Ὤ! Τί; Χρῄζεις
      τινός;
        \opt()Ναί \opt()Οὔ

  - name: TX_0b3b
    index: 0x3b
    text: |-
      Μὴ κάλει με ἐὰν
      μὴ χρῄζῃς μου.

  - name: TX_0b3c
    index: 0x3c
    text: |-
      Ὤ! Ἡ φίλη μήτηρ
      μου ἐν τῷ
      \col(3)Ὁλόδρουμ\col(0) ἐστίν;
      Ἡ νεανικὴ μήτηρ
      μου μέριμνά
      ἐστιν! Πολλὰ
      ἐποίησας, ἀλλ'
      αἰτήσω τι;
        \opt()Ναί \opt()Οὔ

  - name: TX_0b3d
    index: 0x3d
    text: |-
      ;;;
      Μωρὲ παῖ...

  - name: TX_0b3e
    index: 0x3e
    text: |-
      Ἀληθῶς; Κρίμα...

  - name: TX_0b3f
    index: 0x3f
    text: |-
      Ὁ τίμιος κύων
      μου ἀπώλετο.
      Ἔστι που ἐν τῇ
      πόλει· θέλω σε
      εὑρεῖν αὐτόν.
      Ἁπαλός ἐστιν·
      βάστασον αὐτὸν
      καλῶς. Μέγας
      μισθὸς ἔσται σοι
      ἐὰν εὕρῃς αὐτόν!

  - name: TX_0b40
    index: 0x40
    text: |-
      Εὗρες τὸν κύνα
      μου;

  - name: TX_0b41
    index: 0x41
    text: |-
      Τὸ κυνάριόν μου!
      Ποῦ ἦσθα;
      Εὐχαριστῶ σοι
      ἀγαγόντι αὐτὸν
      εἰς οἶκον σῶον!
      Ἰδοὺ ὁ μισθός
      σου!

  - name: TX_0b42
    index: 0x42
    text: |-
      Μὴ ἐπιλάθῃ
      ἀγαγεῖν αὐτὸ
      πρὸς τὸν
      δακτυλιουργὸν
      εἰς δοκιμήν!!!

  - name: TX_0b43
    index: 0x43
    text: |-
      Ἀκούσεις τῆς
      δεήσεώς μου;
        \opt()Ναί \opt()Οὔ

  - name: TX_0b44
    index: 0x44
    text: |-
      Ἔνεγκε ἐκεῖνον
      τὸν \col(1)δακτύλιον\col(0)
      πρὸς τὸν
      δακτυλιουργόν.

  - name: TX_0b45
    index: 0x45
    text: |-
      Φεῦ! Κρέας!!!

- group: 0x0c
  data:
  - name: TX_0c00
    index: 0x00
    text: |-
      Ἆρα ἔρριψας
      \col(1)Χρυσοῦν Βόμβον\col(0);
      Ἢ \col(1)Ἀργυροῦν
      Βόμβον\col(0);\stop
       \opt()Χρυσοῦν
      \opt()Ἀργυρ.
       \opt()Κοινόν τινα

  - name: TX_0c01
    index: 0x01
    text: |-
      ...Ἀληθῶς;
      \col(1)Χρυσοῦν Βόμβον\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_0c02
    index: 0x02
    text: |-
      Ἀληθῶς καὶ ὄντως
      \col(1)Χρυσοῦν
      Βόμβον\col(0);;;
        \opt()Ναί \opt()Οὔ

  - name: TX_0c03
    index: 0x03
    text: |-
      Ψεῦστα! Ἡ
      πλεονεξία τίκτει
      λύπην!

  - name: TX_0c04
    index: 0x04
    text: |-
      Ἐλπίζω ὅτι
      ἔμαθες μὴ
      ψεύδεσθαι.\heart

  - name: TX_0c05
    index: 0x05
    text: |-
      ...Ἀληθῶς;
      \col(1)Ἀργυροῦν Βόμβον\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_0c06
    index: 0x06
    text: |-
      Ψεῦστα! Αἴρω
      τοὺς \col(1)Βόμβους\col(0)
      σου!

  - name: TX_0c07
    index: 0x07
    text: |-
      Δίκαιος ἄνθρωπος
      εἶ.\stop
      Αὐξήσω τὸν
      ἀριθμὸν τῶν
      \col(1)Βόμβων\col(0) οὓς
      δύνασαι φέρειν
      ὡς μισθόν.\stop
      Εἶα!

  - name: TX_0c08
    index: 0x08
    text: |-
      Νῦν δύνασαι
      φέρειν \num1
      \col(1)Βόμβους\col(0). Καὶ
      ἐπλήρωσα τὴν
      πήραν σου.
      Χαῖρε...

- group: 0x0d
  data:
  - name: TX_0d00
    index: 0x00
    text: |-
      \pos(2)Ἐγώ εἰμι ἡ
      Μεγάλη Φαρμακὶς
      \col(3)Σιρόπη\col(0) καὶ τοῦτό
      ἐστι τὸ
      πωλητήριον τῶν
      \col(1)Φαρμάκων\col(0) μου.
      Φέρε μοι ὃ
      θέλεις.

  - name: TX_0d01
    index: 0x01
    text: |-
      \pos(2)\col(1)Φάρμακον Μαγείας\col(0)
      300 δραχμῶν.
        \opt()Εἶεν \opt()Οὔ,
      χάρις\cmd8(0x0d)

  - name: TX_0d02
    index: 0x02
    text: |-
      \pos(2)Τοῦτό ἐστι τὸ
      μαγικὸν μύρον
      τῆς \col(3)Σιρόπης\col(0).
      Ὠφελεῖ ὅταν αἱ
      καρδίαι σου
      ἐκλείπωσιν.

  - name: TX_0d03
    index: 0x03
    text: |-
      \pos(2)Ἐλπίζω μὴ
      μεταμεληθῆναί
      σε! Ἆ, ἆ!

  - name: TX_0d04
    index: 0x04
    text: |-
      \pos(2)Ἓν φάρμακον
      ἑκάστῳ! Ἐλθὲ
      πάλιν ἐὰν
      ἐκλείπῃ.

  - name: TX_0d05
    index: 0x05
    text: |-
      \pos(2)\col(1)Κάρυον Γασά\col(0)
      300 δραχμῶν!
        \opt()Εἶεν \opt()Οὔ,
      χάρις\cmd8(0x0e)

  - name: TX_0d06
    index: 0x06
    text: |-
      \pos(2)Τίμιόν ἐστι
      \col(1)Κάρυον Γασά\col(0).
      Ἀνάμεινον αὐτὸ
      καρποφορῆσαι!

  - name: TX_0d07
    index: 0x07
    text: |-
      \pos(2)Πλεονέκτα παῖ!
      Οὐ δύνασαι
      φέρειν πλέον.
      Σύγγνωθι!

  - name: TX_0d08
    index: 0x08
    text: |-
      \pos(2)Οὐ πωλῶ τῷ μὴ
      ἔχοντι δραχμάς.

  - name: TX_0d09
    index: 0x09
    text: |-
      \pos(1)Στῆθι! Κλέπτα!
      Οὐ φεύξῃ με!

  - name: TX_0d0a
    index: 0x0a
    text: |-
      \pos(2)\col(1)Βομβόμυς\col(0)
      5 ἀντὶ 100 δρ.
        \opt()Εἶεν \opt()Οὔ,
      χάρις\cmd8(0x11)

  - name: TX_0d0b
    index: 0x0b
    text: |-
      \pos(2)Κέκλεισται!

  - name: TX_0d0c
    index: 0x0c
    text: |-
      \pos(2)Οὗτος ὁ νέος
      \col(1)Βόμβος\col(0) περιτρέ-
      χει ὅταν θῇς
      αὐτόν.

- group: 0x0e
  data:
  - name: TX_0e00
    index: 0x00
    text: |-
      Χαῖρε, κύριε!
      Φέρε μοι πᾶν
      σκεῦος ὃ θέλεις
      ἀγοράσαι.

  - name: TX_0e01
    index: 0x01
    text: |-
      \col(1)Μέρος Καρδίας\col(0)\stop
        \num1 δραχμαί
      \jump(TX_0e2b)
    null_terminator: False

  - name: TX_0e02
    index: 0x02
    text: |-
      \col(1)3 Καρδίαι\col(0)\stop
       \num1 δραχμαί
      \jump(TX_0e2b)
    null_terminator: False

  - name: TX_0e03
    index: 0x03
    text: |-
      \col(1)Ξύλινος Θυρεός\col(0)\stop
       \num1 δραχμαί
      \jump(TX_0e2b)
    null_terminator: False

  - name: TX_0e04
    index: 0x04
    text: |-
      \col(1)10 Βόμβοι\col(0)\stop
       \num1 δραχμαί
      \jump(TX_0e2b)
    null_terminator: False

  - name: TX_0e05
    index: 0x05
    text: |-
      Ἔχεις αὐτό. Ἄλλο
      ἓν οὐκ ὠφελήσει.

  - name: TX_0e06
    index: 0x06
    text: |-
      Οὐκ ἔχεις ἱκανὰς
      δραχμάς.

  - name: TX_0e07
    index: 0x07
    text: |-
      Ἒ! Μὴ λάμβανε
      οὕτως! Κλέπτα!
      Ἀπόδος τοῦτο
      παραχρῆμα!

  - name: TX_0e08
    index: 0x08
    text: |-
      Χαῖρε, κύριε.
      Ἀρέσκει σοι τὸ
      πωλητήριόν μου.

  - name:
    - TX_0e09
    - TX_0e0a
    index:
    - 0x09
    - 0x0a
    text: |-
      Κύριε, δύναμαι
      αὐξῆσαι τὴν
      \col(1)Πυξίδα Δακτυλίων\col(0)
      σου ἵνα χωρῇ
      πλείονας
      \col(1)δακτυλίους\col(0).
      300 δραχμαί.
        \opt()Εἶεν \opt()Οὔ,
      χάρις\cmd8(0x0f)

  - name: TX_0e0b
    index: 0x0b
    text: |-
      Ὤ! Οὐκ ἔχεις
      \col(1)Πυξίδα
      Δακτυλίων\col(0)! Οὐ
      δύναμαι
      βοηθῆσαι!

  - name:
    - TX_0e0c
    - TX_0e0d
    index:
    - 0x0c
    - 0x0d
    text: |-
      Ἐξέλιπε τὰ
      ὤνια, διὸ νῦν
      νέαν ἐργασίαν
      ἔχομεν.
      \jump(TX_0e0f)
    null_terminator: False

  - name: TX_0e0e
    index: 0x0e
    text: |-
      Χαῖρε.\n
    null_terminator: False

  - name: TX_0e0f
    index: 0x0f
    text: |-
      Μία ἐκ δύο
      κιβωτῶν ἔχει
      θησαυρόν. Λήψῃ
      καλὸν δῶρον ἐὰν
      ἀνοίξῃς τὴν
      ὀρθὴν κιβωτὸν
      τρὶς ἐφεξῆς!
      Ἑκάστη πεῖρα
      10 δραχμῶν.
        \opt()Εἶεν \opt()Οὔ,
      χάρις

  - name: TX_0e10
    index: 0x10
    text: |-
      Εἶεν! ...Ἄρξαι!

  - name: TX_0e11
    index: 0x11
    text: |-
      Ἐλπίζω σε
      ἐλθεῖν πάλιν.

  - name: TX_0e12
    index: 0x12
    text: |-
      Συγχαίρω!
      Αὕτη ἐστὶν ἡ
      ἐσχάτη πεῖρά
      σου! Ἐὰν τύχῃς
      τούτου, λήψῃ
      θαυμαστὸν δῶρον!
        \opt()Εἶεν \opt()Οὔ,
      χάρις

  - name: TX_0e13
    index: 0x13
    text: |-
      Εὐτυχεῖς; Ἑλοῦ
      τὴν κιβωτόν σου!

  - name: TX_0e14
    index: 0x14
    text: |-
      Ὦ; Οὐκοῦν...
      \jump(TX_0e1f)
    null_terminator: False

  - name: TX_0e15
    index: 0x15
    text: |-
      Ἐπέτυχες!
      Συγχαίρω!
      Αὕτη ἐστὶν ἡ
      ἐσχάτη πεῖρά
      σου! Ἐὰν τύχῃς
      τούτου, λήψῃ
      ἐξαίρετον δῶρον!
        \opt()Εἶεν \opt()Οὔ,
      χάρις

  - name: TX_0e16
    index: 0x16
    text: |-
      Συγχαίρω!
      \jump(TX_0e1f)
    null_terminator: False

  - name: TX_0e17
    index: 0x17
    text: |-
      Φεῦ. Πειράσεις
      πάλιν;
        \opt()Εἶεν \opt()Οὔ,
      χάρις

  - name: TX_0e18
    index: 0x18
    text: |-
      Νῦν χαλεπώτερον
      ἔσται.

  - name: TX_0e19
    index: 0x19
    text: |-
      Κύριε! Οὔπω
      εἵλου! Ἅπαξ
      μόνον νουθετήσω
      σε.

  - name: TX_0e1a
    index: 0x1a
    text: |-
      Σπεῦσον!

  - name: TX_0e1b
    index: 0x1b
    text: |-
      \col(1)Ξένος Αὐλός\col(0)\stop
       \num1 δραχμαί
      \jump(TX_0e2b)
    null_terminator: False

  - name:
    - TX_0e1c
    - TX_0e1d
    index:
    - 0x1c
    - 0x1d
    text: |-
      \col(1)Κάρυον Γασά\col(0)\stop
      \num1 δραχμαί
      \jump(TX_0e2b)
    null_terminator: False

  - name:
    - TX_0e1e
    - TX_0e1f
    index:
    - 0x1e
    - 0x1f
    text: |-
      Τὸ δῶρόν σου
      \col(1)δακτύλιός\col(0) ἐστιν,
      ἀλλὰ ποῖος
      \col(1)δακτύλιος\col(0)
      μυστήριόν ἐστιν.

  - name: TX_0e20
    index: 0x20
    text: |-
      Χαῖρε, κύριε...\stop
      εἰς τὸ
      Πωλητήριον
      Προόδου 100 δρ.
      Θαυμάζω ὅτι
      εὗρες
      ἡμᾶς! Εὑρισκό-
      μεθα μόνον ἐν
      τῷ Παιγνίῳ
      Προόδου! Πάντα
      100 δραχμῶν.\stop
      Μὴ εἴπῃς τὸ
      μυστήριον ἡμῶν!

  - name: TX_0e21
    index: 0x21
    text: |-
      Ὤ! Ὁ βίος σου
      ἐν Προόδῳ ἐστίν;
      Ὁ ἐμὸς βίος ἐν
      Προόδῳ ἐστίν!
      Ἀπὸ τοῦ νῦν,
      Πρόοδος!

  - name:
    - TX_0e22
    - TX_0e23
    index:
    - 0x22
    - 0x23
    text: |-
      \col(1)Δακτύλιος
      Προόδου\col(0)\stop
       \num1 δραχμαί
      \jump(TX_0e2b)
    null_terminator: False

  - name:
    - TX_0e24
    - TX_0e25
    index:
    - 0x24
    - 0x25
    text: |-
      \col(1)Μαγικὸς
      Δακτύλιος\col(0). Ποῖος
      \col(1)δακτύλιός\col(0) ἐστι
      μυστήριόν ἐστιν.\stop
      \num1 δραχμαί
      \jump(TX_0e2b)
    null_terminator: False

  - name: TX_0e26
    index: 0x26
    text: |-
      Ἠγόρασας πάντα,
      διὸ κλείω τὸ
      πωλητήριον.

  - name:
    - TX_0e27
    - TX_0e28
    index:
    - 0x27
    - 0x28
    text: |-
      Οὐκ ἀνεῴγμεθα.
      Ἐλθὲ ὕστερον.

  - name: TX_0e29
    index: 0x29
    text: |-
      \col(1)Σιδηροῦς Θυρεός\col(0)\stop
       \num1 δραχμαί
      \jump(TX_0e2b)
    null_terminator: False

  - name: TX_0e2a
    index: 0x2a
    text: |-
      \col(1)Θυρεὸς Ἐσόπτρου\col(0)\stop
       \num1 δραχμαί\n
    null_terminator: False

  - name: TX_0e2b
    index: 0x2b
    text: |2-
        \opt()Εἶεν \opt()Οὔ,
      χάρις\cmd8(0x0f)

- group: 0x0f
  data:
  - name: TX_0f00
    index: 0x00
    text: |-
      Που ἐν τῷ δρυμῷ
      ἐστι δένδρον ὃ
      φέρει λίαν
      \col(1)ἴδια σπέρματα\col(0).

  - name: TX_0f01
    index: 0x01
    text: |-
      Ἔστι δένδρα ἐν
      ἄλλοις τόποις ἃ
      φέρει \col(1)Μυστικὰ
      Σπέρματα\col(0).

  - name: TX_0f02
    index: 0x02
    text: |-
      Ἠρξάμην τοῦ βίου
      ὡς ἁλιεὺς ἐν τῇ
      νήσῳ ταύτῃ, ἀλλὰ
      νῦν ἡ νῆσος
      φέρεται πρὸς τὸν
      ὁρίζοντα. Ἐν
      ταῖς ἡμέραις τοῦ
      υἱωνοῦ μου ἔσται
      πορρωτέρω
      δυσμῶν.

  - name: TX_0f03
    index: 0x03
    text: |-
      Ὁ οἶκός μου
      ἁλιεύει ἐν τῇ
      νήσῳ ταύτῃ ἀπὸ
      τοῦ πάππου μου.\stop
      Ἡ νῆσος φέρεται
      πρὸς δυσμάς, διὸ
      πάλαι ἦν
      πορρωτέρω
      ἀνατολῶν.

- group: 0x10
  data:
  - name: TX_1000
    index: 0x00
    text: |-
      Ἔδει ἡμᾶς
      τελέσαι αὔριον,
      ἀλλ' ὑστεροῦμεν
      πολύ! Οὐ μὴ
      φθάσωμεν!

  - name: TX_1001
    index: 0x01
    text: |-
      Ἆ; Σκεῦος
      ὀρύγματος; Εὖγε,
      ὦ τέκνον! Ἰδού!
      Λάβε ταύτην τὴν
      \col(1)σκαπάνην\col(0)!
      Δύνασαι χρῆσθαι
      τῇ \col(1)σκαπάνῃ\col(0) ἵνα
      κινήσῃς τὸν χοῦν
      ἐκ τῆς ὁδοῦ;

  - name: TX_1002
    index: 0x02
    text: |-
      Μοχθοῦμεν ἐπὶ
      τῷ πύργῳ τούτῳ!
      Βοήθησον ἡμῖν!

  - name: TX_1003
    index: 0x03
    text: |-
      Αὕτη ἐστὶν ἡ
      εἴσοδος τοῦ
      πύργου τοῦ
      οἰκοδομουμένου
      πρὸς τὸν οὐρανὸν
      κελεύσει τῆς
      \col(3)βασιλίσσης Ἄμβι\col(0).

  - name: TX_1004
    index: 0x04
    text: |-
      Οὐκ εἰώθει ἡ
      \col(3)βασίλισσα Ἄμβι\col(0)
      ἐπείγειν ἡμᾶς
      οὕτως. Οὐδὲ
      καιρὸν ὕπνου
      ἔχομεν!

  - name: TX_1005
    index: 0x05
    text: |-
      \pos(0)Πρῶτον ὁ πύργος
      οὗτος ᾠκοδομεῖτο
      ἵνα ὁδηγήσῃ τὸν
      ἀγαπητὸν τῆς
      βασιλίσσης Ἄμβι
      σῶον ἐκ
      θαλάσσης.
      Ἀλλ' ἀφ' οὗ
      ἦλθεν
      ἡ Ναϋρού, ὁ
      ἥλιος ἕστηκεν ἐν
      τῷ οὐρανῷ ὡς τοῦ
      χρόνου στάντος.
      Οὐκ εἰώθει ἡ
      βασίλισσα Ἄμβι
      ἐπείγειν ἡμᾶς
      οὕτως. Ἐν τῇ
      κώμῃ ἤρξαντο
      καλεῖν αὐτὸν
      Μέλανα Πύργον.

  - name: TX_1006
    index: 0x06
    text: |-
      Δύνασαι βλέπειν
      πέριξ, ἀλλὰ
      μέρη τινὰ
      κέκλεισται. Ἐὰν
      δὲ μείνῃς ὧδε
      πολύ, ἴσως
      ἐπιτιμήσουσί
      σοι.

  - name: TX_1007
    index: 0x07
    text: |-
      Διὰ τί
      οἰκοδομεῖν
      τηλικοῦτόν τι..;
      Ἔργον, ἔργον,
      ἔργον μόνον!

  - name:
    - TX_1008
    - TX_1009
    index:
    - 0x08
    - 0x09
    text: |-
      Ἐγὼ... οὕτω...
      κοπιῶ... Οὐκ
      ἔστιν ὕπνος...
      μόνον ἔργον...
      Ἀλλὰ σχεδὸν
      ἐτελέσαμεν...

  - name: TX_100a
    index: 0x0a
    text: |-
      Τοῦτο ὧδε,
      ἐκεῖνο
      ἐκεῖ... Οὐχί!
      Ἐκεῖνο ὧδε! Οὐκ
      ἔστιν ὕπνος...
      Ὁ υἱός μου μόνος
      ἐν οἴκῳ...
      Μάτην.
      Ὡς χαλεπὴ
      βασίλισσα! (Ἀλλὰ
      μηδενὶ εἴπῃς!)

  - name: TX_100b
    index: 0x0b
    text: |-
      Τὸ ἔργον μου οὐκ
      ἐτελέσθη! Πῶς
      ὄψομαι τὴν
      βασίλισσαν; Οὐ
      μὴ φθάσω...

  - name: TX_100c
    index: 0x0c
    text: |-
      Ἀσχολία,
      ἀσχολία!
      Ἐὰν μὴ σπεύσω,
      οἱ φύλακες
      ἐλεύσονται
      ἐπισκέψασθαί με!

  - name: TX_100d
    index: 0x0d
    text: |-
      Ἐπικίνδυνόν ἐστι
      πέραν ἐντεῦθεν.
      Θηρία ἐστὶ
      πανταχοῦ, καὶ οὐ
      δύνασαι εὑρεῖν
      τὴν ὁδὸν πρὸς
      τὴν κορυφὴν μὴ
      πλανηθείς!
      Τί γίγνεται;

- group: 0x11
  data:
  - name: TX_1100
    index: 0x00
    text: |-
      \pos(2)Οὗτός ἐστιν ὁ
      τόπος παιδιᾶς
      ἡμῶν!

  - name: TX_1101
    index: 0x01
    text: |-
      \pos(2)Οὐ παίξεις
      κρυπτίνδα;

  - name: TX_1102
    index: 0x02
    text: |-
      \pos(2)Ἐὰν μὴ εὕρῃς
      ἡμᾶς τοὺς τρεῖς,
      οὐ δύνασαι
      προελθεῖν!

  - name: TX_1103
    index: 0x03
    text: |-
      \pos(2)Κρυβησόμεθα·
      ζήτησον ἡμᾶς!

  - name: TX_1104
    index: 0x04
    text: |-
      \pos(2)Ἕτοιμος ἢ οὔ,
      ἐλθὲ εὑρεῖν
      ἡμᾶς!

  - name: TX_1105
    index: 0x05
    text: |-
      \pos(2)Φεῦ! Ἀλλ' ἔτι
      δύο εἰσίν!

  - name: TX_1106
    index: 0x06
    text: |-
      \pos(2)Εὗρές με...
      Ἀλλ' ὁ ἔσχατος
      χαλεπώτατός
      ἐστιν!

  - name: TX_1107
    index: 0x07
    text: |-
      \pos(2)Τί; Εὗρες ἡμᾶς
      πάντας; Δεινὸς
      εἶ, ὦ κύριε!

  - name: TX_1108
    index: 0x08
    text: |-
      \pos(2)Ἔτι δύο λείπον-
      ται! Ἢ ἀπαγο-
      ρεύεις;

  - name: TX_1109
    index: 0x09
    text: |-
      \pos(2)Εἷς ἔτι!
      Εἷς ἔτι!

  - name: TX_110a
    index: 0x0a
    text: |-
      \pos(2)Ἆ... Εὗρες ἡμᾶς
      πάντας. Εἶεν,
      οὐκέτι ἐμπαίξο-
      μέν σοι. Τάξομεν
      πάλιν τὸν
      δρυμόν.

  - name: TX_110b
    index: 0x0b
    text: |-
      \pos(2)Ἡδὺ ἦν!
      Παίξωμεν πάλιν
      ποτέ.

  - name: TX_110c
    index: 0x0c
    text: |-
      Παύῃ;
        \opt()Ναί \opt()Οὔ

  - name: TX_110d
    index: 0x0d
    text: |-
      \pos(2)Οὐχ εὑρήσεις
      ἡμᾶς αὖθις!

  - name: TX_110e
    index: 0x0e
    text: |-
      \pos(2)Ξένον τι
      αἰσθάνομαι. Ἆρα
      κακόν τι μέλλει
      γενέσθαι;

  - name: TX_110f
    index: 0x0f
    text: |-
      \pos(2)Παίξωμεν πάλιν,
      ὦ κύριε!

  - name: TX_1110
    index: 0x10
    text: |-
      \pos(2)Παίξωμεν πάλιν
      ποτέ.

  - name: TX_1111
    index: 0x11
    text: |-
      \pos(2)Ὁ δρυμὸς ἡμῶν
      καλῶς ἕξει!
      Οὐδὲν κακὸν
      γενήσεται ὧδε!

  - name: TX_1112
    index: 0x12
    text: |-
      \pos(2)Ὁ δρυμὸς εἰρήνην
      ἔχει πάλιν· ἐλθὲ
      παῖξαι μεθ'
      ἡμῶν!

  - name: TX_1113
    index: 0x13
    text: |-
      \pos(2)Ἴσως ἐμπαίξω
      σοι πάλιν...

  - name: TX_1114
    index: 0x14
    text: |-
      \pos(2)Οἱ κακοὶ φεύγου-
      σιν ὅταν ἐμπαί-
      ζωμεν αὐτοῖς.

  - name:
    - TX_1115
    - TX_1116
    - TX_1117
    - TX_1118
    - TX_1119
    - TX_111a
    - TX_111b
    - TX_111c
    - TX_111d
    - TX_111e
    - TX_111f
    index:
    - 0x15
    - 0x16
    - 0x17
    - 0x18
    - 0x19
    - 0x1a
    - 0x1b
    - 0x1c
    - 0x1d
    - 0x1e
    - 0x1f
    text: |-
      \pos(2)Αὖθις ὁ λαβύριν-
      θος τοῦ δρυμοῦ
      χαλεπώτερος
      ἔσται!

  - name: TX_1120
    index: 0x20
    text: |-
      Κύριε! Εὗρόν
      σε!

  - name: TX_1121
    index: 0x21
    text: |-
      Ἄκουε! Ταραχή
      ἐστιν!\n
    null_terminator: False

  - name: TX_1122
    index: 0x22
    text: |-
      \call(0xff)
      ἐπλανήθη ἐν τῷ
      δρυμῷ ἡμῶν καὶ
      οὐ δύναται
      ἐξελθεῖν!
      Ἐπαίζομεν δόλον
      μικρόν...
      Ἀλλὰ νῦν οὐ μὴ
      ἐξέλθῃ! Δύνασαι
      βοηθῆσαι εὑρεῖν
      αὐτό; Συνίης;
        \opt()Ναί \opt()Οὔ

  - name: TX_1123
    index: 0x23
    text: |-
      Ζῷον ἔχον
      χειρίδας

  - name: TX_1124
    index: 0x24
    text: |-
      Ἐρυθρὸν ζῷον
      ὅμοιον σαύρᾳ

  - name: TX_1125
    index: 0x25
    text: |-
      Μέγα πτερωτὸν
      ζῷον ὡς ἄρκτος

  - name: TX_1126
    index: 0x26
    text: |-
      Μεῖνον, κύριε!
      Τῇδε!

  - name: TX_1127
    index: 0x27
    text: |-
      Ἐν τῷ βάθει τοῦ
      δρυμοῦ ἐστιν.

  - name: TX_1128
    index: 0x28
    text: |-
      Οὐδὲ ἡμεῖς
      οἴδαμεν ποῦ
      ἐστιν.

  - name: TX_1129
    index: 0x29
    text: |-
      Οὐκ ἠθέλομεν
      παρασχεῖν κόπον.
      Ἀληθῶς!

  - name: TX_112a
    index: 0x2a
    text: |-
      Κύριε! Εὗρες
      αὐτό! Εἶεν.
      Ἄξομέν σε εἰς τὸ
      ἄκρον τοῦ
      δρυμοῦ.\stop
      Εἶα!

  - name: TX_112b
    index: 0x2b
    text: |-
      Οὐ μὴ πλανηθῇς
      ὧδε!

  - name: TX_112c
    index: 0x2c
    text: |-
      Σύγγνωθι! Οὐκ
      ἠθέλομεν! Ἀλλὰ
      τὸ ζητεῖν ἥδιόν
      ἐστι τοῦ
      κρύπτεσθαι!

  - name: TX_112d
    index: 0x2d
    text: |-
      Ἀληθῶς! Θέλω
      ποιῆσαι αὐτὸ
      πάλιν!

  - name: TX_112e
    index: 0x2e
    text: |-
      Αὖθις χαλεπώτε-
      ρον ἔσται!

  - name: TX_112f
    index: 0x2f
    text: |-
      Ἐλθὲ παῖξαι μεθ'
      ἡμῶν πάλιν,
      εἶεν;
      Χαῖρε!

  - name: TX_1130
    index: 0x30
    text: |-
      Σπεῦσον! Μενῶ
      ἐπὶ τῇ εἰσόδῳ
      τοῦ δρυμοῦ πρὸς
      νότον ἐντεῦθεν!

  - name: TX_1131
    index: 0x31
    text: |-
      \call(0xff)

  - name: TX_1132
    index: 0x32
    text: |-
      \call(0xfe)

  - name: TX_1133
    index: 0x33
    text: |-
      \sfx(0xc3)Ἆ... τοῦτο ἄγει
      ἐκεῖσε,
      ἐκεῖνο...
      Φεῦ! Οὐκ οἶδα!
      Τί γίγνεται;

  - name: TX_1134
    index: 0x34
    text: |-
      \sfx(0xc3)Εὗρες τὰς
      χειρίδας μου,
      ναί...

  - name: TX_1135
    index: 0x35
    text: |-
      \sfx(0xc3)\Link! Διὰ τί
      ὧδε εἶ;

  - name: TX_1136
    index: 0x36
    text: |-
      \sfx(0xc3)Οὔπω συνίημι,
      ἀλλ' ἐβοήθησάς
      μοι. Ἐγώ εἰμι ὁ
      \col(3)Ῥίκι\col(0). Ἐμνήσθης;
      Εἰπέ, οἶδα τὸ
      ὄνομά σου;\stop
      \Link; Καλόν!\stop
      Εὐχαριστῶ ἐπὶ τῇ
      βοηθείᾳ, \Link!
      Πολλὴ χάρις!
      Θέλω δοῦναί σοί
      τι... Ἒ! Ξένος
      \col(1)αὐλός\col(0) ἐστιν.
      Οἶδα!\stop
      \jump(TX_1138)
    null_terminator: False

  - name: TX_1137
    index: 0x37
    text: |-
      \sfx(0xc3)Οὔπω συνίημι,
      ἀλλ' ἐβοήθησάς
      μοι, \Link!
      Ἀληθῶς ὁ ἄριστος
      φίλος μου εἶ!\stop
      Θέλω πορεύεσθαι
      μετὰ σοῦ ὡς ἐν
      τῷ \col(3)Ὁλόδρουμ\col(0)!
      Οἶδα! Λάβε
      τοῦτον τὸν
      \col(1)αὐλόν\col(0)!\n
    null_terminator: False

  - name: TX_1138
    index: 0x38
    text: |-
      Αὔλησον ἐκεῖνον
      τὸν \col(1)αὐλὸν\col(0) ὅταν
      χρῄζῃς μου. Ἐὰν
      ἀκούσω τοῦ
      \col(1)αὐλοῦ\col(0), ἥξω
      εὑρεῖν σε!

  - name: TX_1139
    index: 0x39
    text: |-
      \sfx(0xc3)Θέλεις ἀπελθεῖν
      πρὸς βορρᾶν,
      ναί;
      Ἄξω σε! Εἴσελθε
      εἰς τὸν
      μάρσιππον!

  - name: TX_113a
    index: 0x3a
    text: |-
      \sfx(0xc4)Διί; Πᾶς τόπος
      ὅμοιος φαίνεται.
      Πῶς ἐξελεύσεται
      ὁ \col(3)Δημήτριος\col(0);

  - name: TX_113b
    index: 0x3b
    text: |-
      \sfx(0xc4)Διί! Ἐβοήθησας
      τῷ \col(3)Δημητρίῳ\col(0) ἐν
      τῇ νήσῳ.
      Εὔκαιρος
      εἶ!

  - name: TX_113c
    index: 0x3c
    text: |-
      \sfx(0xc4)\Link!
      Εὔκαιρος εἶ!
      Πῶς ἦλθες ὧδε;

  - name: TX_113d
    index: 0x3d
    text: |-
      \sfx(0xc4)Χαίρω σφόδρα
      ἐξελθών! Δὶς
      ἐβοήθησάς μοι.
      Τίς εἶ;\stop
      \Link; Ξένον
      ὄνομα.\stop
      Ἀλλ' ἀπὸ σήμερον
      ὁ \Link φίλος
      μου ἐστίν.
      Ἒ! Καλὸς \col(1)αὐλός\col(0),
      \Link!
      \jump(TX_113f)
    null_terminator: False

  - name: TX_113e
    index: 0x3e
    text: |-
      \sfx(0xc4)Ἔξω! Ἐξῆλθον!
      Εὐχαριστῶ,
      \Link! Ὡς
      ἀγαθὸς φίλος!\stop
      Ἐβοήθησάς μοι,
      \Link, διὸ
      βοηθῶ τῷ \Link.
      Ἔμαθον ἐν τῷ
      \col(3)Ὁλόδρουμ\col(0)--
      Ἐγὼ καὶ ὁ \Link
      ἀνίκητοί ἐσμεν!
      Λάβε τοῦτον τὸν
      \col(1)αὐλόν\col(0)!\n
    null_terminator: False

  - name: TX_113f
    index: 0x3f
    text: |-
      Αὔλησον ἐκεῖνον
      τὸν \col(1)αὐλόν\col(0). Ἥξω
      ἐὰν ἀκούσω τοῦ
      \col(1)αὐλοῦ\col(0).

  - name: TX_1140
    index: 0x40
    text: |-
      Πρὸς βορρᾶν;
      Ἀνάβηθι ἐπ' ἐμέ.

  - name: TX_1141
    index: 0x41
    text: |-
      \sfx(0xc5)Πάλιν ἐν τῷ αὐτῷ
      τόπῳ εἰμί. Πεινῶ
      σφόδρα. Οὐ
      δύναμαι
      κινεῖσθαι.

  - name: TX_1142
    index: 0x42
    text: |-
      \sfx(0xc5)Ὤ! Ἐδίωξας τὰ
      φαντάσματα...

  - name: TX_1143
    index: 0x43
    text: |-
      \sfx(0xc5)\Link!
      Ἆρα καὶ σὺ
      ἐπλανήθης;

  - name: TX_1144
    index: 0x44
    text: |-
      \sfx(0xc5)Εὐχαριστῶ σοι
      βοηθήσαντί μοι.
      Οὔπω εἶπάς μοι
      τὸ ὄνομά σου.
      Εἰπέ μοι.\stop
      \Link...
      Εὐμνημόνευτόν
      ἐστιν. Πρῶτον τὰ
      μνημεῖα, νῦν δὲ
      τοῦτο... Ἀεὶ
      βοηθεῖς μοι,
      \Link. Δεῖ κἀμὲ
      βοηθῆσαί σοι ἐν
      ταῖς ὁδοῖς σου,
      \Link, διὸ λάβε
      τοῦτον τὸν
      \col(1)αὐλόν\col(0).
      \jump(TX_1146)
    null_terminator: False

  - name: TX_1145
    index: 0x45
    text: |-
      \sfx(0xc5)Εὐχαριστῶ,
      \Link. Ἐνόμισα
      ὅτι οὐδέποτε
      ἐξελεύσομαι.\stop
      Ἀεὶ βοηθεῖς μοι,
      \Link. Δεῖ κἀμὲ
      βοηθῆσαί σοι ἐν
      ταῖς ὁδοῖς σου.
      Ἴσως βοηθήσω ὡς
      ἐν τῷ \col(3)Ὁλόδρουμ\col(0),
      διὸ λάβε τοῦτον
      τὸν \col(1)αὐλόν\col(0).\n
    null_terminator: False

  - name: TX_1146
    index: 0x46
    text: |-
      Αὔλησον ἐκεῖνον
      τὸν \col(1)αὐλὸν\col(0) ὅταν
      χρῄζῃς μου. Ἥξω
      ἐὰν ἀκούσω
      αὐτοῦ.

  - name: TX_1147
    index: 0x47
    text: |-
      \sfx(0xc5)Θέλεις ἀπελθεῖν
      πρὸς βορρᾶν,
      ναί.
      Εἶεν, ἀνάβηθι
      ἐπὶ
      τὸν νῶτόν μου.

  - name: TX_1148
    index: 0x48
    text: |-
      Χαῖρε! Ἆρα ἐμὲ
      ζητεῖς;
        \opt()Ναί \opt()Οὔ

  - name: TX_1149
    index: 0x49
    text: |-
      Ὦ, ἀληθῶς...

  - name: TX_114a
    index: 0x4a
    text: |-
      Τοῦτό ἐστι τὸ
      \col(1)μυστήριον\col(0) ὃ
      ἐδιδάξαμεν τὴν
      κόρην ἐκ τοῦ
      \col(3)Ὁλόδρουμ\col(0)!\stop
      Δώσομεν καὶ σοὶ
      εὐτυχίαν τινά!

  - name: TX_114b
    index: 0x4b
    text: |-
      Τί; Νέον
      τέχνημα;

  - name:
    - TX_114c
    - TX_114d
    index:
    - 0x4c
    - 0x4d
    text: |-
      Ἰδοὺ τὸ
      \col(1)μυστήριον\col(0) τοῦ
      εὐτυχεῖν ἐν τῷ
      \col(3)Ὁλόδρουμ\col(0)·\stop
      \secret1\stop
      Ἐὰν ἐπιλάθῃ τοῦ
      \col(1)μυστηρίου\col(0), ἐλθὲ
      καὶ ἐρώτησον!

- group: 0x12
  data:
  - name: TX_1200
    index: 0x00
    text: |-
      Μέγας ψόφος
      ἠκούσθη
      μακρόθεν,
      ὡς λυομένου
      τινός!

  - name: TX_1201
    index: 0x01
    text: |-
      Ἠκούσθη ὡς
      βαρέος τινὸς
      πεσόντος κάτω!

  - name: TX_1202
    index: 0x02
    text: |-
      \pos(2)Βουί! Οὗτός ἐστι
      περὶ οὗ ἡ \col(3)Βερὰν\col(0)
      ἐλάλει! Λάβετε
      αὐτόν!

  - name: TX_1203
    index: 0x03
    text: |-
      \pos(2)Τί ἐστιν;
      Ἀπόστηθι!

  - name: TX_1204
    index: 0x04
    text: |-
      Ἒ ἕ! Οὗτος
      ἐξεπλάγη!

  - name: TX_1205
    index: 0x05
    text: |-
      Ἐκπλήξωμεν αὐτὸν
      πλέον!

  - name: TX_1206
    index: 0x06
    text: |-
      Βουί! Διὰ τί ὁ
      ξένος ὧδέ ἐστιν!
      Τί βλέπεις;

  - name: TX_1207
    index: 0x07
    text: |-
      Ἐκπλήξομεν καὶ
      σέ!

  - name: TX_1208
    index: 0x08
    text: |-
      Ἤκουσας ὕδατος
      ἐξιόντος.

  - name: TX_1209
    index: 0x09
    text: |-
      Ἤκουσας ὕδατος
      εἰσιόντος.

  - name: TX_120a
    index: 0x0a
    text: |-
      Δεῖξον τὴν
      Ἀνδρείαν, Σοφίαν
      καὶ Δύναμίν σου.
      Ἡ ὁδὸς εἰς τὸ
      πάλαι τότε
      ἀνοιχθήσεται.

  - name: TX_120b
    index: 0x0b
    text: |-
      \right4 \up2 \right2

  - name: TX_120c
    index: 0x0c
    text: |-
      \up2 \left1 \up2 \right1 \up1

  - name: TX_120d
    index: 0x0d
    text: |-
      \left2 \up1 \left3

  - name: TX_120e
    index: 0x0e
    text: |-
      \down1 \left3 \up1 \left3

  - name: TX_120f
    index: 0x0f
    text: |-
      \down1 \right1 \down2 \left2 \down3

  - name: TX_1210
    index: 0x10
    text: |-
      \right1 \down1 \right2 \up1 \right1
      \up1 \right2

  - name: TX_1211
    index: 0x11
    text: |-
      Βῆμά ἐστιν εἰς
      τὸ ἔχειν
      \col(1)βιβλίον\col(0).

  - name: TX_1212
    index: 0x12
    text: |-
      \call(TX_1211)
      Θήσεις τὸ
      \col(1)Βιβλίον
      τῶν Σφραγίδων\col(0)
      ὧδε;
        \opt()Ναί \opt()Οὔ

  - name: TX_1213
    index: 0x13
    text: |-
      \pos(2)Δέξαι τὸν ἆθλον
      ἡμῶν, ὦ δυνατέ!

- group: 0x13
  data:
  - name: TX_1300
    index: 0x00
    text: |-
      \pos(2)Τί ἤνεγκας
      ἐνώπιόν μου;

  - name: TX_1301
    index: 0x01
    text: |-
      \pos(2)\col(1)Σπέρματα τοῦ
      Μυστηρίου\col(0)!\stop
      Ἡ \col(3)Ναϋροὺ\col(0) ποθεῖ
      \col(1)Σπέρματα τοῦ
      Μυστηρίου\col(0) ὑπὲρ
      πάντα! Χαρήσεται
      σφόδρα! Τί τὸ
      ὄνομά σου, ὦ
      παῖ;\stop
      ...\Link; Δίδωμι
      μισθόν, \Link.

  - name: TX_1302
    index: 0x02
    text: |-
      \pos(2)Ἔνεγκε αὐτὸ ὧδε.

  - name: TX_1303
    index: 0x03
    text: |-
      \pos(2)\Link, οὗτός
      ἐστιν ὁ μισθός
      σου. Λάβε αὐτὸν
      μετὰ χάριτος.

  - name: TX_1304
    index: 0x04
    text: |-
      \pos(2)Τὸ βασίλειόν μου
      μέγα ἐστίν--οὐ
      δυνήσῃ εὑρεῖν
      τὴν ἔξοδον
      μόνος.

  - name: TX_1305
    index: 0x05
    text: |-
      \pos(2)Ἆρα ὁ παῖς οὗτος
      δυνήσεται
      ἐπανελθεῖν;

  - name: TX_1306
    index: 0x06
    text: |-
      \pos(2)Ὤ... Κληθήσομαι
      μεγάλη
      βασίλισσα...\n
    null_terminator: False

  - name: TX_1307
    index: 0x07
    text: |-
      \pos(2)\col(3)Ναϋρού\col(0), Προφῆτι
      τῶν Αἰώνων, δός
      μοι ἡμέραν
      ἀτέλεστον, ἵνα ὁ
      λαὸς ἐργάζηται
      ἀπαύστως! Νέοι
      καὶ πρεσβύτεροι
      ἐργάσονται εἰς
      τὸ θέλημά μου!

  - name: TX_1308
    index: 0x08
    text: |-
      \pos(0)Τίς ὁ θόρυβος
      οὗτος;!;

  - name: TX_1309
    index: 0x09
    text: |-
      \pos(0)Ἀληθῶς σὺ εἶ ἡ
      \col(3)Ναϋρού\col(0); Ἄλλη
      φαίνῃ...
      Ἀγαθὴ φαίνῃ...

  - name: TX_130a
    index: 0x0a
    text: |-
      \pos(0)Αἰῖῖ!
      Τί ποιεῖτε;
      Λάβετε αὐτούς!
      Νῦν!

  - name: TX_130b
    index: 0x0b
    text: |-
      \pos(0)Ἆ ἆ ἆ ἆ!\stop
      Ὁ \col(3)Μέλας Πύργος\col(0)
      τέλος ἐτελέσθη!
      Δυνάμεις τοῦ
      σκότους, ἔλθετε
      πρός με!

  - name: TX_130c
    index: 0x0c
    text: |-
      \pos(0)Ἆ! Αἱ δυνάμεις
      τοῦ σκότους
      ῥέουσι δι' ἐμοῦ!
      Αὐξάνονται! Ἆ!
      Καὶ ἄνευ τῆς
      δυνάμεως τῆς
      \col(3)Ναϋρού\col(0), δύναμαι
      στῆσαι χρόνον!
      Νῦν τὸ ἀληθὲς
      σκότος ἔρχεται!
      Ἡ λύπη τοῦ λαοῦ
      δοθήσεταί μοι,
      ἅπτουσα τὴν
      Φλόγα τῆς Λύπης!
      Ἆ ἆ ἆ ἆ!

  - name: TX_130d
    index: 0x0d
    text: |-
      \pos(0)Οὐδεὶς κωλύσει
      τὴν \col(3)Βερὰν\col(0) νῦν!
      Μόνον ἀναμένετε
      τὴν Φλόγα τῆς
      Λύπης ἁφθῆναι!
      Ὡς καλὴ θέα! Πᾶς
      ἄνθρωπος αἰσθά-
      νεται τῆς λύπης!
      Ἆ ἆ ἆ ἆ!

  - name: TX_130e
    index: 0x0e
    text: |-
      \pos(2)\Link!
      Σέσωσαι!
      Ἐκάλεσα τοὺς
      ἱππέας μου ἐκ
      τοῦ βασιλείου
      βοηθῆσαι ἐπεὶ
      ἐκλείσθης ἐντὸς
      τοῦ πύργου...

  - name: TX_130f
    index: 0x0f
    text: |-
      \pos(2)\Link, χάριτι
      σῇ πάντες πάλιν
      καλῶς ἔχουσιν.
      Εὐχαριστῶ σοι.

  - name: TX_1310
    index: 0x10
    text: |-
      \pos(2)Ὁ \col(3)Ῥάλφ\col(0) ἐστὶν ὁ
      υἱωνὸς τοῦ
      υἱωνοῦ... τοῦ
      υἱωνοῦ μου! Καὶ
      σὺ ἔχεις θάρσος
      μέγα. Ἔσῃ τὸ
      καύχημα τοῦ λαοῦ
      μου.

  - name: TX_1311
    index: 0x11
    text: |-
      \pos(2)Ὡς ἀναιδής! Ἔτι
      νέα εἰμί! Μὴ
      κάλει με γραῦν!

  - name: TX_1312
    index: 0x12
    text: |-
      \pos(3)Πάντα καλῶς ἔχει
      ἐν τῷ αἰῶνι
      τούτῳ! Ἐπάνελθε
      ἀφόβως. Οὐ μὴ
      ἐπιλαθώμεθά σου.

  - name: TX_1313
    index: 0x13
    text: |-
      \pos(2)Σὺ εἶ πάντως...
      ὁ \col(3)Ῥάλφ\col(0), ἐκ τοῦ
      γένους τῆς
      \col(3)Ἄμβι\col(0)...\stop
      Ἆ! Οὐκ ἔχω
      καιρὸν διὰ
      μικρόν τινα!
      Ἄπελθε!\stop
      Ἢ θέλεις μάχε-
      σθαί μοι; Μὴ
      ποίει με γελᾶν!\stop
      Ἄφρων! Τοῦτό
      ἐστι τὸ σῶμα τῆς
      \col(3)Ἄμβι\col(0), τῆς προγό-
      νου σου. Ἐὰν
      ἀνέλῃς με,
      ἀφανισθήσῃ ἐκ
      τοῦ κόσμου!\stop
      Ἔτι θέλεις
      μάχεσθαι;

  - name: TX_1314
    index: 0x14
    text: |-
      \pos(2)Ὦ \Link!\stop
      Διὰ τὴν χρηστό-
      τητά μου ὁ νέος
      \col(3)Ῥάλφ\col(0) ἔτι ζῇ.
      Ἀλλ' ἔτι μάχῃ
      μοι! Ἐὰν βλάψῃς
      τὸ σῶμα τῆς
      \col(3)Ἄμβι\col(0), ὁ \col(3)Ῥάλφ\col(0)
      ἀφανισθήσεται.\stop
      Οὐ μὴ θελήσῃς
      ἀνελεῖν τὸν
      φίλον σου τῇ
      ἰδίᾳ
      χειρί!
      Ἆ ἆ ἆ ἆ!

  - name: TX_1315
    index: 0x15
    text: |-
      \pos(1)Ἔρχῃ παρὰ τὴν
      νουθεσίαν μου;
      Οὐ τιμᾷς τὴν
      ζωήν; Ἢ μωρὸς
      εἶ; Ὅμως οὐ
      ῥᾴδιον ἔσται!
      Διδάξω σε!\stop
      Οὐκ ἔσομαι ἵλεως
      ὡς πρότερον!

  - name: TX_1316
    index: 0x16
    text: |-
      Ὁ \col(3)Πύργος τῆς
      Ἄμβι\col(0) ταχέως
      τελεσθήσεται!

  - name: TX_1317
    index: 0x17
    text: |-
      Ὅταν ὁ Πύργος
      τῆς Ἄμβι τελε-
      σθῇ, μνησθήσον-
      ταί μου ὡς τῆς
      μεγίστης τῶν
      βασιλισσῶν!

  - name: TX_1318
    index: 0x18
    text: |-
      \Link! Τί
      ἐγένετο; Δοκῶ
      ὡς ἐν κακῷ
      ἐνυπνίῳ ληφθεῖ-
      σα... Ὡς κακίας
      οἰκησάσης ἐν τῷ
      σώματί μου...

  - name: TX_1319
    index: 0x19
    text: |-
      Τί; Δεῖ με
      ἀπελθεῖν εὐθύς!
      Βλέπω φόβον ἐν
      τοῖς ὀφθαλμοῖς
      σου. Ἔδει με
      πεισθῆναι...

  - name: TX_131a
    index: 0x1a
    text: |-
      Μὴ μερίμνα περὶ
      τῆς πόλεως. Ὁ
      \col(3)Ῥάλφ\col(0) κἀγὼ ὧδέ
      ἐσμεν. Σπούδασον
      σῶσαι τὴν
      \col(3)βασιλίδα Ζέλδαν\col(0).

- group: 0x14
  data:
  - name: TX_1400
    index: 0x00
    text: |-
      Αὕτη ἐστὶν ἡ
      \col(3)Κώμη Λύννης\col(0)...
      Ἀαα! Ὤ! Σύγγνωθί
      μοι! Οὐκ εἴχομεν
      νύκτα ἀπὸ
      ἡμερῶν τινων.

  - name: TX_1401
    index: 0x01
    text: |-
      Πάντες ἐν τῇ
      κώμῃ νυστάζουσιν
      σφόδρα.

  - name:
    - TX_1402
    - TX_1408
    - TX_1409
    - TX_140a
    - TX_140b
    - TX_140c
    - TX_140d
    - TX_140e
    - TX_140f
    - TX_1410
    - TX_1411
    - TX_1412
    - TX_1413
    index:
    - 0x02
    - 0x08
    - 0x09
    - 0x0a
    - 0x0b
    - 0x0c
    - 0x0d
    - 0x0e
    - 0x0f
    - 0x10
    - 0x11
    - 0x12
    - 0x13
    text: |-
      Πρωΐ ἐστιν;
      Μεσημβρία; Ἢ
      νύξ; Οὐκέτι
      οἶδα.

  - name: TX_1403
    index: 0x03
    text: |-
      Θόρυβός τις
      ἐστὶν ἐν τῷ
      \col(3)Βασιλείῳ Ἄμβι\col(0).

  - name: TX_1404
    index: 0x04
    text: |-
      Τέλος ἐστὶ τῷ
      κόσμῳ τούτῳ. Καὶ
      τὰ δάκρυά μου
      ἐξηράνθη.

  - name: TX_1405
    index: 0x05
    text: |-
      Ὤ... Ἡ ἐλπίς
      μου,
      τὰ ἐνύπνιά
      μου...
      Πάντα ἀπώλετο...

  - name: TX_1406
    index: 0x06
    text: |-
      Ἥρπασαν τὴν
      \col(3)βασιλίδα Ζέλδαν\col(0);
      Τοῦτο τὸ τέλος!

  - name: TX_1407
    index: 0x07
    text: |-
      Χαῖρε εἰς τὴν
      \col(3)Λύνναν\col(0), Κώμην
      τοῦ Χρόνου!

  - name: TX_1414
    index: 0x14
    text: |-
      Πρότερον ὥρμων
      εἰς πᾶν τὸ
      τυχὸν μέχρι
      πρὸ ὀλίγου...
      Ὡς χάσμα ἠνοίχθη
      ἐν τῇ καρδίᾳ
      μου.

  - name:
    - TX_1415
    - TX_1416
    index:
    - 0x15
    - 0x16
    text: |-
      Ἐκώλυσα τὸν
      \col(3)Ῥάλφ\col(0) εἰσιόντα
      εἰς τὸν πύργον,
      καὶ εἶπεν· "Οὐ
      μέλει μοι τί
      πείσομαι!"
      Ὅμοιός
      ἐστιν ἡμῖν.
      Οὐδὲν
      μέλει οὐκέτι.

  - name: TX_1417
    index: 0x17
    text: |-
      Χαῖρε πρωΐ!
      Χαῖρε
      μεσημβρίας!
      Χαῖρε ἑσπέρας!
      Χαῖρε νυκτός!
      Ἆ! Φιλῶ τοὺς
      ἀσπασμούς!

  - name:
    - TX_1418
    - TX_1419
    - TX_141a
    - TX_141b
    - TX_141c
    - TX_141d
    - TX_141e
    - TX_141f
    index:
    - 0x18
    - 0x19
    - 0x1a
    - 0x1b
    - 0x1c
    - 0x1d
    - 0x1e
    - 0x1f
    text: |-
      Ἐνόμιζον ὅτι
      οὐδὲν ἤλλακτο
      ὅτε ἡ \col(3)βασιλὶς
      Ζέλδα\col(0) ἦν ὧδε,
      ἀλλὰ νῦν ἀπελ-
      θούσης αὐτῆς, ὡς
      χάσμα ἠνοίχθη ἐν
      τῇ καρδίᾳ μου.

  - name: TX_1420
    index: 0x20
    text: |-
      Τὸ \col(3)Δένδρον Μακοὺ\col(0)
      ἕστηκεν ἐν τῷ
      τέλει τοῦ
      σπηλαίου τούτου.

  - name: TX_1421
    index: 0x21
    text: |-
      Ἡ αἴσθησις τοῦ
      χρόνου μου
      ἐταράχθη. Διὰ
      τί ἄρα...

  - name: TX_1422
    index: 0x22
    text: |-
      Ἡ \col(3)Ναϋρού\col(0), ἡ
      Προφῆτις τῶν
      Αἰώνων, ἐπανῆλ-
      θεν;!; Εὖγε!

  - name: TX_1423
    index: 0x23
    text: |-
      Καίπερ τῆς
      \col(3)Ναϋροὺ\col(0) ἐπανελ-
      θούσης, ὁ πύργος
      ἔτι αὐξάνεται!
      Κακὸν σημεῖον.

  - name: TX_1424
    index: 0x24
    text: |-
      Αἰσθάνομαι
      μυστικῆς δυνά-
      μεως ἐν τῷ
      \col(3)Δένδρῳ Μακού\col(0).

  - name:
    - TX_1425
    - TX_1426
    - TX_1427
    - TX_1428
    - TX_1429
    - TX_142a
    - TX_142b
    - TX_142c
    - TX_142d
    - TX_142e
    - TX_142f
    index:
    - 0x25
    - 0x26
    - 0x27
    - 0x28
    - 0x29
    - 0x2a
    - 0x2b
    - 0x2c
    - 0x2d
    - 0x2e
    - 0x2f
    text: |-
      Τὸ \col(3)Δένδρον Μακοὺ\col(0)
      σφόδρα χαίρει
      νῦν, οὐχί, ὦ
      καρδιοβόλε!

  - name: TX_1430
    index: 0x30
    text: |-
      Τὸ παίγνιον
      τοῦτο παρὰ τὸ
      ἔθος ἡμῶν ἐστιν,
      οἶδας...

  - name:
    - TX_1431
    - TX_1432
    - TX_1433
    index:
    - 0x31
    - 0x32
    - 0x33
    text: |-
      Οὐ δυνάμεθα
      ποιεῖν τοῦτο
      ἔτι!
      Ἄπελθε!!!

  - name: TX_1434
    index: 0x34
    text: |-
      Τί ἐστιν αὕτη ἡ
      σκυθρωπὴ ἀπορία
      ὅλως;

  - name:
    - TX_1435
    - TX_1436
    - TX_1437
    - TX_1438
    - TX_1439
    - TX_143a
    - TX_143b
    - TX_143c
    - TX_143d
    - TX_143e
    - TX_143f
    - TX_1440
    index:
    - 0x35
    - 0x36
    - 0x37
    - 0x38
    - 0x39
    - 0x3a
    - 0x3b
    - 0x3c
    - 0x3d
    - 0x3e
    - 0x3f
    - 0x40
    text: |-
      Θέλεις οὖν
      ἄρξασθαι πάλιν
      ἐξ ἀρχῆς;

  - name: TX_1441
    index: 0x41
    text: |-
      Οὐκ ἔστι προελ-
      θεῖν ἐντεῦθεν.
      Οὐδὲν ἄνω
      ἐτελέσθη, διὸ
      οὐκ ἔστιν εἴσο-
      δος. Ἄπελθε νῦν!

  - name: TX_1442
    index: 0x42
    text: |-
      Ἡ κώμη πάσχει
      ἐκ τῆς οἰκοδομῆς
      τοῦ πύργου τῆς
      \col(3)βασιλίσσης Ἄμβι\col(0),
      ἀλλὰ δεῖ διάγειν
      χρόνον μετὰ τῶν
      τέκνων. Ἒ! Καλὴ
      βολή!

  - name: TX_1443
    index: 0x43
    text: |-
      Ὁ υἱός μου
      ἐγένετο δεινὸς
      οὕτω ταχέως!
      Χαίρει σφόδρα
      ἐπεὶ οὐκ ἠδυνά-
      μεθα παίζειν ἅμα
      ἐπὶ πολύν.
      Καλὴ βολή!!!

- group: 0x15
  data:
  - name: TX_1500
    index: 0x00
    text: |-
      Ἡ βασίλισσα ἦν
      λίαν χρηστὴ
      μέχρι πρὸ
      ὀλίγου.
      Ἐρώτησον τὸν
      πρεσβύτερον τῆς
      κώμης περὶ
      αὐτῆς.
      Οἰκεῖ πέραν τοῦ
      ποταμοῦ, ἐγγὺς
      τοῦ πύργου.

  - name: TX_1501
    index: 0x01
    text: |-
      Ὁ ἀνήρ μου
      ἐπέμφθη ἐργάζε-
      σθαι ἐν τῷ
      \col(3)Μέλανι Πύργῳ\col(0).
      Ἴσως οὐκέτι
      ὄψομαι αὐτόν.

  - name: TX_1502
    index: 0x02
    text: |-
      Ἐὰν κακολογῇς
      τὴν βασίλισσαν,
      βάλλῃ εἰς φυλα-
      κήν. Χαλεπή ἐστι
      νῦν.

  - name: TX_1503
    index: 0x03
    text: |-
      Ἡ \col(3)βασίλισσα Ἄμβι\col(0)
      ἄλλη φαίνεται
      νῦν. Ἀεὶ τετα-
      ραγμένη δοκεῖ.

  - name: TX_1504
    index: 0x04
    text: |-
      Ξένα πράγματα
      γίγνεται κύκλῳ.

  - name:
    - TX_1505
    - TX_1506
    index:
    - 0x05
    - 0x06
    text: |-
      Δεῖ με ποιῆσαι
      πάντα ἃ θέλω
      πρὶν μὴ δύνασθαι
      κινεῖσθαι ἔτι!

  - name: TX_1507
    index: 0x07
    text: |-
      Ἡ βασίλισσα
      πάλιν χρηστή
      ἐστιν ὡς
      πρότερον!

  - name:
    - TX_1508
    - TX_1509
    - TX_150a
    - TX_150b
    - TX_150c
    - TX_150d
    - TX_150e
    - TX_150f
    index:
    - 0x08
    - 0x09
    - 0x0a
    - 0x0b
    - 0x0c
    - 0x0d
    - 0x0e
    - 0x0f
    text: |-
      Ποθῶ τὰς παλαιὰς
      εἰρηνικὰς
      ἡμέρας.

  - name: TX_1510
    index: 0x10
    text: |-
      Ἡ \col(3)βασίλισσα Ἄμβι\col(0)
      εἶχε
      φίλον--ἄνδρα
      ναυτικόν. Ἀλλ'
      ἐξέπλευσέ ποτε
      καὶ οὐκ ἐπανῆλ-
      θεν. Οἰκοδομεῖ
      ὑψηλὸν πύργον
      ἵνα ζητῇ σημεῖον
      τῆς ἐπανόδου
      αὐτοῦ. Καλεῖται
      \col(3)Πύργος τῆς Ἄμβι\col(0).
      Κατανυκτικὸς
      λόγος ἦν...

  - name: TX_1511
    index: 0x11
    text: |-
      Ὀλίγοι ἔτι
      καλοῦσιν αὐτὸν
      \col(3)Πύργον τῆς Ἄμβι\col(0).
      Νῦν πάντες
      καλοῦσιν αὐτὸν
      \col(3)Μέλανα Πύργον\col(0).

  - name: TX_1512
    index: 0x12
    text: |-
      Οὐκ οἶδα πότερον
      κακή ἐστιν ἡ
      \col(3)βασίλισσα Ἄμβι\col(0)
      ἢ ἡ κόρη \col(3)Ναϋρού\col(0).
      Τί δοκεῖ σοι;

  - name:
    - TX_1513
    - TX_1514
    index:
    - 0x13
    - 0x14
    text: |-
      Ἠγάσθην τοῦ
      προσώπου τοῦ
      \col(3)Ῥάλφ\col(0) ὅτε ἐμνήσθη
      τῆς \col(3)Ναϋρού\col(0).
      Ἐρωτικὸς ἐφάνη.\heart

  - name:
    - TX_1515
    - TX_1516
    - TX_1517
    index:
    - 0x15
    - 0x16
    - 0x17
    text: |-
      Ὁ \col(3)Ῥάλφ\col(0) οὐκ
      ἐπανῆλθεν...
      Ἆ, οὐδὲν μέλει.

  - name:
    - TX_1518
    - TX_1519
    - TX_151a
    - TX_151b
    - TX_151c
    - TX_151d
    - TX_151e
    - TX_151f
    index:
    - 0x18
    - 0x19
    - 0x1a
    - 0x1b
    - 0x1c
    - 0x1d
    - 0x1e
    - 0x1f
    text: |-
      Ῥᾷον ἔχω νῦν
      εἰδυῖα ὅτι ἡ
      \col(3)βασίλισσα Ἄμβι\col(0)
      οὐ κακή ἐστιν,
      ἀλλὰ τί ἔσται τῇ
      \col(3)βασιλίδι Ζέλδᾳ\col(0);

  - name: TX_1520
    index: 0x20
    text: |-
      Οἰκοδομοῦσι
      πύργον πέραν τοῦ
      ποταμοῦ.

  - name: TX_1521
    index: 0x21
    text: |-
      Νῦν δὶς ἐποίησα
      τὸ ἄριστον--
      ἀκουσίως.

  - name: TX_1522
    index: 0x22
    text: |-
      Οἶδας τί;
      Ἐποίησα ἄριστον!

  - name: TX_1523
    index: 0x23
    text: |-
      Ἐποίησα δεῖπνον
      σήμερον μετὰ
      χρόνον πολύν.

  - name: TX_1524
    index: 0x24
    text: |-
      Ἄθυμός εἰμι.
      Οὐδὲν θέλω
      ποιεῖν.

  - name: TX_1525
    index: 0x25
    text: |-
      Χαλεπόν ἐστιν
      ἕψειν βρώματα
      πρωΐ, μεσημβρίας
      καὶ νυκτός!

  - name: TX_1526
    index: 0x26
    text: |-
      Πρότερον ἦν τι
      ὄπισθεν εἰς τὸ
      σφραγίζειν, ἀλλὰ
      νῦν ἓν μόνον
      παλαιὸν \col(1)βιβλίον\col(0)
      ἐστίν.

  - name: TX_1527
    index: 0x27
    text: |-
      Σοφὴ καλὴ γυνὴ
      ἀναγινώσκουσα
      βιβλίον ἐν
      βιβλιοθήκῃ παρὰ
      γαληνῇ
      θαλάσσῃ...
      Οὐ καλὴ θέα;
      Ἐγώ εἰμι, δήπου!

- group: 0x16
  data:
  - name: TX_1600
    index: 0x00
    text: |-
      Ἡ κώμη πλήρης
      ἐστὶ χοῦ ἐκ τοῦ
      πύργου. Οὐκ ἔστι
      τόπος
      περιπατεῖν,
      καὶ τὰ σκεύη
      πάντα ἐν τῇ
      οἰκοδομῇ ἐστιν.

  - name: TX_1601
    index: 0x01
    text: |-
      Πάντες οἱ ἄνδρες
      ἀπήχθησαν εἰς
      τὸν πύργον.
      Μόνοι
      οἱ γέροντες
      μένομεν.

  - name:
    - TX_1602
    - TX_1603
    index:
    - 0x02
    - 0x03
    text: |-
      Ἡ Προφῆτις τῶν
      Αἰώνων ἡ ἄρχουσα
      τοῦ χρόνου οἰκεῖ
      που ἐν τῇ γῇ
      ταύτῃ. Ἆρα
      ἀσθενεῖ νῦν;

  - name: TX_1604
    index: 0x04
    text: |-
      Τί γενήσεται τῷ
      κόσμῳ τούτῳ;

  - name:
    - TX_1605
    - TX_1606
    index:
    - 0x05
    - 0x06
    text: |-
      Θρασὺς νεανίας
      ὀνόματι \col(3)Ῥάλφ\col(0)
      εἰσέδραμεν εἰς
      τὸν \col(3)Μέλανα
      Πύργον\col(0).

  - name: TX_1607
    index: 0x07
    text: |-
      Ὁ υἱός μου
      ἐπανῆλθεν ἐκ τοῦ
      πύργου! Εἶτα
      εὐθὺς ἐξῆλθεν!
      Σφόδρα ἀνήσυχος
      παῖς ἐστιν!

  - name: TX_1608
    index: 0x08
    text: |-
      Τὶς ἐξεβράσθη
      πρὸς νότον.
      Σουβρόσιός τις
      ἦν.

  - name: TX_1609
    index: 0x09
    text: |-
      Οὐκ ἔχω ἐλπίδα.
      Μόνον ἀναμένω
      ἡσύχως τὸ τέλος.

  - name:
    - TX_160a
    - TX_160b
    - TX_160c
    - TX_160d
    - TX_160e
    - TX_160f
    index:
    - 0x0a
    - 0x0b
    - 0x0c
    - 0x0d
    - 0x0e
    - 0x0f
    text: |-
      Χμ! Οὔπω καιρός
      ἐστιν ἀπελθεῖν
      με!

  - name: TX_1610
    index: 0x10
    text: |-
      Αὕτη ἐστὶν ἡ
      \col(3)Πόλις Λύννης\col(0).

  - name: TX_1611
    index: 0x11
    text: |-
      Λέγουσιν ὅτι ζῷά
      τινα ἐν τῇ ἐρήμῳ
      φιλοῦσι τοὺς
      ἀνθρώπους.

  - name: TX_1612
    index: 0x12
    text: |-
      Ἤκουσα ὅτι ἔστι
      θάλασσα οὗ
      οἰκοῦ-
      σιν οἱ Ζώρα.

  - name: TX_1613
    index: 0x13
    text: |-
      Εἶδες τὸ πλοῖον
      φαντασμάτων τὸ
      πλέον ἐν τῇ
      νοτίᾳ θαλάσσῃ;

  - name: TX_1614
    index: 0x14
    text: |-
      Ὁ πύργος ηὐξήθη
      ἐξαίφνης, καὶ ἡ
      κορυφὴ αἰσχρά
      ἐστιν. Τί ἐστιν
      ἐκεῖνο;

  - name:
    - TX_1615
    - TX_1616
    - TX_1617
    - TX_1618
    - TX_1619
    - TX_161a
    - TX_161b
    - TX_161c
    - TX_161d
    - TX_161e
    - TX_161f
    index:
    - 0x15
    - 0x16
    - 0x17
    - 0x18
    - 0x19
    - 0x1a
    - 0x1b
    - 0x1c
    - 0x1d
    - 0x1e
    - 0x1f
    text: |-
      Αὕτη ἐστὶν ἡ
      \col(3)Πόλις Λύννης\col(0).
      Ἡ πόλις οὗ ὁ
      χρόνος ῥεῖ
      ἀπαύστως!

  - name: TX_1620
    index: 0x20
    text: |-
      Τί ἤθελεν ἡ
      βασίλισσα;
      Σπέρματα Γρίφου;
      Αἰνίγματος;
      Μυστήριόν μοι!

  - name: TX_1621
    index: 0x21
    text: |-
      Τοῦτό ἐστιν! Ἡ
      βασίλισσα ἤθελε
      τὰ Σπέρματα
      Γρίφου! Πάντως
      ἐχάρη!

  - name: TX_1622
    index: 0x22
    text: |-
      Ἄλλος εἷς;!;\stop
      Πρῶτον ὁ ἔχων
      τὸν ξένον πῖλον
      ἐφάνη, εἶτα
      σύ...
      Ἀφ' οὗ ἦλθεν ἡ
      \col(3)Ναϋρού\col(0), πολλὰ
      ξένα γίγνεται!

- group: 0x17
  data:
  - name:
    - TX_1700
    - TX_1701
    index:
    - 0x00
    - 0x01
    text: |-
      Οἶδας τοὺς
      \col(3)Τοκαίους\col(0); Ἀκούω
      ὅτι ἔστι νῆσος
      πλήρης αὐτῶν
      πέραν θαλάσσης!

  - name: TX_1702
    index: 0x02
    text: |-
      Ἡ \col(3)Ναϋροὺ\col(0) ἠπάτησε
      τὴν \col(3)βασίλισσαν
      Ἄμβι\col(0), ναί;
      Ἤιδειν τοῦτο!

  - name: TX_1703
    index: 0x03
    text: |-
      Ὅτε ἡ \col(3)Ναϋροὺ\col(0)
      ἀφανίζεται, ἡ
      βασίλισσα αὐτὴ
      ξένως πράσσει!

  - name:
    - TX_1704
    - TX_1705
    - TX_1706
    index:
    - 0x04
    - 0x05
    - 0x06
    text: |-
      Ἡ βασίλισσα
      δοκεῖ ἄλλη
      γυνὴ εἶναι.

  - name:
    - TX_1707
    - TX_1708
    - TX_1709
    - TX_170a
    - TX_170b
    - TX_170c
    - TX_170d
    - TX_170e
    - TX_170f
    index:
    - 0x07
    - 0x08
    - 0x09
    - 0x0a
    - 0x0b
    - 0x0c
    - 0x0d
    - 0x0e
    - 0x0f
    text: |-
      Ἡ βασίλισσα
      μετεβλήθη ὅλως.
      Καλὸν ὅτι χρηστή
      ἐστι νῦν.

  - name: TX_1710
    index: 0x10
    text: |-
      Εὑρήσω τι ὃ
      ποθεῖ ἡ
      \col(3)βασίλισσα
      Ἄμβι\col(0), ἵνα μὴ
      ἐργάζωμαι ἐν τῷ
      \col(3)Πύργῳ τῆς Ἄμβι\col(0).

  - name: TX_1711
    index: 0x11
    text: |-
      Τί ἄρα θελήσει
      ἡ \col(3)βασίλισσα
      Ἄμβι\col(0) ὕστερον...

  - name: TX_1712
    index: 0x12
    text: |-
      Δοκοῦσιν εὐτυχὴς
      οἶκος. Εἴθε
      ἤμην μετ' αὐτῶν.

- group: 0x18
  data:
  - name: TX_1800
    index: 0x00
    text: |-
      Οὐκ ἦν νὺξ ἐπὶ
      πολλὰς ἡμέρας,
      ὡς
      τοῦ χρόνου
      στάντος.

  - name: TX_1801
    index: 0x01
    text: |-
      Ξένος τύπος
      ἐστὶν
      ἐγγὺς τῆς πύλης
      τοῦ \col(3)Δένδρου
      Μακού\col(0). Τί ἄρα
      ἐστίν;

  - name: TX_1802
    index: 0x02
    text: |-
      Ὅλην τὴν ἡμέραν,
      καθ' ἡμέραν,
      "χαῖρε πρωΐ!"

  - name:
    - TX_1803
    - TX_1804
    - TX_1805
    - TX_1806
    - TX_1807
    - TX_1808
    index:
    - 0x03
    - 0x04
    - 0x05
    - 0x06
    - 0x07
    - 0x08
    text: |-
      Ἄλλος εἷς ἀπήχθη
      ἐργάζεσθαι ἐν τῷ
      πύργῳ. Τί
      γίγνεται;

  - name: TX_1809
    index: 0x09
    text: |-
      Πάντες λέγουσιν
      ὅτι κακὴ τύχη
      ἐστὶν ἐγγίσαι τῷ
      πύργῳ.

  - name: TX_180a
    index: 0x0a
    text: |-
      Ὁ ἀνήρ μου ἔδωκε
      τῇ \col(3)βασιλίσσῃ
      Ἄμβι\col(0) ὃ ἀρέσκει
      αὐτῇ, ἀλλ' ὅμως
      ἀπήχθη εἰς τὸν
      \col(3)Μέλανα Πύργον\col(0).
      Θέλω αὐτὸν
      πάλιν.

- group: 0x1a
  data:
  - name:
    - TX_1a00
    - TX_1a01
    - TX_1a02
    index:
    - 0x00
    - 0x01
    - 0x02
    text: |-
      Τὸ \col(3)Δένδρον Μακοὺ\col(0)
      δένδρον λαλοῦν
      ἐστίν! Ἀλλὰ νῦν
      ἐνοχλεῖται ὑπὸ
      θηρίων...

  - name: TX_1a03
    index: 0x03
    text: |-
      Ξένος τις ἦλθεν
      εἰς τὴν κώμην.
      Οὐκ ἠδύνασο
      γνῶναι εἰ ἀνὴρ ἢ
      γυνὴ ἦν! Φοβερὸν
      ἦν!

  - name: TX_1a04
    index: 0x04
    text: |-
      Ὀργίζομαι
      σφόδρα!
      Καίπερ τοῦ
      πύργου
      τελεσθέντος, ὁ
      πατήρ μου οὐκ
      ἐπανῆλθεν!

  - name:
    - TX_1a05
    - TX_1a06
    - TX_1a08
    index:
    - 0x05
    - 0x06
    - 0x08
    text: |-
      Οἶδας τί
      σημαίνει
      "τὸ ἴδιον αἷμά
      μου"; Ὁ \col(3)Ῥάλφ\col(0)
      οἶδεν. Τί ἐστιν;

  - name: TX_1a07
    index: 0x07
    text: |-
      Δύναμαι παίζειν
      ὅπου ἂν θέλω!
      Ὡς ἡδύ!

  - name: TX_1a09
    index: 0x09
    text: |-
      Τί;!; Ἡ \col(3)βασιλὶς
      Ζέλδα\col(0) ἀπῆλθεν;;;

- group: 0x1b
  data:
  - name: TX_1b00
    index: 0x00
    text: |-
      Ἡ κώμη πλήρης
      ἐστὶ λίθων ἀφ'
      οὗ
      ἤρξατο τὸ ἔργον
      ἐν τῷ πύργῳ! Οὐ
      δύνασαι διελθεῖν
      ἄνευ \col(1)σκαπάνης\col(0)
      καθαρίσαι ὁδόν!

  - name: TX_1b01
    index: 0x01
    text: |-
      Ὤ! Πόσον χρόνον
      ἠργασάμην;;; Ἡ
      νὺξ οὐδέποτε
      ἔρχεται, διὸ οὐκ
      οἶδα. Θέλω
      ἀπελθεῖν εἰς
      οἶκον.

  - name: TX_1b02
    index: 0x02
    text: |-
      Ἡ \col(3)βασίλισσα Ἄμβι\col(0)
      μετεβλήθη. Οὐδέ-
      ποτε ἦν χαλεπή,
      ἀλλὰ νῦν ἀναγκά-
      ζει ἡμᾶς ποιεῖν
      ἀδύνατα. Ἀλλ'
      οὐκ
      ἤκουσας παρ'
      ἐμοῦ!

  - name: TX_1b03
    index: 0x03
    text: |-
      Δεινόν ἐστιν ἀφ'
      οὗ ἐφάνη ἡ κόρη
      \col(3)Ναϋρού\col(0). Νῦν δεῖ
      ἡμᾶς ἐργάζεσθαι
      ἀπαύστως!

  - name: TX_1b04
    index: 0x04
    text: |-
      Ὄρυσσε! Βάλλε!
      Ὄρυσσε!

  - name: TX_1b05
    index: 0x05
    text: |-
      Ἕλκε! Ὤθει!

- group: 0x1c
  data:
  - name:
    - TX_1c00
    - TX_1c01
    - TX_1c02
    - TX_1c03
    - TX_1c04
    - TX_1c05
    - TX_1c06
    index:
    - 0x00
    - 0x01
    - 0x02
    - 0x03
    - 0x04
    - 0x05
    - 0x06
    text: |-
      Τί ἔχει ἡ κώμη
      αὕτη; Οὐκ ἔχει
      δύναμιν!

  - name:
    - TX_1c07
    - TX_1c08
    - TX_1c09
    - TX_1c0a
    - TX_1c0b
    - TX_1c0c
    - TX_1c0d
    - TX_1c0e
    - TX_1c0f
    index:
    - 0x07
    - 0x08
    - 0x09
    - 0x0a
    - 0x0b
    - 0x0c
    - 0x0d
    - 0x0e
    - 0x0f
    text: |-
      Ἡ δύναμις πάντων
      ἐπανῆλθεν!

  - name: TX_1c10
    index: 0x10
    text: |-
      Χαῖρε! Μέμνησαί
      μου;
      ................\stop
      Ἐγώ εἰμι ἡ \col(3)Ῥόζα\col(0)!
      Ἐπελάθου ὅτι
      περιεπατήσαμεν
      ἅμα;!; Αὕτη
      ἐστὶν
      ἡ πρώτη μακρὰ
      ὁδός μου! Καὶ
      εἶδον ξένον τινὰ
      ἔχοντα ταύτην
      τὴν
      \col(1)σκαπάνην\col(0) ἣν
      εἶδον
      πρότερον, καὶ
      ἠρώτησα εἰ οἶδέ
      σε.\stop
      Εἶτα ἐχάρη
      σφόδρα
      καὶ ἀπῆλθε πηδῶν
      ποι. Ὡς ξένος.

  - name: TX_1c11
    index: 0x11
    text: |-
      Ἆρα ἐκείνη ἦν ἡ
      σὴ \col(1)σκαπάνη\col(0); Ἐὰν
      μὴ κρατῇς αὐτήν,
      ἴσως ἐκβρασθή-
      σεται εἰς
      θάλασσαν.

  - name: TX_1c12
    index: 0x12
    text: |-
      Ὁ σκοπὸς τῆς
      ὁδοῦ
      μου ἐστὶν "ἡ
      ἐλευθέρα γυνή",
      διὸ δεῖ σε
      ἀναμεῖναι ἄλλην
      συνάντησιν.

  - name: TX_1c13
    index: 0x13
    text: |-
      Χαῖρε, \Link!
      Ὁ Χορὸς Γορώνων
      θαυμάζεται ἐν
      τοῖς ὄρεσι τού-
      τοις! Ἀλλ' ὁ
      Χορὸς Σουβροσίων
      καλλίων ἐστίν.
      Οἱ Γόρωνες οὗτοι
      λείπονται ἔτι!

  - name: TX_1c14
    index: 0x14
    text: |-
      Ὁ Χορὸς Γορώνων
      καλός ἐστιν!
      Ποιήσω αὐτὸν
      γνωστὸν καὶ ἐν
      τῇ Σουβροσίᾳ!

  - name: TX_1c15
    index: 0x15
    text: |-
      Ὁ \col(3)Εὐσχήμων
      Γόρων\col(0) ἄριστός
      ἐστιν! Ἔσομαι ἡ
      \col(3)Εὐσχήμων
      Σουβροσία\col(0)!

- group: 0x1d
  data:
  - name: TX_1d00
    index: 0x00
    text: |-
      Εὐχαριστῶ.\stop
      Ἦλθες μακρόθεν
      ἐκ τῆς \col(3)Ὑρούλης\col(0),
      ναί; Χαίρω
      ἰδοῦσά
      σε. Ἐγώ εἰμι ἡ
      \col(3)Ναϋρού\col(0). Ἐφοβού-
      μην ἀκούσασα ὅτι
      ἡ \col(3)Λαβρύννα\col(0)
      πείσεται κακὰ
      πολλά.

  - name: TX_1d01
    index: 0x01
    text: |-
      \pos(2)\Link...
      Ἆ! Καλῶς ἐποίη-
      σας! Πρῶτον
      εἴασάς με διελ-
      θεῖν τὸ φράγμα,
      νῦν δὲ φέρεις
      μοι
      \col(1)Σπέρματα τοῦ
      Μυστηρίου\col(0)! Καλὸς
      παῖς! Τὸ ἀπατᾶν
      τὴν χρηστότητα
      ῥᾴδιόν ἐστιν!
      Οὕτως ἓν ἔλαττον
      κωλύει τὰς
      βουλάς
      μου. Ἀλλὰ φεῦ,
      τὰ
      \col(1)Σπέρματα τοῦ
      Μυστηρίου\col(0) ἀηδῆ
      ἐστιν! Ἡ ὄψις
      καὶ
      ἡ ὀσμή... Χμ!
      Ὅμως!

  - name: TX_1d02
    index: 0x02
    text: |-
      \pos(2)\col(3)Βασίλισσα
      Ἄμβι\col(0)...
      Νῦν τῇ δυνάμει
      μου ἡ ῥοὴ τοῦ
      χρόνου ὑπὸ σέ
      ἐστιν. Ποιήσω
      σοι
      ἡμέραν
      ἀτέλεστον,
      ἵνα ὁ λαὸς μὴ
      καθεύδῃ καὶ τὸ
      ἔργον ἐν τῷ
      πύργῳ
      προβαίνῃ. Καὶ
      ὅταν ὁ πύργος
      φθάσῃ εἰς οὐρα-
      νόν, κληθήσῃ ἡ
      μεγίστη
      βασίλισσα
      πασῶν!

  - name: TX_1d03
    index: 0x03
    text: |-
      \pos(1)Ἒ ἓ ἓ ἕ! Ἐγγύτε-
      ρόν ἐσμεν τοῦ
      Αἰῶνος τῆς
      Σκιᾶς!
      Ἀλλ' οὔπω
      καιρός.
      Ἡ ἀληθὴς σκιὰ
      πεσεῖται ὅταν ὁ
      \col(3)Μέλας Πύργος\col(4)
      φθάσῃ εἰς
      οὐρανὸν
      κἀγὼ ἀναβῶ ἐπὶ
      τὸ ἄκρον αὐτοῦ!
      Τότε ἥξει...
      Ἒ ἓ ἕ...
      Ἆ ἆ ἆ ἆ!

  - name: TX_1d04
    index: 0x04
    text: |-
      Ἆ...
      \Link..;
      Ποῦ ἐσμεν;

  - name: TX_1d05
    index: 0x05
    text: |-
      \col(3)Ῥάλφ\col(0)!!! Σύγγνωθί\stop
      μοι ὅτι ἐφόβησά
      σε. Καλῶς ἔχω
      νῦν. Ἐπανέλθωμεν
      εἰς τὸν ἴδιον
      αἰῶνα!

  - name: TX_1d06
    index: 0x06
    text: |-
      Εὐχαριστῶ,
      \Link!\stop
      Ἐρρύσω με ἀσφα-
      λῶς ἐκ τῆς
      χειρὸς
      τῆς \col(3)Βεράν\col(0). Νῦν
      πάντα τὰ ξένα τὰ
      γενόμενα ἐν τῇ
      γῇ ἀποκαταστα-
      θήσεται.

  - name: TX_1d07
    index: 0x07
    text: |-
      \col(3)Ῥάλφ\col(0)...
      Καθὼς εἶπας,
      βοηθήσω ὅσον
      δύναμαι!

  - name: TX_1d08
    index: 0x08
    text: |-
      Ὀλίγον ἔτι δύνα-
      μαι ποιῆσαι, διὸ
      ἐπάνειμι εἰς
      οἶκον νῦν. Ἐλθὲ
      ὅταν θέλῃς.

  - name: TX_1d09
    index: 0x09
    text: |-
      \Link,
      ἔχεις τὴν
      \col(1)Κινύραν τῶν
      Αἰώνων\col(0).\stop
      Θέλω σε ἔχειν
      αὐτὴν νῦν.
      Πάντως
      βοηθήσει σοι
      ἔτι.
      Νῦν διδάξω σε τὸ
      ἔσχατον \col(1)ᾆσμα\col(0), ὃ
      λύσει τὴν ἀληθῆ
      δύναμιν τῆς
      \col(1)Κινύρας τῶν
      Αἰώνων\col(0).

  - name: TX_1d0a
    index: 0x0a
    text: |-
      \pos(0)\Link...\stop
      Τί γίγνεται
      ἔνδον..;

  - name: TX_1d0b
    index: 0x0b
    text: |-
      \pos(0)\Link!!!
      Χαίρω σφόδρα ὅτι
      σέσωσαι!
      Χάρις τῷ Θεῷ!

  - name: TX_1d0c
    index: 0x0c
    text: |-
      \pos(0)Ἄγωμεν!

  - name: TX_1d0d
    index: 0x0d
    text: |-
      \pos(0)Οὐ θέλω χωρισθῆ-
      ναι, ἀλλὰ δεῖ
      ἡμᾶς ἐπανελθεῖν
      εἰς τὸν ἴδιον
      αἰῶνα!

  - name:
    - TX_1d0e
    - TX_1d0f
    index:
    - 0x0e
    - 0x0f
    text: |-
      Οὐκ ἐκφεύξῃ οὕτω
      ῥᾳδίως!

  - name: TX_1d10
    index: 0x10
    text: |-
      Ἐγώ εἰμι ἡ
      \col(3)Ναϋρού\col(4), Προφῆτις
      τῶν Αἰώνων.\stop
      Κρατεῖς ὄργανον
      καλούμενον
      \col(2)Κινύρα τῶν
      Αἰώνων\col(4). Οὐκ οἶδά
      σε, ἀλλ' οὐ κατὰ
      τύχην κρατεῖς
      νῦν τὴν \col(2)κινύραν\col(4).
      Δυνατὸς εἶ
      ἐκλεκτὸς ὑπὸ τῶν
      ῥευμάτων τοῦ
      χρόνου.\stop
      Ἡ παρουσία σου
      σημαίνει ὅτι οὐκ
      εἰμὶ ἐν τῷ αἰῶνι
      τούτῳ ἔτι.\stop
      Ἔκρυψα τὴν
      \col(2)κινύραν\col(4) ὧδε,
      εἰδυῖα ὅτι τοῦτο
      γενήσεται.
      Παρατίθεμαί σοι
      τὴν \col(2)κινύραν\col(4)!
      Ψάλλων \col(2)ᾄσματά\col(4)
      τινα ἐν τῇ
      \col(2)Κινύρᾳ τῶν
      Αἰώνων\col(4), δύνασαι
      διελθεῖν τὸν
      χρόνον!\stop
      Διδάξω σε τὸ
      \col(2)ᾆσμα τῆς Ἠχοῦς\col(4)!

  - name: TX_1d11
    index: 0x11
    text: |-
      Ἐὰν ψάλῃς ἐκεῖνο
      τὸ \col(2)ᾆσμα\col(4), λύσεις
      τὰς δυνάμεις τῶν
      \col(3)Πυλῶν τοῦ Χρόνου\col(4)
      τῶν ἐν τῇ γῇ
      ταύτῃ.\stop
      Εἴσελθε εἰς
      \col(3)Πύλην
      τοῦ Χρόνου\col(4) ἵνα
      διέλθῃς εἰς
      ἄλλον αἰῶνα.\stop
      Ἐν τῇ ὁδῷ σου
      μαθήσῃ πλείονα
      \col(2)ᾄσματα\col(4) ἃ ἐάσει
      σε διελθεῖν τὸν
      χρόνον ἐλευθέρως
      ὅταν ψάλλῃς
      αὐτά.\stop
      Δέομαι, ἐκλεκτὲ
      δυνατέ, φύλαξον
      τὴν γῆν ταύτην
      ἐκ τῶν χειρῶν
      τοῦ
      πονηροῦ! Ἐλπίζω
      ἐπὶ σέ, ἄγνωστε
      δυνατέ.

  - name: TX_1d12
    index: 0x12
    text: |-
      \pos(2)\Link,
      δέομαι! Κώλυσον
      τὸν \col(3)Ῥάλφ\col(0)! Θέλει
      θῦσαι ἑαυτὸν
      ὑπὲρ
      τοῦ λαοῦ τοῦ
      αἰῶνος τούτου
      ἀναιρῶν τὴν
      \col(3)βασίλισσαν
      Ἄμβι\col(0)...
      Οὐκ ἐάσω τὸν
      \col(3)Ῥάλφ\col(0) ποιῆσαι
      τοιαύτην θυσίαν!

  - name: TX_1d13
    index: 0x13
    text: |-
      \pos(2)Ἡ \col(3)Ἴμπα\col(0) κἀγὼ
      εὑρήσομεν τρόπον
      δοῦναι ἰσχὺν
      τοῖς
      κατοικοῦσιν.
      Δέομαι, \Link,
      σῶσον τὸν \col(3)Ῥάλφ\col(0).

  - name: TX_1d14
    index: 0x14
    text: |-
      Καλῶς ἔχω.\stop
      \Link...
      Σὺ μόνος ἴσως
      δύνασαι κωλῦσαι
      τὴν \col(3)Βεράν\col(0). Ἀλλὰ
      πάντως ὁ \col(3)Ῥάλφ\col(0)
      βοηθήσει σοι.

  - name: TX_1d15
    index: 0x15
    text: |-
      \Link, σπεῦσον!
      Φοβοῦμαι μὴ ὁ
      \col(3)Ῥάλφ\col(0) ποιήσῃ τι
      προπετές!

  - name: TX_1d16
    index: 0x16
    text: |-
      Εὐχαριστῶ,
      \Link,
      Χάριτι σῇ ἡ
      \col(3)Πόλις Λύννης\col(0)
      πάλιν εἰρηνικὸς
      τόπος ἐστίν!

  - name: TX_1d17
    index: 0x17
    text: |-
      Ὅτε ἐνομίσαμεν
      ὅτι ἡ σκιὰ
      παύσεται,
      αὐξάνεται, καθὼς
      εἶπεν ἡ \col(3)Βεράν\col(0).
      \Link!
      Βοήθησον τῇ
      \col(3)Ζέλδᾳ\col(0)!

  - name: TX_1d18
    index: 0x18
    text: |-
      \Link, καλῶς
      ἔχεις;

  - name: TX_1d19
    index: 0x19
    text: |-
      Τέλος ἐνίκησας
      τὴν \col(3)Βεράν\col(0). Νῦν
      αἱ τεταραγμέναι
      ῥοαὶ τοῦ χρόνου
      ἀποκατασταθήσον-
      ται. Ἐπανέλθωμεν
      εἰς τὴν κώμην;

  - name: TX_1d1a
    index: 0x1a
    text: |-
      \pos(1)Ἥξω εἰς βοήθειάν
      σου!

  - name: TX_1d1b
    index: 0x1b
    text: |-
      \pos(2)Χρόνος, Φύσις...
      Δυνατὲ τῶν
      \col(1)οὐσιῶν\col(0), ἐγώ εἰμι
      ἡ \col(3)Δίν\col(0), Προφῆτις
      τῶν Καιρῶν.
      Σπεῦσον, \Link!
      Ἐνίκησας τὴν
      \col(3)Βεράν\col(0), ἀλλ' αἱ
      βουλαὶ τῆς
      \col(3)Διδυμορόβας\col(0) οὔπω
      ἐκωλύθησαν!\stop
      Αἱ σκοτειναὶ
      δυνάμεις τοῦ
      Βασιλέως τοῦ
      Πονηροῦ αὐξάνον-
      ται!

  - name: TX_1d1c
    index: 0x1c
    text: |-
      \pos(2)Αἱ δυνάμεις ἡμῶν
      τῶν Προφητίδων\stop
      ὁδηγήσουσί σε
      πρὸς τὴν
      \col(3)βασιλίδα
      Ζέλδαν\col(0)! Κατάβαλε
      τὴν \col(3)Διδυμορόβαν\col(0)
      καὶ κώλυσον τὴν
      ἀνάστασιν τοῦ
      Βασιλέως τοῦ
      Πονηροῦ \col(3)Γάνωνος\col(0)!\stop
      \Link, πάντως
      δύνασαι! Ἐπὶ σοὶ
      ἐλπίζομεν!

  - name: TX_1d1d
    index: 0x1d
    text: |-
      \pos(1)Εἴη ἡ θεία σκέπη
      τῆς Τριδυνάμεως
      μετὰ τοῦ δυνατοῦ
      τῶν \col(1)Οὐσιῶν τοῦ
      Χρόνου καὶ τῆς
      Φύσεως\col(0)!

  - name: TX_1d1e
    index: 0x1e
    text: |-
      \Link, ὁ
      δυνατός!
      Ἐνίκησας
      πολλοὺς πειρα-
      σμούς, καὶ ἔγνως
      τὰς \col(1)Οὐσίας τοῦ
      Χρόνου καὶ τῆς
      Φύσεως\col(0). Σὺ μόνος
      δύνασαι νικῆσαι
      τὴν \col(3)Διδυμορόβαν\col(0)!

  - name: TX_1d1f
    index: 0x1f
    text: |-
      Μυστικὴ δύναμις
      πληροῖ τὸ σῶμά
      σου!

  - name: TX_1d20
    index: 0x20
    text: |-
      Ἡ αἰτία τοῦ
      ἐλθεῖν τὴν \col(3)Βερὰν\col(0)
      εἰς τὴν γῆν
      ταύτην ἐπ' ἐμοί
      ἐστιν. Οὐκ ἐάσω
      τὸν \col(3)Ῥάλφ\col(0) φέρειν
      τὸ βάρος μόνον.

  - name: TX_1d21
    index: 0x21
    text: |-
      \Link!
      Πῶς ἔχεις;
      Ἄκουσόν μου.
      Μετὰ πάντα τὰ
      γενόμενα, ὁ
      \col(3)Ῥάλφ\col(0),
      ὡς ἄλλος ἀνήρ,
      ἤρξατο τῆς
      τέχνης
      τῆς μάχης. Ἀλλ'
      οὐκ ἐάσω αὐτὸν
      νικῆσαί με! Δεῖ
      με τελέσαι τὰ
      ἔργα μου ὡς
      Προφῆτις τῶν
      Αἰώνων πιστῶς.\stop
      Ἀλλ' ἓν
      μεριμνῶ--
      τὴν \col(3)Ἴμπαν\col(0). Τὸ
      ὄρνεον τοῦτο
      ἤνεγκέ μοι
      ἐπιστολὴν λέγου-
      σαν ὅτι ἡ \col(3)Ἴμπα\col(0)
      πορεύεται εἰς τὸ
      \col(3)Ὁλόδρουμ\col(0)... Ἆρα
      δεινόν τι πάλιν
      γίγνεται λάθρᾳ;
      Ἴσως μεριμνῶ
      λίαν...

  - name: TX_1d22
    index: 0x22
    text: |-
      Σύγγνωθί μοι,
      \Link.
      Ὁ \col(3)Ῥάλφ\col(0) ἀεὶ οὕτως
      ἐστὶ περὶ ἐμέ.
      Ἀλλ' αἰσθάνομαι
      ὅτι κακόν τι
      ἐγγίζει, καθὼς
      λέγει ὁ \col(3)Ῥάλφ\col(0)...

- group: 0x1e
  data:
  - name: TX_1e00
    index: 0x00
    text: |-
      Τί ἐστι τοῦτο;
      Χλωρὰ ἱμάτια...
      Κύριε, ἆρα
      φιλεῖς
      τὰς νύμφας τοῦ
      δρυμοῦ; Ὄνομά
      μοί ἐστι
      \col(3)Τίγγλος\col(0),
      ὁ μόνος! Ἀληθὴς
      νύμφη εἰμί!\stop
      Οἱ ἐν τῇ κώμῃ
      λέγουσιν ὅτι
      τριάκοντα πέντε
      ἐτῶν ὢν δεῖ με
      ἀνοῖξαι τοὺς
      ὀφθαλμούς...
      Ἀλλ' ἐγὼ λέγω
      ὅτι ὁ \col(3)Τίγγλος\col(0)
      μετεμψύχωσις
      νύμφης ἐστίν!
      Θέλεις τὸν
      \col(3)Τίγγλον\col(0) τὴν
      νύμφην φίλον;
        \opt()Ναί \opt()Οὐδαμῶς

  - name: TX_1e01
    index: 0x01
    text: |-
      Κύριε, πάντως
      φιλεῖς τὰς
      νύμφας
      τοῦ δρυμοῦ!\stop
      Θέλεις τὸν
      \col(3)Τίγγλον\col(0) τὴν
      νύμφην φίλον;
        \opt()Ναί \opt()Οὐδαμῶς

  - name: TX_1e02
    index: 0x02
    text: |-
      Οὐκοῦν ἀπὸ σήμε-
      ρον σὺ καὶ ὁ
      \col(3)Τίγγλος\col(0) φίλοι
      ἐσμέν!\stop
      Ναί! Ναί! Εἰς
      σημεῖον τῆς
      φιλίας ἡμῶν, ὁ
      \col(3)Τίγγλος\col(0) δώσει
      σοι τὸν \col(1)πίνακα\col(0)
      αὐτοῦ τὸν
      δεικνύν-
      τα τὴν ὁδὸν εἰς
      τὴν κρυπτὴν
      νῆσον!

  - name: TX_1e03
    index: 0x03
    text: |-
      ...Ὁρῶ! Ἐλπίζω
      μὴ μεταμεληθῆναί
      σε!

  - name: TX_1e04
    index: 0x04
    text: |-
      Ἐπάνελθε ὧδε
      ὅταν θέλῃς ἰδεῖν
      τὸν \col(3)Τίγγλον\col(0)! Ἐὰν
      λάβῃς πλείονα
      \col(1)Μυστικὰ
      Σπέρματα\col(0),
      ἀγαθόν τι ἴσως
      γενήσεται!

  - name: TX_1e05
    index: 0x05
    text: |-
      \call(TX_1e0c)\stop
      ...Ταῦτά ἐστι τὰ
      μαγικὰ ῥήματα ἃ
      ὁ Τίγγλος αὐτὸς
      ἐποίησα. Μὴ
      κλέψῃς αὐτά!

  - name: TX_1e06
    index: 0x06
    text: |-
      Τί ἐστι τοῦτο;
      Ἴδε πάντα τὰ
      \col(1)Μυστικὰ Σπέρματα\col(0)
      ἃ συνήγαγες! Ὁ
      \col(3)Τίγγλος\col(0) ἡ νύμφη
      δύναται ποιῆσαι
      τὴν \col(1)πήραν\col(0) σου
      φέρειν πλείονα
      σπέρματα!
      Ποιήσω;
        \opt()Ναί \opt()Οὔ

  - name: TX_1e07
    index: 0x07
    text: |-
      Καλῶς! Οὐκοῦν ὁ
      \col(3)Τίγγλος\col(0) ποιήσει
      τὴν μαγείαν
      αὐτοῦ.
      Κλεῖσον τοὺς
      ὀφθαλμούς σου!

  - name: TX_1e08
    index: 0x08
    text: |-
      Ἐπάνελθε ὅταν
      θέλῃς ἰδεῖν τὸν
      \col(3)Τίγγλον\col(0).

  - name: TX_1e09
    index: 0x09
    text: |-
      Ἆρα οἶδας καλλί-
      ονα \col(1)μυστήρια\col(0) ἢ ὁ
      \col(3)Τίγγλος\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_1e0a
    index: 0x0a
    text: |-
      ...Ὁρῶ!\n
    null_terminator: False

  - name: TX_1e0b
    index: 0x0b
    text: |-
      Οἶμαι ὅτι ὁ
      \col(3)Τίγγλος\col(0) κάλλι-
      στός ἐστιν.

  - name: TX_1e0c
    index: 0x0c
    text: |-
      \sfx(0xb5)Τίγγλε, Τίγγλε!
      Κουλοὺ-Λίμπα!

  - name: TX_1e0d
    index: 0x0d
    text: |-
      Τοῦτο οὐ καλόν
      ἐστιν ὅλως!!!
      \jump(TX_1e0b)
    null_terminator: False

  - name: TX_1e0e
    index: 0x0e
    text: |-
      Τί ἐστι τοῦτο;!;
      Ἄκων ὁμολογῶ,
      ἀλλὰ πολὺ
      καλλίων
      εἶ τοῦ
      \col(3)Τίγγλου\col(0)...
      Ἀνθ' ὧν ἐδίδαξάς
      με τοῦτο, ποιήσω
      σε δύνασθαι
      φέρειν πλείονα
      \col(1)σπέρματα\col(0)!
      Κλεῖσον
      τοὺς ὀφθαλμούς!

  - name: TX_1e0f
    index: 0x0f
    text: |-
      Διδάξω σε τὸ
      \col(1)μυστήριον\col(0) τοῦ
      φέρειν πλείονα
      \col(1)σπέρματα\col(0) καὶ ἐν
      τῷ \col(3)Ὁλόδρουμ\col(0).\stop
      \secret1\stop
      Κάλεσόν με πάλιν
      ἐὰν ἐπιλάθῃ.

  - name: TX_1e10
    index: 0x10
    text: |-
      \call(TX_1e0c)
      Τὰ ῥήματα τοῦ
      \col(3)Τίγγλου\col(0) κάλλιστά
      ἐστιν! Μὴ κλέψῃς
      αὐτά!

- group: 0x20
  data:
  - name: TX_2000
    index: 0x00
    text: |-
      \sfx(0xc3)Χό... Ἐγώ εἰμι
      ὁ \col(3)Ῥίκι\col(0). Εἴωθα
      ὑπερπηδᾶν
      βόθρους
      καὶ κρημνοὺς τῷ
      ἰδίῳ ἅλματί
      μου...
      \jump(TX_2002)
    null_terminator: False

  - name: TX_2001
    index: 0x01
    text: |-
      \sfx(0xc3)Χό... \Link;
      Πολὺς χρόνος
      παρῆλθεν!\stop
      Εἰώθειν χαίρειν
      ὁρῶν σε...\n
    null_terminator: False

  - name: TX_2002
    index: 0x02
    text: |-
      Ἀλλ' οὐκ εὐθυμῶ
      νῦν... Ὁρᾷς...
      ἀπώλεσα τὰς
      τιμίας \col(1)χειρίδας\col(0)
      μου...

  - name: TX_2003
    index: 0x03
    text: |-
      Οἶμαι ὅτι κατέ-
      λιπον αὐτὰς παρὰ
      τῷ δένδρῳ ἐν τῷ
      αἰγιαλῷ, ἀλλ'
      οὐχ
      εὑρίσκω αὐτάς.

  - name: TX_2004
    index: 0x04
    text: |-
      \sfx(0xc3)Ἒ! Αἱ \col(1)χειρίδες\col(0)
      μου! Εὗρες
      αὐτάς!
      Εὐχαριστῶ!\stop
      Νῦν βοηθήσω σοι
      εὑρεῖν ὃ ζητεῖς!
      Εἴσελθε εἰς τὸν
      μάρσιππόν μου!

  - name: TX_2005
    index: 0x05
    text: |-
      \sfx(0xc3)Πίεσον \abtn
      παῖσαι,
      ἢ σύναξον ἰσχὺν
      ἀφεῖναι λαίλαπα.
      Δύναμαι καὶ
      πηδᾶν μικροὺς
      βόθρους ἢ
      πέτρας.

  - name: TX_2006
    index: 0x06
    text: |-
      \sfx(0xc3)Οἶμαι ὅτι εὗρες
      ὃ ἐζήτεις...
      Τοῦτο μεταξὺ σοῦ
      κἀμοῦ, ἀλλ' οὐ
      φέρω τοῦτον, διὸ
      ὄψομαί σε αὖθις!

  - name: TX_2007
    index: 0x07
    text: |-
      Οὐκ ἔστιν ἐκεῖ
      ὃ ζητεῖς;

  - name: TX_2008
    index: 0x08
    text: |-
      \sfx(0xc3)Ἐὰν κινηθῇς πρὸς
      βόθρον, ὑπερπη-
      δήσω εὐθύς.
      Δύναμαι πηδᾶν
      ἕνα βόθρον
      ῥᾳδίως.
      Πείρασον αὐτό.

  - name: TX_2009
    index: 0x09
    text: |-
      \sfx(0xc3)Κρημνὸς τοιοῦτος
      ἓν ἅλμα ἐστίν.
      Πηδήσω ἐὰν
      προσέλθῃς αὐτῷ.
      Πείρασον αὐτό.

  - name: TX_200a
    index: 0x0a
    text: |-
      \sfx(0xc3)Ὤ! Σύγγνωθί μοι,
      ἀλλὰ λίαν θερμόν
      ἐστιν ἐκεῖ
      ἔνδον!

- group: 0x21
  data:
  - name: TX_2100
    index: 0x00
    text: |-
      \pos(2)\sfx(0xc4)Διί! Διί!

  - name: TX_2101
    index: 0x01
    text: |-
      \sfx(0xc4)Σχεδὸν κατεβρώ-
      θην! Ἐγώ εἰμι ὁ
      \col(3)Δημήτριος\col(0).
      Κολυμβῶ ἐν τῇ
      θαλάσσῃ.
      \jump(TX_2103)
    null_terminator: False

  - name: TX_2102
    index: 0x02
    text: |-
      \sfx(0xc4)\Link! Σὺ εἶ!
      Ἔσωσάς με!
      Ἀγαθὸς φίλος εἶ.\n
    null_terminator: False

  - name: TX_2103
    index: 0x03
    text: |-
      Πορεύῃ ποι;
      Δύναμαι φέρειν
      σε.

  - name: TX_2104
    index: 0x04
    text: |-
      \sfx(0xc4)Ἐφθάσαμεν!
      Πορεύου μόνος
      νῦν. Χαῖρε!

  - name: TX_2105
    index: 0x05
    text: |-
      \sfx(0xc4)Πλανηθήσομαι ἐὰν
      προέλθω πόρρω!

  - name: TX_2106
    index: 0x06
    text: |-
      \sfx(0xc4)Δάκνω ὅταν
      πιέζῃς \abtn.\stop
      Καὶ κολυμβῶ ὡς
      ἰχθύς--καὶ ἀνὰ
      καταρράκτας.
      Δύνασαι αἴρειν
      με
      τῷ \col(1)Ψελίῳ τῆς
      Δυνάμεως\col(0).

  - name: TX_2107
    index: 0x07
    text: |-
      \sfx(0xc4)Δύνασαι αἴρειν
      καὶ βάλλειν με
      χρώμενος τῷ
      \col(1)Ψελίῳ τῆς
      Δυνάμεως\col(0). Θέλεις
      πειράσαι;

  - name: TX_2108
    index: 0x08
    text: |-
      \sfx(0xc4)Κολυμβῶ καὶ ἀνὰ
      καταρράκτας.
      Πείρασον!

  - name: TX_2109
    index: 0x09
    text: |-
      \sfx(0xc4)Λίαν θερμόν!
      Ζεῖ ὧδε! Πορεύου
      μόνος, \Link!

- group: 0x22
  data:
  - name: TX_2200
    index: 0x00
    text: |-
      \sfx(0xc5)Φ-φ-φάντασμα!
      Βοήθει!

  - name: TX_2201
    index: 0x01
    text: |-
      \sfx(0xc5)Μ-μὴ φάγῃς με!
      Κακῶς γεύομαι!

  - name: TX_2202
    index: 0x02
    text: |-
      \sfx(0xc5)...Τὰ φαντάσματα
      πάντα ἀπῆλθεν!

  - name: TX_2203
    index: 0x03
    text: |-
      \call(TX_2202)
      Ἐδίωξας αὐτά;
      Εὐχαριστῶ! Ἐγώ
      εἰμι ὁ \col(3)Μούς\col(0).
      Ἴσως βοηθήσω
      σοι.
      Ἀνάβηθι ἐπὶ τὸν
      νῶτόν μου.

  - name: TX_2204
    index: 0x04
    text: |-
      \call(TX_2202)
      \sfx(0xc5)!!!
      \Link;;;
      Δύναμαι βοηθῆσαί
      σοι ἐὰν θέλῃς,
      \Link.
      Ἀνάβηθι ἐπὶ τὸν
      νῶτόν μου.

  - name: TX_2205
    index: 0x05
    text: |-
      \sfx(0xc5)Πίεσον \abtn πέτε-
      σθαι, ἢ κάτεχε
      αὐτὸ ἵνα παίσῃς
      τὴν γῆν.\stop
      Ἀλλὰ τὸ ὕδωρ
      ἀσθένειά μου
      ἐστίν. Τὸ βραχὺ
      οὐδέν, ἀλλὰ βαθὺ
      ὕδωρ οὐ φέρω·
      φύλαξαι οὖν.

  - name: TX_2206
    index: 0x06
    text: |-
      \sfx(0xc5)Κάτεχε \abtn πληρῶ-
      σαι ἰσχύν. Ἐὰν
      ἀφῇς αὐτό, παίσω
      τὴν γῆν.
      Πείρασον
      αὐτό.

  - name: TX_2207
    index: 0x07
    text: |-
      \sfx(0xc5)Πέτομαι ἐὰν
      πιέζῃς \abtn. Ἐὰν
      κινῇ πετομένου
      μου, διαβήσῃ
      βόθρους.
      Πείρασον.

  - name: TX_2208
    index: 0x08
    text: |-
      \sfx(0xc5)Εὗρες ὃ ἐζήτεις;
      Χαίρω βοηθήσας.
      Ὄψομαί σε αὖθις.

  - name: TX_2209
    index: 0x09
    text: |-
      \sfx(0xc5)Οὐ θέλω
      προελθεῖν
      πόρρω...

  - name: TX_220a
    index: 0x0a
    text: |-
      \sfx(0xc5)Φεῦ! Θερμόν!\stop
      Οὐ φέρω τοσοῦτον
      καῦμα. Σύγγνωθι.

- group: 0x23
  data:
  - name: TX_2300
    index: 0x00
    text: |-
      Οἱ ὀκνηροί,
      ἄχρηστοι μωροί!\stop
      Ὅτε οἰκοδομοῦμεν
      τὴν γέφυραν πρὸς
      τὰ \col(3)Ἐρείπια τῆς
      Πόλεως
      Συμμετρίας\col(0),
      ἀπέρχονται εἰς
      ἀνάπαυσιν! Μένω
      καὶ μένω, ἀλλ'
      οὐκ
      ἐπανέρχονται!

  - name: TX_2301
    index: 0x01
    text: |-
      \call(TX_2300)
      Οὐ μὴ τελέσωμεν
      τὴν γέφυραν
      οὕτως!
      Ἀπῆλθον ἂν
      εὑρεῖν
      αὐτούς, ἀλλ' ἡ
      γῆ ὧδε τραχεῖά
      ἐστιν!\stop
      Οὐδεὶς δύναται
      διελθεῖν μόνος!
      Φεῦ! Τίς ἀπορία!

  - name: TX_2302
    index: 0x02
    text: |-
      \call(TX_2300)\stop
      Ἄγε, ἑταῖρε.
      Δύνασαι εὑρεῖν
      τοὺς ὀκνηροὺς
      ἐκείνους μοι;
        \opt()Ναί \opt()Σύγγνωθι

  - name: TX_2303
    index: 0x03
    text: |-
      Ἄπελθε οὖν!
      Ὀκνηρὲ παῖ!

  - name: TX_2304
    index: 0x04
    text: |-
      Εὐχαριστῶ,
      ἑταῖρε!
      Ἄπελθε οὖν νῦν!\n
    null_terminator: False

  - name: TX_2305
    index: 0x05
    text: |-
      Ἐὰν ἀγάγῃς τοὺς
      τρεῖς ὀκνηροὺς
      ὧδε, ἐργασόμεθα
      ἐπὶ τῇ γεφύρᾳ.
      Ἀλλ' ἡ γῆ ὧδε
      τραχεῖά ἐστιν,
      διὸ οὐ δυνήσῃ
      μόνος. Εἶεν;
        \opt()Εἶεν \opt()Τί;

  - name: TX_2306
    index: 0x06
    text: |-
      Ἐὰν ἀγάγῃς τοὺς
      τρεῖς ὀκνηροὺς
      ὧδε, τελέσομεν
      τὴν γέφυραν.

  - name: TX_2307
    index: 0x07
    text: |-
      Οὔπω ἦλθες
      ἐκεῖσε!
      Ἢ ἀπαγορεύεις;
        \opt()Ναί \opt()Οὔ

  - name: TX_2308
    index: 0x08
    text: |-
      Ἀληθῶς! Ὄψομαί
      σε ὕστερον!

  - name: TX_2309
    index: 0x09
    text: |-
      Ζήτει οὖν ἔτι!

  - name: TX_230a
    index: 0x0a
    text: |-
      Ἆ ἆ! Τέλος ὧδέ
      εἰσιν! Ἐβράδυνον
      μόνον! Ἄγετε εἰς
      τὸ ἔργον! Οὐκέτι
      ἀνάπαυσις ἕως ἂν
      τελεσθῇ ἡ
      γέφυρα!

  - name: TX_230b
    index: 0x0b
    text: |-
      Τί; Ἤδη ἐτελέσα-
      τε; Ἄρα δύνασθε
      ἐργάζεσθαι,
      μωροί!
      Ἀλλ' οὐκ ἔστι
      καιρὸς
      ἀναπαύσεως!
      Ἐπὶ τὸ ἄλλο
      ἔργον!

  - name: TX_230c
    index: 0x0c
    text: |-
      Ὁ ἐπιστάτης μου
      δύσκολος ἀνήρ!
      Οὐδὲν ἐργάζεται,
      ἀλλὰ μέμφεται!

  - name: TX_230d
    index: 0x0d
    text: |-
      Κελεύει
      οἰκοδομεῖν
      γέφυραν πρὸς τὰ
      \col(3)Ἐρείπια τῆς
      Πόλεως
      Συμμετρίας\col(0),
      ἀλλ' οὐδεὶς
      μένει
      χρήσασθαι αὐτῇ.
      Οὐκ ἐπείγει, οὐ
      δοκεῖ σοι;

  - name: TX_230e
    index: 0x0e
    text: |-
      Ἆ! Καλὴ ἡμέρα!
      Ἐπιλαθοῦ τοῦ
      ἔργου! Ἴσως
      γράψω
      ποίημα...

  - name: TX_230f
    index: 0x0f
    text: |-
      Ἆ; Ὁ ἐπιστάτης;\stop
      Ἀλλ' ἤθελον
      μεῖναι μικρὸν
      ἔτι... Ἀλλ'
      ἐπανελεύσομαι...

  - name: TX_2310
    index: 0x10
    text: |-
      Οὐδαμῶς! Μὴ
      νομίσῃ ὅτι φεύγω
      τὸ ἔργον!

  - name: TX_2311
    index: 0x11
    text: |-
      Ναίιι,
      ἐπιστάτα...

  - name: TX_2312
    index: 0x12
    text: |-
      Ἐτελέσαμεν,
      ἐπιστάτα!

  - name: TX_2313
    index: 0x13
    text: |-
      Ἤκουσας περὶ τῆς
      \col(1)Κόνεως τῶν
      Νυμφῶν\col(0);\stop
      Οἱ μῦθοι
      λέγουσιν
      ὅτι ἀποκατέστησε
      βασίλισσαν ἐκ
      κατάρας.
      Λέγουσιν
      ὅτι ἡ \col(1)Κόνις τῶν
      Νυμφῶν\col(0)
      ἐφυλάσσετο
      ὄπισθεν πάλαι!\stop
      Οὐκ οἶδα εἰ
      ἀληθές ἐστιν,
      ἀλλὰ καλόν
      ἐστιν.

  - name: TX_2314
    index: 0x14
    text: |-
      Ζητῶ ἐρωτικὸν
      ποίημα, ἀλλ'
      οὐδὲν
      καλὸν εὑρίσκω...
      Πῶς δοκεῖ
      τοῦτο...
      "Τὰ ῥόδα ἐρυθρά,
      τὰ ἴα ἐστίν..."

- group: 0x24
  data:
  - name: TX_2400
    index: 0x00
    text: |-
      \sfx(0xc7)Χαῖρε!\stop
      Ἐγώ εἰμι ἡ πρώτη
      γενεὰ τῶν
      Εὐσχημόνων
      Χορευτῶν! Οὗτός
      ἐστιν ὁ οἶκος
      χοροῦ ἡμῶν! Δεῖ
      εἰδέναι τὸν
      χορὸν
      ἡμῶν ἵνα καλῆται
      τις Γόρων. Ἐὰν
      χορεύσῃς καλῶς,
      δώσω σοι
      \col(1)Σύμβολον
      τῆς Ἀδελφότητος\col(0)!
      Μία πεῖρα 20
      δραχμῶν. Χορεύ-
      σωμεν;
        \opt()Ναί \opt()Οὔ

  - name: TX_2401
    index: 0x01
    text: |-
      \sfx(0xc7)Χαῖρε!
      Ἐγώ εἰμι ἡ πρώτη
      γενεὰ τῶν
      Εὐσχημόνων
      Χορευτῶν! Οὗτός
      ἐστιν ὁ οἶκος
      χοροῦ μου. Ὁ
      Χορὸς Γορώνων
      θαυμάζεται ὑπὸ
      τῶν νέων
      Γορώνων.
      Κάλλιστός
      ἐστιν!!!\stop
      Θέλεις χορεῦσαι;
      20 δραχμαί.
        \opt()Εἶεν \opt()Οὔ,
      χάρις

  - name:
    - TX_2402
    - TX_2422
    index:
    - 0x02
    - 0x22
    text: |-
      \sfx(0xc7)Δηλώσω σοι τὸν
      χορόν;
        \opt()Οὔ \opt()Ναί

  - name:
    - TX_2403
    - TX_2423
    index:
    - 0x03
    - 0x23
    text: |-
      \sfx(0xc7)Οὐκ ἀπωθούμεθα
      τὸν ἐρχόμενον,
      οὐδὲ διώκομεν
      τὸν
      ἀπιόντα. Ἐλθὲ
      ὅταν θέλῃς.

  - name:
    - TX_2404
    - TX_2424
    index:
    - 0x04
    - 0x24
    text: |-
      \sfx(0xc7)Πρόσεχε τῇ
      διδαχῇ μου.
      Ἀκούσεις τὸν
      ῥυθμὸν ἀρχομένου
      τοῦ χοροῦ. Δεῖ
      σε
      ἐπαναλαβεῖν τὸν
      ῥυθμόν. Δύο εἴδη
      ἐστίν.

  - name:
    - TX_2405
    - TX_2425
    index:
    - 0x05
    - 0x25
    text: |-
      \sfx(0xc7)Πίεσον \bbtn κινεῖ-
      σθαι πρὸς τοῦτον
      τὸν ἦχον!

  - name:
    - TX_2406
    - TX_2426
    index:
    - 0x06
    - 0x26
    text: |-
      \sfx(0xc7)Πίεσον \abtn στῆναι
      ἐν σχήματι ὅταν
      ἀκούσῃς τοῦτον
      τὸν ἦχον! Ὀκτὼ
      περίοδοί εἰσιν.
      Χόρευσον καλῶς
      ἐν ἓξ ἵνα λάβῃς
      ἆθλον! Ἐὰν
      ἁμάρτῃς τρίς,
      ἡττᾷ.\stop
      Τὸ πειρᾶν μαθεῖν
      ἐστιν! Συνίης;
        \opt()Ναί \opt()Οὔ

  - name:
    - TX_2407
    - TX_2427
    index:
    - 0x07
    - 0x27
    text: |-
      \sfx(0xc7)Οὐ μέλει ἡμῖν
      πῶς
      χορεύεις, ἐὰν
      μόνον ἔχῃς
      ῥυθμόν!
      Ἆρα ἀγαθὸς
      χορευτής εἰμι;

  - name:
    - TX_2408
    - TX_2428
    index:
    - 0x08
    - 0x28
    text: |-
      \sfx(0xc7)Ἓν... Δύο...\stop
      Ἓν, δύο, τρία!

  - name:
    - TX_2409
    - TX_2429
    index:
    - 0x09
    - 0x29
    text: |-
      \sfx(0xc7)Ἒ! Χρῄζεις
      πλειόνων
      δραχμῶν!

  - name:
    - TX_240a
    - TX_242a
    index:
    - 0x0a
    - 0x2a
    text: |-
      Δεινὸς χορευτὴς
      Γορώνων εἶ!
      Δύνασαι χορεύειν
      ἐν οἵᾳ τάξει
      θέλεις! Τίνα
      αἱρῇ;

  - name: TX_240b
    index: 0x0b
    text: |-
      \sfx(0xc7)\call(TX_240a)\stop
       \opt()Λευκόχρ.
      \opt()Χρυσῆν
       \opt()Ἀργυρᾶν

  - name:
    - TX_240c
    - TX_242c
    index:
    - 0x0c
    - 0x2c
    text: |-
      \sfx(0xc7)Λευκόχρυσον;

  - name:
    - TX_240d
    - TX_242d
    index:
    - 0x0d
    - 0x2d
    text: |-
      \sfx(0xc7)Χρυσῆν;

  - name:
    - TX_240e
    - TX_242e
    index:
    - 0x0e
    - 0x2e
    text: |-
      \sfx(0xc7)Ἀργυρᾶν;

  - name:
    - TX_240f
    - TX_242f
    index:
    - 0x0f
    - 0x2f
    text: |-
      \sfx(0xc7)Χαλκῆν;

  - name:
    - TX_2410
    - TX_2430
    index:
    - 0x10
    - 0x30
    text: |-
      \sfx(0xc7)Καλῶς ἐποίησας!
      Τοῦτο ποιεῖ σε
      ἀδελφὸν τῶν
      Γορώνων!\stop
      Καθὼς ὑπεσχόμην,
      ἰδού!

  - name:
    - TX_2411
    - TX_2431
    index:
    - 0x11
    - 0x31
    text: |-
      \sfx(0xc7)Πάντες οἱ
      Γόρωνες
      καλέσουσί σε
      φίλον!
      Χορεύοιμεν
      ἀεὶ ἅμα!

  - name:
    - TX_2412
    - TX_2432
    index:
    - 0x12
    - 0x32
    text: |-
      \sfx(0xc7)Τέλειον! Κάλλι-
      στον ἦν! Ἄγριον
      καὶ ἐλεύθερον
      ἦν,
      ὡς ἡ θάλασσα!
      Ποίημα ἐν
      κινήσει
      ἦν! Εὐχαριστῶ.
      Ἰδοὺ τὸ ἆθλόν
      σου.

  - name:
    - TX_2413
    - TX_2433
    index:
    - 0x13
    - 0x33
    text: |-
      \sfx(0xc7)Ἐτέλεσας \num1 ἐξ
      8 περιόδων!
      Εὖγε!
      Σχεδὸν ἴσος ἐμοὶ
      εἶ! Ἰδοὺ τὸ
      ἆθλόν
      σου!

  - name:
    - TX_2414
    - TX_2434
    index:
    - 0x14
    - 0x34
    text: |-
      \sfx(0xc7)Χρῶ τῷ σώματί
      σου
      ἵνα δείξῃς τὸν
      ζῆλόν σου πλέον!

  - name:
    - TX_2415
    - TX_2435
    index:
    - 0x15
    - 0x35
    text: |-
      \sfx(0xc7)Ὁ χορὸς καρδία
      ἐστίν! Ζῆλός
      ἐστιν!\stop
      Τὸ σῶμά σου δεῖ
      δεικνύναι τὸν
      ζῆλον! Πύρωσον
      αὐτό!!! Θέλεις
      πειράσαι πάλιν;
        \opt()Ναί \opt()Οὔ

  - name:
    - TX_2416
    - TX_2436
    index:
    - 0x16
    - 0x36
    text: |-
      \sfx(0xc7)Πρόσεχε! Εἶεν,
      ἡ ἑξῆς περίοδος!

  - name:
    - TX_2417
    - TX_2437
    index:
    - 0x17
    - 0x37
    text: |-
      \sfx(0xc7)Ἡττᾷ ἐὰν ἁμάρτῃς
      ἅπαξ ἔτι!

  - name:
    - TX_2418
    - TX_2438
    index:
    - 0x18
    - 0x38
    text: |-
      \sfx(0xc7)Φεῦ! Ἡττᾷ νῦν.

  - name: TX_2419
    index: 0x19
    text: |-
      \sfx(0xc7)Ἆ; \col(1)Σύστασίς\col(0)
      ἐστι παρ'
      ἀδελφοῦ;
      Τί ἐστι τοῦτο..;\stop
      Δοῦναί σοι τὴν
      \col(1)Κλεῖδα Σειρῆνος\col(0);
      Πῶς ἔγνω ὅτι ἔχω
      αὐτήν; Εἶεν...\stop
      Οὐ δύναμαι ἀρνή-
      σασθαι δέησιν
      ἀδελφοῦ. Ἀλλ' οὐ
      δώσω σοι αὐτὴν
      δωρεάν! Χόρευσον
      πρός με! Ἐὰν
      μιμήσῃ με, ἡ
      \col(1)Κλεὶς τῆς
      Σειρῆνος\col(0) σή
      ἐστιν.
      20 δραχμαί...
        \opt()Εἶεν \opt()Οὔ,
      χάρις

  - name: TX_241a
    index: 0x1a
    text: |-
      \sfx(0xc7)Οἵα ψυχή!\stop
      Ἐπεὶ ἀδελφὸς
      συνέστησέ σε,
      ποιήσω ὡς
      ὑπεσχόμην!

  - name:
    - TX_241b
    - TX_241c
    - TX_241d
    - TX_241e
    - TX_241f
    index:
    - 0x1b
    - 0x1c
    - 0x1d
    - 0x1e
    - 0x1f
    text: |-
      \sfx(0xc7)Ἐπάνελθε ἐὰν
      χρῄζῃς ἄλλης
      διδαχῆς!

  - name: TX_2420
    index: 0x20
    text: |-
      \sfx(0xc7)Χαῖρε!\stop
      Ἐγώ εἰμι ἡ
      πέμπτη
      γενεὰ τῶν
      Εὐσχημόνων
      Χορευτῶν! Οὗτός
      ἐστιν ὁ οἶκος
      χοροῦ μου. Δεῖ
      εἰδέναι τὸν
      χορὸν
      ἡμῶν ἵνα καλῆται
      τις Γόρων. Ἐὰν
      χορεύσῃς καλῶς,
      δώσω σοι
      \col(1)Σύμβολον
      τῆς Ἀδελφότητος\col(0)!
      Μία πεῖρα 10
      δραχμῶν. Χορεύ-
      σωμεν;
        \opt()Ναί \opt()Οὔ

  - name: TX_2421
    index: 0x21
    text: |-
      \sfx(0xc7)Χαῖρε!
      Ἐγώ εἰμι ἡ
      πέμπτη
      γενεὰ τῶν
      Εὐσχημόνων
      Χορευτῶν! Οὗτός
      ἐστιν ὁ οἶκος
      χοροῦ μου. Ὁ
      χορὸς Γορώνων
      θαυμάζεται ὑπὸ
      τῶν νέων
      Γορώνων.
      Κάλλιστός
      ἐστιν!!!\stop
      Θέλεις χορεῦσαι;
      10 δραχμαί.
        \opt()Εἶεν \opt()Οὔ,
      χάρις

  - name:
    - TX_242b
    - TX_2439
    - TX_243a
    - TX_243b
    - TX_243c
    - TX_243d
    - TX_243e
    - TX_243f
    index:
    - 0x2b
    - 0x39
    - 0x3a
    - 0x3b
    - 0x3c
    - 0x3d
    - 0x3e
    - 0x3f
    text: |-
      \sfx(0xc7)\call(TX_242a)\stop
        \opt()Χρυσῆν
      \opt()Ἀργυρᾶν
        \opt()Χαλκῆν

  - name: TX_2440
    index: 0x40
    text: |-
      \sfx(0xc7)Φιλῶ τὸ
      χορεύειν!
      Ὁ χορὸς οὗτος
      χορευθήσεται εἰς
      τὸν αἰῶνα!

  - name: TX_2441
    index: 0x41
    text: |-
      \sfx(0xc7)Τῇ ἀσκήσει ἔσῃ
      καὶ σὺ
      διδάσκαλος
      Χοροῦ Γορώνων!

  - name: TX_2442
    index: 0x42
    text: |-
      \sfx(0xc7)Ποτὲ θέλω
      διδάξαι
      τοῦτο τοῖς
      τέκνοις μου!!!

  - name: TX_2443
    index: 0x43
    text: |-
      \sfx(0xc7)Χορεύω ὅταν
      χαίρω
      καὶ ὅταν
      λυπῶμαι.
      Εἰ πάντες
      ἐποίουν
      αὐτό, πάντες ἂν
      ἔχαιρον!

  - name: TX_2444
    index: 0x44
    text: |-
      \sfx(0xc7)Τὸ χορεύειν καθ'
      ἡμέραν κοπιᾷ σε.
      Ἐνίοτε δεῖ
      ἀναπαύεσθαι. Ὡς
      τὸ ἔργον καὶ ἡ
      μάθησις. Ἀλλ' οὐ
      δεῖ ῥᾳθυμεῖν
      ἀεί.

  - name: TX_2445
    index: 0x45
    text: |-
      \sfx(0xc7)Ὁ Χορὸς Γορώνων
      ὁ φίλτατός μοί
      ἐστιν. Θέλω
      πάντας μαθεῖν!

  - name:
    - TX_2446
    - TX_2447
    - TX_2448
    - TX_2449
    - TX_244a
    - TX_244b
    - TX_244c
    - TX_244d
    - TX_244e
    - TX_244f
    index:
    - 0x46
    - 0x47
    - 0x48
    - 0x49
    - 0x4a
    - 0x4b
    - 0x4c
    - 0x4d
    - 0x4e
    - 0x4f
    text: |-
      \sfx(0xc7)Δεῖ ἔχειν καὶ
      ῥυθμὸν καὶ
      ζῆλον!

  - name: TX_2450
    index: 0x50
    text: |-
      \sfx(0xc7)Φιλῶ τὸ
      χορεύειν!
      Πᾶν μέλος τοῦ
      σώματος ζῇ!

  - name: TX_2451
    index: 0x51
    text: |-
      \sfx(0xc7)Ἡμεῖς οἱ Γόρωνες
      εὑρήσομεν τὸν
      ἴδιον χορὸν
      ποτέ.

  - name: TX_2452
    index: 0x52
    text: |-
      \sfx(0xc7)Θέλω διαδοῦναι
      τὸν χορὸν τοῦτον
      ἐν ὅλῳ τῷ κόσμῳ!
      Ὁ χορὸς κοινὴ
      γλῶσσα τοῦ
      κόσμου ἐστίν!

  - name: TX_2453
    index: 0x53
    text: |-
      \sfx(0xc7)Ἤιδεις;\stop
      Ὁ ζῆλος ῥεῖ
      ἔσωθεν τοῦ
      σώματος ὅταν ὁ
      ῥυθμὸς ἄρχῃ!

  - name: TX_2454
    index: 0x54
    text: |-
      \sfx(0xc7)Ὁ πάππος μου
      εἶπέ μοι τοῦτο·\stop
      \call(TX_2444)\stop
      Καλὴ συμβουλή
      ἐστιν.

  - name: TX_2455
    index: 0x55
    text: |-
      \sfx(0xc7)Ὁ χορὸς καὶ
      ἄθλος
      καὶ τέχνη ἐστίν.
      Γυμνάζῃ καὶ
      δεικνύεις τὰ ἐν
      τῇ ψυχῇ.

  - name:
    - TX_2456
    - TX_2457
    - TX_2458
    - TX_2459
    - TX_245a
    - TX_245b
    - TX_245c
    - TX_245d
    - TX_245e
    - TX_245f
    index:
    - 0x56
    - 0x57
    - 0x58
    - 0x59
    - 0x5a
    - 0x5b
    - 0x5c
    - 0x5d
    - 0x5e
    - 0x5f
    text: |-
      \sfx(0xc7)Δεῖ ἔχειν καὶ
      ῥυθμὸν καὶ
      ζῆλον!

  - name: TX_2460
    index: 0x60
    text: |-
      Ὁ Χορὸς Γορώνων
      ἀναμιμνήσκει με
      τὸν ζέοντα
      ῥύακα
      Σουβροσίας!

  - name: TX_2461
    index: 0x61
    text: |-
      Ποιήσω Χορὸν
      Σουβροσίων!
      Ἀνοίξω νέαν ὁδὸν
      ἐν τῇ παιδείᾳ
      τῶν Σουβροσίων!

  - name: TX_2462
    index: 0x62
    text: |-
      Τὸ σῶμα μανθάνει
      χορεῦον! Μόνη ἡ
      νεότης νικᾷ τὴν
      ὑπομονήν! Μόνος
      ὁ θερμὸς σίδηρος
      στομοῦται!

  - name: TX_2463
    index: 0x63
    text: |-
      Οἱ Γόρωνες οὗτοι
      ἔχουσιν αἴσθησιν
      τέχνης! Δεῖ καὶ
      ἡμᾶς κτήσασθαι!

  - name: TX_2464
    index: 0x64
    text: |-
      Ὁ Χορὸς Γορώνων
      οὗτος ἔχει ζῆλον
      ὡς πῦρ ζέον!

  - name: TX_2465
    index: 0x65
    text: |-
      Ὁ Χορὸς Γορώνων
      πρῶτός ἐστι τῶν
      χορῶν!

  - name:
    - TX_2466
    - TX_2467
    - TX_2468
    - TX_2469
    - TX_246a
    - TX_246b
    - TX_246c
    - TX_246d
    - TX_246e
    - TX_246f
    index:
    - 0x66
    - 0x67
    - 0x68
    - 0x69
    - 0x6a
    - 0x6b
    - 0x6c
    - 0x6d
    - 0x6e
    - 0x6f
    text: |-
      Τὸ χορεύειν
      οὕτως
      ἡδύτατόν ἐστιν!
      Δίδωσι λόγον τῷ
      βίῳ!

  - name: TX_2470
    index: 0x70
    text: |-
      \pos(1)\sfx(0xc7)Ἆ;\stop
      Ὤρυσσον νέαν
      διώρυγα καὶ
      ἔφθασα ὧδε!

  - name: TX_2471
    index: 0x71
    text: |-
      \pos(1)\sfx(0xc7)Ἒ!!!\stop
      Τί ποιεῖς ὧδε;
      Οὐκ οἶδας; Τὰ
      παίγνια νέον
      ἔθος ἐστὶν ἐν τῇ
      \col(3)Κυλιούσῃ Ῥάχει\col(0)!
      Ἴδε αὐτὰ καὶ σύ!

  - name: TX_2472
    index: 0x72
    text: |-
      \sfx(0xc7)Τὸ εὑρεῖν θησαυ-
      ρὸν χαλεπόν
      ἐστι!
      Δώσεις μοι 20
      \col(1)Σπέρματα
      Ἄνθρακος\col(0)
      καὶ 20 \col(1)Βόμβους\col(0);\stop
      Ἐὰν εὐτυχήσω καὶ
      εὕρω θησαυρόν,
      δώσω σοι τὸ
      ἥμισυ. Τί φῄς;
        \opt()Ναί \opt()Οὔ

  - name: TX_2473
    index: 0x73
    text: |-
      \sfx(0xc7)Οὔ..; Ἐπάνελθε
      ἐὰν μετανοήσῃς.

  - name: TX_2474
    index: 0x74
    text: |-
      \sfx(0xc7)Ἆ; Μὴ ψεύδου.
      Ἀρίθμει κάλλιον
      πόσα ἔχεις.

  - name: TX_2475
    index: 0x75
    text: |-
      \sfx(0xc7)Ἔασον ἐμοί!
      Εὑρήσω θησαυρόν.
      Ἐπάνελθε πρός με
      μετὰ μικρόν!

  - name: TX_2476
    index: 0x76
    text: |-
      \sfx(0xc7)Μενῶ! Πάντως
      ἔστι θησαυρὸς
      ὧδε!

  - name: TX_2477
    index: 0x77
    text: |-
      \sfx(0xc7)Χάριτι σῇ εὗρον
      θησαυρόν! Ἔχω
      δύο κιβωτούς·
      ἑλοῦ μίαν.
        \opt()Ἀριστ. 
      \opt()Δεξιάν

  - name: TX_2478
    index: 0x78
    text: |-
      \sfx(0xc7)Εἰπέ μοι ἐὰν
      νομίσῃς ὅτι
      εὗρες
      θησαυρὸν
      κρυπτόν!

  - name: TX_2479
    index: 0x79
    text: |-
      \sfx(0xc7)Δεινόν ἐστιν! Ὁ
      Πρεσβύτερος τῶν
      Γορώνων ἐτάφη
      ζῶν ὑπὸ πέτρας!
      Τί ποιήσομεν;

  - name: TX_247a
    index: 0x7a
    text: |-
      \sfx(0xc7)Θαυμαστόν ἐστιν!
      Ὁ Πρεσβύτερος
      τῶν
      Γορώνων ἐσώθη!

  - name: TX_247b
    index: 0x7b
    text: |-
      \sfx(0xc7)Ὁ Πρεσβύτερος
      ἐτάφη ζῶν! Ἀλλ'
      οἱ Γόρωνες μόνοι
      οὐ δύνανται
      ἐξορύξαι αὐτόν!
      Εἰ εἴχομεν τὸ
      \col(1)Ἄνθος τοῦ
      Βόμβου\col(0),
      ἐρρήξαμεν ἂν τὰς
      πέτρας...

  - name: TX_247c
    index: 0x7c
    text: |-
      \sfx(0xc7)Ὁ Πρεσβύτερος
      ἐποίησε θόρυβον
      μέγαν!

  - name: TX_247d
    index: 0x7d
    text: |-
      \sfx(0xc7)Βοήθει! Σπεῦσον!\stop
      Ὁ Πρεσβύτερος
      ἀποθανεῖται ἐὰν
      μὴ σπεύσωμεν!
      Εἴθε
      εἴχομεν \col(1)Ἄνθος
      τοῦ Βόμβου\col(0)...

  - name: TX_247e
    index: 0x7e
    text: |-
      \sfx(0xc7)Ἒ!\stop
      Ἆρα τοῦτό ἐστι
      τὸ θρυλικὸν
      \col(1)Ἄνθος τοῦ
      Βόμβου\col(0);
      Οὐκ ἀπατήσεις
      με!
      Αὕτη ἐστὶν ἡ
      ὀσμὴ \col(1)Ἄνθους τοῦ
      Βόμβου\col(0)!\stop
      Δέομαι! Δός μοι
      τὸ \col(1)Ἄνθος τοῦ
      Βόμβου\col(0)!
        \opt()Εἶεν \opt()Οὐδαμῶς

  - name: TX_247f
    index: 0x7f
    text: |-
      \sfx(0xc7)Ἄνευ τοῦ \col(1)Ἄνθους
      τοῦ Βόμβου\col(0) ὁ
      Πρεσβύτερος
      ἀποθανεῖται.
      Δός μοι αὐτό!
        \opt()Εἶεν \opt()Οὐδαμῶς

  - name: TX_2480
    index: 0x80
    text: |-
      \sfx(0xc7)Εὐχαριστῶ! Νῦν
      σώσομεν τὸν
      Πρεσβύτερον!

  - name: TX_2481
    index: 0x81
    text: |-
      \sfx(0xc7)Χαίρω ὅτι ὁ
      Πρεσβύτερος σῶός
      ἐστιν.

  - name: TX_2482
    index: 0x82
    text: |-
      \sfx(0xc7)Ἐγένετό τι;

  - name: TX_2483
    index: 0x83
    text: |-
      \sfx(0xc7)Τί γίγνεται;
      Ἤκουσα ψόφου
      μεγάλου...

  - name: TX_2484
    index: 0x84
    text: |-
      \sfx(0xc7)Ὁ Πρεσβύτερος
      τῶν
      Γορώνων ἐτάφη
      ὑπὸ σωρὸν
      πετρῶν.
      Ἐλπίζω τινὰ
      σῶσαι
      αὐτόν.

  - name: TX_2485
    index: 0x85
    text: |-
      \sfx(0xc7)Εὗρον τρόπον
      σῶσαι τὸν
      Πρεσβύτερον. Νῦν
      ὀρύξομεν ἔτι τὴν
      νέαν διώρυγα!

  - name: TX_2486
    index: 0x86
    text: |-
      \sfx(0xc7)Οὗτός ἐστιν ὁ
      οἶκος τῶν
      Γορώνων.

  - name: TX_2487
    index: 0x87
    text: |-
      \pos(2)\sfx(0xc7)Ἆ; Τί ἐστιν,
      ἀδελφοί; Ἐφοβεῖ-
      σθε περὶ ἐμοῦ;
      Ἆ ἆ ἆ ἆ ἆ!
      Πέτρα τηλικαύτη
      οὐ βλάπτει με!
      Ἆ ἆ ἆ ἆ ἆ!

  - name: TX_2488
    index: 0x88
    text: |-
      \sfx(0xc7)Ἤνεγκας ἡμῖν τὸ
      \col(1)Ἄνθος τοῦ
      Βόμβου\col(0);
      Σύγγνωθι ἐπὶ τῷ
      κόπῳ.\stop
      Αὕτη ἐστὶν ἡ
      λαμπρὰ \col(1)κλεὶς\col(0) ἣν
      εὗρον ἐν τῇ
      Βορείῳ Κορυφῇ.
      Οὐχ εὗρον τὸ
      κλεῖθρον, διὸ
      δίδωμί σοι
      αὐτήν.

  - name:
    - TX_2489
    - TX_248a
    - TX_248b
    - TX_248c
    - TX_248d
    - TX_248e
    - TX_248f
    index:
    - 0x89
    - 0x8a
    - 0x8b
    - 0x8c
    - 0x8d
    - 0x8e
    - 0x8f
    text: |-
      \sfx(0xc7)Ἐπιμελησόμεθα
      τῶν \col(1)Ἀνθέων τοῦ
      Βόμβου\col(0) ἃ ἤνεγκας
      ἡμῖν. Πληρώσομεν
      τὰς κορυφὰς
      αὐτῶν!

  - name: TX_2490
    index: 0x90
    text: |-
      \sfx(0xc7)Κάθημαι ὧδε
      φυλάσσων τὴν
      εἰρήνην ἐν τῇ
      \col(3)Κυλιούσῃ Ῥάχει\col(0).

  - name: TX_2491
    index: 0x91
    text: |-
      \sfx(0xc7)Ἔχεις θερμὴν
      καρδίαν; Μόνοι
      οἱ δόκιμοι ἀδελ-
      φοὶ τῶν Γορώνων
      διέρχονται.
      Ἄπελθε!

  - name:
    - TX_2492
    - TX_249e
    index:
    - 0x92
    - 0x9e
    text: |-
      \sfx(0xc7)Ἆ;!; Τοῦτό ἐστι
      \col(1)Σύμβολον τῆς
      Ἀδελφότητος\col(0)!
      Συνίης τὸν ζῆλον
      καρδίας Γόρωνος!
      Δίελθε!

  - name: TX_2493
    index: 0x93
    text: |-
      \sfx(0xc7)Οἶδα ὅτι αἰφνί-
      διόν ἐστιν, ἀλλὰ
      βοηθήσεις μοι,
      ἀδελφέ;\n
    null_terminator: False

  - name: TX_2494
    index: 0x94
    text: |-
      \sfx(0xc7)Τὸ φυλάσσειν τὴν
      \col(3)Κυλίουσαν Ῥάχιν\col(0)
      ἔδωκε λόγον τῷ
      βίῳ μου. Χρῄζω
      κειμηλίου ὃ
      διδάξει τοὺς
      ἀπογόνους μου
      τιμᾶν τὴν
      ζωήν...
      Καλὸν ἂν εἴη εἰ
      φέρεις μοι ἴδιόν
      τι.

  - name: TX_2495
    index: 0x95
    text: |-
      \sfx(0xc7)Ναί...
      \col(1)Σκεῦος\col(0) καλὸν ἂν
      εἴη!

  - name: TX_2496
    index: 0x96
    text: |-
      \sfx(0xc7)Ὤωω! Τοῦτο τὸ
      \col(1)σκεῦος\col(0)! Ὡς καλὸν
      \col(1)Σκεῦος τῶν
      Γορώνων\col(0)! Δέομαι!
      Δός μοι αὐτό!
      Ἀλλάξω σοι \col(1)Πόμα
      τῶν Γορώνων\col(0) ἀντ'
      αὐτοῦ!
        \opt()Εἶεν \opt()Οὔ,
      χάρις

  - name: TX_2497
    index: 0x97
    text: |-
      \sfx(0xc7)Ὤ... Ἐπάνελθε
      ἐὰν μετανοήσῃς.

  - name: TX_2498
    index: 0x98
    text: |-
      \sfx(0xc7)Ἕτοιμος εἶ
      δοῦναί
      μοι τὸ \col(1)Σκεῦος
      τῶν
      Γορώνων\col(0);
        \opt()Ναί \opt()Οὔ

  - name:
    - TX_2499
    - TX_24a5
    index:
    - 0x99
    - 0xa5
    text: |-
      \sfx(0xc7)Εὐχαριστῶ! Καλόν
      ἐστιν! Καθὼς
      ὑπεσχόμην--ἰδού!

  - name: TX_249a
    index: 0x9a
    text: |-
      \sfx(0xc7)Φυλάξω ἐπιμελῶς
      τοῦτο τὸ \col(1)σκεῦος\col(0)!

  - name: TX_249b
    index: 0x9b
    text: |-
      \sfx(0xc7)Φυλάξω ἐπιμελῶς
      τὸ \col(1)Σκεῦος τῶν
      Γορώνων\col(0)!

  - name: TX_249c
    index: 0x9c
    text: |-
      \sfx(0xc7)Ἐπὶ γενεὰς οἱ
      πρόγονοί μου
      ἐκάθηντο ὧδε
      φυλάσσοντες τὴν
      εἰρήνην ἐν τῇ
      \col(3)Κυλιούσῃ Ῥάχει\col(0).

  - name: TX_249d
    index: 0x9d
    text: |-
      \sfx(0xc7)Ἔχεις θερμὴν
      καρδίαν; Ἀπὸ
      παλαιοῦ μόνοι οἱ
      δόκιμοι ἀδελφοὶ
      τῶν Γορώνων
      διέρχονται ὧδε.
      Ἄπελθε!!!

  - name: TX_249f
    index: 0x9f
    text: |-
      \sfx(0xc7)Οἶδα ὅτι αἰφνί-
      διόν ἐστιν, ἀλλὰ
      βοηθήσεις μοι,
      ἀδελφέ;\n
    null_terminator: False

  - name: TX_24a0
    index: 0xa0
    text: |-
      \sfx(0xc7)Ἐπὶ γενεὰς οἱ
      πρόγονοί μου
      ἐκάθηντο ὧδε
      φυλάσσοντες τὴν
      εἰρήνην ἐν τῇ
      \col(3)Κυλιούσῃ Ῥάχει\col(0).
      Οὐ δύναμαι
      λιπεῖν,
      ἀλλὰ πεινῶ ὥστε
      ἀποθανεῖν...
      Δώσεις μοι βρῶμά
      τι...

  - name: TX_24a1
    index: 0xa1
    text: |-
      \sfx(0xc7)\col(1)Ὀσφὺν Πέτρας\col(0),
      \col(1)Στηθύνιον τῆς
      Πέτρας\col(0)... Ὅ τι
      οὖν!

  - name: TX_24a2
    index: 0xa2
    text: |-
      \sfx(0xc7)Ὤωω! Ἔχεις
      κάλλιστον
      \col(1)Στηθύνιον τῆς
      Πέτρας\col(0)!\stop
      Δέομαι! Δός μοι
      τὸ \col(1)Στηθύνιον τῆς
      Πέτρας\col(0)! Ἀλλάξω
      σοι τὸ \col(1)Σκεῦος
      τῶν
      Γορώνων\col(0) τῶν
      προγόνων μου!
        \opt()Εἶεν \opt()Οὔ,
      χάρις

  - name: TX_24a3
    index: 0xa3
    text: |-
      \sfx(0xc7)Πεινῶ ὥστε
      ἀποθανεῖν.
      Ἤθελον
      \col(1)Στηθύνιον τῆς
      Πέτρας\col(0)...

  - name: TX_24a4
    index: 0xa4
    text: |-
      \sfx(0xc7)Ἕτοιμος εἶ
      δοῦναί
      μοι τὸ \col(1)Στηθύνιον
      τῆς Πέτρας\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_24a6
    index: 0xa6
    text: |-
      \sfx(0xc7)Ὤ! Τοῦτο τὸ
      \col(1)Στηθύνιον τῆς
      Πέτρας\col(0) ἥδιστόν
      ἐστιν!
      Εὐχαριστῶ!

  - name: TX_24a7
    index: 0xa7
    text: |-
      \sfx(0xc7)Ἐὰν λάβῃς ἄλλο
      βρῶμα, δός μοι!

  - name: TX_24a8
    index: 0xa8
    text: |-
      \sfx(0xc7)Χαῖρε εἰς τὰς
      Ἁμάξας Σκοπῶν!
      Βάλλε τῷ
      \col(1)Σπερματοβόλῳ\col(0) σου
      ἐπιβαίνων
      ἁμάξης.
      Ἐὰν βάλῃς
      ἱκανοὺς
      σκοπούς, λήψῃ
      ἆθλον! Μέχρι 3
      ἁμαρτιῶν φέρει
      20 δραχμάς.
      Πειράσεις; 10
      δραχμαί.
        \opt()Ναί \opt()Οὔ

  - name: TX_24a9
    index: 0xa9
    text: |-
      \sfx(0xc7)Ὤ... Ἐπάνελθε
      ὅταν θέλῃς!

  - name: TX_24aa
    index: 0xaa
    text: |-
      \sfx(0xc7)Ἆ; Οὐκ ἔχεις
      ἱκανὰς δραχμάς!
      Σύναξον καὶ
      ἐπάνελθε!

  - name: TX_24ab
    index: 0xab
    text: |-
      \sfx(0xc7)Εἶεν! Ἄρξωμεν!

  - name: TX_24ac
    index: 0xac
    text: |-
      \sfx(0xc7)Τὸ ἆθλον νῦν
      ἐστι... τοῦτο!

  - name: TX_24ad
    index: 0xad
    text: |-
      \sfx(0xc7)Ἕτοιμος; Ἄγε!

  - name: TX_24ae
    index: 0xae
    text: |-
      \sfx(0xc7)Χαῖρε εἰς τὰς
      Ἁμάξας Σκοπῶν.
      Λάλησον ἐκείνῳ
      τῷ Γόρωνι
      παῖξαι!

  - name: TX_24af
    index: 0xaf
    text: |-
      \sfx(0xc7)Τέλος! Ἔβαλες
      \col(4)\num1\col(0) ἐκ 12!

  - name: TX_24b0
    index: 0xb0
    text: |-
      \sfx(0xc7)Τέλειον! Καλὴ
      βολή! Λαμβάνεις
      ἆθλον!

  - name: TX_24b1
    index: 0xb1
    text: |-
      \sfx(0xc7)Ὦ, σχεδὸν
      τέλειον
      ἦν. Ἀλλὰ λαμβά-
      νεις 20 δραχμάς!

  - name: TX_24b2
    index: 0xb2
    text: |-
      \sfx(0xc7)Φεῦ... Πείρασον
      πάλιν ὕστερον.

  - name: TX_24b3
    index: 0xb3
    text: |-
      \sfx(0xc7)Ἕτοιμος πειράσαι
      πάλιν;
        \opt()Ναί \opt()Οὔ

  - name: TX_24b4
    index: 0xb4
    text: |-
      \sfx(0xc7)Ὤ... Ἀλλὰ πείρα-
      σον πάλιν
      ὕστερον!

  - name: TX_24b5
    index: 0xb5
    text: |-
      \pos(2)\sfx(0xc7)Ἆαα...\stop
      Ἠργασάμην πολλὰς
      νύκτας νῦν, καὶ
      οὐκ ἰσχύω
      παίζειν
      παίγνια. Καὶ
      ἐξώρυξα καλὸν
      ἆθλον. Εἶεν...

  - name: TX_24b6
    index: 0xb6
    text: |-
      \pos(2)Χρῄζω τινὸς
      δυναμοῦντος ὃ
      ἐγερεῖ με.

  - name: TX_24b7
    index: 0xb7
    text: |-
      \pos(2)\sfx(0xc7)Τοῦτό ἐστι \col(1)Πόμα
      τῶν Γορώνων\col(0)!\stop
      Μία πόσις τούτου
      πληροῖ ἰσχύν!
      Δώσεις μοι αὐτό;
        \opt()Ναί \opt()Οὔ

  - name: TX_24b8
    index: 0xb8
    text: |-
      \pos(2)\sfx(0xc7)Οὔ..; Ὤ... Ἆ...
      Οὕτω κοπιῶ νῦν!

  - name: TX_24b9
    index: 0xb9
    text: |-
      \pos(2)\sfx(0xc7)Ἐγρήγορα νῦν!
      Εὐχαριστῶ!
      Ἀνοίξω
      τὸ πωλητήριον!
      Θέλεις πειράσαι
      τὸ παίγνιόν μου;
      Τὸ πρῶτον δωρεάν
      ἐστιν. Θέλεις;
        \opt()Ναί \opt()Οὔ

  - name: TX_24ba
    index: 0xba
    text: |-
      \pos(2)\sfx(0xc7)Τί; Οὐ θέλεις;
      Αὖθις 10 δραχμῶν
      ἔσται.

  - name: TX_24bb
    index: 0xbb
    text: |-
      \pos(2)\sfx(0xc7)Πάντως! Θέλεις
      ἀκοῦσαι τοὺς
      νόμους;
        \opt()Οὔ \opt()Ναί

  - name: TX_24bc
    index: 0xbc
    text: |-
      \pos(2)\sfx(0xc7)Νῦν τὸ ἆθλόν
      ἐστι... τοῦτο!

  - name: TX_24bd
    index: 0xbd
    text: |-
      \pos(2)\sfx(0xc7)Ὅταν ἄρξηται τὸ
      παίγνιον, φεῦγε
      ἢ βάλλε τοὺς
      \col(1)Βόμβους\col(0) τοὺς
      πίπτοντας κύκλῳ.
      Ἴδε πόσον ἀνθέ-
      ξεις! Λήψῃ καλὸν
      ἆθλον ἐὰν
      ὑπομεί-
      νῃς εἰς τέλος.
      Ἐὰν δὲ πληγῇς
      ἅπαξ, ἡττᾷ!
      Εἶεν;
        \opt()Ναί \opt()Οὔ

  - name: TX_24be
    index: 0xbe
    text: |-
      \pos(2)\sfx(0xc7)Ἕτοιμος εἶ;

  - name: TX_24bf
    index: 0xbf
    text: |-
      \pos(2)\sfx(0xc7)Ἦλθες παῖξαι;
      10 δραχμῶν
      ἐστιν.
      Θέλεις πειράσαι;
        \opt()Ναί \opt()Οὔ

  - name: TX_24c0
    index: 0xc0
    text: |-
      \pos(2)\sfx(0xc7)Οὐ θέλεις; Ἐλθὲ
      ὅταν θέλῃς.

  - name: TX_24c1
    index: 0xc1
    text: |-
      \pos(2)\sfx(0xc7)Οὐκ ἔχεις ἱκανὰς
      δραχμάς!

  - name: TX_24c2
    index: 0xc2
    text: |-
      \pos(2)\sfx(0xc7)Πειράσεις πάλιν
      διὰ 10 δραχμάς;
        \opt()Ναί \opt()Οὔ

  - name: TX_24c3
    index: 0xc3
    text: |-
      \pos(2)\sfx(0xc7)Θαυμαστόν!
      Λάβε τὸ ἆθλόν
      σου!

  - name: TX_24c4
    index: 0xc4
    text: |-
      \sfx(0xc7)Μηδενὶ εἴπῃς,
      ἀλλὰ φίλος εἰμὶ
      τοῦ κλεινοῦ
      \col(3)Εὐσχήμονος
      Γόρωνος\col(0). Ἀληθῶς!

  - name: TX_24c5
    index: 0xc5
    text: |-
      \sfx(0xc7)Ἐλάλησας τῷ
      \col(3)Εὐσχήμονι
      Γόρωνι\col(0);

  - name: TX_24c6
    index: 0xc6
    text: |-
      \sfx(0xc7)Ἒ!!!\stop
      Ἡ \col(1)κλεὶς\col(0) αὕτη
      ὁμοία ἐστὶ τῇ
      \col(1)Κλειδὶ Σειρῆνος\col(0)
      ἣν ἔχει ὁ \col(3)Εὐσχή-
      μων Γόρων\col(0).

  - name: TX_24c7
    index: 0xc7
    text: |-
      \sfx(0xc7)Θέλεις καὶ τὴν
      \col(1)κλεῖδα\col(0) τοῦ
      \col(3)Εὐσχήμονος
      Γόρωνος\col(0); Ὡς
      πλεονέκτης εἶ...

  - name: TX_24c8
    index: 0xc8
    text: |-
      \sfx(0xc7)Ἄκουε. Οὐκ οἶδα
      εἰ ὠφελήσει,
      ἀλλ'
      ἐὰν δῷς μοι τὸν
      \col(1)Χυλὸν τοῦ Πυρός\col(0),
      συστήσω σε τῷ
      \col(3)Εὐσχήμονι
      Γόρωνι\col(0)!
      Τί οὖν; Λήψομαι
      τὸν \col(1)Χυλὸν Πυρός\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_24c9
    index: 0xc9
    text: |-
      \sfx(0xc7)Εἶεν. Ἔνεγκε
      ταύτην τὴν
      \col(1)Ἐπιστολὴν
      Συστάσεως\col(0) πρὸς
      τὸν
      \col(3)Εὐσχήμονα
      Γόρωνα\col(0)!

  - name: TX_24ca
    index: 0xca
    text: |-
      \sfx(0xc7)Ἐὰν δείξῃς τοῦτο
      τῷ \col(3)Εὐσχήμονι
      Γόρωνι\col(0), συνήσει.

  - name: TX_24cb
    index: 0xcb
    text: |-
      \sfx(0xc7)Ἀληθῶς...
      Εἶεν, οὐδὲν
      μέλει!

  - name: TX_24cc
    index: 0xcc
    text: |-
      \sfx(0xc7)Ἐλπίζω τὸν
      \col(3)Εὐσχήμονα Γόρωνα\col(0)
      δοῦναί σοι τὴν
      \col(1)κλεῖδα\col(0) αὐτοῦ!

  - name: TX_24cd
    index: 0xcd
    text: |-
      \sfx(0xc7)Τί εἶχεν ὁ
      \col(3)Εὐσχήμων
      Γόρων\col(0)..;
      Σχῆμά τι
      σειρῆνος... Ἆ...
      Ἐπελαθόμην!

  - name: TX_24ce
    index: 0xce
    text: |-
      \sfx(0xc7)Ὁ \col(3)Εὐσχήμων Γόρων\col(0)
      πίνει \col(1)Χυλὸν τοῦ
      Πυρὸς\col(0) καθ'
      ἡμέραν
      ἵνα ἔχῃ ἰσχὺν
      χορεύειν. Θέλω
      κἀγώ!

  - name: TX_24cf
    index: 0xcf
    text: |-
      \sfx(0xc7)Χαῖρε εἰς τὴν
      Στοὰν Γορώνων!
      Τὸ παίγνιον
      τοῦτο
      ἐθαυμάζετο ἐν τῇ
      \col(3)Κώμῃ Λύννης\col(0).
      Πειράσεις; 20
      δραχμῶν ἐστιν.
        \opt()Εἶεν \opt()Οὔ,
      χάρις

  - name: TX_24d0
    index: 0xd0
    text: |-
      \sfx(0xc7)Ἀληθῶς; Εἶεν,
      ἐλθὲ πάλιν.

  - name: TX_24d1
    index: 0xd1
    text: |-
      \sfx(0xc7)Δεῖ σε ἀκοῦσαι
      τοὺς νόμους;
        \opt()Οὔ \opt()Ναί

  - name: TX_24d2
    index: 0xd2
    text: |-
      \sfx(0xc7)Οὐκ ἔχεις ἱκανὰς
      δραχμάς!

  - name: TX_24d3
    index: 0xd3
    text: |-
      \sfx(0xc7)Παῖσον τὰς σφαί-
      ρας εἰς τοὺς
      σκοποὺς τῷ
      ξίφει·
      Νύμφαι 100 ἀρ.
      Κυανοῖ  30 ἀρ.
      Ἐρυθροὶ -10 ἀρ.
      Δαίμονες -50 ἀρ.
      Πληγὴ   -50 ἀρ.
      Παίσεις δέκα
      σφαίρας, καὶ τὸ
      ἆθλον ἐκ τοῦ
      παντὸς ἀριθμοῦ
      ἐστιν. Συνίης;
        \opt()Ναί \opt()Οὔ

  - name: TX_24d4
    index: 0xd4
    text: |-
      \sfx(0xc7)Αὕτη ἐστὶν ἡ
      Στοὰ Γορώνων! Τὸ
      παίγνιον ἡμῶν
      ἐθαυμάζετο ἐν τῇ
      \col(3)Κώμῃ Λύννης\col(0)! Νῦν
      δίδομεν \col(1)Χυλὸν
      τοῦ Πυρὸς\col(0) τῷ
      ἀριστεύοντι!
      Πειράσεις; 20
      δραχμῶν ἐστιν.
        \opt()Εἶεν \opt()Οὔ,
      χάρις

  - name: TX_24d5
    index: 0xd5
    text: |-
      \sfx(0xc7)Ἐὰν μὴ θέλῃς,
      ἄλλος τις
      λήψεται
      τὸν \col(1)Χυλὸν Πυρός\col(0)!

  - name: TX_24d6
    index: 0xd6
    text: |-
      \sfx(0xc7)Εἶεν! Ἄρξωμεν.
      Ἀγαθῇ τύχῃ!

  - name: TX_24d7
    index: 0xd7
    text: |-
      \sfx(0xc7)Ἔλαβες \num1 ἀρ.!

  - name: TX_24d8
    index: 0xd8
    text: |-
      \sfx(0xc7)Θαυμαστόν!
      Λαμβάνεις τὸν
      \col(1)Χυλὸν τοῦ
      Πυρός\col(0)!!!

  - name: TX_24d9
    index: 0xd9
    text: |-
      \sfx(0xc7)Φεῦ! Ἔλαττον 100
      ἀριθμῶν οὐ φέρει
      ἆθλον.

  - name: TX_24da
    index: 0xda
    text: |-
      \sfx(0xc7)400 ἢ πλείονες
      φέρουσι
      \col(1)παλίνδρομον\col(0).

  - name: TX_24db
    index: 0xdb
    text: |-
      \sfx(0xc7)300 ἢ πλείονες
      φέρουσι
      \col(1)Κάρυον Γασά\col(0)!

  - name: TX_24dc
    index: 0xdc
    text: |-
      \sfx(0xc7)200 ἢ πλείονες
      φέρουσι \col(1)20
      Βόμβους\col(0)!

  - name: TX_24dd
    index: 0xdd
    text: |-
      \sfx(0xc7)100 ἢ πλείονες
      φέρουσι
      \col(1)30 δραχμάς\col(0)!

  - name: TX_24de
    index: 0xde
    text: |-
      \sfx(0xc7)Οὐκ ἔστιν ἆθλον
      ἐλάττονι 100
      ἀριθμῶν...

  - name: TX_24df
    index: 0xdf
    text: |-
      \sfx(0xc7)Θέλεις πειράσαι
      πάλιν; 20
      δραχμῶν
      μόνον ἐστίν!
        \opt()Εἶεν \opt()Οὔ,
      χάρις

  - name: TX_24e0
    index: 0xe0
    text: |-
      \sfx(0xc7)Θαυμαστόν!

  - name: TX_24e1
    index: 0xe1
    text: |-
      \sfx(0xc7)Ὤ! Ἐπλήγης.
      Φεῦ...

  - name: TX_24e2
    index: 0xe2
    text: |-
      \sfx(0xc7)Ὁ Πρεσβύτερος
      περιέρχεται τὴν
      \col(3)Κυλίουσαν Ῥάχιν\col(0)
      φυτεύων \col(1)Ἄνθη τοῦ
      Βόμβου\col(0)!

  - name: TX_24e3
    index: 0xe3
    text: |-
      \sfx(0xc7)Ὁ Πρεσβύτερος
      πλήρης δυνάμεώς
      ἐστιν. Δεῖ με
      μιμεῖσθαι αὐτόν.

  - name: TX_24e4
    index: 0xe4
    text: |-
      \sfx(0xc7)Φυτεύσω \col(1)Ἄνθη τοῦ
      Βόμβου\col(0) ἐν ὅλῃ τῇ
      \col(3)Κυλιούσῃ Ῥάχει\col(0)!

  - name: TX_24e5
    index: 0xe5
    text: |-
      \sfx(0xc7)Ὁ Πρεσβύτερος
      σφόδρα ἰσχυρός
      ἐστιν... Οὐ
      φθάνω αὐτόν.

- group: 0x25
  data:
  - name: TX_2500
    index: 0x00
    text: |-
      Ξένος τις ἐστὶ
      παρὰ τῇ θαλάσσῃ!
      Πέτεται ἐν τῷ
      ἀέρι... Τίς ἄρα
      ἐστίν!

  - name: TX_2501
    index: 0x01
    text: |-
      Ὁ πύργος δοκεῖ
      ὑψηλότερος
      γίγνεσθαι...
      Ἆρα ἐμοὶ μόνῳ;

  - name: TX_2502
    index: 0x02
    text: |-
      Ὁ πύργος ὄντως
      ὑψηλότερος
      γίγνεται!
      Φοβερόν!

  - name: TX_2503
    index: 0x03
    text: |-
      Ἴδε! Ἴδε! Ὅσον
      ὑψηλὸς ἐγένετο
      ὁ πύργος!

  - name: TX_2504
    index: 0x04
    text: |-
      Ἆρα οἱ πύργοι
      αὐξάνονται ἀφ'
      ἑαυτῶν;

  - name:
    - TX_2505
    - TX_2506
    - TX_2507
    - TX_2508
    - TX_2509
    - TX_250a
    - TX_250b
    - TX_250c
    - TX_250d
    - TX_250e
    - TX_250f
    index:
    - 0x05
    - 0x06
    - 0x07
    - 0x08
    - 0x09
    - 0x0a
    - 0x0b
    - 0x0c
    - 0x0d
    - 0x0e
    - 0x0f
    text: |-
      Πορεύομαι εἰς
      τὸν
      πύργον παῖξαι
      πάλιν σήμερον!

  - name: TX_2510
    index: 0x10
    text: |-
      Σίγα! Οὐκ ἀκούω
      τῆς \col(3)Ναϋροὺ\col(0)
      ᾳδούσης!

  - name: TX_2511
    index: 0x11
    text: |-
      Οὐδαμῶς! Λίαν
      φοβερόν ἐστιν!
      Σκότος βαθύ
      ἐστιν
      ἐντὸς τοῦ τάφου
      ὑπὸ τὸ δένδρον!

  - name: TX_2512
    index: 0x12
    text: |-
      Ἄλλως τε...

  - name: TX_2513
    index: 0x13
    text: |-
      Ἴσως ἐξελεύσε-
      ται...

  - name: TX_2514
    index: 0x14
    text: |-
      ...Τὸ φάντασμα.

  - name: TX_2515
    index: 0x15
    text: |-
      \pos(2)Τίς εἶ..;
      Εἶεν... Χαῖρε...
      εἰς τὸ σκότος
      τῶν
      θλίψεών μου.\stop
      Σφόδρα
      λυποῦμαι...
      Θέλω γελᾶν ἕως
      ἂν
      ἐπιλάθωμαι
      πάντων.
      Τότε εὐτυχὴς ἂν
      ἤμην. Ἆ.........\stop
      ................\stop
      Εἰπεῖν αὐτῷ τὸ
      \col(0x84)\item(0x08)\col(1)Γελοῖον
      Παίγνιον\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_2516
    index: 0x16
    text: |-
      \pos(2)Ἆ...\stop
      Τί ἐστι τοῦτο..;\stop
      Ἆ.............\stop
      ................\stop
      Ὤ...\stop
      Οὕτω γελοῖόν
      ἐστι\stop
      ὥστε ἐπελαθόμην
      γελάσαι.\stop
      Εὐχαριστῶ...\stop
      Χάριτι σῇ
      δύναμαι
      λυπεῖσθαι ὅσον
      θέλω... Λάβε ὃ
      θέλεις βιβλίον
      ἐκ
      τῆς θήκης
      ἐκείνης.

  - name: TX_2517
    index: 0x17
    text: |-
      \pos(2)Ἆ... Μόνον τὸ
      σκότος
      παραμυθεῖ-
      ται τὴν καρδίαν
      μου. Τὸ γελᾶν
      μάταιον ἐνύπνιόν
      ἐστιν...

  - name: TX_2518
    index: 0x18
    text: |-
      \pos(2)Ἀρκεῖ... Ὡς
      ὄρνεον ὃ εἶδόν
      ποτε, πέτου ποι.

  - name: TX_2519
    index: 0x19
    text: |-
      Ἒ ἕ! Ἤδη ἀναγι-
      νώσκω! "Ἡ Βασί-
      λισσα τῶν Νυμφῶν
      ἡ Καθαρίζουσα
      τὴν
      Θάλασσαν"\stop
      Οὗτος ὁ φίλτατός
      μοι λόγος ἐστίν.

  - name: TX_251a
    index: 0x1a
    text: |-
      Τὸ ἀναγινώσκειν
      ἡδύ ἐστι, κἂν μὴ
      συνιῶ!

  - name: TX_251b
    index: 0x1b
    text: |-
      \pos(2)Οὐαᾶ! Ὁ πατήρ
      μου
      ἐλιθώθη!

  - name: TX_251c
    index: 0x1c
    text: |-
      Τὸ παίζειν πολὺ
      ἐκοπίασέ με,
      ἀλλὰ
      χαίρω δυνάμενος
      κινεῖσθαι!

  - name: TX_251d
    index: 0x1d
    text: |-
      Εἶεν! Ταχύτερον
      νῦν! Βαλῶ αὐτό,
      λάβε οὖν,
      πάτερ!!!

  - name: TX_251e
    index: 0x1e
    text: |-
      Οὐκ ἐγενόμην
      βελτίων, πάτερ;
      Ἀσκησόμεθα ἅμα
      καθ' ἡμέραν ἀπὸ
      τοῦ νῦν!

- group: 0x26
  data:
  - name: TX_2600
    index: 0x00
    text: |-
      Νῦν ἄνθρωποι
      ἀφανίζονται καὶ
      λιθοῦνται ἐξαί-
      φνης. Τί
      γίγνεται;

  - name: TX_2601
    index: 0x01
    text: |-
      Ἆρα ἐμοὶ δοκεῖ,
      ἢ
      ὁ πύργος ἐκεῖνος
      μείζων γίγνεται;

  - name: TX_2602
    index: 0x02
    text: |-
      Ἆ... Κοπιῶ
      ῥᾳδίως
      νῦν. Ἆρα
      γηράσκω;

  - name: TX_2603
    index: 0x03
    text: |-
      Ὁ πύργος ἐκεῖνος
      μείζων ἐστίν,
      καὶ
      ἡ πόλις τετάρα-
      κται. Καὶ τὸ
      σῶμά
      μου οὐ καλῶς
      ἔχει.
      Τὰ κακὰ σωρηδὸν
      ἔρχεται.

  - name: TX_2604
    index: 0x04
    text: |-
      Τὰ σκέλη μου
      βαρέα ὡς λίθος.
      Οὐ δύναμαι
      κινεῖ-
      σθαι ὡς θέλω...
      Βδελύσσομαι
      πάντα
      τὰ κακὰ ταῦτα.

  - name: TX_2605
    index: 0x05
    text: |-
      Τὰ ὀστᾶ μου
      κοῦφα
      φαίνεται νῦν!
      Οὐκ
      ἐάσω νεανίσκον
      παρελθεῖν με!

  - name: TX_2606
    index: 0x06
    text: |-
      Βλέπω εἰς τὸ
      σπήλαιον τοῦτο
      νομίζων θησαυρὸν
      εἶναι ἔνδον,
      ἀλλ'
      ἡ πέτρα αὕτη
      φράσσει με. Εἴθε
      ἔρρηξα αὐτήν...

- group: 0x27
  data:
  - name: TX_2700
    index: 0x00
    text: |-
      Ἐγώ εἰμι ὁ
      \col(3)Ῥάφτων\col(0). Τὸ
      ἐνύπνιόν μου
      ἐστὶ ποιῆσαι
      καλὰς σχεδίας
      πλεούσας ἐν ταῖς
      θαλάσσαις!

  - name: TX_2701
    index: 0x01
    text: |-
      Εἰ εἶχον
      σχοινίον
      μὴ φθειρόμενον
      ἐν ὕδατι, ἐποίη-
      σα ἂν τὴν
      σχεδίαν
      μου. Ἀλλ' οὐχ
      εὑρίσκω.\stop
      Ἀνήρ τις ὀνόματι
      \col(3)Σεβὰλ\col(0) ἐν τῷ
      ἀνατολικῷ ἄκρῳ
      τῆς πόλεως ποιεῖ
      τοιοῦτον σχοινί-
      ον, ἀλλ' οὔπω
      ἐτέλεσεν.

  - name: TX_2702
    index: 0x02
    text: |-
      Ἒ! Τοῦτό ἐστιν!

  - name: TX_2703
    index: 0x03
    text: |-
      Τῷ \col(1)Σχοινίῳ Σεβὰλ\col(0)
      τούτῳ τελέσω τὴν
      σχεδίαν μου!
      Δός μοι ἐκεῖνο
      τὸ \col(1)σχοινίον\col(0),
      δέομαι!
         \opt()Εἶεν
      \opt()Σύγγνωθι

  - name: TX_2704
    index: 0x04
    text: |-
      Οὐδὲν ἔστι
      ποιῆσαι.

  - name: TX_2705
    index: 0x05
    text: |-
      Εὐχαριστῶ!
      Ἀληθῶς, σὺ
      πρῶτος
      ἐπιβήσῃ τῆς
      σχεδίας μου ὅταν
      τελεσθῇ. Ἀλλὰ
      χρῄζεις \col(1)πίνακος\col(0)
      ἐὰν θέλῃς πλεῖν
      τὴν θάλασσαν. Τὸ
      πλεῖν ἄνευ
      \col(1)πίνακος\col(0) φέρει
      ὄλεθρον.\n
    null_terminator: False

  - name: TX_2706
    index: 0x06
    text: |-
      Ἑτοιμάσω τὴν
      σχεδίαν ἕως ἂν
      λάβῃς \col(1)πίνακα\col(0).

  - name: TX_2707
    index: 0x07
    text: |-
      Ἒ! Τί ἐβράδυνας;
      Ἡ σχεδία μου
      ἑτοίμη ἐστίν!
      Ἐλθὲ ὧδε!

  - name: TX_2708
    index: 0x08
    text: |-
      Ἀνάχθητι
      ἐκεῖθεν.
      Ἡ σχεδία μένει!\n
    null_terminator: False

  - name: TX_2709
    index: 0x09
    text: |-
      Ἀνάβηθι καὶ
      πίεσον \col(0x84)\item(0x00)\col(0)
      κινεῖσθαι!

  - name: TX_270a
    index: 0x0a
    text: |-
      Ἑτοιμάσω σοι
      σχεδίαν ὅταν
      χρῄζῃς πλεῖν!
      \jump(TX_2709)
    null_terminator: False

  - name: TX_270b
    index: 0x0b
    text: |-
      Ἐγώ εἰμι ὁ
      \col(3)Σεβάλ\col(0).\stop
      Ζητῶ σκεύη εἰς
      χρῆσιν ἐν ὕδατι.

  - name: TX_270c
    index: 0x0c
    text: |-
      \call(TX_270b)
      Πρὶν ἀποθανεῖν,
      θέλω τελέσαι τὸ
      ἔργον μου ἐπὶ
      πτερυγίοις εἰς
      τὸ κολυμβᾶν καὶ
      σχοινίῳ μὴ φθει-
      ρομένῳ ἐν ὕδατι.
      Ἐλπίζω βοηθῆσαι
      πᾶσι τοῖς ἀνθρώ-
      ποις εὑρίσκων
      τοιαῦτα!

  - name:
    - TX_270d
    - TX_270e
    - TX_270f
    index:
    - 0x0d
    - 0x0e
    - 0x0f
    text: |-
      \call(TX_270b)
      Ὁρῶν σε ἔχω
      ἐλπίδα περὶ τῆς
      ζητήσεώς μου.

  - name: TX_2710
    index: 0x10
    text: |-
      Ἒ! Πῶς ἔχει ἡ
      σχεδία; Βούλομαι
      ἀγωνίσασθαι ἐν
      δρόμῳ σχεδιῶν,
      ἀλλ' οὔπω εὗρον
      καλὴν \col(1)κώπην\col(0) εἰς
      τὸν ἀγῶνα.

  - name: TX_2711
    index: 0x11
    text: |-
      Δώσεις αὐτῷ τὴν
      \col(0x84)\item(0x0a)\col(1)Μαγικὴν Κώπην\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_2712
    index: 0x12
    text: |-
      Ὤ! Ἐκείνη ἡ \col(0x84)\item(0x0a)
      \col(1)Κώπη\col(0)! Ὁμοία
      παιγνίῳ ἐστίν...
      Ἀλλ' ἀρέσκει
      μοι!
      Εὐχαριστῶ! Ἀντὶ
      τούτου... Οἶδα!
      Πῶς δοκεῖ τοῦτο;
      Τὸ ψάλλειν λύραν
      βλέποντα εἰς τὴν
      σελήνην ἡδύ
      ἐστι.

  - name: TX_2713
    index: 0x13
    text: |-
      Δεῖ με ἐλαύνειν
      ταῖς χερσίν.

  - name: TX_2714
    index: 0x14
    text: |-
      Ἒ! Μοχθεῖς
      σφόδρα;

  - name: TX_2715
    index: 0x15
    text: |-
      Χαῖρε! Αὕτη
      ἐστὶν
      ἡ \col(3)Βιβλιοθήκη τῶν
      Διόπτρων\col(0). Πάλαι
      \col(1)Κόνις τῶν Νυμφῶν\col(0)
      ἐφυλάσσετο ἐν
      ταύτῃ τῇ
      βιβλιοθήκῃ.\stop
      Ἀλλὰ ποτὲ ἐν τῷ
      πάλαι ἔλαβέ τις
      αὐτήν, καὶ νῦν
      οὐδὲν μένει.

  - name: TX_2716
    index: 0x16
    text: |-
      Χαῖρε! Αὕτη
      ἐστὶν
      ἡ \col(3)Βιβλιοθήκη τῶν
      Διόπτρων\col(0). Σκόπει
      τὰ βιβλία ἡμῶν
      ἐλευθέρως, ἀλλ'
      ἡσύχαζε διὰ τοὺς
      ἄλλους.

- group: 0x28
  data:
  - name: TX_2800
    index: 0x00
    text: |-
      \pos(1)\Link!!!
      Ἄφρων!

  - name: TX_2801
    index: 0x01
    text: |-
      \pos(2)Καθὼς ᾠήθημεν,
      τὸ σῶσαι τὴν
      \col(3)Ναϋροὺ\col(0) μάταιον
      ἦν!\stop
      Ὁ αἰὼν τῆς \col(3)Ἄμβι\col(0)
      πλήρης ἐστὶ
      κραυγῶν λύπης! Ἡ
      \col(3)Βερὰν\col(0) ἐξέτεινε
      τὸ Κράτος τοῦ
      Σκότους, διδοῦσα
      ἡμῖν ὃ
      ζητοῦμεν--
      κραυγὰς λύπης!
      Αὐξάνου, σκότος!
      Αὐξάνου, λύπη!

  - name: TX_2802
    index: 0x02
    text: |-
      \pos(2)Ὢ χὸ χὸ χό!
      \Link,
      \Link!
      Μὴ ἐπιλάθῃ ἡμῶν!

  - name: TX_2803
    index: 0x03
    text: |-
      \pos(2)Χαίρομεν ὁρῶσαί
      σε μετὰ τοσοῦτον
      χρόνον, \Link!
      Ἡμεῖς ἐσμεν ἡ
      \col(3)Διδυμορόβα\col(0),
      φαρμακίδες
      Γερούδο!

  - name: TX_2804
    index: 0x04
    text: |-
      \pos(2)Πολλὰ ἔπραξας
      ἐν τῷ \col(3)Ὁλόδρουμ\col(0)!
      Ἰὶ χὶ χὶ χί!

  - name: TX_2805
    index: 0x05
    text: |-
      \pos(2)Δοκεῖς χαίρειν
      σώσας τὴν
      \col(3)Ναϋρού\col(0),
      ἀλλ' ὁ αἰὼν τῆς
      \col(3)Ἄμβι\col(0) ἤδη πλήρης
      ἐστὶ κραυγῶν
      λύπης!

  - name: TX_2806
    index: 0x06
    text: |-
      \pos(2)Ἐκτείνασα τὸ
      Κράτος τοῦ
      Σκότους, ἡ \col(3)Βερὰν\col(0)
      διέσπειρε λύπην
      ἐν τῇ γῇ. Ταχέως
      ἡ Φλὸξ τῆς Λύπης
      ἁφθήσεται!
      Χὸ χὸ χὸ χὸ χό!

  - name: TX_2807
    index: 0x07
    text: |-
      \pos(2)Νῦν μία μόνη
      φλὸξ λείπεται...
      Ὅταν αἱ τρεῖς
      φλόγες καίωνται
      ἐν τῷ σκότει...
      Ὁ Βασιλεὺς ὁ
      Πονηρὸς
      ἐπανελεύ-
      σεται! Ὢ χὸ χό!

  - name: TX_2808
    index: 0x08
    text: |-
      \pos(2)Ἰὶ χὶ χὶ χί!
      Ἐπεὶ ῥᾳθυμεῖς,
      ἦλθον
      ἀπαγγεῖλαι!
      Ὁ \col(3)Μέλας Πύργος\col(0)
      ἤδη ἔφθασεν εἰς
      τὸν οὐρανόν!!!
      Ὢ χὸ χὸ χὸ χό!

  - name: TX_2809
    index: 0x09
    text: |-
      \pos(0)Ἰὶ χὶ χὶ χί!
      Ὑστέρησας,
      \Link!
      Ὁ \col(3)Μέλας Πύργος\col(0)
      ἤδη ἔφθασεν εἰς
      τὸν οὐρανόν!
      Ὢ χὸ χὸ χὸ χό!

  - name: TX_280a
    index: 0x0a
    text: |-
      \pos(0)Ἰὶ χὶ χὶ χί!
      Ἡ ἰσχύς σου μόνη
      οὐ κωλύσει
      τοῦτο!
      Ὢ χὸ χὸ χὸ χό!

  - name: TX_280b
    index: 0x0b
    text: |-
      \pos(3)Ἰὶ χὶ χὶ χί!
      \Link!
      Μὴ νόμιζε ὅτι
      λήγει ὧδε!

  - name: TX_280c
    index: 0x0c
    text: |-
      \pos(3)Ἰδού, \col(3)Βεράν\col(0)!
      Τὰ κακὰ ἃ ἐποί-
      ησας ἐπλήρωσε
      τὴν γῆν κραυγῶν
      λύπης! Ἔτεκε τὴν
      Φλόγα τῆς Λύπης,
      ἣ καίεται
      λαμπρῶς!\stop
      Ὅταν ἡ φλὸξ αὕτη
      φωτίσῃ τὸ
      σκότος,
      τὸ θέλημα ἡμῶν
      τελεσθήσεται!
      Ὢ χὸ χὸ χὸ χό!

  - name:
    - TX_280d
    - TX_280e
    - TX_280f
    - TX_281b
    index:
    - 0x0d
    - 0x0e
    - 0x0f
    - 0x1b
    text: |-
      Ἰὶ χὶ χὶ χί!\stop
      \Link,
      \Link...
      Οἱ ἀγῶνές σου
      μάταιοι
      φαίνονται!
      Ἰδού! Ὁ χρόνος
      ἐταράχθη ἐν τῇ
      \col(3)Λαβρύννῃ\col(4)! Ὁ λαὸς
      ἀπώλεσε πᾶσαν
      χαρὰν καὶ πλήρης
      λύπης ἐστίν!
      Ὢ χὸ χὸ χὸ χό!

  - name: TX_2810
    index: 0x10
    text: |-
      \pos(0)Μάταιος κόπος!
      Ὑστέρησας!

  - name: TX_2811
    index: 0x11
    text: |-
      \pos(0)Ἀπόστηθι,
      \Link!
      Οὐκ οἶδας ὅτι
      πάντες οἱ κόποι
      σου μάταιοί
      εἰσι!

  - name: TX_2812
    index: 0x12
    text: |-
      \pos(0)Ἡμεῖς ἐσμεν αἱ
      φαρμακίδες
      Γερούδο,
      ἡ \col(3)Διδυμορόβα\col(0)!

  - name:
    - TX_2813
    - TX_2816
    index:
    - 0x13
    - 0x16
    text: |-
      \pos(0)Ὁ κόσμος οὗτος
      ἡμέτερός ἐστιν!
      Ὅσον ἂν ἀγωνίζῃ,
      αἱ Τελεταὶ τοῦ
      Σκότους ἄρξονται
      ταχέως!

  - name:
    - TX_2814
    - TX_2818
    index:
    - 0x14
    - 0x18
    text: |-
      \pos(0)Μνήσθητι τοῦ
      ὀνόματος ἡμῶν ὡς
      λύπης! Τὸ ὄνομα
      τῆς \col(3)Διδυμορόβας\col(0)!
      Ὢ χὸ χὸ χὸ χό!

  - name: TX_2815
    index: 0x15
    text: |-
      \pos(0)Ἰὶ χὶ χὶ χί!
      \Link,
      \Link!
      Οἱ ἀγῶνές σου
      μάταιοι
      φαίνονται!

  - name: TX_2817
    index: 0x17
    text: |-
      \pos(0)Καὶ αἱ κόραι
      αὗται ἔντομά
      εἰσιν--ἔντομα
      πρὸ πυρός!
      Ὢ χὸ χὸ χὸ χό!

  - name: TX_2819
    index: 0x19
    text: |-
      \pos(0)Ἡ ἀνάστασις τοῦ
      Βασιλέως τοῦ
      Πονηροῦ ἄρχεται!
      Ὢ χὸ χὸ χὸ χό!

  - name: TX_281a
    index: 0x1a
    text: |-
      \pos(0)Ὢ χὸ χὸ χό!\stop
      \col(3)Ὄνοξ\col(0), Στρατηγὲ
      τοῦ Σκότους! Ἡ
      \col(3)Διδυμορόβα\col(0) οὐκ
      ἐάσει τὸν
      θάνατόν
      σου μάταιον
      γενέσθαι! Ἰδού,
      \col(3)Ὄνοξ\col(0)!\stop
      Τὰ κακὰ ἃ ἐποίη-
      σας νῦν καίεται
      ἐν τῇ Φλογὶ τοῦ
      Ὀλέθρου! Ὅταν αἱ
      Φλόγες τῆς Λύπης
      καὶ Ἀπογνώσεως
      ἁφθῶσιν,\stop
      προσοίσομεν τὴν
      θυσίαν, καὶ αἱ
      τελεταὶ τοῦ
      σκότους τῶν
      Γερούδο τελεσθή-
      σονται!\stop
      Τότε ὁ Βασιλεὺς
      ὁ Πονηρὸς
      ἐπανελεύσεται!

  - name: TX_281c
    index: 0x1c
    text: |-
      \pos(3)Αἱ Φλόγες τῆς
      Λύπης καὶ τοῦ
      Ὀλέθρου καίονται
      λαμπρῶς! Μόνη ἡ
      Φλὸξ τῆς Ἀπογνώ-
      σεως λείπεται!
      Ἰὶ χὶ χὶ χί!

  - name: TX_281d
    index: 0x1d
    text: |-
      \pos(3)Ὅταν αἱ τρεῖς
      φλόγες ἁφθῶσι,
      προσοίσομεν τὴν
      θυσίαν καὶ τελέ-
      σομεν τὰς
      Τελετὰς
      τοῦ Σκότους.
      Τότε
      ὁ Βασιλεὺς ὁ
      Πονηρὸς ἥξει!

  - name: TX_281e
    index: 0x1e
    text: |-
      \pos(3)Ὢ χὸ χὸ χὸ χό!

  - name: TX_281f
    index: 0x1f
    text: |-
      \pos(1)Ὢ χὸ χὸ χό!\stop
      Περιπατεῖς;
      Ἄφρων βασιλίς!

  - name: TX_2820
    index: 0x20
    text: |-
      \pos(1)Ἰὶ χὶ χὶ χί!
      Εὕρομέν σε,
      \col(3)βασιλὶς Ζέλδα\col(0)!

  - name: TX_2821
    index: 0x21
    text: |-
      \pos(1)Ἐλπὶς τοῦ λαοῦ;
      Σβέσομεν αὐτήν!

  - name: TX_2822
    index: 0x22
    text: |-
      \pos(1)Καὶ σὺ ἅψεις τὴν
      Φλόγα τῆς
      Ἀπογνώσεως!
      Ἰὶ χὶ χὶ χί!

  - name: TX_2823
    index: 0x23
    text: |-
      Ἡ θυσία ἐν ταῖς
      χερσὶν ἡμῶν
      ἐστιν.

  - name: TX_2824
    index: 0x24
    text: |-
      Ὅταν ἡ \col(3)Ζέλδα\col(0), ἡ
      ἐλπὶς τοῦ λαοῦ,
      ἀφανισθῇ, ἡ γῆ
      αὕτη πληγήσεται
      ἀπογνώσει.

  - name: TX_2825
    index: 0x25
    text: |-
      Καιρός ἐστιν!

  - name: TX_2826
    index: 0x26
    text: |-
      Χὸ χὸ χὸ χὸ χό!\stop
      Ἡ προσδοκωμένη
      Φλὸξ τῆς Ἀπογνώ-
      σεως τέλος
      καίεται!

  - name: TX_2827
    index: 0x27
    text: |-
      Αἱ Φλόγες τῆς
      Λύπης καὶ τοῦ
      Ὀλέθρου ἥφθησαν
      ὑπὸ τῆς \col(3)Βερὰν\col(0)
      καὶ
      τοῦ \col(3)Ὄνοκος\col(0)! Νῦν
      ἡ ἀπώλεια τῆς
      \col(3)Ζέλδας\col(0) πληροῖ
      πάντας
      ἀπογνώσεως!\stop
      Ὦ Φλόγες τῆς
      Λύπης,
      Ἀπογνώσεως
      καὶ Ὀλέθρου,
      καίεσθε ταῖς
      σκοτειναῖς δυνά-
      μεσι τῶν
      συμφορῶν
      ἡμῶν!

  - name: TX_2828
    index: 0x28
    text: |-
      Ἰὶ χὶ χὶ χί!
      Ἔρχεται...
      Ἐλθὲ νῦν εἰς τὰς
      τρεῖς φλόγας!
      Ἐλθὲ ἐκ τῶν
      σκοτεινῶν βαθῶν!\stop
      Ἐλθὲ, \col(3)Γάνων\col(0),
      Βασιλεῦ
      Πονηρέ!!!

  - name: TX_2829
    index: 0x29
    text: |-
      \pos(3)Ἰὶ χὶ χὶ χί!
      Ὁ καιρὸς ἥκει!
      Ἤδη ἡ Φλὸξ τῆς
      Λύπης ἥφθη!

- group: 0x29
  data:
  - name:
    - TX_2900
    - TX_2901
    - TX_2902
    - TX_2903
    - TX_2904
    - TX_2905
    - TX_2906
    - TX_2907
    - TX_2908
    - TX_2909
    - TX_290a
    - TX_290b
    - TX_290c
    - TX_290d
    - TX_290e
    - TX_290f
    index:
    - 0x00
    - 0x01
    - 0x02
    - 0x03
    - 0x04
    - 0x05
    - 0x06
    - 0x07
    - 0x08
    - 0x09
    - 0x0a
    - 0x0b
    - 0x0c
    - 0x0d
    - 0x0e
    - 0x0f
    text: |-
      Ἐρώτησον τὸν
      \col(3)Τροίαν\col(0) περὶ ζῴων
      καὶ θηρίων!
      ...Οὐχ ὅτι ἐγὼ
      οὐκ οἶδα...
      Ἀληθῶς!

  - name: TX_2910
    index: 0x10
    text: |-
      Ἐν τῷ βάθει τοῦ
      δρυμοῦ ἐστι
      μαγικὰ \col(1)σπέρματα\col(0)
      καὶ ἄγαλμα γλαυ-
      κός. Ὅταν τὰ
      \col(1)σπέρματα\col(0) τεθῇ
      ἐπὶ
      τὸ ἄγαλμα,
      κινεῖ-
      ται! Πρῶτον μὲν
      ἐφοβήθην, νῦν δὲ
      χαίρω! Ἀλλ' οὐκ
      ἔξεστί μοι
      εἰσελ-
      θεῖν εἰς τὸν
      δρυμόν· μὴ εἴπῃς
      τοῖς
      πρεσβυτέροις!

  - name: TX_2911
    index: 0x11
    text: |-
      Σίγα! Οὐ καλόν
      ἐστιν ἐὰν
      φοβηθῇς!

- group: 0x2a
  data:
  - name: TX_2a00
    index: 0x00
    text: |-
      Ὑμεῖς ἐστε οἱ
      ἄγγελοι τῆς
      \col(3)Ὑρούλης\col(0), οὐχί!
      \col(3)Ἴμπα\col(0) καὶ \Link,
      ναί; Ὄρνεον
      ἤνεγκεν ἀγγελίαν
      τῆς παρουσίας
      ὑμῶν.\stop
      Ὄνομά μοί ἐστι
      \col(3)Ῥάλφ\col(0)! Παλαιὸς
      φίλος εἰμὶ τῆς
      \col(3)Ναϋρού\col(0).
      Ἐλπίζομεν
      ἐφ' ὑμᾶς.

  - name: TX_2a01
    index: 0x01
    text: |-
      \pos(2)Τί ποιεῖς τῇ
      \col(3)Ναϋρού\col(0); Διχοτο-
      μήσω σε ἐὰν μὴ
      ἀφῇς αὐτήν!

  - name: TX_2a02
    index: 0x02
    text: |-
      \pos(2)Ἐκείνη ἡ \col(3)Βεράν\col(0)!
      Οὐκ ἠδύνατο
      ἅψασθαι τοῦ
      λίθου, διὸ ἐχρή-
      σατό σοι εἰσελ-
      θεῖν ὧδε!

  - name: TX_2a03
    index: 0x03
    text: |-
      \pos(2)Ἤιδειν ὅτι ἡ
      \col(3)Ναϋροὺ\col(0) ἦν ἡ
      Προφῆτις τῶν
      Αἰώνων ἐκ
      παιδός.\stop
      Ἀεὶ ἤμην παρ'
      αὐτῇ, φυλάσσων
      αὐτήν.

  - name: TX_2a04
    index: 0x04
    text: |-
      \pos(2)Καὶ νῦν τοῦτο!!!
      \col(3)ΝΑΥΡΟΥ\col(0)!!!

  - name: TX_2a05
    index: 0x05
    text: |-
      \col(3)Ναϋρού\col(0)!!!
      Μεῖνον!
      Σώσω σε!

  - name: TX_2a06
    index: 0x06
    text: |-
      \col(3)ΝΑΥΡΟΥ\col(0)!!!

  - name:
    - TX_2a07
    - TX_2a08
    - TX_2a09
    index:
    - 0x07
    - 0x08
    - 0x09
    text: |-
      \pos(0)\Link!\stop
      Ἤκουσας τοῦτο;
      Λέγουσι δεινὰ
      περὶ τῆς \col(3)Ναϋροὺ\col(0)
      ἐν τῇ κώμῃ...
      Διὰ τί; Πάντως
      ἔργον τῆς \col(3)Βερὰν\col(0)
      ἐστίν! Ἡ ἀλήθεια
      φανήσεται ὅταν
      σώσω τὴν \col(3)Ναϋρού\col(0)!
      Μεῖνον ὧδε!
      Πορεύομαι!
      \jump(TX_2a06)
    null_terminator: False

  - name: TX_2a0a
    index: 0x0a
    text: |-
      \pos(2)Ἰδού, ὁ \Link
      ἐστίν!

  - name: TX_2a0b
    index: 0x0b
    text: |-
      Βραδύνεις ὡς
      εἴωθας. Τί
      ποιεῖς;
      Ἆ; Χρῄζεις
      \col(1)Πίνακος τῆς
      Νήσου\col(0);
      Ἤκουσα ὅτι ὁ
      ξένος ἐκεῖνος
      ἔχει \col(1)πίνακας\col(0) τῆς
      κρυπτῆς νήσου.
      Ποίει ὃ θέλεις!
      Σπεύδω σῶσαι τὴν
      \col(3)Ναϋρού\col(0), οὐ
      σχολά-
      ζω βοηθῆσαί σοι!
      Χαῖρε!

  - name: TX_2a0c
    index: 0x0c
    text: |-
      \col(3)Ναϋρού\col(0)!!!

  - name: TX_2a0d
    index: 0x0d
    text: |-
      Σὺ εἶ; Ἀληθῶς ἡ
      \col(3)Ναϋροὺ\col(0) εἶ;

  - name: TX_2a0e
    index: 0x0e
    text: |-
      Σύγγνωθι, \Link.
      Ἐγὼ περιέτρεχον
      ἐν ᾧ σὺ
      ἔσωζες...\stop
      Ἀλλὰ γνῶθι
      τοῦτο·
      ἐγὼ παύσω τὴν
      \col(3)Βεράν\col(0)!!! Οὐκ
      ἐάσω
      τὸν λαὸν τοῦ
      πάλαι ἐν τοῖς
      κακοῖς ἔργοις
      αὐτῆς! Τὸ ἐπιλα-
      θέσθαι τῆς \col(3)Βερὰν\col(0)
      νῦν μωρόν ἐστιν.
      Ἐὰν ἐπιλαθώμεθα,
      ἥξει πάλιν ἐπὶ
      τὴν \col(3)Ναϋρού\col(0)!

  - name: TX_2a0f
    index: 0x0f
    text: |-
      Τί ἦν τοῦτο;;;\stop
      Οὐ φέρω τοῦτο!
      \Link! Ἐπάνειμι
      εἰς τὸν αἰῶνα
      τῆς
      \col(3)Ἄμβι\col(0) πρῶτος!
      Εἴθε ἡ τύχη
      συνάγοι ἡμᾶς
      πάλιν! Χαῖρε!

  - name: TX_2a10
    index: 0x10
    text: |-
      Τί ἦν τοῦτο; Αἱ
      γραῖαι
      ἐκεῖναι...
      Τί πειρῶνται
      ποιεῖν;\stop
      Οὐ φέρω τοῦτο!
      \Link! Ἐπάνειμι
      εἰς τὸν αἰῶνα
      τῆς
      \col(3)Ἄμβι\col(0) πρῶτος!
      Εἴθε ἡ τύχη
      συνάγοι ἡμᾶς
      πάλιν! Χαῖρε!

  - name: TX_2a11
    index: 0x11
    text: |-
      \pos(0)Ἀληθῶς ἐνίκησας
      τὴν \col(3)Βεράν\col(0), οὐχί;
      Εὖγε, \Link!
      Θαυμαστὸς εἶ!
      ...Ἆ; Ἡ
      \col(3)βασίλισσα
      Ἄμβι\col(0); Εἶδέ σε
      κλεισθέντα καὶ
      ἔφυγεν.

  - name: TX_2a12
    index: 0x12
    text: |-
      \pos(2)Τί; Θέλεις
      μάχεσθαι τῷ
      \col(3)Ῥάλφ\col(0);

  - name: TX_2a13
    index: 0x13
    text: |-
      Μὴ ἐκφόβει με
      οὕτως! Ἐνόμισα
      ὅτι οἱ δόλοι τῆς
      \col(3)Βερὰν\col(0) εἷλόν σε!

  - name: TX_2a14
    index: 0x14
    text: |-
      \Link! Τιμῶ σε
      πλέον νῦν.
      Ἐνόμισα ὅτι
      τέλος
      ἦν ὅτε ἐκλείσθης
      ἐν τῷ πύργῳ.
      Οὐκ ᾠήθην σε
      νικήσειν με!

  - name: TX_2a15
    index: 0x15
    text: |-
      Καὶ σύ,
      \col(3)βασίλισσα
      Ἄμβι\col(0)! Ἡ \col(3)Βερὰν\col(0)
      ἀπῆλθεν, διὸ νῦν
      εἶ ἡ
      προ-προ-προ-
      προ-προ...\stop
      μάμμη μου!
      Βασίλισσα!
      Σφόδρα
      καυχῶμαι!

  - name: TX_2a16
    index: 0x16
    text: |-
      \Link! Μὴ
      ἐκφόβει με! Καὶ
      σὺ ἤκουσας ὅτι
      οἱ φύλακες τοῦ
      βασιλείου ἔπεσον
      καὶ ἦλθες σῶσαι
      τὴν \col(3)Ναϋρού\col(0); Εἴ
      τις σώσει αὐτήν,
      ἐγώ εἰμι! Οὐκ
      ἐάσω σε φθάσαι
      με!

  - name: TX_2a17
    index: 0x17
    text: |-
      Ἀλλ' οὐ καλόν
      ἐστιν εἰσελθεῖν
      διὰ τῆς πρώτης
      θύρας.\stop
      Οἶδα! Ἔστι
      κρυπτὴ
      εἴσοδος ἐν τῷ
      κήπῳ τοῦ
      βασιλεί-
      ου! Εἰσδύσομαι
      ἐκεῖθεν!

  - name: TX_2a18
    index: 0x18
    text: |-
      Τί; "Διὰ τί οἶδα
      περὶ τῆς κρυπτῆς
      ὁδοῦ πρῶτον
      ἐλθὼν
      ὧδε;"\stop
      Ἔασον τοῦτο!!!
      Ἔρχομαι,
      \col(3)Ναϋρού\col(0)!!!

  - name: TX_2a19
    index: 0x19
    text: |-
      Οὐκοῦν, \Link,
      τέλος ἦλθες!
      Ἦλθον ἀνελεῖν
      τὴν
      \col(3)Βεράν\col(0)! Ἡ \col(3)Βερὰν\col(0)
      κρατεῖ τῆς
      \col(3)βασιλίσσης Ἄμβι\col(0),
      ναί; Ἵνα νικήσω
      τὴν \col(3)Βεράν\col(0)... δεῖ
      με νικῆσαι...
      τὴν
      \col(3)βασίλισσαν
      Ἄμβι\col(0)...
      Ἆ... Εἶεν...
      \col(3)Βασίλισσα Ἄμβι\col(0)!
      \col(3)Βεράν\col(0)! Ἀνελῶ
      ἀμφοτέρας ὑμᾶς!
      Τότε ὁ λαὸς τοῦ
      αἰῶνος τούτου
      καὶ
      τοῦ ἡμετέρου
      εἰρήνην ἕξει...
      ...Ἀλλὰ τί...
      γενήσεται
      ἐμοί..;\stop
      Ἆ... \Link...
      Μὴ ἐπιλάθῃ μου.
      Λέγω, νομίζω
      σε...
      φίλον... Εἶεν!
      Πορεύομαι! Ὁ
      \col(3)Ῥάλφ\col(0) δύναται!
      Χαῖρε, \Link!

  - name: TX_2a1a
    index: 0x1a
    text: |-
      Ἒ, \Link! Τί
      ποιεῖς ὧδε;
      Ἦλθον
      εὑρεῖν γέροντα
      ἐρημίτην μανθά-
      νοντα \col(1)ᾄσματα\col(0) ἐν
      τῷ ὄρει τούτῳ.
      Οὐκ
      οἶδα ποῦ ἐστιν,
      ἀλλὰ δώσει
      σημεῖον
      σῶσαι τὴν
      \col(3)Ναϋρού\col(0).\stop
      Εὑρήσω αὐτόν!
      Χαῖρε!

  - name: TX_2a1b
    index: 0x1b
    text: |-
      Δολία!\stop
      Εἶεν! Ἐὰν ἀνέλω
      σε, ἀφανίζομαι!
      Ἴσως φοβερόν
      ἐστιν... Ἀλλ' εἰ
      δεῖ, δεῖ. Τὸ
      μηδὲν ποιεῖν καὶ
      ζῆν οὐκ ἔστιν
      ἐμόν. Οὐδὲν
      σημαίνει τότε!
      Ἀνελῶ σε! Ἵνα
      φυλάξω τὸν λαὸν
      τοῦ αἰῶνος
      τούτου
      καὶ τὴν
      \col(3)Ναϋρού\col(0)!!!

  - name: TX_2a1c
    index: 0x1c
    text: |-
      Ἡ φωνὴ ἐκείνη...
      \Link...
      Οὐκ...
      ἠδυνήθην...
      Ἒ ἕ. Οὐ δοκῶ
      μωρός...\n
    null_terminator: False

  - name: TX_2a1d
    index: 0x1d
    text: |-
      \col(3)Να-Ναϋρού\col(0)...

  - name: TX_2a1e
    index: 0x1e
    text: |-
      Τὸ \col(3)Δένδρον
      Μακού\col(0);
      Καὶ τοῦτο ἔργον
      τῆς \col(3)Βερὰν\col(0) ἐστίν!\stop
      \Link! Ἦλθες! Ἡ
      \col(3)Βερὰν\col(0) εἰσεπήδη-
      σεν εἰς ταύτην
      τὴν \col(3)Πύλην τοῦ
      Χρόνου\col(0)! Ἐὰν
      ἐπανέλθωμεν εἰς
      τὸ πάλαι,
      σώσομεν
      τὴν \col(3)Ναϋροὺ\col(0) καὶ
      τὸ
      \col(3)Δένδρον Μακού\col(0)!
      Ἔρχομαι, \col(3)Ναϋρού\col(0)!

  - name: TX_2a1f
    index: 0x1f
    text: |-
      \pos(0)\Link! Ἐποίησας
      αὐτό! Κἀγὼ ᾠήθην
      ὅτι τέλος ἦν
      νῦν,
      ἀλλ' ἡ \col(3)Ναϋροὺ\col(0) ἦν
      ἐκεῖ. Οὐ δύναται
      μένειν ἀβοήθητος
      ἀεί! Γυμνάσομαι
      ἵνα φυλάσσω τὴν
      \col(3)Ναϋροὺ\col(0) μόνος!

  - name: TX_2a20
    index: 0x20
    text: |-
      Ἒ, \Link!\stop
      Ζητεῖς τι, ἢ τί;
      Ἆ; \col(3)Σχοινίον
      Σεβάλ\col(0); Οἶδα τὸ
      ὄνομα τοῦτο.
      Ναί!
      Εἶδον τάφον ἐν
      τῷ
      ἡμετέρῳ χρόνῳ
      ἔχοντα τὸ ὄνομα
      τοῦτο.\stop
      Ἀλλ' οὐ σχολάζω
      λαλεῖν! Ἀσχολίαν
      ἔχω! Χαῖρε!

  - name: TX_2a21
    index: 0x21
    text: |-
      Ἒ, \Link! Πῶς
      ἔχεις;
      Γυμνάζομαι
      καθ' ἡμέραν! Δεῖ
      με ἰσχυρὸν εἶναι
      ἵνα φυλάσσω τὴν
      \col(3)Ναϋροὺ\col(0) μόνος! Ἡ
      τέχνη μου ηὐξήθη
      σφόδρα!
      Ἀσκηθῶμεν
      αὖθις; Ἐπεὶ ὧδε
      εἶ, ἀκούσωμεν
      τῆς
      \col(3)Ναϋροὺ\col(0) ᾳδούσης!

  - name: TX_2a22
    index: 0x22
    text: |-
      Μὴ φοβοῦ,
      \col(3)Ναϋρού\col(0)!
      Ὧδέ εἰμι. Διώξω
      πᾶν θηρίον
      ἐγγίζον
      σοι! Σύγγνωθι,
      \Link, ἀλλ' οὐ
      χρῄζομέν σου.

  - name: TX_2a23
    index: 0x23
    text: |-
      Ἔασον τοῦτο ἐμοὶ
      καὶ τῇ μάμμῃ
      μου!
      Σὺ ἄπελθε ἐπὶ
      τὴν
      \col(3)Διδυμορόβαν\col(0)!

- group: 0x2c
  data:
  - name: TX_2c00
    index: 0x00
    text: |-
      \pos(2)Ἐγώ εἰμι ὁ
      \col(3)Τόκκι\col(0). Ζητῶ τὸν
      χρόνον. Μετὰ ἔτη
      πολλὰ ζητήσεως,
      ἐγγύς εἰμι τοῦ
      τελέσαι \col(1)ᾆσμα\col(0)
      ἄγον
      εἰς τὸν μέλλοντα
      χρόνον, ἀλλ'
      ἀπορῶ νῦν.\n
    null_terminator: False

  - name: TX_2c01
    index: 0x01
    text: |-
      \pos(2)"Ἡ ἠχὼ ποιεῖ
      κύματα..."
      Τί ἄρα σημαίνει;

  - name: TX_2c02
    index: 0x02
    text: |-
      \pos(2)Τοῦτό ἐστι τὸ
      \col(1)ᾆσμα τῆς Ἠχοῦς\col(0)!
      Οὗτός ἐστιν ὁ
      τόνος οὗ ἔχρῃζεν
      ἡ ζήτησίς μου!
      Ἔλυσε τὰς
      ἀπορίας
      μου! Νῦν τελέσω
      τὸ ᾆσμά μου!

  - name: TX_2c03
    index: 0x03
    text: |-
      Σὺ ὁ ἔχων πολλὰ
      ᾄσματα, δίδωμί
      σοι νέον \col(1)ᾆσμα\col(0)!
      Ὁ χρόνος ῥεῖ
      ὅταν
      ψάλλῃς τὸ \col(1)ᾆσμα
      τῶν Ῥευμάτων\col(0)!
      Ὅταν ψάλλῃς
      τοῦτο
      τὸ \col(1)ᾆσμα\col(0), εὐθὺς
      ἐπανελεύσῃ εἰς
      τὸν ἴδιον
      χρόνον!\stop
      Ἐὰν ᾖς ἐν τόπῳ
      ὅθεν οὐ δύνασαι
      φθάσαι εἰς τὸν
      ἴδιον χρόνον,
      ἐπανελεύσῃ εἰς
      τὸ πάλαι.

  - name: TX_2c04
    index: 0x04
    text: |-
      \pos(2)Τὰ ῥεύματα τοῦ
      χρόνου βαθέα
      ἐστίν...

  - name: TX_2c05
    index: 0x05
    text: |-
      \pos(2)Ἡ ἀκοή μου οὐκ
      ἔστιν ὡς
      πάλαι...

  - name: TX_2c06
    index: 0x06
    text: |-
      Χὸ χό! Ἐγώ εἰμι
      ὁ \col(3)Τροίας\col(0).\stop
      Φιλόπονος φυσιο-
      λόγος εἰμί.
      Ἦλθον
      εἰς τὴν
      \col(3)Κυλίουσαν
      Ῥάχιν\col(0) ἵνα μάθω
      τοὺς Γόρωνας καὶ
      τὰ παίγνια
      αὐτῶν.
      Χρῄζεις μου;
        \opt()Ναί \opt()Οὔ

  - name:
    - TX_2c07
    - TX_2c0f
    index:
    - 0x07
    - 0x0f
    text: |-
      Οὐ δοκεῖς
      δόκιμος εἶναι.

  - name: TX_2c08
    index: 0x08
    text: |-
      Θαυμαστόν... Ὁ
      μαθητής μου
      μοχθεῖ ἐν τῷ
      \col(3)Ὁλόδρουμ\col(0).
      Εὐχαρι-
      στῶ ἀπαγγείλαντί
      μοι. Δώσω σοί τι
      ἀντὶ τούτου...
      Ἀλλ' οὐ δωρεάν!
      Ἐὰν ἀριστεύσῃς
      ἐν τῷ παιγνίῳ
      ἐκείνῳ, λήψῃ
      δῶρον, εἶεν;
        \opt()Εἶεν \opt()Οὔ,
      χάρις

  - name: TX_2c09
    index: 0x09
    text: |-
      Ἤδη παραφρονεῖς;

  - name: TX_2c0a
    index: 0x0a
    text: |-
      Αἱ Ἅμαξαι Σκοπῶν
      παίγνιόν ἐστιν
      ἐν
      ᾧ βάλλεις τῷ
      \col(1)Σπερματοβόλῳ\col(0) εἰς
      σκοποὺς
      ἐπιβαίνων
      ἁμάξης. Λήψῃ τὸ
      δῶρόν μου ἐὰν
      βάλῃς πάντας
      τοὺς
      σκοπούς. Συνίης;
        \opt()Ναί \opt()Οὔ

  - name: TX_2c0b
    index: 0x0b
    text: |-
      Ἐλθὲ λάλησόν μοι
      βαλὼν πάντας
      τοὺς
      σκοπούς. Ἐὰν μὴ
      λαλήσῃς εὐθύς,
      ἴσως ἐπιλήσομαι.

  - name: TX_2c0c
    index: 0x0c
    text: |-
      Ὤ! Εὖγε! Νῦν
      λάβε τὸν μισθόν
      σου!

  - name: TX_2c0d
    index: 0x0d
    text: |-
      Διδάξω σε τὸ
      \col(1)μυστήριον\col(0) τοῦ
      χρῆσθαι \col(1)Βομβόμυϊ\col(0)
      καὶ ἐν τῷ
      \col(3)Ὁλόδρουμ\col(0).\stop
      \secret1\stop
      Ἐπάνελθε ἐὰν
      ἐπιλάθῃ τοῦ
      \col(1)μυστηρίου\col(0).

  - name: TX_2c0e
    index: 0x0e
    text: |-
      Ἕτοιμος εἶ
      παῖξαι;
        \opt()Ναί \opt()Οὔ

  - name: TX_2c10
    index: 0x10
    text: |-
      Ἀπαγορεύεις;

  - name: TX_2c11
    index: 0x11
    text: |-
      Χὸ χό! Ἐγώ εἰμι
      ὁ \col(3)Τροίας\col(0)! Νέος
      ὢν
      περιῆλθον τὸν
      κόσμον καὶ εἶδον
      πολλὰ ζῷα. Καὶ
      ἐν
      τῷ γήρᾳ μου
      σπουδάζω! Ἐλπίδα
      ἔχεις ἐλθὼν
      ἀκοῦσαί μου.\n
    null_terminator: False

  - name: TX_2c12
    index: 0x12
    text: |-
      Μεταξὺ ἡμῶν,
      εἶδον
      \call(0xff)

  - name: TX_2c13
    index: 0x13
    text: |-
      ζῷον καλούμενον
      \col(3)Ῥίκι\col(0) ὃ δύναται
      πηδᾶν μικροὺς
      βόθρους καὶ
      κρημνοὺς προσερ-
      χόμενον αὐτοῖς!

  - name: TX_2c14
    index: 0x14
    text: |-
      ζῷον καλούμενον
      \col(3)Ῥίκι\col(0) ὃ βάλλει
      ἰσχυρὰς πυγμὰς
      ποιούσας ἐνίοτε
      λαίλαπας!

  - name: TX_2c15
    index: 0x15
    text: |-
      ζῷον καλούμενον
      \col(3)Δημήτριος\col(0) ὃ
      ἐσθίει πολλά--
      καὶ θηρία!

  - name: TX_2c16
    index: 0x16
    text: |-
      ζῷον καλούμενον
      \col(3)Δημήτριος\col(0) ὃ
      κολυμβᾷ καλῶς.
      Κολυμβᾷ καὶ ἀνὰ
      ἰσχυρὰ ῥεύματα
      ῥᾳδίως!

  - name: TX_2c17
    index: 0x17
    text: |-
      ζῷον καλούμενον
      \col(3)Δημήτριος\col(0) ὃ
      αἴρεται, φέρεται
      καὶ βάλλεται!

  - name: TX_2c18
    index: 0x18
    text: |-
      ζῷον καλούμενον
      \col(3)Μοὺς\col(0) ὃ πέτεται
      ἐν
      τῷ ἀέρι ἐπ'
      ὀλίγον χρόνον!

  - name: TX_2c19
    index: 0x19
    text: |-
      ζῷον καλούμενον
      \col(3)Μοὺς\col(0) ὃ συνάγει
      ἰσχὺν πετόμενον
      καὶ παίει τὴν
      γῆν ἰσχυρῶς!

  - name:
    - TX_2c1a
    - TX_2c1b
    index:
    - 0x1a
    - 0x1b
    text: |-
      εἴδη τινὰ
      \col(3)Θάμνων Δέκου\col(0) οἳ
      ἐμπορεύονται!
      Καλοῦνται
      \col(3)Ἔμποροι Δέκου\col(0)!

  - name: TX_2c1c
    index: 0x1c
    text: |-
      θηρίον
      καλούμενον
      \col(3)Ψιθυρισμὸς\col(0) ὃ
      καταρᾶταί σε
      ὅταν
      ἅψῃ αὐτοῦ. Οὐ
      δύνασαι ἑλκύσαι
      τὸ \col(1)ξίφος\col(0) σου
      τότε!
      Ὡς φοβερόν!

  - name:
    - TX_2c1d
    - TX_2c1e
    - TX_2c1f
    - TX_2c20
    - TX_2c21
    - TX_2c22
    index:
    - 0x1d
    - 0x1e
    - 0x1f
    - 0x20
    - 0x21
    - 0x22
    text: |-
      φοβερὸν θηρίον
      ἐσθίον \col(1)θυρεούς\col(0)!
      Ὡς φοβερόν!

- group: 0x2d
  data:
  - name: TX_2d00
    index: 0x00
    text: |-
      Ὤ... Ἐτρώθην ὑπὸ
      πέτρας
      ἐκπεσούσης
      ἐν τῇ ἐκρήξει...
      Ἐὰν θέλῃς τὸ
      \col(1)Κάρυον Τούνι\col(0),
      ἴδε
      τὸν ἀδελφόν μου
      πέραν τῆς
      πόλεως.

  - name: TX_2d01
    index: 0x01
    text: |-
      Δεῖ ποιῆσαί τι
      περὶ τῶν
      ἐκρήξεων!

  - name: TX_2d02
    index: 0x02
    text: |-
      Ὅσῳ ἐγγύτερον ὁ
      \col(3)Μέλας Πύργος\col(0)
      τελεῖται,
      τοσούτῳ
      ξενωτέρα
      γίγνεται
      ἡ πόλις αὕτη.
      Ὅτε
      ἐκλάσθη τὸ
      \col(1)Κάρυον
      Τούνι\col(0), ἡ πόλις
      ἀπώλεσε τὴν
      ἰσορ-
      ροπίαν, καὶ τὸ
      ὄρος ἐξερράγη.\n
    null_terminator: False

  - name: TX_2d03
    index: 0x03
    text: |-
      Θέλω ἀγαγεῖν τὸ
      \col(1)Κάρυον Τούνι\col(0)
      πρὸς
      τὸν \col(3)Ἐπίβλητον\col(0)...\stop
      Ἀλλ' οὐ δύναμαι
      λιπεῖν τὴν
      πόλιν.
      Αὕτη ἐστὶν ἡ
      \col(3)Πόλις τῆς
      Συμμετρίας\col(0)! Τὰ
      ἀριστερὰ καὶ
      δεξιὰ δεῖ
      ἰσορρο-
      πεῖν τελείως!\stop
      Ὁ ἀδελφός μου
      τέτρωται καὶ οὐ
      κινεῖται, διὸ
      οὐδ' ἐγὼ
      κινοῦμαι.
      Ἐὰν ὁ εἷς
      ἀπέλθῃ,
      ἡ ἰσορροπία
      ἀπολεῖται. Ἀλλὰ
      δεῖ τινα
      ἀπελθεῖν.

  - name: TX_2d04
    index: 0x04
    text: |-
      Ἒ! Σὺ δύνασαι
      λιπεῖν τὴν
      πόλιν!
      Δύνασαι ἀγαγεῖν
      τὸ \col(1)Κάρυον Τούνι\col(0)
      πρὸς τὸν
      \col(3)Ἐπίβλητον\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_2d05
    index: 0x05
    text: |-
      Ἀληθῶς;
      Εὐχαριστῶ!
      Ἐπιτρέπω τοῦτο
      σοί!\n
    null_terminator: False

  - name: TX_2d06
    index: 0x06
    text: |-
      Ὁ \col(3)Ἐπίβλητος\col(0)
      οἰκεῖ
      ἐπὶ τοῦ \col(3)Τείχους
      Ἀνορθώσεως\col(0) πρὸς
      νότον! Ὅταν ἰαθῇ
      τὸ \col(1)Κάρυον Τούνι\col(0),
      ἔνεγκε αὐτὸ εἰς
      τὸν μέσον οἶκον
      τῆς πόλεως καὶ
      θὲς ἐπὶ τῆς
      βάσεως.

  - name: TX_2d07
    index: 0x07
    text: |-
      Ἐνόμισα μόνον
      ἐρωτῆσαι...

  - name: TX_2d08
    index: 0x08
    text: |-
      Ὁ \col(3)Ἐπίβλητος\col(0)
      οἰκεῖ
      ἐπὶ τοῦ \col(3)Τείχους
      Ἀνορθώσεως\col(0).
      Πολλὴ χάρις!

  - name: TX_2d09
    index: 0x09
    text: |-
      Ἒ! Τὸ \col(1)Κάρυον
      Τούνι\col(0) ἰάθη! Θὲς
      αὐτὸ ἐπὶ τῆς
      βάσεως ἐν τῷ
      Μέσῳ Οἴκῳ!

  - name: TX_2d0a
    index: 0x0a
    text: |-
      Ἡ ἰσορροπία
      ἐπανῆλθεν εἰς
      τὴν
      πόλιν!
      Εὐχαριστῶ!

  - name: TX_2d0b
    index: 0x0b
    text: |-
      Φεῦ! Εἴθε ἤρχετο
      ὁ \col(3)Ἐπίβλητος\col(0) ἐν
      καιροῖς
      τοιούτοις.

  - name:
    - TX_2d0c
    - TX_2d0d
    - TX_2d0e
    - TX_2d0f
    index:
    - 0x0c
    - 0x0d
    - 0x0e
    - 0x0f
    text: |-
      Ὢ τῆς ταραχῆς...
      Δεῖ με ἐλάττονα
      εἶναι;

  - name: TX_2d10
    index: 0x10
    text: |-
      Βοήθει! Βοήθει!
      Τὸ \col(1)Κάρυον Τούνι\col(0)
      ἐκλάσθη! Τί;
      Ἀκούσεις τῆς
      θλίψεώς μου;
        \opt()Ναί \opt()Οὔ

  - name: TX_2d11
    index: 0x11
    text: |-
      Ὅσῳ ἐγγύτερον ὁ
      \col(3)Μέλας Πύργος\col(0)
      τελεῖται,
      τοσούτῳ
      ξενωτέρα
      γίγνεται
      ἡ πόλις αὕτη.
      Ὅτε
      ἐκλάσθη τὸ
      \col(1)Κάρυον
      Τούνι\col(0), ἡ πόλις
      ἀπώλεσε τὴν
      ἰσορ-
      ροπίαν, καὶ τὸ
      ὄρος ἐξερράγη.
      Τὸ
      \col(1)Κάρυον Τούνι\col(0)
      σύμβολον τῆς
      πόλεώς ἐστιν.
      Ἐτιμῶμεν αὐτὸ
      πιστῶς. Οἱ νόμοι
      τῆς \col(3)Πόλεως τῆς
      Συμμετρίας\col(0)
      κελεύουσι τὰ
      ἀριστερὰ καὶ
      δεξιὰ
      ἰσορροπεῖν!
      Ἀλλὰ τὸ \col(1)Κάρυον
      Τούνι\col(0) ἐν μέσῳ
      τῆς
      πόλεως ἐκλάσθη!
      Ἡ
      \col(3)Πόλις Συμμετρίας\col(0)
      ἐταράχθη. Ἐὰν μὴ
      ἰαθῇ τὸ \col(1)Κάρυον
      Τούνι\col(0) καὶ τεθῇ
      πάλιν, ἡ \col(3)Πόλις
      τῆς Συμμετρίας\col(0)
      ἀπολεῖται ὑπὸ
      τῶν
      ἐκρήξεων.
      Συνίης;
        \opt()Ναί \opt()Οὔ

  - name: TX_2d12
    index: 0x12
    text: |-
      Ἔδωκα τὸ κλασθὲν
      \col(1)Κάρυον Τούνι\col(0) τῷ
      ἀνδρί μου, ἀλλ'
      οὐ δύναται
      ἀναβῆ-
      ναι τὸ \col(3)Τεῖχος
      Ἀνορθώσεως\col(0).

  - name: TX_2d13
    index: 0x13
    text: |-
      Τί; Διὰ τί οὔ;

  - name: TX_2d14
    index: 0x14
    text: |-
      Οὐκ ἤκουες;
      Δηλώσω οὖν αὐτὸ
      πάλιν!
      \jump(TX_2d11)
    null_terminator: False

  - name: TX_2d15
    index: 0x15
    text: |-
      Σοφός τις
      ὀνόματι
      \col(3)Ἐπίβλητος\col(0) οἰκεῖ
      ἐπὶ τοῦ \col(3)Τείχους
      Ἀνορθώσεως\col(0).
      Οἶμαι
      ὅτι ἰάσεται τὸ
      κλασθὲν \col(1)Κάρυον
      Τούνι\col(0), ἀλλ' ἐγὼ
      οὐ δύναμαι ἀνα-
      βῆναι τὸ τεῖχος.

  - name: TX_2d16
    index: 0x16
    text: |-
      Τοῦτό ἐστι τὸ
      \col(1)Κάρυον Τούνι\col(0),
      ἀλλὰ κέκλασται
      νῦν. Ἔνεγκε αὐτὸ
      πρὸς τὸν
      \col(3)Ἐπίβλητον\col(0).

  - name: TX_2d17
    index: 0x17
    text: |-
      Τὸ \col(1)Κάρυον Τούνι\col(0)
      ἰάθη! Δύνασαι
      θεῖναι αὐτὸ ἐπὶ
      τῆς βάσεως;

  - name: TX_2d18
    index: 0x18
    text: |-
      Νῦν τὸ ὄρος
      ἡσυχάσει! Δεῖ με
      καθαρίσαι τὸ
      σπήλαιον ἐκεῖνο!

  - name:
    - TX_2d19
    - TX_2d1a
    - TX_2d1b
    - TX_2d1c
    - TX_2d1d
    - TX_2d1e
    - TX_2d1f
    index:
    - 0x19
    - 0x1a
    - 0x1b
    - 0x1c
    - 0x1d
    - 0x1e
    - 0x1f
    text: |-
      Χαῖρε εἰς τὴν
      \col(3)Πόλιν
      Συμμετρίας\col(0)!
      Ἡ τελεία ἰσορρο-
      πία νόμος τῆς
      γῆς
      ἐστιν!

  - name: TX_2d20
    index: 0x20
    text: |-
      Ἐνίοτε ἀκούω
      μουσικῆς καταρ-
      ρεούσης ἐκ τῆς
      κορυφῆς τοῦ
      ὄρους, ἀλλ'
      ἀπορῶ
      διὰ τί.

  - name: TX_2d21
    index: 0x21
    text: |-
      Ἆ; Ἡ εἴσοδος τοῦ
      σπηλαίου; Ἐκαλύ-
      φθη ὑπὸ ῥύακος
      πυρὸς ἐκ τοῦ
      ὄρους πάλαι! Ἐὰν
      ἡσυχάσῃ τὸ ὄρος,
      ἴσως εἰσελεύσῃ.

  - name: TX_2d22
    index: 0x22
    text: |-
      Τὸ ἔχειν τι ἐν
      τῷ
      μέσῳ καλόν
      ἐστιν!

  - name: TX_2d23
    index: 0x23
    text: |-
      Ὢ τῆς ταραχῆς...
      Δεῖ με μείζονα
      εἶναι;

  - name: TX_2d24
    index: 0x24
    text: |-
      Χαῖρε εἰς τὴν
      \col(3)Πόλιν
      Συμμετρίας\col(0)!
      Χρῄζεις τινός;
        \opt()Ναί \opt()Οὔ

  - name: TX_2d25
    index: 0x25
    text: |-
      Καλόν ἐστι τὸ
      μηδενὸς χρῄζειν,
      οὐχί;

  - name: TX_2d26
    index: 0x26
    text: |-
      Θαυμαστόν! Οὐκ
      ᾔδειν ὅτι ἄλλοι
      ἴσασι τὴν ἰσχὺν
      τῆς \col(3)συμμετρίας\col(0)!
      Εὐχαριστῶ
      εἰπόντι
      μοι! Εἰς χάριν
      αὐξήσω τὸν
      ἀριθμὸν τῶν
      \col(1)δακτυλίων\col(0) οὓς
      δύνασαι φέρειν!

  - name: TX_2d27
    index: 0x27
    text: |-
      Τί οὖν ἀληθῶς
      θέλεις;

  - name: TX_2d28
    index: 0x28
    text: |-
      Δεῖξόν μοι τὴν
      \col(1)Πυξίδα Δακτυλίων\col(0)
      σου μικρόν!
      ................
      Νίψον ἀνομήματα
      μὴ μόναν ὄψιν!

  - name: TX_2d29
    index: 0x29
    text: |-
      Ἰδού!

  - name: TX_2d2a
    index: 0x2a
    text: |-
      Ἒ! Οὐκ ἔχεις
      \col(1)Πυξίδα
      Δακτυλίων\col(0).
      Εἶεν, λάβε τὴν
      ἐμὴν \col(1)πυξίδα\col(0)!

  - name: TX_2d2b
    index: 0x2b
    text: |-
      Διδάξω σε τὸ
      \col(1)μυστήριον\col(0) τοῦ
      φέρειν πολλοὺς
      \col(1)δακτυλίους\col(0) καὶ
      ἐν
      τῷ \col(3)Ὁλόδρουμ\col(0)!\stop
      \secret1\stop
      Ἐπάνελθε ἐὰν
      ἐπιλάθῃ αὐτοῦ.

  - name: TX_2d2c
    index: 0x2c
    text: |-
      Τὸ ὄρος τοῦτο
      εἶχε κρυπτὸν
      σπήλαιον, ἀλλὰ
      μυστήριόν ἐστιν.

  - name: TX_2d2d
    index: 0x2d
    text: |-
      Τὸ ἔχειν τι ἐν
      τῷ
      μέσῳ καλόν
      ἐστιν!

- group: 0x2e
  data:
  - name: TX_2e00
    index: 0x00
    text: |-
      Βάλε σκοπούς,
      λάβε καλὰ ἆθλα!
      350 ἀρ. καὶ ἄνω·
            Δακτύλιος
      250 - 349 ἀρ.·
          Κάρυον Γασά
      150 - 249 ἀρ.·
           30 δραχμαί
      50 - 149 ἀρ.·
             1 Καρδία
      Ὑπὸ 50 ἀρ....
                Οὐδέν\stop
      Ἀγαθῇ τύχῃ!

  - name: TX_2e01
    index: 0x01
    text: |-
      \left Κυλίουσα Ῥάχις
      \down Πόλις Λύννης

  - name: TX_2e02
    index: 0x02
    text: |-
      Κίνδυνος!!!

  - name: TX_2e03
    index: 0x03
    text: |-
      \down Κώμη Λύννης

  - name: TX_2e04
    index: 0x04
    text: |-
      Τεῖχος
      Ἀνορθώσεως

  - name: TX_2e05
    index: 0x05
    text: |-
      \left Ξηροὶ Καταρρ.

  - name: TX_2e06
    index: 0x06
    text: |-
      \up Βασίλειον τοῦ
        Μεγάλου Μοβλίν

  - name: TX_2e07
    index: 0x07
    text: |-
      \up Ἅμαξαι Σκοπῶν
        Πολλὴ Χαρά!

  - name: TX_2e08
    index: 0x08
    text: |-
      \up Στοὰ Γορώνων
        Πολλὴ Χαρά!

  - name: TX_2e09
    index: 0x09
    text: |-
      \up Βάσις Ῥάχεως
      \left Κώμη Λύννης

  - name: TX_2e0a
    index: 0x0a
    text: |-
      \up Οἶκος Χοροῦ
      \right Κορυφὴ Ῥάχεως

  - name: TX_2e0b
    index: 0x0b
    text: |-
      \right Μέγας Κτύπος
      \down Ἅμαξαι Σκοπῶν

  - name: TX_2e0c
    index: 0x0c
    text: |-
      Ζητεῖται·
       Πόμα Δυνάμεως
        Ὁ τοῦ Κτύπου

  - name: TX_2e0d
    index: 0x0d
    text: |-
      Ὁδὸς Μακού

  - name: TX_2e0e
    index: 0x0e
    text: |-
      \right Δένδρον Μακού

  - name: TX_2e0f
    index: 0x0f
    text: |-
      \right Μνημεῖα Ἰώλ

  - name: TX_2e10
    index: 0x10
    text: |-
      \up Πόλις
      Συμμετρίας
      \right Πόλις Λύννης

  - name: TX_2e11
    index: 0x11
    text: |-
      \up Πόλις
      Συμμετρίας

  - name: TX_2e12
    index: 0x12
    text: |-
      Μὴ βάλλετε μηδὲν
      εἰς τὸ ὕδωρ.

  - name: TX_2e13
    index: 0x13
    text: |-
      \up Τεῖχος
         Ἀνορθώσεως

  - name: TX_2e14
    index: 0x14
    text: |-
      \up Δένδρον Μακού

  - name: TX_2e15
    index: 0x15
    text: |-
      Σκηνὴ Σοφῶν
      Ὀρνέων
       Οἱ νέοι εὖ
       ἔλθοιεν!!!

  - name: TX_2e16
    index: 0x16
    text: |-
      \up Οἶκος Ναϋρού
      \down Πόλις Λύννης

  - name: TX_2e17
    index: 0x17
    text: |-
      \up Βασίλειον Ἄμβι
      \left Πύργος Ἄμβι

  - name: TX_2e18
    index: 0x18
    text: |-
      \right Οἶκος Σεβάλ

  - name: TX_2e19
    index: 0x19
    text: |-
      \left Κώμη τῶν Ζώρα
      \right Θάλασσα
      Λαιλάπων

  - name: TX_2e1a
    index: 0x1a
    text: |-
      \up Βασίλειον Ζώρα
      \left Ἱερὸν Ἰαβού

  - name: TX_2e1b
    index: 0x1b
    text: |-
      \right Βιβλιοθήκη
         τῶν Διόπτρων

  - name: TX_2e1c
    index: 0x1c
    text: |-
      **Ἀρχαῖον
      Σπήλ.**
      Φύλαξαι! Πίπτει
      ῥᾳδίως!

  - name: TX_2e1d
    index: 0x1d
    text: |-
      Εἰς τὸ Ὁλόδρουμ!
       Βιπὶν καὶ
      Βλόσσομ

  - name: TX_2e1e
    index: 0x1e
    text: |-
      \left Κώμη Λύννης

  - name: TX_2e1f
    index: 0x1f
    text: |-
      Χαῖρε εἰς τὴν
      Κώμην τῶν Ζώρα!

  - name: TX_2e20
    index: 0x20
    text: |-
      Παραθήσομαι τὸ
      εὕρημά μου μόνῳ
      τῷ ἔχοντι ἰσχὺν
      καὶ κούφους
      πόδας.
        Σεβάλ

- group: 0x2f
  data:
  - name: TX_2f00
    index: 0x00
    text: |-
      Ὁ μὴ ἔχων πτέρυ-
      γας οὐ νικήσει
      με!

  - name: TX_2f01
    index: 0x01
    text: |-
      \pos(1)Τὸ ἰσχυρὸν ξίφος
      καὶ ὁ θυρεός μου
      συντρίψουσί σε!

  - name: TX_2f02
    index: 0x02
    text: |-
      ΟΥΧΙ!\stop
      Τὸ ἰσχυρὸν ξίφος
      μου ἐκλάσθη...
      Τίσεις δίκην ἐπὶ
      τούτῳ!!!

  - name: TX_2f03
    index: 0x03
    text: |-
      \pos(2)Ἕως εἰμὶ ὑπὸ
      γῆν,
      αἱ πληγαί σου οὐ
      φοβοῦσί με!

  - name: TX_2f04
    index: 0x04
    text: |-
      \pos(2)Οὐκοῦν, \Link!\stop
      Τέλος ἔφθασας
      εἰς τὸν βωμόν!
      Φεῦ! Οὐκ ἐάσομέν
      σε περιτρέχειν
      ἄνω! Διὸ εἱλκύ-
      σαμέν σε ὧδε.

  - name:
    - TX_2f05
    - TX_2f06
    - TX_2f07
    - TX_2f08
    index:
    - 0x05
    - 0x06
    - 0x07
    - 0x08
    text: |-
      \pos(2)Αἱ Φλόγες τῆς
      Λύπης, Ὀλέθρου
      καὶ Ἀπογνώσεως
      καίονται
      λαμπρῶς.
      Ἡ ἐπάνοδος τοῦ
      Βασιλέως Πονηροῦ
      \col(3)Γάνωνος\col(0) ἐγγίζει.
      Ἡ Ἱερὰ Θυσία, ἡ
      \col(3)Ζέλδα\col(0), μόνη λεί-
      πεται! Ὅταν
      καλέ-
      σωμεν τὸ πνεῦμα
      τοῦ \col(3)Γάνωνος\col(0) εἰς
      τὸ σκεῦος, τελε-
      σθήσεται!\stop
      Οὐ κωλύσεις
      ἡμᾶς!
      Ἑτοιμάζου πρὸς
      ὄλεθρον!

  - name: TX_2f09
    index: 0x09
    text: |-
      \pos(2)Ὢ χὸ χό! Οὐκ
      ᾠήθην σε
      προελεύ-
      σεσθαι
      τοσοῦτον...

  - name: TX_2f0a
    index: 0x0a
    text: |-
      \pos(2)Ἀλλ' οὐ πεσοῦμαι
      ὡς ὁ \col(3)Ὄνοξ\col(0) καὶ ἡ
      \col(3)Βεράν\col(0)! Ἴδε τὴν
      ἀληθῆ δύναμίν
      μου!

  - name: TX_2f0b
    index: 0x0b
    text: |-
      \pos(2)Θύσομέν σε ἵνα ὁ
      Βασιλεὺς ὁ
      Πονηρὸς
      ἐπανέλθῃ!

  - name: TX_2f0c
    index: 0x0c
    text: |-
      \pos(2)Χὸ χό! Ἡ
      ἐπάνοδος
      τοῦ \col(3)Γάνωνος\col(0)
      ἐγγὺς
      ἦν! \Link! Οὔπω
      τέλος ἐστίν! Αἱ
      τελεταὶ ἡμῶν
      ἀπέτυχον, ἀλλὰ
      θύοντες τὸ σῶμα
      τοῦτο, ὁ \col(3)Γάνων\col(0)
      ἐπανελεύσεται!

  - name: TX_2f0d
    index: 0x0d
    text: |-
      \pos(2)Γουὸ χὸ χό!
      Γουὰ χὰ χά...
      Ὀλέσω...
      πάντα...
      Ἀνελῶ ΠΑΝΤΑΣ!!!

  - name: TX_2f0e
    index: 0x0e
    text: |-
      \pos(2)Γουὸ χὸ χό! Ἐγώ
      εἰμι ὁ Βασιλεὺς
      ὁ
      Πονηρός, ὁ
      \col(3)Γάνων\col(0)...

  - name: TX_2f0f
    index: 0x0f
    text: |-
      \pos(2)Γουὸ χὸ χό!

  - name:
    - TX_2f10
    - TX_2f11
    - TX_2f12
    index:
    - 0x10
    - 0x11
    - 0x12
    text: |-
      \pos(2)Ἐγώ εἰμι ὁ \col(3)Βαΐρ\col(0),
      ὁ πιστὸς
      ὑπηρέτης
      τῆς \col(3)Βεράν\col(0)! Ἤκου-
      σα ὅτι τις
      πειρᾶ-
      ται κωλῦσαι τὴν
      \col(3)Βεράν\col(0), διὸ
      ἦλθον.
      Ἀλλὰ παῖς τις
      μόνον ἐστίν!\stop
      Εἶεν! Νικήσω σε!

  - name: TX_2f13
    index: 0x13
    text: |-
      \pos(2)Θαυμάζω ὅτι
      ἦλθες
      τοσοῦτον.
      Ἐνόμισά
      σε χελώνην ἀβλα-
      βῆ, ἀλλ'
      ἥμαρτον.
      ...Ὅμως τελέσω
      τοῦτο ταχέως!!!

  - name: TX_2f14
    index: 0x14
    text: |-
      \slow()ΩΩ! Κακὲ παῖ!
      Λάβε τοῦτο!

  - name: TX_2f15
    index: 0x15
    text: |-
      \slow()Βίαιε! Ἀρκεῖ!
      Σπουδάζω νῦν!

  - name: TX_2f16
    index: 0x16
    text: |-
      \slow()Εἶεν! Χαῖρε!

  - name: TX_2f17
    index: 0x17
    text: |-
      \slow()ΩΩ..!\stop
      Ἔτισα δίκην τῆς
      ὑπερηφανίας μου,
      ἀλλ' ἀπαγγελῶ
      τοῦτο τῇ \col(3)Βεράν\col(0)!
      Γὰρ χὰρ χάρ!

  - name: TX_2f18
    index: 0x18
    text: |-
      \slow()Ἀ...ἀδύνατον!
      Οὐχ
      ἅπαξ, ἀλλὰ δίς!
      \col(3)Βεράν\col(0)... \col(3)Ὄνοξ\col(0)...
      Σύγγνωτε...
      Χαίρετε!

  - name: TX_2f19
    index: 0x19
    text: |-
      \pos(2)Τίς εἰσέρχεται
      εἰς τὸ φρούριόν
      μου οὕτως
      ἀναιδῶς;\stop
      Ἆ! Συνῆκα! Ἦλθες
      κλέψαι τὰ \col(1)Ἄνθη
      τοῦ Βόμβου\col(0) ἃ
      συνάγω, οὐχί; Οὐ
      γενήσεται τοῦτο,
      κλέπτα! Μὴ
      νόμιζε
      ὅτι ἐξελεύσῃ
      ζῶν!

  - name: TX_2f1a
    index: 0x1a
    text: |-
      \pos(2)Ἒ! Σὺ εἶ ὁ παῖς
      ὁ περίεργος! Νῦν
      οὐ γενήσεται ὡς
      ἐν τῷ \col(3)Ὁλόδρουμ\col(0)!
      Ἐμόχθησα
      χρώμενος
      τοῖς \col(1)Ἄνθεσι τοῦ
      Βόμβου\col(0) ἃ ἔκλεψα
      παρὰ τῶν
      Γορώνων!
      Γεῦσαι τῶν
      \col(1)Βόμβων\col(0)
      μου! Ἄγε, ἄφρων!

  - name:
    - TX_2f1b
    - TX_2f1c
    - TX_2f1d
    index:
    - 0x1b
    - 0x1c
    - 0x1d
    text: |-
      \pos(0)Οὐχίιιιι!
      Ἀδύνατον!
      Διὰ τί
      ἐμοίιιι;!;

  - name: TX_2f1e
    index: 0x1e
    text: |-
      3 Μεγάλα,
      2 Κοινά.

  - name: TX_2f1f
    index: 0x1f
    text: |-
      Θέλω καλὴν
      θερινὴν ἀνάπαυ-
      σιν.

  - name: TX_2f20
    index: 0x20
    text: |-
      Αἰσθοῦ τοῦ
      ψυχροῦ
      βλέμματός μου!!!

  - name: TX_2f21
    index: 0x21
    text: |-
      Ἆ; Εἶπον ἐγὼ
      τοῦτο;

  - name: TX_2f22
    index: 0x22
    text: |-
      Ἀληθῶς; Λέγω,
      ᾔδειν τοῦτο!

  - name: TX_2f23
    index: 0x23
    text: |-
      Εἴθε ἀπῆλθον εἰς
      νοτίαν νῆσον.

  - name: TX_2f24
    index: 0x24
    text: |-
      Θέλω πέτεσθαι.
      Ὅπου ἂν ᾖ.

  - name: TX_2f25
    index: 0x25
    text: |-
      Νυστάζω σφόδρα.

  - name: TX_2f26
    index: 0x26
    text: |-
      \pos(2)Καιρός ἐστι τοῦ
      μικροῦ παιγνίου
      ἡμῶν! Διαλύομαι.
      Ἐὰν ἀναγκάσῃς με
      συνελθεῖν καὶ
      ῥήξῃς με, λήγει!
      Ἀλλὰ πρὶν ποιῆ-
      σαι τοῦτο, λήψο-
      μαι μέρος τῆς
      ψυχῆς σου!!!
      Ἄρξαι νῦν!

  - name: TX_2f27
    index: 0x27
    text: |-
      Χελώνη ταχύτερον
      σοῦ ἐργάζεται!\stop
      Ὑστέρησας!
      \Link...
      Ἐποίησάς μοι
      χάριν ἐν τῷ
      \col(3)Ὁλόδρουμ\col(0)! Ἥρπασα
      τὴν βασιλίδα ἣν
      ζητεῖς! Ἐὰν
      νομίζῃς ὅτι
      σώσεις αὐτήν,
      πείρασον!
      Γὰρ χὰρ χὰρ χάρ!

  - name: TX_2f28
    index: 0x28
    text: |-
      \pos(2)Ἐὰν φύγῃς τὰς
      πληγάς μου καὶ
      ἀναβῇς ὧδε, λήψῃ
      τὴν τιμίαν βασι-
      λίδα σου πάλιν!
      Ἀλλ' οὐ μὴ
      γένηται!
      Γὰρ χὰρ χὰρ χάρ!

  - name: TX_2f29
    index: 0x29
    text: |-
      Ἆ! Μὴ νόμιζε ὅτι
      ἐτελέσθη!
      Γὰρ χὰρ χὰρ χάρ!
      Χαῖρε!

  - name: TX_2f2a
    index: 0x2a
    text: |-
      \slow()Οὐ κακόν! Ἀλλ'
      ἕως εἰμὶ ἐν τῷ
      σώματι τῆς
      \col(3)Ναϋρού\col(0), οὐ δύνα-
      σαι βλάψαι με,
      ἀνίκητός εἰμι
      οὖν!
      Ἆ ἆ ἆ ἆ!

  - name: TX_2f2b
    index: 0x2b
    text: |-
      Χιὰ χιὰ χιά!\stop
      Οὐχ ὁρᾷς τίς
      εἰμί, ὅτι ἡ σκιά
      σού εἰμι!

- group: 0x30
  data:
  - name: TX_3000
    index: 0x00
    text: |-
      Εἴσελθε!\stop
      Ἐγώ εἰμι ὁ
      \col(3)Βασού\col(0),
      ὁ δακτυλιουργός.
      Πρῶτον ἦλθες;
      Δηλώσω οὖν σοι
      τὰ περὶ
      δακτυλίων.
      \jump(TX_303a)
    null_terminator: False

  - name: TX_3001
    index: 0x01
    text: |-
      Τὸ φέρειν
      \col(1)δακτύλιον\col(0) οὐδὲν
      ποιεῖ. Μὴ
      ἐπιλάθῃ
      ἀνοῖξαι τὴν
      Ὀθόνην Σκευῶν
      καὶ φορεῖν
      αὐτόν.

  - name: TX_3002
    index: 0x02
    text: |-
      Ἐδοκίμασα πάντας
      τοὺς δακτυλίους
      σου!

  - name: TX_3003
    index: 0x03
    text: |-
      Εἴσελθε! Χαῖρε
      εἰς τὸ τοῦ
      \col(3)Βασού\col(0).\stop
      Τί ποιήσω;\stop
       \opt()Δοκίμασον
      \opt()Κατάλογος
       \opt()Παῦσαι

  - name: TX_3004
    index: 0x04
    text: |-
      Ποῖον δοκιμάσω;

  - name: TX_3005
    index: 0x05
    text: |-
      20 δραχμῶν
      ἐστιν!
       \opt()Δοκίμασον
      \opt()Παῦσαι

  - name: TX_3006
    index: 0x06
    text: |-
      Οὐκ ἔχεις
      ἱκανάς.
      Σύγγνωθι.

  - name: TX_3007
    index: 0x07
    text: |-
      Ἔχεις τοῦτον
      ἤδη,
      διὸ ἀγοράσω
      αὐτὸν
      30 δραχμῶν.

  - name: TX_3008
    index: 0x08
    text: |-
      Οἱ \col(1)δακτύλιοι\col(0)
      οὐδὲν
      ποιοῦσιν ἐὰν μὴ
      φορῶνται!

  - name: TX_3009
    index: 0x09
    text: |-
      Ἐγώ εἰμι ὁ
      \col(3)Ἐρυθρὸς Ὄφις\col(0).\stop
      Θέλεις ἐρωτῆσαι
      περὶ \col(1)δακτυλίων\col(0);
          \opt()Ναί \opt()Οὔ

  - name: TX_300a
    index: 0x0a
    text: |-
      Δοκιμασία ἢ
      Πυξίδες
      Δακτυλίων;
      Πότερον;
      \opt()Δοκιμασία
      \opt()Πυξίς

  - name: TX_300b
    index: 0x0b
    text: |-
      Πολλοὶ μαγικοὶ
      \col(1)δακτύλιοί\col(0) εἰσιν
      ἐν τῇ γῇ ταύτῃ,
      ἀλλὰ τὸ εὑρεῖν
      μόνον οὐ δίδωσι
      τὴν δύναμιν.\stop
      Ἕως ἂν δοκιμασθῇ
      ὁ \col(1)δακτύλιος\col(0) καὶ
      γνωσθῇ ἡ δύναμις
      αὐτοῦ, οὐκ ἔστι
      χρῆσθαι αὐτῷ.\stop
      Ὁ \col(3)Βασοὺ\col(0)
      δοκιμάζει.
      Δοκιμασθέντων
      δέ,
      ἑλοῦ ἐκ τοῦ
      Καταλόγου οὓς
      θέλεις ἐν τῇ
      \col(1)Πυξίδι
      Δακτυλίων\col(0).\stop
      Καὶ μέμνησο
      φορεῖν τὸν
      \col(1)δακτύλιον\col(0) ᾧ
      χρήσῃ.
      Τοῦτό ἐστιν.\stop
      \jump(TX_3016)Τοῦτό ἐστιν.\stop
      \jump(TX_3016)
    null_terminator: False

  - name: TX_300c
    index: 0x0c
    text: |-
      Ἵνα φέρῃς
      δεδοκιμασμένους
      \col(1)δακτυλίους\col(0), δεῖ
      ἔχειν \col(1)Πυξίδα
      Δακτυλίων\col(0).\stop
      Ἑλοῦ τοὺς
      \col(1)δακτυλίους\col(0) ἐκ
      τοῦ
      Καταλόγου καὶ
      θὲς
      ἐν τῇ \col(1)πυξίδι\col(0)
      σου.\stop
      Εἶτα ἄνοιξον τὴν
      Ὀθόνην Σκευῶν
      ὅταν θέλῃς
      φορεῖν
      \col(1)δακτύλιον\col(0).\stop
      Πείρασον αὐτό.\stop
      \jump(TX_3016)
    null_terminator: False

  - name: TX_300d
    index: 0x0d
    text: |-
      Ἑλοῦ.\stop
        \opt()Τύχη
        \opt()Σύνδεσμος

  - name: TX_300e
    index: 0x0e
    text: |-
      Εἶεν...\stop
      Χρῶ καλωδίῳ
      συνδέσμου πρὸς
      ἄλλο παίγνιον.\stop
      Νῦν ἴδε εἰ ὁ
      φίλος σου
      ἕτοιμός
      ἐστιν.\stop
      Εἶεν! Νῦν ἡ \col(3)τύχη\col(0)
      σου!\stop
      Ἐπὶ τῷ "Ἄρξαι",
      ὄψομαι τὸν φίλον
      σου. Ἐπὶ τῷ
      "Ἕτοιμος",
      ἕλεσθε
      ἀμφότεροι.
      Ἕτοιμος  \opt()Ἄρξαι!

  - name: TX_300f
    index: 0x0f
    text: |-
      Ἐκωλύθην ἐν τῇ
      ὁδῷ. Συνδέδεταί
      σου τὸ καλώδιον;
      Σκόπει αὐτὸ καὶ
      πείρασον πάλιν!

  - name: TX_3010
    index: 0x10
    text: |-
      Ἐπάνελθε ὅταν
      θέλῃς.

  - name: TX_3011
    index: 0x11
    text: |-
      Δοκιμάσαι
      τοῦτον;
        \opt()Ναί \opt()Οὔ

  - name: TX_3012
    index: 0x12
    text: |-
      Οὐχί! Οὐκ
      ἐξελεύ-
      σῃ πρὶν δοκιμάσω
      αὐτόν!

  - name: TX_3013
    index: 0x13
    text: |-
      Δοκιμάσω αὐτὸν
      δωρεὰν νῦν, ἀλλὰ
      μετὰ τοῦτο 20
      δραχμῶν ἔσται
      ἕκαστος
      \col(1)δακτύλιος\col(0).
      Ἐὰν λάβῃς δύο
      ὁμοίους
      \col(1)δακτυλίους\col(0),
      ἀγοράσω τὸν ἕνα
      30 δραχμῶν.\stop
      Νῦν ὁ Κατάλογος!
      Οἱ
      δεδοκιμασμένοι
      \col(1)δακτύλιοι\col(0) τίθεν-
      ται ἐν τῷ
      Καταλό-
      γῳ. Ὅταν θέλῃς
      \col(1)δακτύλιον\col(0), θὲς
      αὐτὸν ἐκ τοῦ
      Καταλόγου εἰς
      τὴν
      \col(1)πυξίδα\col(0) σου.
      Λάλη-
      σόν μοι ἰδεῖν
      τὸν
      Κατάλογον.
      Ἴδωμεν
      αὐτὸν νῦν.

  - name: TX_3014
    index: 0x14
    text: |-
      Ὤ! Πάντες οἱ
      \col(1)δακτύλιοί\col(0) σου
      ἐδοκιμάσθησαν.

  - name: TX_3015
    index: 0x15
    text: |-
      Ὤ! Οὐκ ἔχεις
      \col(1)δακτυλίους\col(0) ἐν τῷ
      Καταλόγῳ σου!

  - name: TX_3016
    index: 0x16
    text: |-
      Θέλεις ἀκοῦσαι
      πλείονα;
          \opt()Ναί \opt()Οὔ

  - name: TX_3017
    index: 0x17
    text: |-
      Τοῦτό ἐστιν ὁ
      \col(1)δακτύλιος\col(0) οὗτος.
      Θήσω αὐτὸν ἐν τῷ
      Καταλόγῳ σου!

  - name: TX_3018
    index: 0x18
    text: |-
      Ἐγώ εἰμι ὁ
      \col(3)Ἐρυθρὸς Ὄφις\col(0)!
      Φύλαξ εἰμὶ τῶν
      \col(1)μυστηρίων
      δακτυλίων\col(0)!
      Ἑλοῦ!\stop
      \opt()Εἰπὲ \opt()Αἴτει
      \col(1)μυστ.\col(0)
              \opt()Παῦσαι

  - name: TX_3019
    index: 0x19
    text: |-
      "Περὶ Μυστηρίων
      Δακτυλίων"
        \opt()Ἀνάγνωθι \opt()Μή

  - name: TX_301a
    index: 0x1a
    text: |-
      Ἐὰν φυλάξῃς τὸ
      \col(1)μυστήριον\col(0) ὃ εἶπέ
      σοι ὁ \col(3)Ἐρυθρὸς
      Ὄφις\col(0) ἐν τῇ
      Προφήτιδι τῶν
      Καιρῶν, καὶ
      εἴπῃς
      αὐτὸ τῷ \col(3)Ἐρυθρῷ
      Ὄφει\col(0) ὧδε,\stop
      δύνασαι ἐνεγκεῖν
      \col(1)δακτυλίους\col(0) ἐκ
      τῆς
      Προφήτιδος τῶν
      Καιρῶν ὧδε.
      Ὁμοίως
      δύνασαι λαβεῖν
      \col(1)δακτυλίους\col(0)
      ἐντεῦ-
      θεν ἐκεῖσε.\stop
      Εὐαγγέλιον!\stop
      Καλωδίῳ
      συνδέσμου
      καὶ δυσὶ
      παιγνίοις
      δύνασαι ἐνεγκεῖν
      \col(1)δακτυλίους\col(0) ὧδε
      ἄνευ \col(1)μυστηρίου\col(0)!\stop
        -ΠΡΟΣΕΧΕ!!-
      Ἐὰν μὴ ἐτέλεσας
      τὸν ἆθλον ἢ
      ἦλθες
      διὰ \col(1)μυστηρίου\col(0)
      εἰς
      τὴν \col(3)Λαβρύνναν\col(0),
      τὸ
      \col(1)μυστήριον\col(0) οὐκ
      ἐνεργήσει.

  - name: TX_301b
    index: 0x1b
    text: |-
      Ὦ, ἀληθῶς;
      \jump(TX_3010)
    null_terminator: False

  - name: TX_301c
    index: 0x1c
    text: |-
      Ἆ... Ὁρῶ! Καλῶ
      τοῦτο
      \call(0xfd)!

  - name: TX_301d
    index: 0x1d
    text: |-
      Ἄκουε καλῶς!\stop
      \secret1
      \secret2\stop
      Ἀκοῦσαι πάλιν;
        \opt()Ναί \opt()Οὔ

  - name: TX_301e
    index: 0x1e
    text: |-
      Οὐκ οἶδα ἐκεῖνο
      τὸ \col(1)μυστήριον\col(0).
      Ἐπάνελθε ἀκούσας
      πάλιν τὸ
      \col(1)μυστήριον\col(0)
      ἐν τῇ Προφήτιδι
      τῶν Αἰώνων.

  - name: TX_301f
    index: 0x1f
    text: |-
      Ἐγώ εἰμι ὁ
      \col(3)Κυανοῦς Ὄφις\col(0).\stop
      Δίδωμι \col(3)τύχας
      δακτυλίων\col(0).
      Θέλεις
      \col(3)τύχην δακτυλίου\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_3020
    index: 0x20
    text: |-
      "Ἀρχαὶ Συνδέσμου
      Δακτυλίων"
        \opt()Ἀνάγνωθι \opt()Μή

  - name: TX_3021
    index: 0x21
    text: |-
      Πῶς ποιήσεις
      τύχην φιλίας
      μόνος; Πείρασον
      μετὰ φίλου.

  - name:
    - TX_3022
    - TX_3023
    index:
    - 0x22
    - 0x23
    text: |-
      Ἡ \col(3)τύχη\col(0) σου
      ἐτελέ-
      σθη. Ὁ \col(1)δακτύλιος\col(0)
      σημεῖόν ἐστι τῆς
      φιλίας ὑμῶν. Μὴ
      ὀργίζου ὅλως.

  - name: TX_3024
    index: 0x24
    text: |-
      Ἐγώ εἰμι ὁ
      \col(3)Κυανοῦς Ὄφις\col(0).\stop
      Εὐθύνω τὸ καλώ-
      διον συνδέσμου.
      Τί ποιήσω;\stop
        \opt()Τύχη
        \opt()Σύνδ. 
      \opt()Παῦσαι

  - name: TX_3025
    index: 0x25
    text: |-
      Ἑλοῦ λόγον.\stop
        \opt()Τύχη
        \opt()Σύνδ. 
      \opt()Παῦσαι

  - name: TX_3026
    index: 0x26
    text: |-
      Περὶ Συνδέσμων\stop
      Καλωδίῳ
      συνδέσμου
      καὶ δυσὶ
      παιγνίοις
      δύνασαι ἐνεγκεῖν
      \col(1)δακτυλίους\col(0) ἐκ
      τῆς
      Προφήτιδος τῶν
      Καιρῶν εἰς τὴν
      \col(3)Λαβρύνναν\col(0) ἄνευ
      \col(1)μυστηρίου\col(0).\stop
      Θὲς τὴν Προφῆτιν
      τῶν Καιρῶν εἰς
      ἄλλο παίγνιον,
      σύνδεσον τὸ
      καλώδιον καὶ
      ἄνοιξον, ἀλλὰ μὴ
      πιέσῃς πλῆκτρα.\stop
      Παῖξον τὴν
      Προφῆ-
      τιν τῶν Αἰώνων,
      λάλησον τῷ \col(3)Κυανῷ
      Ὄφει\col(0) καὶ ἑλοῦ
      "Σύνδ." ἵνα
      ἐνέγ-
      κῃς \col(1)δακτυλίους\col(0)
      ὧδε.\stop
      Ὁμοίως δύνασαι
      λαβεῖν
      \col(1)δακτυλίους\col(0)
      ἐντεῦθεν εἰς τὴν
      Προφῆτιν Καιρῶν.\stop
        --ΠΡΟΣΕΧΕ!!!--
      Ἐὰν μὴ ἐτέλεσας
      τὸν ἆθλον ἢ
      ἦλθες
      διὰ \col(1)μυστηρίου\col(0)
      εἰς
      τὴν \col(3)Λαβρύνναν\col(0),
      οὐ
      δύνασαι
      \col(1)συνδέσαι\col(0).\stop
      Ἀναγνῶναι ἔτι;
        \opt()Ναί \opt()Οὔ

  - name: TX_3027
