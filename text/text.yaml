# See "text/info.txt" for documentation about this file.

groups:
- group: 0x00
  data:
  - name:
    - TX_0000
    - TX_0001
    index:
    - 0x00
    - 0x01
    text: |-
      Ἔλαβες \col(1)1
      δραχμήν\col(0)!
      ...

  - name: TX_0002
    index: 0x02
    text: |-
      Ἔλαβες
      \col(1)5 δραχμάς\col(0)!

  - name: TX_0003
    index: 0x03
    text: |-
      Ἔλαβες
      \col(1)10 δραχμάς\col(0)!

  - name: TX_0004
    index: 0x04
    text: |-
      Ἔλαβες
      \col(1)20 δραχμάς\col(0)!
      Οὐ κακόν ἐστιν.

  - name: TX_0005
    index: 0x05
    text: |-
      Ἔλαβες
      \col(1)30 δραχμάς\col(0)!
      Καλόν ἐστιν.

  - name: TX_0006
    index: 0x06
    text: |-
      Ἔλαβες
      \col(1)50 δραχμάς\col(0)!
      Ὡς μακάριος εἶ!

  - name: TX_0007
    index: 0x07
    text: |-
      Ἔλαβες \col(1)100
      δραχμάς\col(0)! Ἆρα
      σφόδρα χαίρεις;

  - name: TX_0008
    index: 0x08
    text: |-
      Ἔλαβες \col(1)150
      δραχμάς\col(0)!
      Εὖγε!!!

  - name: TX_0009
    index: 0x09
    text: |-
      Ἔλαβες \col(1)200
      δραχμάς\col(0)! Τοῦτο
      ἡδονή ἐστιν!

  - name: TX_000a
    index: 0x0a
    text: |-
      Ἔμαθες τὸ \col(1)ᾆσμα
      τῶν Ῥευμάτων\col(0)!\stop
      Αὔλησον τοῦτο
      ἵνα μεταβῇς ἐκ
      τοῦ πάλαι εἰς
      τὸ νῦν!
      Ἑλοῦ τοῦτο
      χρώμενος τῇ
      \col(1)κινύρᾳ\col(0)!

  - name: TX_000b
    index: 0x0b
    text: |-
      Ἔμαθες τὸ \col(1)ᾆσμα
      τῶν Αἰώνων\col(0)!\stop
      Αὔλησον τοῦτο
      ἵνα μεταβῇς ὧδε
      κἀκεῖσε ἐν τῷ
      πάλαι καὶ νῦν!
      Ἑλοῦ τοῦτο
      χρώμενος τῇ
      \col(1)κινύρᾳ\col(0).

  - name: TX_000c
    index: 0x0c
    text: |-
      Ἔλαβες τὸ
      \col(1)Σύμβολον τῆς
      Ἀδελφότητος\col(0)!
      Νῦν καὶ σὺ εἶ
      Γόρων!

  - name: TX_000d
    index: 0x0d
    text: |-
      Ἔλαβες \col(1)Φυτὸν
      τῆς Ὀσμῆς\col(0)!
      Ἴσως ποιήσει
      πολλὰ σπέρματα!

  - name: TX_000e
    index: 0x0e
    text: |-
      \pos(2)\slow()Ἔλαβες τὸ
      \col(1)Αἰώνιον Πνεῦμα\col(0),
      Οὐσίαν τινὰ
      τοῦ Χρόνου!\stop
      Κἂν ἡ ζωὴ
      παρέλθῃ, λαλεῖ
      διὰ τοῦ χρόνου
      τῇ καρδίᾳ.

  - name: TX_000f
    index: 0x0f
    text: |-
      \pos(2)\slow()Ἔλαβες τὸ
      \col(1)Ἀρχαῖον Ξύλον\col(0),
      Οὐσίαν τινὰ
      τοῦ Χρόνου!\stop
      Ψιθυρίζει μόνον
      ἀλήθειαν ὠσὶν
      κεκλεισμένοις
      ἐκ τῆς σιγῆς.

  - name: TX_0010
    index: 0x10
    text: |-
      \pos(2)\slow()Ἔλαβες τὸν
      \col(1)Ἠχοῦντα
      Ὀλολυγμόν\col(0),
      Οὐσίαν τινὰ
      τοῦ Χρόνου!\stop
      Ἠχεῖ μακρὰν
      διὰ τῶν πεδίων
      λαλεῖν ταῖς
      ὑπερηφάνοις
      καρδίαις.

  - name: TX_0011
    index: 0x11
    text: |-
      \pos(2)\slow()Ἔλαβες τὴν
      \col(1)Φλέγουσαν
      Φλόγα\col(0), Οὐσίαν
      τοῦ Χρόνου!\stop
      Ἀναζωπυρεῖ τὰς
      σαλευομένας
      καρδίας πόθῳ
      φλέγοντι τοῦ
      δυνατοῦ.

  - name: TX_0012
    index: 0x12
    text: |-
      \pos(2)\slow()Ἔλαβες τὴν
      \col(1)Ἱερὰν Γῆν\col(0),
      Οὐσίαν τινὰ τοῦ
      Χρόνου!\stop
      Πάντα ὅσα ἐν
      κόλπῳ γῆς
      καθεύδει
      γνώσεται τὴν
      τρέφουσαν θέρμην
      τῆς Ἱερᾶς Γῆς.

  - name: TX_0013
    index: 0x13
    text: |-
      \pos(2)\slow()Ἔλαβες τὴν
      \col(1)Ἔρημον Κορυφήν\col(0),
      Οὐσίαν τινὰ τοῦ
      Χρόνου!\stop
      Πνεῦμά ἐστιν
      ὑπερήφανον καὶ
      μόνον, ὃ μένει
      πιστὸν καὶ ἐν
      καιροῖς κακοῖς.

  - name: TX_0014
    index: 0x14
    text: |-
      \pos(2)\slow()Ἔλαβες τὴν
      \col(1)Κυμαίνουσαν
      Θάλασσαν\col(0),
      Οὐσίαν Χρόνου!\stop
      Τὸ μυστικὸν
      ᾆσμα θαλάσσης
      ἠχεῖ ὡς μέγα
      κῦμα ὃ ἐκβάλλει
      τοὺς δυνατοὺς
      εἰς κινδύνους.

  - name: TX_0015
    index: 0x15
    text: |-
      \pos(2)\slow()Ἔλαβες τὸν
      \col(1)Πίπτοντα
      Ἀστέρα\col(0),
      Οὐσίαν Χρόνου!\stop
      Τὸ αἰώνιον φῶς
      τούτου τοῦ
      οὐρανίου σώματος
      ὁδηγεῖ τὰς ἄλλας
      οὐσίας.

  - name: TX_0016
    index: 0x16
    text: |-
      Ἔλαβες \col(1)σκεῦος
      καρδίας\col(0)!

  - name: TX_0017
    index: 0x17
    text: |-
      Ἔλαβες \col(1)μέρος
      καρδίας\col(0)!\heartpiece
      Σύναξον τέσσαρα
      ἵνα λάβῃς \col(1)σκεῦος
      καρδίας\col(0) ἄλλο!
      Σκόπει αὐτὰ ἐν
      τῇ ὀθόνῃ σκευῶν.

  - name: TX_0018
    index: 0x18
    text: |-
      Ἔστι \col(1)Πίναξ τοῦ
      Λαβυρίνθου\col(0)!
      Πίεσον Ἐκλογὴν
      ἰδεῖν αὐτόν.
      Τὰ σκοτεινὰ
      δωμάτια οὐδέπω
      εἶδες.

  - name: TX_0019
    index: 0x19
    text: |-
      Εὗρες τὸν
      \col(1)Γνώμονα\col(0)!\stop
      Χρῶ αὐτῷ ἰδεῖν
      ποῦ εἶ, καὶ ἵνα
      εὕρῃς κιβωτοὺς
      καὶ κλεῖς.

  - name: TX_001a
    index: 0x1a
    text: |-
      Εὗρες \col(1)Μικρὰν
      Κλεῖδα\col(0)!\stop
      Χρῶ αὐτῇ ἀνοῖξαι
      κεκλεισμένην
      θύραν ἢ λίθον ἐν
      τῷ λαβυρίνθῳ.

  - name: TX_001b
    index: 0x1b
    text: |-
      Εὗρες τὴν \col(1)Κλεῖδα
      τοῦ Ἄρχοντος\col(0)!

  - name: TX_001c
    index: 0x1c
    text: |-
      Ἔλαβες τὸ
      Ἡρωικὸν
      \col(1)Ξύλινον Ξίφος\col(0)!
      Κάτεχε τὸ \abtn ἢ
      τὸ
      \bbtn πληρῶσαι, καὶ
      ἄφες αὐτὸ διὰ
      πληγὴν δίνης!

  - name: TX_001d
    index: 0x1d
    text: |-
      Ἔλαβες τὸ ἱερὸν
      \col(1)Εὐγενὲς Ξίφος\col(0)!

  - name: TX_001e
    index: 0x1e
    text: |-
      Ἔλαβες τὸ
      θρυλικὸν
      \col(1)Κύριον Ξίφος\col(0)!

  - name: TX_001f
    index: 0x1f
    text: |-
      Ἔλαβες \col(1)Ξύλινον
      Θυρεόν\col(0)!

  - name: TX_0020
    index: 0x20
    text: |-
      Ἔλαβες \col(1)Σιδηροῦν
      Θυρεόν\col(0)!

  - name: TX_0021
    index: 0x21
    text: |-
      Ἔλαβες τὸν
      \col(1)Θυρεὸν
      τοῦ Ἐσόπτρου\col(0)!

  - name: TX_0022
    index: 0x22
    text: |-
      Ἔλαβες
      \col(1)παλίνδρομον\col(0)!
      Χρῶ αὐτῷ
      ἵστησιν τοὺς
      ἐχθρούς!

  - name: TX_0023
    index: 0x23
    text: |-
      Ἔλαβες τὴν
      \col(1)Κλεῖδα
      τῶν Μνημείων\col(0)!

  - name: TX_0024
    index: 0x24
    text: |-
      Ἔλαβες \col(1)βόμβους\col(0)!
      Χρῶ αὐτοῖς ρῆξαι
      ψευδεῖς τοίχους.
      Πίεσον \abtn ἢ \bbtn
      θεῖναι \col(1)βόμβον\col(0).
      Εἰ πιέζεις ἅμα
      \col(0x84)\item(0x00)\col(0), δύνασαι
      βαλεῖν τὸν
      \col(1)βόμβον\col(0).

  - name: TX_0025
    index: 0x25
    text: |-
      Ἔλαβες τὴν
      \col(1)σκαπάνην\col(0)!
      Ἄρξαι ὀρύσσειν!

  - name: TX_0026
    index: 0x26
    text: |-
      \pos(2)Ἔλαβες τὸ \col(1)Ψέλιον
      τῆς Δυνάμεως\col(0)!
      Κάτεχε τὸ
      πλῆκτρον
      καὶ πίεσον \col(0x84)\item(0x00)\col(0)
      αἴρειν βαρέα!

  - name: TX_0027
    index: 0x27
    text: |-
      Ἔλαβες τὸ \col(1)Πτερὸν
      Μεγάλου Ὄρνεος\col(0)!
      Ὡς πτερὸν
      ἐλαφρὸς
      εἶ!

  - name: TX_0028
    index: 0x28
    text: |-
      Ἔλαβες τὸ \col(1)Μακρὸν
      Ἄγκιστρον\col(0)!
      Ἄλλαξον τόπους
      μετὰ σκευῶν
      μακρόθεν.

  - name: TX_0029
    index: 0x29
    text: |-
      Ἔλαβες \col(1)Σπέρματα
      τῆς Ὀσμῆς\col(0)!
      Ἡ ὀσμὴ αὐτῶν
      ἕλκει θηρία.
      Ἄνοιξον τὴν
      \col(1)Πήραν
      Σπερμάτων\col(0)
      χρῆσθαι αὐτοῖς.

  - name: TX_002a
    index: 0x2a
    text: |-
      Ἔλαβες \col(1)Σπέρματα
      τοῦ Μυστηρίου\col(0)!
      Μυστήριόν ἐστιν
      ὃ ποιοῦσιν!
      Πείρασον αὐτὰ
      ἐπὶ πολλοῖς!
      Ἄνοιξον τὴν
      \col(1)Πήραν
      Σπερμάτων\col(0)
      χρῆσθαι αὐτοῖς.

  - name: TX_002b
    index: 0x2b
    text: |-
      Ἔλαβες \col(1)Σπέρματα
      τοῦ Πηγάσου\col(0)!
      Ποιήσουσί σε
      ταχὺν ὡς τὸν
      θρυλικὸν ἵππον!
      Ἄνοιξον τὴν
      \col(1)Πήραν
      Σπερμάτων\col(0)
      χρῆσθαι αὐτοῖς.

  - name: TX_002c
    index: 0x2c
    text: |-
      Ἔλαβες \col(1)Σπέρματα
      τῆς Θυέλλης\col(0)!
      Ἡ πνοὴ αὐτῶν
      ἄγει σε ὅπου
      βούλει.
      Ἄνοιξον τὴν
      \col(1)Πήραν
      Σπερμάτων\col(0)
      χρῆσθαι αὐτοῖς.

  - name: TX_002d
    index: 0x2d
    text: |-
      \pos(2)Ἔλαβες \col(1)Πήραν
      Σπερμάτων\col(0)!
      Καὶ ἔχει 20
      \col(1)Σπέρματα τοῦ
      Ἄνθρακος\col(0)!

  - name: TX_002e
    index: 0x2e
    text: |-
      Ἔλαβες τὸν
      \col(1)Σπερματοβόλον\col(0)!\stop
      Ἑλοῦ \col(1)σπέρματα\col(0),
      βάλε, καὶ βλέπε
      αὐτὰ ἀναπηδᾶν.

  - name: TX_002f
    index: 0x2f
    text: |-
      Ἔλαβες τὴν
      \col(1)Χειρίδα
      τῆς Δυνάμεως\col(0)!
      Νῦν δύνασαι
      αἴρειν
      βαρέα.

  - name: TX_0030
    index: 0x30
    text: |-
      Ἔλαβες τὸ
      \col(1)Ἄγκιστρον
      Ἀλλαγῆς\col(0)!
      Βάλε εἰς τι
      ἵνα ἀλλάξῃς
      τόπον μετ'
      αὐτοῦ.

  - name: TX_0031
    index: 0x31
    text: |-
      Ἔλαβες \col(1)Πτερύγια
      τῶν Ζώρα\col(0)!
      Νῦν δύνασαι
      κολυμβᾶν!
      Πίεσον \abtn ἵνα
      κολυμβᾷς, \bbtn ἵνα
      δύῃς!

  - name: TX_0032
    index: 0x32
    text: |-
      Ἔλαβες
      \col(1)Βομβόμυν\col(0)!
      Πέμψον αὐτὸν
      τοῖς ἐχθροῖς
      σου!

  - name: TX_0033
    index: 0x33
    text: |-
      Ἔλαβες \col(1)Μέγα
      Σπέρμα Μακού\col(0)!
      Τοῦτο ῥήξει τὰς
      δυνάμεις κακῶν!

  - name: TX_0034
    index: 0x34
    text: |-
      Ἔλαβες μείζονα
      \col(1)Πυξίδα
      Δακτυλίων\col(0)!
      Ἔχει πλείονας
      \col(1)δακτυλίους\col(0)!

  - name: TX_0035
    index: 0x35
    text: |-
      Οἴμοι! Οὐ
      δύνασαι φέρειν
      αὐτὰ οὕτως!

  - name: TX_0036
    index: 0x36
    text: |-
      Ἔλαβες \col(1)Στολὴν
      τῆς Σειρῆνος\col(0)!
      Νῦν δύνασαι
      κολυμβᾶν βαθιά.
      Πίεσον \col(0x84)\item(0x00)\col(0) ἵνα
      κολυμβᾷς, \bbtn ἵνα
      δύῃς καὶ \abtn ἵνα
      χρῇ σκεύεσι.

  - name: TX_0037
    index: 0x37
    text: |-
      Ἔλαβες τὸ
      \col(1)Κάρυον Τούνι\col(0)!

  - name: TX_0038
    index: 0x38
    text: |-
      Ἔλαβες τὸν \col(1)Αὐλὸν
      τοῦ Ῥίκι\col(0)! ὁ
      \col(3)Ῥίκι\col(0) ἥξει
      βοηθῆσαί σοι
      ὅταν αὐλῇς.

  - name: TX_0039
    index: 0x39
    text: |-
      Ἔλαβες τὸν \col(1)Αὐλὸν
      τοῦ Δημητρίου\col(0)!
      ὁ \col(3)Δημήτριος\col(0)
      ἥξει βοηθῆσαί
      σοι ὅταν αὐλῇς
      αὐτῷ.

  - name: TX_003a
    index: 0x3a
    text: |-
      Ἔλαβες τὸν \col(1)Αὐλὸν
      τοῦ Μούς\col(0)! ὁ
      \col(3)Μοὺς\col(0) ἥξει
      βοηθῆσαί σοι
      ὅταν αὐλῇς!

  - name: TX_003b
    index: 0x3b
    text: |-
      Ἔλαβες \col(1)Ξένον
      Αὐλόν\col(0)!
      Σπάνιος φαίνεται
      ἀληθῶς!

  - name: TX_003c
    index: 0x3c
    text: |-
      Ἔλαβες \col(1)Ἄνθος
      τοῦ Βόμβου\col(0)!
      Φύλαξαι χρῆσθαι
      αὐτῷ!!!

  - name: TX_003d
    index: 0x3d
    text: |-
      Ἔλαβες τὴν
      \col(1)Κλεῖδα
      τοῦ Στεφάνου\col(0)!

  - name: TX_003e
    index: 0x3e
    text: |-
      Ἔλαβες \col(1)Στηθύνιον
      τῆς Πέτρας\col(0)!

  - name: TX_003f
    index: 0x3f
    text: |-
      Ἔλαβες τὸ
      \col(1)Σκεῦος
      τῶν Γορώνων\col(0)!

  - name: TX_0040
    index: 0x40
    text: |-
      Ἔλαβες τὸ \col(1)Πόμα
      τῶν Γορώνων\col(0)!
      Μία ταχεῖα πόσις
      τηρήσει σε
      ἐγρηγορότα.

  - name: TX_0041
    index: 0x41
    text: |-
      Ἔλαβες τὸν
      \col(1)Χυλὸν
      τοῦ Πυρός\col(0)!

  - name: TX_0042
    index: 0x42
    text: |-
      Ἔλαβες τὴν
      \col(1)Κλεῖδα
      τῆς Σειρῆνος\col(0)!

  - name: TX_0043
    index: 0x43
    text: |-
      Ἔλαβες τὴν
      \col(1)Παλαιὰν Κλεῖδα
      Σειρῆνος\col(0)!

  - name: TX_0044
    index: 0x44
    text: |-
      Ἔλαβες τὴν
      \col(1)Κλεῖδα τῆς
      Βιβλιοθήκης\col(0)!

  - name: TX_0045
    index: 0x45
    text: |-
      Ἔλαβες \col(1)Δέλτον
      Μετόχου\col(0)
      τοῦ καπηλείου
      τῆς κώμης!

  - name: TX_0046
    index: 0x46
    text: |-
      Νῦν δύνασαι
      φέρειν πλείονα
      \col(1)Σπέρματα τοῦ
      Μυστηρίου\col(0)!

  - name: TX_0047
    index: 0x47
    text: |-
      \pos(2)Ἔλαβες τὴν
      \col(1)Λεπίδα τῶν
      Ζώρα\col(0)!

  - name: TX_0048
    index: 0x48
    text: |-
      Ἔλαβες τὴν
      \col(1)Πλάκα Λίθου\col(0)!
      Ἀρχαῖα ῥήματα
      γέγραπται ἐν
      αὐτῇ.

  - name: TX_0049
    index: 0x49
    text: |-
      Ἔλαβες τέσσαρα
      \col(1)μέρη καρδίας\col(0)!
      Ποιοῦσιν ἓν
      \col(1)σκεῦος καρδίας\col(0)!

  - name: TX_004a
    index: 0x4a
    text: |-
      Ἔλαβες \col(1)Ἐπιστολὴν
      Συστάσεως\col(0)!

  - name: TX_004b
    index: 0x4b
    text: |-
      Ἔλαβες \col(1)Κάρυον
      Γασά\col(0)! Φύτευσον
      αὐτὸ ἐν μαλακῇ
      γῇ!

  - name: TX_004c
    index: 0x4c
    text: |-
      Ἔλαβες τρεῖς
      \col(1)καρδίας\col(0)!

  - name: TX_004d
    index: 0x4d
    text: |-
      Ἔλαβες δέκα
      \col(1)βόμβους\col(0)!

  - name: TX_004e
    index: 0x4e
    text: |-
      Ἔλαβες τὸ
      \col(1)Βιβλίον τῶν
      Σφραγίδων\col(0)!

  - name: TX_004f
    index: 0x4f
    text: |-
      Ἔλαβες τέσσαρα
      \col(1)Σπέρματα τοῦ
      Ἄνθρακος\col(0)!

  - name: TX_0050
    index: 0x50
    text: |-
      Ἔλαβες δέκα
      \col(1)Σπέρματα τοῦ
      Πηγάσου\col(0)!

  - name: TX_0051
    index: 0x51
    text: |-
      Ἀνέλαβες
      μόνον μίαν
      καρδίαν.

  - name: TX_0052
    index: 0x52
    text: |-
      Ἡ \col(1)Πήρα τῶν
      Σπερμάτων\col(0) σου
      πλήρης ἐστίν!

  - name: TX_0053
    index: 0x53
    text: |-
      Ἡ Δύναμις
      Ζωῆς σου
      πλήρης ἐστίν!

  - name: TX_0054
    index: 0x54
    text: |-
      Ἔλαβες
      \col(1)δακτύλιον\col(0)!
      Δοκίμασον αὐτὸν
      ὕστερον!

  - name: TX_0055
    index: 0x55
    text: |-
      Ἔλαβες \col(1)Κόνιν
      τῶν Νυμφῶν\col(0)!
      Αἴρει τὰς
      κατάρας.

  - name: TX_0056
    index: 0x56
    text: |-
      Ἔλαβες τὸν
      \col(1)Ὀφθαλμὸν τῶν
      Τοκαίων\col(0),
      θησαυρὸν βαθύν!

  - name: TX_0057
    index: 0x57
    text: |-
      Ἔλαβες \col(1)Πυξίδα
      Δακτυλίων Α'\col(0)!
      Ἔχει ἕνα
      \col(1)δακτύλιον\col(0)!

  - name: TX_0058
    index: 0x58
    text: |-
      Ἔλαβες \col(1)Πυξίδα
      Δακτυλίων Β'\col(0)!
      Ἔχει τρεῖς
      \col(1)δακτυλίους\col(0)!

  - name: TX_0059
    index: 0x59
    text: |-
      Ἔλαβες \col(1)Πυξίδα
      Δακτυλίων Γ'\col(0)!
      Ἔχει πέντε
      \col(1)δακτυλίους\col(0)!

  - name: TX_005a
    index: 0x5a
    text: |-
      \pos(2)Ἔλαβες τὸ \col(0x84)\item(0x01)
      \col(1)Ὡρολόγιον
      Φάσματος\col(0)!
      Κουφίζει τὴν
      καρδίαν;

  - name: TX_005b
    index: 0x5b
    text: |-
      Ἔλαβες \col(0x84)\item(0x02)
      \col(1)Χάρτην\col(0)!
      Τίνι γράψεις;

  - name: TX_005c
    index: 0x5c
    text: |-
      Ἔδωκας τὸν \col(0x84)\item(0x02)\col(0)
      ἀντὶ \col(0x84)\item(0x03) \col(1)Δυσώδους
      Σάκκου\col(0)! Φεῦ...
      Ὄζει!

  - name: TX_005d
    index: 0x5d
    text: |-
      Ἔλαβες \col(0x84)\item(0x04)
      \col(1)Χρηστὸν Κρέας\col(0)!
      Ἔργον ἐστὶ
      τοῦ μαγείρου!

  - name: TX_005e
    index: 0x5e
    text: |-
      Ἔλαβες \col(0x84)\item(0x05)
      \col(1)Προσωπεῖον
      Κυνός\col(0)! Φίλος
      κυνῶν φιλήσει!

  - name: TX_005f
    index: 0x5f
    text: |-
      Ἔλαβες \col(0x84)\item(0x06)
      \col(1)Ἁλτῆρα\col(0)!!!
      Ἀλλὰ μόνον
      εἷς ἐστιν!

  - name: TX_0060
    index: 0x60
    text: |-
      Ἔλαβες \col(0x84)\item(0x07)
      \col(1)Γελοῖον
      Μύστακα\col(0)!
      Ξένος ἐστίν...

  - name: TX_0061
    index: 0x61
    text: |-
      Ἔμαθες \col(0x84)\item(0x08)
      \col(1)Γελοῖον
      Παίγνιον\col(0)!
      Ἆρα ἀρέσεις
      πολλοῖς;

  - name: TX_0062
    index: 0x62
    text: |-
      Ἔλαβες τὸ \col(0x84)\item(0x09)
      \col(1)Κατανυκτικὸν
      Βιβλίον\col(0)!
      Λυπηρὸς λόγος.

  - name: TX_0063
    index: 0x63
    text: |-
      Ἔλαβες τὴν \col(0x84)\item(0x0a)
      \col(1)Μαγικὴν Κώπην\col(0)!
      Τέμνει τὸ
      κῦμα ἰσχυρῶς!

  - name: TX_0064
    index: 0x64
    text: |-
      Ἔλαβες τὴν \col(0x84)\item(0x0b)
      \col(1)Θαλασσίαν
      Λύραν\col(0)!
      Ἔχει γλυκεῖαν
      ὀσμὴν θαλάσσης!

  - name:
    - TX_0065
    - TX_0066
    index:
    - 0x65
    - 0x66
    text: |-
      Ἔλαβες τὸ \col(0x84)\item(0x0c)
      \col(1)Συντριβὲν
      Ξίφος\col(0)!
      ...Ἰδού!
      Συντέτριπται!

  - name: TX_0067
    index: 0x67
    text: |-
      \pos(2)Ἔλαβες τὰς
      \col(1)Χειρίδας
      τοῦ Ῥίκι\col(0)! Ἔνεγκε
      αὐτὰς τῷ κυρίῳ.

  - name:
    - TX_0068
    - TX_0069
    index:
    - 0x68
    - 0x69
    text: |-
      Ὁ \col(1)Ξένος
      Αὐλός\col(0) ἐστιν ὁ
      \col(1)Αὐλὸς τοῦ
      Ῥίκι\col(0)! Αὔλησον
      καλέσαι \col(3)Ῥίκι\col(0)!

  - name:
    - TX_006a
    - TX_006b
    - TX_006c
    index:
    - 0x6a
    - 0x6b
    - 0x6c
    text: |-
      Ὁ \col(1)Ξένος
      Αὐλός\col(0) ἐστιν ὁ
      \col(1)Αὐλὸς τοῦ
      Δημητρίου\col(0)!
      Αὔλησον καλέσαι
      \col(3)Δημήτριον\col(0)!

  - name: TX_006d
    index: 0x6d
    text: |-
      Ἔλαβες \col(1)Φάρμακον
      τῆς Μαγείας\col(0)!
      Ἔνεστιν ὅταν
      μὴ ἔχῃς ἄλλας
      καρδίας!

  - name: TX_006e
    index: 0x6e
    text: |-
      Νῦν δύνασαι
      φέρειν πλείονας
      \col(1)βόμβους\col(0) ἢ
      πρότερον!

  - name:
    - TX_006f
    - TX_0070
    index:
    - 0x6f
    - 0x70
    text: |-
      Ἔλαβες \col(1)Ξίφος τοῦ
      Μεγαγόρωνος\col(0)!
      Τοῦτο τὸ ξίφος
      μέγιστόν ἐστιν!

  - name: TX_0071
    index: 0x71
    text: |-
      Ἔλαβες τὴν
      \col(1)Κινύραν τῶν
      Αἰώνων\col(0)!

  - name: TX_0072
    index: 0x72
    text: |-
      Ἔστι τὸ \col(2)ᾆσμα
      τῆς Ἠχοῦς\col(4)!
      Ἐγερεῖ πυλῶνας
      \col(3)χρόνου\col(4)
      καθεύδοντας!

  - name: TX_0073
    index: 0x73
    text: |-
      Ἔλαβες τὴν
      \col(1)Ῥάβδον τῆς
      Σομαρίας\col(0)!
      Χρῶ αὐτῇ ποιεῖν
      λίθους.

  - name: TX_0074
    index: 0x74
    text: |-
      Ἀνέλαβες τὴν
      \col(1)σκαπάνην\col(0) σου!

  - name: TX_0075
    index: 0x75
    text: |-
      Ἀνέλαβες τὸ
      \col(1)Ξύλινον Ξίφος\col(0)
      σου!

  - name: TX_0076
    index: 0x76
    text: |-
      Ἀνέλαβες τοὺς
      \col(1)βόμβους\col(0) σου!

  - name: TX_0077
    index: 0x77
    text: |-
      Ἀνέλαβες τὸ
      \col(1)Ψέλιον τῆς
      Δυνάμεως\col(0) σου!

  - name: TX_0078
    index: 0x78
    text: |-
      Ἀνέλαβες τὴν
      \col(1)Κινύραν τῶν
      Αἰώνων\col(0)!

  - name: TX_0079
    index: 0x79
    text: |-
      Ἀνέλαβες \col(1)Πτερὸν
      Μεγάλου
      Ὄρνεος\col(0)!

  - name: TX_007a
    index: 0x7a
    text: |-
      Ἀνέλαβες τὰ
      \col(1)Πτερύγια τῶν
      Ζώρα\col(0)!

  - name: TX_007b
    index: 0x7b
    text: |-
      Ἀνέλαβες τὴν
      \col(1)Πήραν
      Σπερμάτων\col(0) σου!

  - name: TX_007c
    index: 0x7c
    text: |-
      Ἔστι \col(1)Πίναξ τῆς
      Νήσου\col(0)! Δύνασαι
      νῦν πλεῖν τὰς
      θαλάσσας!

  - name: TX_007d
    index: 0x7d
    text: |-
      Ἔλαβες \col(1)Σχοινίον
      Σεβάλ\col(0)! Τοῦτο
      ἰσχυρὸν οὐ
      φθείρεται
      βρεχόμενον.

  - name: TX_007e
    index: 0x7e
    text: |-
      Ἔλαβες
      \col(1)20 βόμβους\col(0)!

  - name: TX_007f
    index: 0x7f
    text: |-
      Ἔλαβες τὸν
      \col(3)κύνα\col(0)!

  - name: TX_0080
    index: 0x80
    text: |-
      Ἡ \col(1)Πήρα τῶν
      Σπερμάτων\col(0)
      φέρει πλείονα
      \col(1)σπέρματα\col(0) νῦν!

- group: 0x01
  data:
  - name: TX_0100
    index: 0x00
    text: |-
      \pos(2)ΒΟΗΘΕΙΙΙΙ!!!

  - name: TX_0101
    index: 0x01
    text: |-
      Τοῦτο ἦν
      φοβερόν!\stop
      Ἐξαίφνης
      ἐπέθεντό μοι...
      Εὐχαριστῶ σοι,
      ὦ ὁδοιπόρε.
      Τί ὄνομά σοι;\stop
      Σὺ εἶ ὁ \Link;\stop
      Βλέπω \sym(0x57) ἐπὶ
      τῆς ἀριστερᾶς
      χειρός σου.
      Τοῦτό ἐστι τὸ
      σημεῖον τοῦ
      \col(3)δυνατοῦ τῆς
      Ὑρούλης\col(0)!
      Διὰ τοῦτο ἔφυγον
      τὰ θηρία.\stop
      Ἐγώ εἰμι \col(3)Ἴμπα\col(0),
      ἡ τροφὸς τῆς
      βασιλίδος
      \col(3)Ζέλδας\col(0) τῆς
      \col(3)Ὑρούλης\col(0).

  - name: TX_0102
    index: 0x02
    text: |-
      \call(TX_0101)
      Ζητῶ ᾠδὸν
      ὀνόματι
      \col(3)Ναϋρού\col(0).\stop
      Βοηθήσεις μοι
      ζητεῖν, \Link;
      Ἀσφαλὴς ἔσομαι
      μετὰ σοῦ.

  - name: TX_0103
    index: 0x03
    text: |-
      \call(TX_0101)
      Ἡ \col(3)Ζέλδα\col(0)
      ἠρώτησέ με
      εὑρεῖν ᾠδὸν
      ὀνόματι
      \col(3)Ναϋρού\col(0).\stop
      Βοηθήσεις μοι
      ζητεῖν, \Link;
      Ἀσφαλὴς ἔσομαι
      μετὰ σοῦ.

  - name: TX_0104
    index: 0x04
    text: |-
      Ἰδού!
      Τοῦτό ἐστιν!

  - name: TX_0105
    index: 0x05
    text: |-
      Ἡ πέτρα αὕτη
      μετὰ τοῦ \sym(0x57)
      σημεῖόν ἐστιν!

  - name: TX_0106
    index: 0x06
    text: |-
      Δύνασαι κινῆσαι
      τὴν πέτραν
      ταύτην δι' ἐμέ,
      \Link;

  - name: TX_0107
    index: 0x07
    text: |-
      Ἐγὼ... ἆ...
      Ἐγὼ μόνον...

  - name: TX_0108
    index: 0x08
    text: |-
      Οὐ δύναμαι...

  - name: TX_0109
    index: 0x09
    text: |-
      Εὐχαριστῶ σοι...
      Ἄγωμεν νῦν.

  - name: TX_010a
    index: 0x0a
    text: |-
      Ποῦ πορεύῃ;!
      \jump(TX_010c)

  - name: TX_010b
    index: 0x0b
    text: |-
      Τί ποιεῖς;\n

  - name:
    - TX_010c
    - TX_010d
    - TX_010e
    - TX_010f
    index:
    - 0x0c
    - 0x0d
    - 0x0e
    - 0x0f
    text: |-
      Σπεῦσον καὶ
      κίνησον τοῦτο!

  - name: TX_0110
    index: 0x10
    text: |-
      Ὦ \Link!
      ἔσωσάς με!
      Ἐδαιμονιζόμην!

  - name: TX_0111
    index: 0x11
    text: |-
      ............\stop
      Ἡ γυνὴ \col(3)Βεράν\col(0)
      φοβερά ἐστιν.
      Ἠναγκάσθην
      ποιεῖν τὸ
      θέλημα αὐτῆς
      ἄκουσα.

  - name: TX_0112
    index: 0x12
    text: |-
      Σκιαὶ ἐκύκλουν
      τὴν Προφῆτιν
      τῶν Αἰώνων,
      διὸ ἦλθον
      ἐλπίζουσα
      ἀπαγαγεῖν αὐτὴν
      εἰς τὴν
      \col(3)Ὑρούλην\col(0).
      Οὐκ ᾔδειν ὅτι
      τοῦτο ἔσται...
      \jump(TX_0111)

  - name: TX_0113
    index: 0x13
    text: |-
      Ἠθέτησα τὴν
      \col(3)Ζέλδαν\col(0)...
      \col(3)Ζέλδα\col(0)...\stop
      Ἠσθάνετο σκιὰν
      πονηρὰν
      ἐγγίζουσαν τῇ
      \col(3)Ναϋρού\col(0)
      καὶ ἠρώτησέ με
      ἀγαγεῖν αὐτὴν
      εἰς τὴν
      \col(3)Ὑρούλην\col(0).
      Οὐκ ἔδει ἡμᾶς
      ἐπιλαθέσθαι σου,
      τοῦ δυνατοῦ τοῦ
      \col(3)Ὁλόδρουμ\col(0).\stop
      Ἴδε τί νῦν
      γέγονεν...
      \jump(TX_0111)

  - name: TX_0114
    index: 0x14
    text: |-
      Ἡ \col(3)Βεράν\col(0) εἶπεν
      ὅτι ὑποστρέψει
      εἰς τὸν
      παρελθόντα
      χρόνον. Βούλεται
      χρῆσθαι τῇ
      δυνάμει τῆς
      \col(3)Ναϋρού\col(0) ἐν τῷ
      παρελθόντι.
      Ἡ \col(3)Λαβρύννα\col(0)
      ἤδη πάσχει.\stop
      Εἰ ἀληθές ἐστιν,
      δεῖ ἡμᾶς κωλῦσαι
      αὐτήν... Ἆ! Τὰ
      μέλη μου βαρέα
      μετὰ ἃ ἐποίησεν
      ἡ \col(3)Βεράν\col(0). Οὐ
      δύναμαι κινεῖν
      αὐτὰ ῥᾳδίως.\stop
      \Link...
      Εἰ τὸ \sym(0x57)
      ἐπὶ τῆς
      ἀριστερᾶς χειρός
      σου ἀληθές
      ἐστιν, σὺ εἶ
      ἴσως ὁ δυνατὸς
      ὃς σώσει τὸν
      κόσμον τοῦτον.
      Βοήθησον ἡμῖν!

  - name: TX_0115
    index: 0x15
    text: |-
      \call(TX_0114)\stop
      Ἆ, ναί! Ἡ \col(3)Ζέλδα\col(0)
      παρέθετό μοι τὴν
      μάχαιραν ταύτην.
      Δύνασαι χρῆσθαι
      αὐτῇ.

  - name: TX_0116
    index: 0x16
    text: |-
      \call(TX_0118)\stop
      Ἆ, ναί! Ἡ \col(1)Ζέλδα\col(0)
      παρέθετό μοι τὴν
      \col(3)ἀσπίδα\col(0) ταύτην.
      Χρῶ αὐτῇ.

  - name: TX_0117
    index: 0x17
    text: |-
      \Link,
      δύνασαι ἀπελθεῖν
      εἰς ἀπάντησιν
      τοῦ \col(3)Δένδρου
      Μακού\col(0) ἐν τῇ
      \col(3)Κώμῃ τῆς
      Λύννης\col(0);\stop
      Τὸ \col(3)Δένδρον Μακού\col(0)
      φύλαξ τῆς
      \col(3)Λαβρύννης\col(0) ἐστίν.
      Βεβαίως δύναται
      βοηθῆσαι.
      Ὁ οἶκος τῆς
      \col(3)Ναϋρού\col(0) ἐν τῷ
      δρυμῷ πρὸς
      ἀνατολὰς
      ἐντεῦθεν.
      Ἐκεῖ ἔσομαι.

  - name:
    - TX_0118
    - TX_0119
    - TX_011a
    - TX_011b
    - TX_011c
    - TX_011d
    - TX_011e
    - TX_011f
    index:
    - 0x18
    - 0x19
    - 0x1a
    - 0x1b
    - 0x1c
    - 0x1d
    - 0x1e
    - 0x1f
    text: |-
      Ἡ \col(3)Βεράν\col(0) εἶπεν
      ὅτι ὑποστρέψει
      εἰς τὸν
      παρελθόντα
      χρόνον. Βούλεται
      χρῆσθαι ταῖς
      δυνάμεσι τῆς
      \col(3)Ναϋρού\col(0) ἐν τῷ
      παρελθόντι.
      Ἡ \col(3)Λαβρύννα\col(0)
      ἤδη πάσχει.\stop
      \Link...
      Πρῶτον τὸ
      \col(3)Ὁλόδρουμ\col(0), νῦν ἡ
      \col(3)Λαβρύννα\col(0)
      κινδυνεύει.
      Λυποῦμαι ὅτι
      τοσοῦτον αἰτῶ...
      ἀλλ' οὐκ ἔχομεν
      ἄλλον! Δέομαι!
      Σῶσον τὴν
      \col(3)Ναϋρού\col(0)!

  - name: TX_0120
    index: 0x20
    text: |-
      \Link, δέομαί
      σου, σῶσον τὴν
      \col(3)Ναϋρού\col(0)!

  - name: TX_0121
    index: 0x21
    text: |-
      Ἆρα ἐστί που
      ταμεῖον κρυπτόν;
      Πνεῦμα ἄνωθεν
      ᾐσθόμην...

  - name: TX_0122
    index: 0x22
    text: |-
      Σπεῦσον! Δεῖ σε
      σῶσαι τὴν
      \col(3)Ναϋρού\col(0)!
      Ὁ κόσμος
      καταλύεται!

  - name: TX_0123
    index: 0x23
    text: |-
      Σώσας τὴν
      \col(3)Ναϋρού\col(0), οὐκ
      ἔπαυσας τοῦτο...
      Ἔασον τοῦτο
      ἐμοί. Σὺ ἄπελθε
      εἰς τὸν
      παρελθόντα
      χρόνον καὶ
      κώλυσον τὰς
      βουλὰς τῆς
      \col(3)Βεράν\col(0)!

  - name: TX_0124
    index: 0x24
    text: |-
      \Link!!!
      Μεῖνον!

  - name: TX_0125
    index: 0x25
    text: |-
      \pos(2)\Link,
      ἐξήτασα τὸν
      παρελθόντα
      χρόνον καὶ
      εὗρόν τι δεινόν!
      Ὁ \col(3)Ῥάλφ\col(0)
      ἀπόγονός ἐστι
      τῆς βασιλίσσης
      \col(3)Ἄμβι\col(0)!
      Οἶδας τί
      τοῦτο σημαίνει;\stop
      Ὁ \col(3)Ῥάλφ\col(0) νῦν
      ζῇ διότι ἡ
      \col(3)Ἄμβι\col(0) ἔζη ἐν
      τῷ παρελθόντι.
      Ἐὰν ἡ \col(3)Ἄμβι\col(0)
      ἀποθάνῃ, ὁ
      \col(3)Ῥάλφ\col(0) οὐκέτι
      ἔσται!\stop
      Ἦλθον ἵνα
      κωλύσω τὸν
      \col(3)Ῥάλφ\col(0),
      ἀλλ' οὐκ ἴσχυσα!

  - name: TX_0126
    index: 0x26
    text: |-
      \pos(2)Σὺ μόνος
      δύνασαι σῶσαι
      τὸν \col(3)Ῥάλφ\col(0)
      καὶ πάντας
      ἡμᾶς, \Link!

  - name: TX_0127
    index: 0x27
    text: |-
      \Link!
      Εὔκαιρος εἶ!
      Τὸ ὄρνεον τοῦτο
      ἀπήγγειλέ μοι
      ὅτι ἡ \col(3)Ζέλδα\col(0)
      ἔρχεται εἰς τὴν
      \col(3)Κώμην Λύννης\col(0)!
      Ἦλθον
      ἀπαντῆσαι αὐτῇ,
      ἀλλά...\stop
      Ὦ τῆς συμφορᾶς!
      Θηρίον ἐρυθρὸν
      ἐφάνη πρὸ τῶν
      ὀφθαλμῶν μου καὶ
      ἥρπασε τὴν
      \col(3)Ζέλδαν\col(0) καὶ
      ἀπήνεγκε πρὸς
      τὸν πύργον...
      Τί ποιήσω;
      \Link, ἡ
      \col(3)Ζέλδα\col(0) ἐλπίς
      ἐστι τοῦ κόσμου!
      Ἐὰν πάθῃ τι,
      πᾶσα ἐλπὶς
      ἀπολεῖται!\stop
      Δεῖ σε σῶσαι
      τὴν \col(3)Ζέλδαν\col(0)!
      Δέομαι, \Link,
      εὑρὲ τρόπον
      σῶσαι τὴν
      \col(3)Ζέλδαν\col(0)!

  - name: TX_0128
    index: 0x28
    text: |-
      \col(3)Ζέλδα\col(0)!!!
      Σέσωσαι!
      Σφόδρα
      ἐφοβούμην.
      Διὰ τί μόνη
      ἦλθες εἰς τόπον
      ἐπισφαλῆ;

  - name: TX_0129
    index: 0x29
    text: |-
      Ἡ \col(3)Ζέλδα\col(0) ἐστιν
      ἐπὶ τῆς κορυφῆς
      τοῦ πύργου
      τούτου! Δέομαι,
      \Link, εὑρὲ
      τρόπον σῶσαι
      αὐτήν!

  - name: TX_012a
    index: 0x2a
    text: |-
      Ὁ \Link ἔλαβεν
      αὐτό, οὐδὲν οὖν
      φοβητέον, ὦ
      \col(3)Ζέλδα\col(0). Νῦν
      δὲ δεῖ κρυβῆναι
      ἐν τῷ οἴκῳ τῆς
      \col(3)Ναϋρού\col(0) καὶ
      ἀναμένειν λόγον
      παρὰ τοῦ
      \Link.\stop
      \Link...
      Ἐπορεύου πρὸς τὰ
      ὄρη πρὸς βορρᾶν
      καὶ δυσμάς;
      Ἤκουσα ὅτι
      ἀτραπός ἐστιν
      πρὸς δυσμὰς
      ἐντεῦθεν.
      Φύλαξαι.

  - name: TX_012b
    index: 0x2b
    text: |-
      Τί γενήσεται
      τοῖς κατοικοῦσιν
      ἐν τῇ κώμῃ;

  - name: TX_012c
    index: 0x2c
    text: |-
      Αἱ πράξεις τῆς
      \col(3)Ζέλδας\col(0) φοβοῦσί
      με σφόδρα.
      \Link,
      δέομαι, σῶσον
      τὴν \col(3)Ναϋρού\col(0)!

  - name: TX_012d
    index: 0x2d
    text: |-
      Ἡ σωτηρία τῆς
      \col(3)Ναϋρού\col(0)
      οὐκ ἤρκεσεν.
      Δέομαι, \Link!
      Ἐπὶ σοὶ
      ἐλπίζομεν!

  - name: TX_012e
    index: 0x2e
    text: |-
      Εἰ ἡ \col(3)Ζέλδα\col(0)
      ἦν ὧδε, πάντα
      καλῶς εἶχεν ἄν!

  - name: TX_012f
    index: 0x2f
    text: |-
      Ἆ! Ἡ \col(3)Ζέλδα\col(0)
      ἡρπάσθη! Τί νῦν
      ποιήσομεν; Δεῖ
      σε ποιῆσαί τι,
      \Link!

  - name: TX_0130
    index: 0x30
    text: |-
      \Link!
      Δεινόν ἐστιν! 

  - name: TX_0131
    index: 0x31
    text: |-
      \col(3)Ζέλδα\col(0)!
      Ὦ \col(3)Ζέλδα\col(0)!
      Ἄκουε· ὅτε οἱ
      λιθωθέντες τῆς
      κώμης ἤρξαντο
      ὑγιαίνειν, ἐγὼ
      καὶ ἡ \col(3)Ζέλδα\col(0)
      παρεκαλέσαμεν
      παιδάριον
      κλαίοντα. Εἶτα
      ἐξαίφνης
      ἀστραπή...

  - name: TX_0132
    index: 0x32
    text: |-
      Ἐφοβούμην περὶ
      τῆς \col(3)Ναϋρού\col(0)
      μόνης οὔσης,
      διὸ συνῆλθον.

