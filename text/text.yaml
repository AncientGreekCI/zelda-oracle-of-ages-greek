      κασέταν εἰς τὸ
      ἄλλο καὶ
      ἄνοιξον,
      ἀλλὰ μὴ πιέσῃς
      πλῆκτρον. Ὅταν
      πάντα ἕτοιμα ᾖ,
      ἑλοῦ "Ἄρξαι!"
