      ῥεῖ ἀληθῶς ἐν
      ἐμοὶ πάλιν, καὶ
      μέμνημαι πάντων
      ὧν ἐπελαθόμην!
      \pos(2)Εἰμὶ φύλαξ
      τῆς \col(3)Ναϋρού\col(0), τῆς
      Προφήτιδος τῶν
      Αἰώνων, καὶ τῷ
      \col(1)Σπέρματι Μακού\col(0)
