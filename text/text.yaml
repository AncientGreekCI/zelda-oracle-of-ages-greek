      Ὁ τοῖχος οὗτος
      ἐρράγη.\n
    null_terminator: False

  - name: TX_5107
    index: 0x07
    text: |-
      Φαίνεται ὅτι
      δύνα-
      ται συντριβῆναι!

  - name: TX_5108
    index: 0x08
    text: |-
      Ἡ δᾲς αὕτη
      χρῄζει
      ἀνάψεως.

  - name: TX_5109
    index: 0x09
    text: |-
      Ἔα; Τοῦτο ἔχει
      κλειδότρυπαν.

  - name: TX_510a
    index: 0x0a
    text: |-
      Ὤφ! Λίαν βαρύ
      ἐστι
      τοῦ κινηθῆναι!

  - name: TX_510b
    index: 0x0b
    text: |-
      Ἡ \col(1)ἀσπίς\col(0) σου
      κατεβρώθη!

  - name: TX_510c
    index: 0x0c
    text: |-
      Ἡ ᾠδὴ τοῦ \col(1)αὐλοῦ\col(0)
      σου ἀπέτυχεν.

  - name: TX_510d
    index: 0x0d
    text: |-
      Οὐκ ἀνοίγει ἐκ
      ταύτης τῆς
      πλευρᾶς!

  - name: TX_510e
    index: 0x0e
    text: |-
      Οὐ δύνασαι
      ἀναγνῶ-
      ναι αὐτὸ
      ἐντεῦθεν!

  - name: TX_510f
    index: 0x0f
    text: |-
      Ἡ ᾠδή σου ἁπλῶς
      ἀντηχεῖ...

  - name: TX_5110
    index: 0x10
    text: |-
      Τὸ \col(1)ᾆσμά\col(0) σου
      ἀντη-
      χεῖ μάτην.

  - name: TX_5111
    index: 0x11
    text: |-
      Φαίνεται ὅτι τι
      ἁρμόζει ἐν τῇδε
      τῇ ὀπῇ.

  - name: TX_5112
    index: 0x12
    text: |-
      Ἀπεπέμφθης ὀπίσω
      ὑπὸ παραδόξου
      δυνάμεως!

