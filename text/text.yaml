      οἱ Γόρωνες
      πάντες
      χαίρουσιν!
      Θέλω καὶ ἐγὼ
      παίζειν
      μετ' αὐτῶν!

  - name:
    - TX_0580
    - TX_0581
    - TX_05a0
    - TX_05a1
