  - name: TX_30af
    index: 0xaf
    text: |-
      Διπλῆ Πληγὴ
      Δίνης

  - name: TX_30b0
    index: 0xb0
    text: |-
      Οὐδεμία βλάβη ἐξ
      ἰδίων Βόμβων

  - name: TX_30b1
    index: 0xb1
    text: |-
      Ἀκτὶς ἀντὶ
      Πληγῆς Δίνης

  - name: TX_30b2
    index: 0xb2
    text: |-
      Βλάβη ξίφους \up
      ἀλλὰ τιτρώσκῃ

  - name: TX_30b4
    index: 0xb4
    text: |-
      1000 θηρία
      ἀνῃρέθη

  - name: TX_30b5
    index: 0xb5
    text: |-
      10,000 δραχμαὶ
      συνήχθησαν

  - name: TX_30b6
    index: 0xb6
    text: |-
      Ὁ Βασιλεὺς
      Πονηρὸς
      \col(3)Γάνων\col(0) ἐνικήθη

  - name: TX_30b7
    index: 0xb7
    text: |-
      100 σημεῖα
      ἐκλάσθη

  - name: TX_30b8
    index: 0xb8
    text: |-
      100 δακτύλιοι
      ἐδοκιμάσθησαν

  - name: TX_30b9
    index: 0xb9
    text: |-
      Οὐδεμία βλάβη ἐκ
      καταρῶν

  - name: TX_30ba
    index: 0xba
    text: |-
      Αὔξανε μεγάλα
      Δένδρα Γασά

  - name: TX_30bb
    index: 0xbb
    text: |-
      Οὐκ ἐκρήγνυται
      κρατούμενος
      Βόμβος

  - name: TX_30bc
    index: 0xbc
    text: |-
      Κατάδυθι ἄνευ
      ἀναπνοῆς

  - name: TX_30bd
    index: 0xbd
    text: |-
      Πυγμὴ ὅταν ᾖς
      ἄοπλος

  - name: TX_30be
    index: 0xbe
    text: |-
      Βλάβη ξίφους \down
      Ἐνίοτε καίριον

  - name: TX_30bf
    index: 0xbf
    text: |-
      Ἡ ληφθεῖσα πληγὴ
      ἀεὶ μία Καρδία

  - name: TX_30c0
    index: 0xc0
    text: ""

  - name: TX_30c1
    index: 0xc1
    text: |-
      \call(0xfd)
      \call(0xfc)

- group: 0x31
  data:
  - name: TX_3100
    index: 0x00
    text: |-
      \sfx(0xc7)Οὐ δύνασαι διελ-
      θεῖν διὰ τὰς
      πεσούσας πέτρας.
      Ἐν καιροῖς
      τοιού-
      τοις καθεύδω καὶ
      μένω. Πάλαι
      πολλαὶ
      πέτραι ἔπιπτον
      ὧδε παρέχουσαι
      κόπον πολύν.

  - name: TX_3101
    index: 0x01
    text: |-
      \sfx(0xc7)Καλῶς εὗρες τὸν
      κρυπτὸν τόπον
      μου.

  - name: TX_3102
    index: 0x02
    text: |-
      \sfx(0xc7)Νέος παῖς ἤνεγκε
      \col(1)Ἄνθη τοῦ Βόμβου\col(0)
      εἰς τὴν
      \col(3)Κυλίουσαν
      Ῥάχιν\col(0).\stop
      Χάριτι αὐτοῦ τὰ
      \col(1)Ἄνθη τοῦ Βόμβου\col(0)
      νῦν κλεινὴν
      ποιεῖ
      τὴν \col(3)Κυλίουσαν
      Ῥάχιν\col(0).

  - name: TX_3103
    index: 0x03
    text: |-
      \sfx(0xc7)Τελεσθείσης τῆς
      νέας διώρυγος,
      ἔχομεν νέους
      οἴκους! Καί
      τινες
      Γόρωνες ἀνέῳξαν
      νέα πωλητήρια.
      Ἴδε αὐτά!

  - name: TX_3104
    index: 0x04
    text: |-
      \sfx(0xc7)Ἦλθες εἰς τὰ
      πωλητήρια
      Γορώνων;
      Ἅπαξ οὐκ ἀρκεῖ!
      Δεῖ ἐλθεῖν δὶς ἢ
      τρὶς εἰς
      ἕκαστον!

  - name: TX_3105
    index: 0x05
    text: |-
      \sfx(0xc7)Ἡ κλῖμαξ αὕτη
      ἄγει εἰς τὴν
      βάσιν τῆς
      \col(3)Κυλιούσης
      Ῥάχεως\col(0).

  - name: TX_3106
    index: 0x06
    text: |-
      \sfx(0xc7)Οἱ Γόρωνες ἀεὶ
      ἐπιμελοῦνται τῶν
      ἀδελφῶν αὐτῶν,
      καὶ ἀεὶ ποιήσου-
      σιν οὕτως!

  - name: TX_3107
    index: 0x07
    text: |-
      \sfx(0xc7)Ὅτε ὁ πάππος μου
      νέος ἦν, εἶχεν
      ἄλλο πωλητήριον
      πρὶν ἀνοῖξαι τὰς
      Ἁμάξας Σκοπῶν.

  - name: TX_3108
    index: 0x08
    text: |-
      \sfx(0xc7)Ἔλαβον παντοῖα
      ἆθλα ἐν τοῖς
      παιγνίοις
      σήμερον!

  - name: TX_3109
    index: 0x09
    text: |-
      \sfx(0xc7)Μέγας θόρυβος
      ἀναβαίνει
      κάτωθεν.
      Ἐγένετό τι;

  - name: TX_310a
    index: 0x0a
    text: |-
      \sfx(0xc7)Ὁ Πρεσβύτερος
      οὖν
      σῶος ἦν; Καλόν!

  - name: TX_310b
    index: 0x0b
    text: |-
      \sfx(0xc7)Ἡμεῖς οἱ Γόρωνες
      φιλοῦμεν
      παίγνια!
      Πολλοὶ τόποι
      εἰσὶν εἰς τὸ
      παίζειν ὧδε!

  - name: TX_310c
    index: 0x0c
    text: |-
      \sfx(0xc7)Ὁ \col(3)Εὐσχήμων Γόρων\col(0)
      κάτω ἐκαυχᾶτο
      ὅτι
      εὗρε καλὴν
      \col(1)κλεῖδα\col(0)
      ἐν σπηλαίῳ
      καταρ-
      ράκτου. Ζηλῶ
      αὐτόν.

  - name: TX_310d
    index: 0x0d
    text: |-
      \sfx(0xc7)Δύναμαι χορεύειν
      ἀμερίμνως ὅτι ὁ
      κόσμος εἰρηνικός
      ἐστιν!

  - name: TX_310e
    index: 0x0e
    text: |-
      \sfx(0xc7)Οἱ σκοποὶ σχεδὸν
      ἴσον τῷ χορῷ
      θαυμάζονται!

  - name: TX_310f
    index: 0x0f
    text: |-
      \sfx(0xc7)Πρὸ ὀλίγου
      ἐνίκη-
      σα πάντας ἐν
      ταῖς
      Ἁμάξαις Σκοπῶν!

  - name: TX_3110
    index: 0x10
    text: |-
      \sfx(0xc7)Ἀφ' οὗ ἦλθεν ὁ
      μέγας χοῖρος--ὁ
      \col(3)Μέγας Μοβλίν\col(0)--οὐ
      δυνάμεθα
      αὐξάνειν
      τὰ κλεινὰ \col(1)Ἄνθη
      τοῦ Βόμβου\col(0).

  - name: TX_3111
    index: 0x11
    text: |-
      \sfx(0xc7)Ἀπῆλθεν ὁ \col(3)Μέγας
      Μοβλίν\col(0); Νῦν
      αὐξήσομεν \col(1)Ἄνθη
      τοῦ Βόμβου\col(0)
      ἀμερίμνως!

  - name: TX_3112
    index: 0x12
    text: |-
      \sfx(0xc7)Τὰ \col(1)Ἄνθη τοῦ
      Βόμβου\col(0)
      αὐξάνεται
      βραδέως
      ἐν χρόνῳ μακρῷ.

  - name: TX_3113
    index: 0x13
    text: |-
      \sfx(0xc7)Ξένη τις
      οἰκοδομὴ
      ἐξαίφνης ἐφάνη
      ὧδε ἐν τῇ
      \col(3)Κυλιούσῃ Ῥάχει\col(0)!\stop
      Καλούμενός τις
      \col(3)Μέγας Μοβλίν\col(0)
      ᾠκοδόμησεν
      αὐτήν,
      καὶ ἐμποδών
      ἐστιν!

  - name: TX_3114
    index: 0x14
    text: |-
      \sfx(0xc7)Κατέλυσας τὸ
      \col(3)Φρούριον τοῦ
      Μεγάλου Μοβλίν\col(0);
      Εὐχαριστῶ!\stop
      Νῦν ὀψόμεθα τοὺς
      Γόρωνας τοὺς ἐν
      τῇ ἀνατολικῇ
      κορυφῇ!

  - name: TX_3115
    index: 0x15
    text: |-
      \sfx(0xc7)Θέλω ἐκβαλεῖν
      τὸν
      \col(3)Μέγαν Μοβλίν\col(0),
      ἀλλ' οὐ δύναμαι
      κυλίεσθαι ταχέως
      φθάσαι ἐκεῖ...
      Πάλαι ἐπὶ τῆς
      ῥάχεως ἦν
      δένδρον
      ἔχον σπέρματα
      ποιοῦντα ταχύν.
      Καὶ Γόρων
      ἐκυλίε-
      το τάχιστα!

  - name: TX_3116
    index: 0x16
    text: |-
      \sfx(0xc7)Ἒ! Εἶδον ὅτι ὁ
      \col(3)Μέγας Μοβλίν\col(0)
      ἀπῆλθεν ἐκ τῆς
      \col(3)Κυλιούσης
      Ῥάχεως\col(0).
      Μάτην ἐφοβούμην.

  - name: TX_3117
    index: 0x17
    text: |-
      \sfx(0xc7)Ἡμεῖς οἱ Γόρωνες
      ἔχομεν πολλὰ
      μυστικὰ σκεύη!
      Ἐὰν λάβῃς τι,
      φύλασσε καλῶς.

  - name: TX_3118
    index: 0x18
    text: |-
      \sfx(0xc7)Κρατεῖς ἀσφαλῶς
      τὸ \col(1)Σύμβολον τῆς
      Ἀδελφότητος\col(0) σου;
      Δεῖ φυλάσσειν
      αὐτὸ καλῶς.

  - name: TX_3119
    index: 0x19
    text: |-
      \sfx(0xc7)Ἒ, ἀδελφέ!
      Χορεύεις καλῶς
      καὶ σήμερον;

  - name: TX_311a
    index: 0x1a
    text: |-
      \sfx(0xc7)Ὑμεῖς οἱ
      ἄνθρωποι
      ξενώτεροι
      φαίνεσθε
      καθ' ἡμέραν. Τί
      ἐγένετο;

  - name: TX_311b
    index: 0x1b
    text: |-
      \sfx(0xc7)Ποιήσω τὸν τόπον
      τοῦτον καλὸν καὶ
      πληρώσω Γορώνων!

  - name: TX_311c
    index: 0x1c
    text: |-
      \sfx(0xc7)Μέγας
      καταρράκτης
      ἐστὶν ὧδε ἐν τῇ
      \col(3)Κυλιούσῃ Ῥάχει\col(0).
      Δεῖ σε ἰδεῖν
      αὐτὸν ἅπαξ.

  - name: TX_311d
    index: 0x1d
    text: |-
      \sfx(0xc7)Ἤκουσα ὅτι ἔστι
      φάρμακον νόσου
      Γορώνων.
      Καλεῖται
      \col(1)Ζωμὸς Πυρός\col(0).
      Ἤθελον γεύσασθαι
      αὐτοῦ ἅπαξ.

  - name: TX_311e
    index: 0x1e
    text: |-
      \sfx(0xc7)Ἡ \col(3)Κυλίουσα Ῥάχις\col(0)
      τετάρακται νῦν
      παρόντος τοῦ
      \col(3)Μεγάλου Μοβλίν\col(0).

  - name: TX_311f
    index: 0x1f
    text: |-
      \sfx(0xc7)Ἡ \col(3)Κυλίουσα Ῥάχις\col(0)
      πάλιν ἥσυχός
      ἐστι
      νῦν ἀπελθόντος
      τοῦ \col(3)Μεγάλου
      Μοβλίν\col(0).

  - name: TX_3120
    index: 0x20
    text: |-
      \sfx(0xc7)Λέγεται εἶναι
      Γόρων καλούμενος
      \col(3)Μεγαγόρων\col(0) μέγας
      ὡς ὄρος, ἀλλ'
      οἰκεῖ ἀλλαχοῦ
      τῆς \col(3)Κυλιούσης
      Ῥάχεως\col(0). Ἤθελον
      ἰδεῖν αὐτόν.

  - name: TX_3121
    index: 0x21
    text: |-
      \sfx(0xc7)Ἐν τόποις πρὸς
      ἀνατολὰς
      ἐντεῦθεν
      ὁ Χορὸς Γορώνων
      θαυμάζεται! Ἐὰν
      μὴ χορεύῃς
      καλῶς,
      οὐχ ἕξεις
      φίλους.

  - name: TX_3122
    index: 0x22
    text: |-
      \sfx(0xc7)Ὁ Χορὸς Γορώνων!
      Θαυμασθήσεται ἐν
      ὅλῳ τῷ κόσμῳ!

  - name: TX_3123
    index: 0x23
    text: |-
      \sfx(0xc7)Οἱ Γόρωνες ἀεὶ
      ἐφίλουν παίγνια
      καὶ ἀεὶ φιλήσου-
      σιν! Δεῖ
      σχολάζειν
      εἰς παιδιάν!

  - name: TX_3124
    index: 0x24
    text: |-
      \sfx(0xc7)Ὁ \col(3)Εὐσχήμων Γόρων\col(0)
      χορεύει ὄπισθεν!
      Θαυμαστός ἐστιν!

  - name: TX_3125
    index: 0x25
    text: |-
      \sfx(0xc7)Ὁ Χορὸς Γορώνων
      δεικνύει τὴν
      θερμὴν καρδίαν
      τῶν Γορώνων.
      Μαθήσομαι αὐτὸν
      τελείως ποτέ.

  - name: TX_3126
    index: 0x26
    text: |-
      \sfx(0xc7)Σπουδάζω
      γενέσθαι
      ὁ δεύτερος
      \col(3)Εὐσχήμων Γόρων\col(0)!

  - name: TX_3127
    index: 0x27
    text: |-
      \sfx(0xc7)Τίνες εἰσὶν
      οὗτοι
      οἱ καλύμματα
      φοροῦντες;
      Ἐρωτῶ-
      σι περὶ τοῦ
      Χοροῦ
      Γορώνων.

  - name: TX_3128
    index: 0x28
    text: |-
      \sfx(0xc7)Οὐκ οἶδα τίς εἶ
      ἢ
      πόθεν, ἀλλ'
      εὐχα-
      ριστῶ ἐκβαλόντι
      τὸν \col(3)Μέγαν
      Μοβλίν\col(0).
      Ὁ ἄθλιος ἐκώλυεν
      ἡμᾶς αὐξάνειν
      \col(1)Ἄνθη τοῦ Βόμβου\col(0).
      Νῦν αὐξήσομεν
      \col(1)Ἄνθη τοῦ Βόμβου\col(0)
      ἀμερίμνως! Λάβε
      ἓν εἰς σημεῖον
      χάριτος ἡμῶν.

  - name: TX_3129
    index: 0x29
    text: |-
      \sfx(0xc7)Νῦν μιμνήσκομαι,
      πάλαι νέος παῖς
      ἔσωσε τὸν
      Πρεσβύ-
      τερον τῶν
      Γορώνων.
      Ἴσως σὺ ὅμοιος
      εἶ
      τῷ παιδὶ ἐκείνῳ!
      Οὐχ ἡττηθησόμεθα
      ὅταν ἔλθῃ ἄλλος
      ὡς ὁ \col(3)Μέγας
      Μοβλίν\col(0)!
      Εὐχαριστῶ!

  - name:
    - TX_312a
    - TX_312b
    - TX_312c
    - TX_312d
    - TX_312e
    - TX_312f
    - TX_3130
    index:
    - 0x2a
    - 0x2b
    - 0x2c
    - 0x2d
    - 0x2e
    - 0x2f
    - 0x30
    text: |-
      \sfx(0xc7)Ὤ! Σὺ εἶ ὁ παῖς
      ὁ πρὸ ὀλίγου!
      Τίς
      ἂν ᾠήθη ἰδεῖν σε
      ὧδε!\stop
      Εὑρίσκω \col(1)μυστήρια\col(0)
      δι' ἡμᾶς τοὺς
      Γόρωνας. Οἶδάς
      τι;
        \opt()Ναί \opt()Οὔ

  - name: TX_3131
    index: 0x31
    text: |-
      \sfx(0xc7)Ὤ. Εἶεν.

  - name: TX_3132
    index: 0x32
    text: |-
      \sfx(0xc7)Ἒ! Καλὸν τοῦτο!\stop
      Ἀπὸ τοῦ νῦν τὸ
      \col(1)μυστήριον\col(0) τοῦτο
      ζήσεται ἐν ταῖς
      καρδίαις πάντων
      τῶν Γορώνων! Εἰς
      χάριν δώσω σοι
      τὸ
      μέγα \col(1)Ξίφος τοῦ
      Μεγαγόρωνος\col(0)!
      Πλὴν!!! Δεῖ με
      δοκιμάσαι σε εἰ
      δύνασαι χρῆσθαι
      τῷ \col(1)ξίφει\col(0), εἶεν;
        \opt()Εἶεν \opt()Οὔ

  - name: TX_3133
    index: 0x33
    text: |-
      \sfx(0xc7)Δεῖ σε, ναί;

  - name: TX_3134
    index: 0x34
    text: |-
      Ἆ; Οὐ χρῄζεις
      τοῦ
      \col(1)Ξίφους τοῦ
      Μεγαγόρωνος\col(0);

  - name: TX_3135
    index: 0x35
    text: |-
      Ἰδοὺ ἡ
      δοκιμασία·
      Χρῶ τῷ \col(1)Ξίφει τοῦ
      Μεγαγόρωνος\col(0)
      παῖσαι
      τοὺς σκοπούς!
      Οἶδας τοὺς
      νόμους;
        \opt()Ναί \opt()Οὔ

  - name: TX_3136
    index: 0x36
    text: |-
      Δηλώσω οὖν σοι.\stop
      Χρῶ τῷ \col(1)ξίφει\col(0) σου
      παῖσαι τὰς σφαί-
      ρας εἰς τοὺς
      σκοπούς. Λάβε
      πλείστους
      ἀριθμούς.
      Λήψῃ 10 σφαίρας.
      Οἱ σκοποί εἰσιν·
      Νύμφη  100 ἀρ.
      Κυανοῦς 30 ἀρ.
      Ἐρυθρὸς -10 ἀρ.
      Δαίμων  -50 ἀρ.
      Συνῆκας;
        \opt()Ναί \opt()Οὔ

  - name: TX_3137
    index: 0x37
    text: |-
      Εἶεν! Ἐὰν λάβῃς
      300 ἀριθμούς, τὸ
      \col(1)ξίφος\col(0) σόν ἐστιν.
      Ἕτοιμος; Ἄρξαι!

  - name: TX_3138
    index: 0x38
    text: |-
      \sfx(0xc7)Ἆ... Ἴσως
      ἔσπευσας
      λίαν. Πειράσεις
      πάλιν;
         \opt()Ναί \opt()Οὔ

  - name: TX_3139
    index: 0x39
    text: |-
      Ἐπάνελθε
      ἀσκηθείς.

  - name: TX_313a
    index: 0x3a
    text: |-
      \sfx(0xc7)Εὖγε! Καθὼς
      ὑπεσχόμην, τὸ
      \col(1)Ξίφος
      Μεγαγόρωνος\col(0)
      σόν ἐστιν!

  - name: TX_313b
    index: 0x3b
    text: |-
      \sfx(0xc7)Διδάξω σε τὸ
      \col(1)μυστήριον\col(0) τοῦ
      χρῆσθαι τῷ \col(1)Ξίφει\col(1)
      Μεγαγόρωνος\col(0) καὶ
      ἐν 
      τῇ \col(3)Λαβρύννῃ\col(0)!\stop
      \secret1\stop
      Ἐπάνελθε ἐὰν
      ἐπιλάθῃ τοῦ
      \col(1)μυστηρίου\col(0)!

  - name: TX_313c
    index: 0x3c
    text: |-
      \sfx(0xc7)Ἦλθες εἰς τὴν
      δοκιμασίαν μου;
        \opt()Ναί  \opt()Οὔ

  - name: TX_313d
    index: 0x3d
    text: |-
      Τί; Οὐ χρῄζεις
      τοῦ φοβεροῦ
      \col(1)Ξίφους τοῦ
      Μεγαγόρωνος\col(0);

  - name: TX_313e
    index: 0x3e
    text: |-
      \sfx(0xc7)Ἰδοὺ τὸ
      \col(1)μυστήριον\col(0)
      τοῦ χρῆσθαι τῷ
      \col(1)Ξίφει
      Μεγαγόρωνος\col(0)
      καὶ ἐν τῇ
      \col(3)Λαβρύννῃ\col(0)·\stop
      \secret1\stop
      Μὴ ἐπιλάθῃ
      αὐτοῦ!

  - name: TX_313f
    index: 0x3f
    text: |-
      \sfx(0xc7)Πρὸ καιροῦ ἦν!

  - name: TX_3140
    index: 0x40
    text: |-
      \sfx(0xc7)Ὑστέρησας! Ἔξω
      ῥυθμοῦ εἶ!

  - name: TX_3141
    index: 0x41
    text: |-
      \sfx(0xc7)Κακὴ κίνησις!

  - name: TX_3142
    index: 0x42
    text: |-
      Ὁρῶ τὴν μοῖράν
      σου...\stop
      Πνεύματα
      Γορώνων,
      δείξατέ μοι
      πάντα!\stop
      Ὤ!!!

  - name: TX_3143
    index: 0x43
    text: |-
      \call(TX_3142)\stop
      Ὁρῶ σε ἐν τῷ
      μέλλοντι. Διέρχῃ
      πεδίον ὃ οὐκ
      οἶδας!

  - name: TX_3144
    index: 0x44
    text: |-
      \call(TX_3142)\stop
      Ὁρῶ σε
      διαβαίνον-
      τα τὰ ῥεύματα
      τοῦ
      χρόνου ἐρευνῶντα
      μέγαν
      λαβύρινθον!

  - name: TX_3145
    index: 0x45
    text: |-
      \call(TX_3142)\stop
      Ὁρῶ σε χορεύοντα
      θερμῶς μετὰ τοῦ
      \col(3)Εὐσχήμονος
      Γόρωνος\col(0)!

  - name: TX_3146
    index: 0x46
    text: |-
      \call(TX_3142)\stop
      Ὁρῶ σε σείοντα
      τὸ \col(1)ξίφος\col(0) σου
      πρὸς
      πλῆθος πετομένων
      σφαιρῶν!

  - name: TX_3147
    index: 0x47
    text: |-
      \call(TX_3142)\stop
      Ὁρῶ σε ἐν τῷ
      μέλλοντι. Δίδως
      πόμα δυνάμεως
      νυστάζοντι
      Γόρωνι!

  - name: TX_3148
    index: 0x48
    text: |-
      \call(TX_3142)\stop
      Ὁρῶ σε διδόντα
      ξένον \col(1)σκεῦος\col(0)
      Γόρωνι ζητοῦντι
      σπάνιον
      κειμήλιον!

  - name: TX_3149
    index: 0x49
    text: |-
      \call(TX_3142)\stop
      Ὁρῶ σε ἐν τῷ
      μέλλοντι. Δίδως
      βρῶμα πεινῶντι
      Γόρωνι!

  - name: TX_314a
    index: 0x4a
    text: |-
      \call(TX_3142)\stop
      Ὁρῶ σε ἐν τῷ
      μέλλοντι.
      Ἐπιβαί-
      νεις ξένης
      ἁμάξης
      καὶ βάλλεις
      κύκλῳ!

  - name: TX_314b
    index: 0x4b
    text: |-
      \call(TX_3142)\stop
      Ὁρῶ σε χορεύοντα
      θερμῶς!

  - name: TX_314c
    index: 0x4c
    text: |-
      \call(TX_3142)\stop
      Ὁρῶ σε διδόντα
      θερμόν τι φίλῳ
      τοῦ \col(3)Εὐσχήμονος
      Γόρωνος\col(0)!

  - name: TX_314d
    index: 0x4d
    text: |-
      \call(TX_3142)\stop
      Ὁρῶ σε ἐν τῷ
      μέλλοντι.
      Φεύγεις
      βόμβους
      πίπτοντας
      κύκλῳ σου!

  - name: TX_314e
    index: 0x4e
    text: |-
      Ὁρῶ τὴν μοῖράν
      σου...\stop
      Πνεύματα
      Γορώνων,
      δείξατέ μοι
      πάντα!\stop
      Θαυμαστόν!

  - name: TX_314f
    index: 0x4f
    text: |-
      \call(TX_314e)\stop
      Ὁρῶ σε διερχόμε-
      νον πεδίον ὃ οὐκ
      οἶδας!

  - name: TX_3150
    index: 0x50
    text: |-
      \call(TX_314e)\stop
      Ὁρῶ σε
      διαβαίνον-
      τα τὰ ῥεύματα
      τοῦ
      χρόνου ἐρευνῶντα
      μέγαν
      λαβύρινθον!

  - name: TX_3151
    index: 0x51
    text: |-
      \call(TX_314e)\stop
      Ὁρῶ σε ἐν τῷ
      πάλαι. Χορεύεις
      θερμῶς μετὰ τοῦ
      \col(3)Εὐσχήμονος
      Γόρωνος\col(0)!

  - name: TX_3152
    index: 0x52
    text: |-
      \call(TX_314e)\stop
      Ὁρῶ σε ἐν τῷ
      πάλαι. Σείεις τὸ
      \col(1)ξίφος\col(0) σου πρὸς
      πλῆθος ἐρχομένων
      σφαιρῶν!

  - name: TX_3153
    index: 0x53
    text: |-
      \call(TX_314e)\stop
      Ὁρῶ σε διδόντα
      πόμα δυνάμεως
      νυστάζοντι
      Γόρωνι.

  - name: TX_3154
    index: 0x54
    text: |-
      \call(TX_314e)\stop
      Ὁρῶ σε ἐν τῷ
      πάλαι. Δίδως
      ξένον \col(1)σκεῦος\col(0)
      Γόρωνι ζητοῦντι
      σπάνιον
      κειμήλιον!

  - name: TX_3155
    index: 0x55
    text: |-
      \call(TX_314e)\stop
      Ὁρῶ σε διδόντα
      βρῶμα πεινῶντι
      Γόρωνι!

  - name: TX_3156
    index: 0x56
    text: |-
      \call(TX_314e)\stop
      Ὁρῶ σε
      ἐπιβαίνον-
      τα ξένης ἁμάξης
      καὶ βάλλοντα
      κύκλῳ σου!

  - name: TX_3157
    index: 0x57
    text: |-
      \call(TX_314e)\stop
      Ὁρῶ σε χορεύοντα
      θερμῶς!

  - name: TX_3158
    index: 0x58
    text: |-
      \call(TX_314e)\stop
      Ὁρῶ σε ἐν τῷ
      πάλαι. Δίδως τῷ
      φίλῳ τοῦ
      \col(3)Εὐσχήμονος
      Γόρωνος\col(0)
      θερμόν τι!

  - name: TX_3159
    index: 0x59
    text: |-
      \call(TX_314e)\stop
      Ὁρῶ σε φεύγοντα
      \col(1)Βόμβους\col(0)
      πίπτοντας
      κύκλῳ σου!

- group: 0x32
  data:
  - name: TX_3200
    index: 0x00
    text: |-
      Θέλεις μαθεῖν
      \col(1)τέχνην δυνατοῦ\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_3201
    index: 0x01
    text: |-
      Θέλεις μαθεῖν
      τέχνην \col(1)θυρεοῦ\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_3202
    index: 0x02
    text: |-
      Θέλεις μαθεῖν
      περὶ τῶν
      \col(1)Μυστικῶν
      Σπερμάτων\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_3203
    index: 0x03
    text: |-
      Θέλεις μαθεῖν
      περὶ \col(1)Βόμβων\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_3204
    index: 0x04
    text: |-
      Θέλεις μαθεῖν
      περὶ \col(1)σκευῶν\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_3205
    index: 0x05
    text: |-
      Θέλεις μαθεῖν
      περὶ \col(1)πινάκων\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_3206
    index: 0x06
    text: |-
      Θέλεις μαθεῖν
      περὶ \col(1)σωτηρίας\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_3207
    index: 0x07
    text: |-
      Θέλεις μαθεῖν
      περὶ \col(1)αἰώνων\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_3208
    index: 0x08
    text: |-
      Θέλεις μαθεῖν
      περὶ τῶν
      \col(1)Ὀθονῶν\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_3209
    index: 0x09
    text: |-
      Θέλεις μαθεῖν
      περὶ \col(1)οὐσιῶν\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_320a
    index: 0x0a
    text: |-
      Τέχνη ἀνδρείου
      δυνατοῦ!\stop
      Κάτεχε τὸ
      πλῆκτρον
      τοῦ \col(1)ξίφους\col(0)
      πληρῶ-
      σαι ἰσχύν, καὶ
      ἄφες αὐτὸ διὰ
      πληγὴν δίνης!

  - name: TX_320b
    index: 0x0b
    text: |-
      Ἀπωθοῦ τὰς
      πληγὰς
      τῶν ἐχθρῶν
      πιέζων
      τὸ πλῆκτρον τοῦ
      \col(1)θυρεοῦ\col(0).

  - name: TX_320c
    index: 0x0c
    text: |-
      Πέντε εἴδη ἐστὶ
      \col(1)Μυστικῶν
      Σπερμάτων\col(0).
      Ἕκαστον \col(1)σπέρμα\col(0)
      ἔχει ἰδίαν
      δύναμιν.\stop
      Οὐ δύνασαι
      φέρειν
      \col(1)σπέρματα\col(0) ἄνευ
      \col(1)πήρας\col(0).

  - name: TX_320d
    index: 0x0d
    text: |-
      Ἐξελὼν \col(1)Βόμβον\col(0),
      πίεσον πάλιν
      θεῖ-
      ναι αὐτόν.
      Πίεσον
      \col(0x84)\item(0x00)\col(0) βαλεῖν
      \col(1)Βόμβον\col(0) ἐκεῖσε.
      Πίεσον πάλιν
      ἆραι
      τεθέντα \col(1)Βόμβον\col(0).

  - name: TX_320e
    index: 0x0e
    text: |-
      Θὲς σκεύη εἰς \abtn
      ἢ \bbtn ἐν τῇ
      Ὀθόνῃ.
      Ὁ ἀριθμὸς σκευῶν
      ὡς \col(1)σπερμάτων\col(0) καὶ
      \col(1)Βόμβων\col(0) μειοῦται
      ἐν τῇ χρήσει,
      σκόπει οὖν πόσα
      ἔχεις.

  - name: TX_320f
    index: 0x0f
    text: |-
      Πίεσον Ἐκλογὴν
      ἰδεῖν τὸν
      πίνακα.
      Κίνησον τὸ
      σημεῖον
      καὶ πίεσον \abtn
      ἰδεῖν ὀνόματα
      τόπων. Τὰ
      σκοτεινὰ
      μέρη οὔπω εἶδες.
      Μόνα ἃ εἶδες καὶ
      ἤκουσας
      γέγραπται.

  - name: TX_3210
    index: 0x10
    text: |-
      Ἄνοιξον τὴν
      Ὀθόνην
      καὶ πίεσον
      Ἐκλογὴν
      δὶς ἰδεῖν τὴν
      Ὀθόνην Οὐσιῶν.
      Εἶτα ἑλοῦ Σῶσον
      καὶ πίεσον \abtn.
      Πιέζων Ἀρχὴν καὶ
      Ἐκλογὴν ἅμα
      ἀνοίγεις ὡσαύτως
      τὴν Σωτηρίαν.

  - name: TX_3211
    index: 0x11
    text: |-
      Τὸ νῦν καὶ τὸ
      πάλαι
      συνδέδεται.
      Τὰ ἐν τῷ πάλαι
      γινόμενα κινεῖ
      τὰ
      ἐν τῷ νῦν. Καὶ
      σκεύη
      εὑρισκόμενα
      ἐν τῷ νῦν
      φέρεται
      εἰς τὸ πάλαι!

  - name: TX_3212
    index: 0x12
    text: |-
      Πίεσον Ἀρχὴν
      ἀνοῖξαι τὴν
      Ὀθόνην, καὶ
      Ἐκλογὴν διελθεῖν
      τὰς ὀθόνας.\stop
      Πρώτη ἐστὶν ἡ
      Ὀθόνη Σκευῶν,
      εἶτα ἡ
      Κατάστασις
      Ἄθλου. Εἶτα ἡ
      ὀθόνη οὐσιῶν.\stop
      Ἑλοῦ \col(1)δακτύλιον\col(0)
      φορεῖν ἐν τῇ
      Καταστάσει
      Ἄθλου.

  - name: TX_3213
    index: 0x13
    text: |-
      Ἆ, οὐδὲ τοῦτο τὸ
      \col(3)Σοφὸν Ὄρνεον\col(0)
      οἶδε πολλὰ περὶ
      \col(1)οὐσιῶν\col(0).

  - name:
    - TX_3214
    - TX_3215
    index:
    - 0x14
    - 0x15
    text: |-
      Οὐχί! Δεῖ με
      ἀκοῦσαι τῆς ᾠδῆς
      τῆς \col(3)Ναϋρού\col(0)!

  - name: TX_3216
    index: 0x16
    text: |-
      \col(3)Πόλις Λύννης\col(0)!
      Οἶκος \col(3)Ναϋρού\col(0)!
      Ἡ \col(3)Ζέλδα\col(0) ἔρχεται!
      Ἡ \col(3)Ζέλδα\col(0) ἔρχεται!

  - name: TX_3217
    index: 0x17
    text: |-
      Δέομαι! Δέομαι!

- group: 0x33
  data:
  - name: TX_3300
    index: 0x00
    text: |-
      Αὕτη ἐστὶν ἡ
      \col(3)Βιβλιοθήκη τῶν
      Διόπτρων\col(0). \col(1)Κόνις
      τῶν Νυμφῶν\col(0)
      λέγεται
      φυλάσσεσθαι
      ὄπισθεν, ἀλλ'
      οὔπω εἶδον
      αὐτήν.

  - name: TX_3301
    index: 0x01
    text: |-
      Αὕτη ἐστὶν ἡ
      \col(3)Βιβλιοθήκη τῶν
      Διόπτρων\col(0). Ἡ
      \col(1)Κόνις
      τῶν Νυμφῶν\col(0) ἀπῆλ-
      θεν, ἀλλὰ χαίρω
      ὅτι ἡ θάλασσα
      καθαρά ἐστιν.

  - name: TX_3302
    index: 0x02
    text: |-
      Οἱ ἰδόντες ξένον
      θηρίον ἐν τῇ
      νήσῳ
      πρὸς δυσμὰς
      λέγουσιν ὅτι ἀεὶ
      ἐκεῖ ἐστιν, οὐκ
      ἐπιτίθεται, καὶ
      βλέπει ὡς αἰτοῦν
      βοήθειαν.
      Λέγουσι
      δὲ καὶ ὅτι
      λαλεῖ.
      Φλυαρία ἐστίν!

  - name: TX_3303
    index: 0x03
    text: |-
      Τὸ ξένον θηρίον
      ἦν ἡ \col(3)Βασίλισσα
      τῶν Νυμφῶν\col(0). Κἂν
      μωρὸς φαίνηται
      λόγος τις, ἴσως
      ἔχει ἀλήθειαν
      κεκρυμμένην
      ἔνδον.

  - name: TX_3304
    index: 0x04
    text: |-
      Ἡ \col(3)Βασίλισσα τῶν
      Νυμφῶν\col(0) ᾤκει ἐν
      τῇ νήσῳ πρὸς
      δυσμὰς ἐντεῦθεν,
      ἀλλ' ἠφανίσθη
      νῦν... Πάντως ἡ
      \col(3)Βασίλισσα τῶν
      Νυμφῶν\col(0) ἠδύνατο
      βοηθῆσαι ταῖς
      θαλάσσαις...

  - name: TX_3305
    index: 0x05
    text: |-
      Σὺ εἶ ὁ σώσας
      τὴν
      \col(3)Βασίλισσαν τῶν
      Νυμφῶν\col(0); Σὺ εἶ
      οὖν
      ὁ δυνατὸς ὁ
      σώσας
      τὰς \col(3)Θαλάσσας
      Ζώρα\col(0).

  - name: TX_3306
    index: 0x06
    text: |-
      Ἡ \col(1)Κόνις Νυμφῶν\col(0)
      κέκλεισται ὄπι-
      σθεν, ἀλλ' ἄνευ
      ἄλλου \col(1)Βιβλίου
      τῶν
      Σφραγίδων\col(0),
      οὐδεὶς
      φθάνει εἰς τὴν 
      \col(1)κόνιν\col(0). Τί ἐστιν
      ἡ
      \col(1)Κόνις τῶν
      Νυμφῶν\col(0);

  - name: TX_3307
    index: 0x07
    text: |-
      Οὐκ ᾠήθην
      ἐλεύσε-
      σθαι τὸν λύσοντα
      τὸ αἴνιγμα...
      Πόθεν ἤνεγκας τὸ
      λεῖπον \col(1)Βιβλίον
      τῶν Σφραγίδων\col(0);

  - name: TX_3308
    index: 0x08
    text: |-
      Τοῦτό ἐστι τὸ
      \col(1)Βιβλίον
      Σφραγίδων\col(0).
      Πάλαι μέρος ἦν
      συνόλου, ἀλλὰ
      νῦν
      τοῦτο μόνον λεί-
      πεται. Πῶς
      ἐχρῶντο
      αὐτοῖς αἴνιγμα
      αἰώνιόν ἐστιν.

  - name: TX_3309
    index: 0x09
    text: |-
      Λέγεις ὅτι
      λύσεις
      τὸ αἴνιγμα τοῦ
      \col(1)βιβλίου\col(0) τούτου;
      Χὸ χό! Θαυμαστὸν
      ἔσται! Δίδωμί
      σοι
      τὸ \col(1)Βιβλίον τῶν
      Σφραγίδων\col(0)!

  - name: TX_330a
    index: 0x0a
    text: |-
      Ἔλυσας τὸ
      αἴνιγμα;

  - name: TX_330b
    index: 0x0b
    text: |-
      Καλῶς ἐποίησας
      φθάσας ὧδε.
      Γινώσκω τὸ
      θάρσος
      σου καὶ δίδωμί
      σοι τοῦτο.

  - name: TX_330c
    index: 0x0c
    text: |-
      Πρόαγε ἀφόβως.
      Μὴ ἐπιλάθῃ τοῦ
      θάρσους σου.

  - name:
    - TX_330d
    - TX_330e
    - TX_330f
    index:
    - 0x0d
    - 0x0e
    - 0x0f
    text: |-
      Οὐκέτι ἔχω ὃ
      ζητεῖς.
      Ἐπάνελθε.

  - name: TX_3310
    index: 0x10
    text: |-
      Ἔλυσας τὸ
      αἴνιγμα.
      Ἔχεις χρείαν
      τινά;
        \opt()Ναί \opt()Οὔ

  - name: TX_3311
    index: 0x11
    text: |-
      Ἄπελθε οὖν!

  - name: TX_3312
    index: 0x12
    text: |-
      Πῶς οἶδας ἐκεῖνο
      τὸ \col(1)μυστήριον\col(0);\stop
      Τὸ μυστήριον
      τοῦτο μόνης τῆς
      \col(3)βιβλιοθήκης\col(0)
      ἐστίν.\stop
      Μηδενὶ εἴπῃς.
      Δίδωμί σοι τοῦτο
      ἀντὶ τῆς σιγῆς!

  - name:
    - TX_3313
    - TX_3314
    index:
    - 0x13
    - 0x14
    text: |-
      Τοῦτό ἐστι τὸ
      \col(1)μυστήριον\col(0) τοῦ
      θυρεοῦ καὶ ἐν τῷ
      \col(3)Ὁλόδρουμ\col(0)·\stop
      \secret1\stop
      Ἐπάνελθε ἐὰν
      ἐπιλάθῃ τοῦ
      \col(1)μυστηρίου\col(0)! Μὴ
      ἐξείπῃς αὐτό!

  - name: TX_3315
    index: 0x15
    text: |-
      Εὐχαριστῶ σοι
      τίσαντι ἰάσασθαι
      τὴν θύραν μου.

  - name: TX_3316
    index: 0x16
    text: |-
      Μὴ ποιήσῃς τοῦτο
      πάλιν.

  - name: TX_3317
    index: 0x17
    text: |-
      ...Ἤθελον εἰπεῖν
      τοῦτο, ἀλλ' οὐ
      λαμβάνω ὃ οὐκ
      ἔχεις.
      \jump(TX_3316)
    null_terminator: False

  - name: TX_3318
    index: 0x18
    text: |-
      Σίγα! Μὴ εἴπῃς!

  - name: TX_3319
    index: 0x19
    text: |-
      Οὐδὲν ἄλλο ἔχω
      σοι.

- group: 0x34
  data:
  - name: TX_3400
    index: 0x00
    text: |-
      Ὁ-ὁ πόνος!
      Τοῦτό ἐστι τὸ
      τέλος μου...
      Τὸ εὐθηνοῦν
      βασιλικὸν γένος
      μαραίνεται ἐν
      μιᾷ γενεᾷ...
      Ὁ πόνος...

  - name: TX_3401
    index: 0x01
    text: |-
      \call(TX_3400)\stop
      Δοῦναι αὐτῷ τὸ
      \col(1)Μαγικὸν
      Φάρμακον\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_3402
    index: 0x02
    text: |-
      Τοῦτό ἐστι
      \col(1)Μαγικὸν
      Φάρμακον\col(0);\stop
      Χμμ...
      Φαίνεται λίαν
      ὕποπτον, ἀλλ' εἰ
      μέλλω θανεῖν, οὐ
      βλάψει πιεῖν
      αὐτό!

  - name: TX_3403
    index: 0x03
    text: |-
      Γλούγ, γλούγ, ἆ!

  - name: TX_3404
    index: 0x04
    text: |-
      Φεῦ! Ἀηδές
      ἐστιν!\stop
      Ἀλλὰ ῥεῖ δι'
      ἐμοῦ! Τὸ βασιλι-
      κὸν γένος ἐσώθη!\stop
      Τίς εἶ σύ;\stop
      Εὐχαριστῶ σοι,
      \Link!\stop
      Τὸ ἀκάθαρτον
      ὕδωρ τὸ ῥέον ἐξ
      ἀνατολῶν ἐσχάτως
      μὲ ἐνόσησεν. Οὐ
      μή σε ἐπιλάθωμαι
      εἰς τὸν αἰῶνα!\stop
      Τί ποθεῖς,
      \Link;\stop
      Ἔα; Μέγαν ἰχθύν;
      Λέγεις ἄρα...
      τὸν
      \col(3)Ἰαβου-Ἰαβού\col(0);\stop
      Ἀλλ' ὁ
      \col(3)Ἰαβου-Ἰαβοὺ\col(0)
      φύλαξ ἐστὶν ἡμῶν
      τῶν Ζώρα!
      Καλεῖν αὐτὸν
      ἰχθὺν ὕβρις
      ἐστίν! Πρόσεχε
      τῇ γλώσσῃ σου!

  - name: TX_3405
    index: 0x05
    text: |-
      Ἀκάθαρτον ὕδωρ
      ῥεῖ ἐξ ἀνατολῶν
      ἐσχάτως. Ἴσως
      τοῦτό με
      ἐνόσησεν.
      Ὅμως οὐδέποτε
      ἐπιλήσομαι τῶν
      ἔργων σου!

  - name: TX_3406
    index: 0x06
    text: |-
      Ἔδωκας ἡμῖν καὶ
      καθαρὰς θαλάσσας
      πάλιν! Εὐχαριστῶ
      σοι ἐκ νέου! Τί;
      Θέλεις εἰσελθεῖν
      εἰς \col(3)Ἰαβου-Ἰαβού\col(0);
      Εἴθε ἐδυνάμην
      ἐπιτρέψαι σοι,
      ἀλλ' ὁ
      \col(3)Ἰαβου-Ἰαβοὺ\col(0)
      ἔτι νέος ἐστίν.
      Μικρός ἐστι τοῦ
      εἰσελθεῖν ἐντὸς
      αὐτοῦ. Κρεῖττον
      ἀποστῆναι.

  - name: TX_3407
    index: 0x07
    text: |-
      \Link!
      Ὁ σωτὴρ τῶν
      \col(3)Θαλασσῶν Ζώρα\col(0)!\stop
      Εὐχαριστῶ σοι ἐξ
      ὀνόματος πάντων
      τῶν Ζώρα!

  - name: TX_3408
    index: 0x08
    text: |-
      Μέγα θεραπευτά!\stop
      Τί αἰτεῖς;\stop
      Θέλεις εἰσελθεῖν
      εἰς \col(3)Ἰαβου-Ἰαβού\col(0);
      Ἡ ἐμὴ ἄδεια
      χρειάζεται πρὸς
      τὸν \col(3)Ἰαβου-Ἰαβού\col(0),
      ἀλλ' οὐκ
      ἐπιτρέπω
      τῷ τυχόντι ἰδεῖν
      τὸν φύλακα ἡμῶν.
      Ἄλλως τε, τὸ
      ἀκάθαρτον ὕδωρ
      ἤνεγκε τὸν
      \col(3)Ἰαβου-
      Ἰαβοὺ\col(0) ἐγγὺς
      θανάτου.\n
    null_terminator: False

  - name: TX_3409
    index: 0x09
    text: |-
      Εἰ ἀνάγκη ἐστίν,
      εὑρὲ τρόπον
      καθαρίσαι τὸ
      ἀκάθαρτον ὕδωρ
      καὶ σῶσον τὸν
      \col(3)Ἰαβου-Ἰαβού\col(0).
      Δέχῃ τοῦτον τὸν
      ἆθλον;
        \opt()Ναί \opt()Οὔ

  - name: TX_340a
    index: 0x0a
    text: |-
      Οὕτως ἄρα...
      Τότε οὐδὲν
      δύναται
      γενέσθαι.

  - name: TX_340b
    index: 0x0b
    text: |-
      Εὖγε!
      Λάβε δὴ τοῦτο!

  - name: TX_340c
    index: 0x0c
    text: |-
      Αὕτη ἐστὶν ἡ
      \col(1)κλεὶς\col(0)
      τῆς \col(3)Βιβλιοθήκης
      Νήσου Διόπτρων\col(0)
      πρὸς ἀνατολάς.
      Ἀρχαία
      \col(3)βιβλιοθήκη\col(0)
      ἐστίν, καὶ οὐκ
      οἶδα εἰ ἡ \col(1)κλεὶς\col(0)
      ἔτι ἀνοίγει,
      ἀλλ'
      ἴσως ἐρευνήσεις
      διὰ τί τὸ ὕδωρ
      ἐστὶν ἀκάθαρτον.
      Πιστεύω σοι
      σῶσαι
      τὸν \col(3)Ἰαβου-Ἰαβού\col(0).

  - name: TX_340d
    index: 0x0d
    text: |-
      Χάρις σοι, τὸ
      ὕδωρ ἡμῶν
      καθαρόν
      ἐστι πάλιν, καὶ
      ἡ
      ὑγίεια τοῦ
      \col(3)Ἰαβου-
      Ἰαβοὺ\col(0) ἐπανῆλθεν.
      Πάντα καλῶς
      ἔχει.\stop
      Οὐδέποτε
      παραβαίνω
      τὸν λόγον μου.
      Σὲ
      ὀνομάζω Ἥρωα τῶν
      Ζώρα καὶ
      ἐπιτρέπω
      εἰσελθεῖν εἰς
      τὸν
      \col(3)Ἰαβου-Ἰαβού\col(0).\n
    null_terminator: False

  - name: TX_340e
    index: 0x0e
    text: |-
      Ἔξεστί σοι ἰδεῖν
      τὸν \col(3)Ἰαβου-Ἰαβού\col(0).

  - name: TX_340f
    index: 0x0f
    text: |-
      Σὺ εἶ ὁ ἥρως ὁ
      σώσας τὰς
      \col(3)Θαλάσσας Ζώρα\col(0).
      Εὐχαριστῶ σοι ἐξ
      ὀνόματος πάντων
      τῶν Ζώρα.

  - name: TX_3410
    index: 0x10
    text: |-
      Ὁ \col(3)Βασιλεὺς Ζώρα\col(0)
      διάδοχον οὐκ
      ἔχει.
      Ἐὰν ἡ νόσος
      αὐτοῦ
      μείνῃ καὶ θάνῃ,
      ἡμεῖς οἱ Ζώρα
      ἀπολέσομεν τὸν
      ἔσχατον βασιλέα.

  - name: TX_3411
    index: 0x11
    text: |-
      Χάρις σοι, ὁ
      \col(3)Βασιλεὺς Ζώρα\col(0)
      ὑγιαίνει! Τὸ
      βασιλικὸν γένος
      ἀσφαλές ἐστιν!

  - name: TX_3412
    index: 0x12
    text: |-
      Θέλεις εἰσελθεῖν
      εἰς τὸν
      \col(3)Ἰαβου-Ἰαβού\col(0);!;
      Ἀλλ' ὁ
      \col(3)Ἰαβου-Ἰαβοὺ\col(0)
      βρέφος ἐστίν!
      Οὐ χωρεῖς ἐντὸς
      αὐτοῦ!

  - name: TX_3413
    index: 0x13
    text: |-
      Ἡ κλῖμαξ ἐκείνη
      ἄγει εἰς τὴν
      αἴθουσαν θρόνου.
      Ὁ βασιλεὺς
      νοσεῖ.
      Εἰ δεῖ ἰδεῖν
      αὐτόν, συντόμως!

  - name: TX_3414
    index: 0x14
    text: |-
      Ἡ κλῖμαξ ἐκείνη
      ἄγει εἰς τὴν
      αἴθουσαν θρόνου.
      Πρόσεχε τοῖς
      τρόποις σου ὅταν
      λαλῇς τῷ
      βασιλεῖ.

  - name: TX_3415
    index: 0x15
    text: |-
      Ὁ ἄρχων ἡμῶν, ὁ
      \col(3)Βασιλεὺς Ζώρα\col(0),
      αἰφνιδίως
      ἐνόσησε.
      Ἐποιήσαμεν πᾶν
      τὸ
      δυνατόν, ἀλλ' ἡ
      κατάστασις αὐτοῦ
      οὐκ ἀλλάσσει.

  - name: TX_3416
    index: 0x16
    text: |-
      \Link!
      Τοῦτό ἐστι τὸ
      παλάτιον τοῦ
      \col(3)Βασιλέως Ζώρα\col(0).

  - name: TX_3417
    index: 0x17
    text: |-
      Τὸ πρόσωπον τοῦ
      \col(3)Βασιλέως Ζώρα\col(0)
      φαίνεται λίαν
      ἀλγοῦν, οὐχί;

  - name: TX_3418
    index: 0x18
    text: |-
      Εὐχαριστῶ σοι
      σφόδρα δι' ἃ
      ἐποίησας! Ἔδωκας
      τῷ \col(3)Βασιλεῖ Ζώρα\col(0)
      τὴν ζωὴν αὐτοῦ!

  - name: TX_3419
    index: 0x19
    text: |-
      Αἱ \col(3)Θάλασσαι Ζώρα\col(0)
      πάλιν λάμπουσι
      καθαραί! Καὶ
      τοῦτο χάρις σοι,
      \Link.

  - name: TX_341a
    index: 0x1a
    text: |-
      Νομίζομεν ὅτι
      χρειαζόμεθα ἴαμα
      λεγόμενον
      \col(1)Μαγικὸν
      Φάρμακον\col(0) πρὸς
      θεραπείαν τοῦ
      \col(3)Βασιλέως Ζώρα\col(0).
      Ποῦ εὑρήσομεν
      μάγον ποιήσοντα
      τοιοῦτον
      \col(1)φάρμακον\col(0);

  - name:
    - TX_341b
    - TX_341c
    - TX_341d
    - TX_341e
    - TX_341f
    index:
    - 0x1b
    - 0x1c
    - 0x1d
    - 0x1e
    - 0x1f
    text: |-
      Εὖγε, εὖγε,
      \Link!

  - name: TX_3420
    index: 0x20
    text: |-
      Τοῦτο ἦν τὸ
      παλάτιον τοῦ
      ἄρχοντος ἡμῶν,
      τοῦ
      \col(3)Βασιλέως Ζώρα\col(0),
      ἀλλὰ πάλαι ὁ
      βασιλεὺς
      ἐνόσησεν.
      Ἔκτοτε ζῶμεν
      ἄνευ βασιλέως.
      Ὅπερ ὁ βασιλεὺς
      ἐφύλασσεν...
      Ἡ \col(1)κλεὶς\col(0) τῆς
      \col(3)Βιβλιοθήκης
      Νήσου
      Διόπτρων\col(0)--
      ἀπώλετο.

  - name: TX_3421
    index: 0x21
    text: |-
      Ὁ βασιλεὺς ἐφύ-
      λασσε τὴν \col(1)κλεῖδα\col(0)
      τῆς \col(3)Βιβλιοθήκης
      Νήσου Διόπτρων\col(0)
      μακρὰν
      ἀνατολικά.

  - name: TX_3422
    index: 0x22
    text: |-
      Ὁ \col(3)Βασιλεὺς Ζώρα\col(0)
      μόνον μεγάλῳ
      ἥρωϊ
      ἐπιτρέψει
      εἴσοδον
      εἰς \col(3)Ἰαβου-Ἰαβού\col(0).

  - name: TX_3423
    index: 0x23
    text: |-
      Ἔλαβες ἐκείνην
      τὴν \col(1)"οὐσίαν"\col(0)
      καλῶς; Ἄξιον
      τοῦ κληθέντος
      ἥρωος ὑπὸ τοῦ
      \col(3)Βασιλέως Ζώρα\col(0).

  - name: TX_3424
    index: 0x24
    text: |-
      Ἡ κλῖμαξ ἐκείνη
      ἄγει εἰς τὴν
      αἴθουσαν θρόνου.
      Πρόσεχε τοῖς
      τρόποις σου ἐνώ-
      πιον τοῦ
      βασιλέως.

  - name: TX_3425
    index: 0x25
    text: |-
      Καλῶς ἦλθες,
      ὁδοιπόρε. Τοῦτό
      ἐστι τὸ παλάτιον
      τοῦ μεγάλου
      \col(3)Βασιλέως Ζώρα\col(0).

  - name: TX_3426
    index: 0x26
    text: |-
      Εὖγε, εὖγε!
      \Link!
      Τοῦτό ἐστι τὸ
      παλάτιον τοῦ
      \col(3)Βασιλέως Ζώρα\col(0).

  - name: TX_3427
    index: 0x27
    text: |-
      Ὁ ἄρχων ἡμῶν, ὁ
      \col(3)Βασιλεὺς Ζώρα\col(0),
      κάθηται ὄπισθεν.
      Πρόσεχε μὴ φανῇς
      ἀγενής.

  - name: TX_3428
    index: 0x28
    text: |-
      Ὁ βασιλεὺς λίαν
      προσηνὴς Ζώρα
      ἐστίν. Λάλησον
      αὐτῷ ἐλευθέρως
      περὶ παντός.

  - name:
    - TX_3429
    - TX_342a
    - TX_342b
    - TX_342c
    - TX_342d
    - TX_342e
    - TX_342f
    index:
    - 0x29
    - 0x2a
    - 0x2b
    - 0x2c
    - 0x2d
    - 0x2e
    - 0x2f
    text: |-
      Αἱ θάλασσαι ἡμῶν
      καθαραί εἰσι
      πάλιν
      χάρις σοι. Ὁ
      βασιλεὺς χαίρει
      σφόδρα!

  - name: TX_3430
    index: 0x30
    text: |-
      Ἐποίησας τοσαῦτα
      ὑπὲρ ἡμῶν!\stop
      Αἱ θάλασσαι ἡμῶν
      καθαραί εἰσι καὶ
      πάντα καλῶς
      ἔχει!
      Δίδωμί σοι τὸ
      σύμβολον
      ἡρωϊσμοῦ--
      τὴν \col(1)Λεπίδα Ζώρα\col(0)!

  - name: TX_3431
    index: 0x31
    text: |-
      Αἱ θάλασσαι
      πέραν
      ἐντεῦθεν καταπί-
      νουσι πάντας
      τοὺς
      πλέοντας--ἡ
      \col(3)Θάλασ-
      σα τῶν
      Καταιγίδων\col(0)!
      Οὐκ ἐπιτρέπω
      παιδὶ
      ὡς σοὶ διελθεῖν!

  - name: TX_3432
    index: 0x32
    text: |-
      Ἡ \col(1)Λεπὶς τῶν
      Ζώρα\col(0);
      Σὺ ἄρα εἶ ὁ
      \Link!
      Δύνασαι
      διελθεῖν!
      Οὐκ οἶδα τί
      κεῖται
      πέραν, οὐδὲ
      ἐρωτῶ
      διὰ τί διέρχῃ.
      Ὑγίαινε!

  - name: TX_3433
    index: 0x33
    text: |-
      Μελετῶ τὴν
      αἰτίαν
      τοῦ ἀκαθάρτου
      θαλασσίου
      ὕδατος.\stop
      Φαίνεται
      αἰφνιδίως
      μιανθῆναι πρὸ
      ἑκατοντάδων
      ἐτῶν,
      ἀλλ' οὐδὲν πλέον
      ἔμαθον...

  - name: TX_3434
    index: 0x34
    text: |-
      Μελετήσω ὧδε ἐπὶ
      μικρὸν ἔτι πρὸς
      βοήθειαν τῆς
      προόδου τῆς
      κοινωνίας Ζώρα.

  - name: TX_3435
    index: 0x35
    text: |-
      Χρειάζῃ μου,
      μεγάλη γοργών;
        \opt()Ναί \opt()Οὔ

  - name: TX_3436
    index: 0x36
    text: |-
      Νοῶ...

  - name: TX_3437
    index: 0x37
    text: |-
      Ὤ! \col(1)Μυστήριον\col(0)
      παρὰ
      τοῦ Ζώρα ὃν
      ἔπεμψα
      εἰς τὸ \col(3)Ὁλόδρουμ\col(0)
      πρὸς εὕρεσιν
      νέας
      ἐπικρατείας! Εὖ
      ἐποίησας!
      Εὐχαρι-
      στῶ. Ὡς
      ἀμοιβήν...
      Ναί! Δός μοι τὸ
      \col(1)Ξίφος\col(0) σου! Θέλω
      ἀκονῆσαι αὐτό!

  - name: TX_3438
    index: 0x38
    text: |-
      Θέλεις
      ἐξαπατῆσαί
      με;

  - name:
    - TX_3439
    - TX_343a
    - TX_343b
    - TX_343c
    - TX_343d
    - TX_343e
    - TX_343f
    index:
    - 0x39
    - 0x3a
    - 0x3b
    - 0x3c
    - 0x3d
    - 0x3e
    - 0x3f
    text: |-
      Διδάξω σε τὸ
      \col(1)μυστήριον\col(0) τοῦ
      ἀκονῆσαι τὸ
      \col(1)ξίφος\col(0)
      σου καὶ ἐν τῷ
      \col(3)Ὁλόδρουμ\col(0)!\stop
      \secret1\stop
      Ἐπίστρεψον ἐὰν
      ἐπιλάθῃ τὸ
      \col(1)μυστήριόν\col(0) μου.

  - name: TX_3440
    index: 0x40
    text: |-
      Αἱ θάλασσαί
      εἰσιν
      ἀκάθαρτοι--
      γκούχ! Γκούχ! Οὐ
      δύναμαι κολυμβᾶν
      ἐν εἰρήνῃ.

  - name: TX_3441
    index: 0x41
    text: |-
      Χα-χά! Αἱ θάλασ-
      σαι καθαραί
      εἰσιν!
      Δύναμαι κολυμβᾶν
      ἐν εἰρήνῃ πάλιν!

  - name: TX_3442
    index: 0x42
    text: |-
      \call(TX_3447)
      Πρόσεχε μὴ φανῇς
      ἀγενής!

  - name: TX_3443
    index: 0x43
    text: |-
      Αἱ θάλασσαι
      ἀποκατέστησαν!
      Καὶ ὁ \col(3)Βασιλεὺς
      Ζώρα\col(0) ὑγιαίνει!
      Πάντα καλῶς
      ἔχει!

  - name: TX_3444
    index: 0x44
    text: |-
      Μὴ νομίσῃς ἡμᾶς
      τοὺς εὐγενεῖς
      Ζώρα
      τῆς θαλάσσης
      ὁμοί-
      ους τοῖς ἀγρίοις
      Ζώρα τῶν
      ποταμῶν!

  - name: TX_3445
    index: 0x45
    text: |-
      Ἐν κακῷ τόπῳ εἶ
      ἐὰν θέλῃς μεμψι-
      μοιρῆσαι περὶ
      ἐπιθέσεως ὑπὸ
      Ζώρα τοῦ
      ποταμοῦ.

  - name: TX_3446
    index: 0x46
    text: |-
      Ἔστι μεγάλη
      \col(3)βιβλιοθήκη\col(0) πρὸς
      ἀνατολὰς τοῦ
      παλατίου τοῦ
      \col(3)Βασιλέως Ζώρα\col(0).

  - name: TX_3447
    index: 0x47
    text: |-
      Τὸ \col(3)Παλάτιον τοῦ
      Βασιλέως Ζώρα\col(0)
      ἐστὶ πέραν ὧδε.

  - name: TX_3448
    index: 0x48
    text: |-
      Αἱ θάλασσαι λάμ-
      πουσι καθαραί!
      Ὁ \col(3)Βασιλεὺς Ζώρα\col(0)
      χαρήσεται
      σφόδρα!

  - name: TX_3449
    index: 0x49
    text: |-
      Ὁ \col(3)Ἰαβου-Ἰαβοὺ\col(0)
      κατοικεῖ πέραν
      ὧδε. Λέγεται ὅτι
      λαβύρινθός ἐστιν
      ἐν τῇ κοιλίᾳ
      αὐτοῦ.

  - name: TX_344a
    index: 0x4a
    text: |-
      Δεῖ προσέχειν
      περὶ τὸν
      \col(3)Ἰαβου-Ἰαβού\col(0)!
      Δύναται καὶ
      καταπιεῖν ἡμᾶς!

  - name: TX_344b
    index: 0x4b
    text: |-
      Οὐκ ἔστι τις ᾧ
      δυνάμεθα
      πιστεῦσαι
      τὸ σύμβολον
      ἡρωϊ-
      σμοῦ τῶν Ζώρα;
      Τὸ σύμβολον--
      ἡ \col(1)Λεπὶς τῶν
      Ζώρα\col(0)--
      ἰσχυρὸν
      θαλάσσιον
      φυλακτόν
      ἐστιν...

  - name: TX_344c
    index: 0x4c
    text: |-
      \Link! Ἥρως
      τῶν Ζώρα!

  - name: TX_344d
    index: 0x4d
    text: |-
      Οὐ πολλαὶ
      γοργόνες
      ἐπισκέπτονται
      ἡμᾶς! Αὕτη ἐστὶν
      ἡ \col(3)Κώμη τῶν Ζώρα\col(0)!

  - name: TX_344e
    index: 0x4e
    text: |-
      Καλῶς ἦλθες, νέα
      γοργών! Αὕτη
      ἐστὶν
      ἡ \col(3)Κώμη τῶν Ζώρα\col(0)!

- group: 0x35
  data:
  - name: TX_3500
    index: 0x00
    text: |-
      Δύνασαι φυτεῦσαι
      \col(1)Σπέρμα Γασά\col(0).
        \opt()Φύτευσον \opt()Μή

  - name: TX_3501
    index: 0x01
    text: |-
      Ἔλαβες \col(1)Κάρυον
      Γασά\col(0)! Ἴδε τί
      ἐστιν ἐντός!

  - name: TX_3502
    index: 0x02
    text: |-
      ἐντός!

  - name: TX_3503
    index: 0x03
    text: |-
      Ἐντὸς ἦν \heartpiece
      \col(1)Κλάσμα Καρδίας\col(0)!
      Ἴδε αὐτὸ ἐν τῷ
      Καταλόγῳ.

  - name: TX_3504
    index: 0x04
    text: |-
      \col(1)Δακτύλιος\col(0) ἦν
      \jump(TX_3502)
    null_terminator: False

  - name: TX_3505
    index: 0x05
    text: |-
      \col(1)Φάρμακον\col(0) ἦν
      \jump(TX_3502)
    null_terminator: False

  - name: TX_3506
    index: 0x06
    text: |-
      \col(1)200 Δραχμαὶ\col(0) ἦσαν
      \jump(TX_3502)
    null_terminator: False

  - name: TX_3507
    index: 0x07
    text: |-
      \col(1)5 καρδίαι\col(0) ἦσαν
      \jump(TX_3502)
    null_terminator: False

  - name: TX_3508
    index: 0x08
    text: |-
      \col(1)Νύμφη\col(0) ἦν
      \jump(TX_3502)
    null_terminator: False

  - name: TX_3509
    index: 0x09
    text: |-
      Ἡ μαλακὴ γῆ αὕτη
      ἀγαθή ἐστι πρὸς
      φύτευσιν
      \col(1)σπερμάτων\col(0).

- group: 0x36
  data:
  - name: TX_3600
    index: 0x00
    text: |-
      Τὸ πλεῖν τὰς
      θαλάσσας ὄνειρός
      ἐστι παντὸς
      ἀνδρός!\stop
      Μέγα ἦν τὸ
      πλεῦσαι
      γενναίως πρὸς
      τοὺς
      ὀνείρους μου...
      \call(TX_3602)

  - name: TX_3601
    index: 0x01
    text: |-
      Ὦ οὗτος! Πολὺς
      χρόνος παρῆλθεν!
      Οὐκ ἤλπιζον
      εὑρεῖν
      σε ἐνθάδε!
      Ἐπανήλθομεν ἐκ
      τοῦ \col(3)Ὁλόδρουμ\col(0)...
      \call(TX_3602)

  - name: TX_3602
    index: 0x02
    text: |-
      Ἀλλ' ἐνεπλάκημεν
      ἐν τῇ \col(3)Θαλάσσῃ
      τῶν
      Καταιγίδων\col(0) καὶ
      οὐ
      δυνάμεθα
      ἐξελθεῖν!
      Χάρ! Ἔχεις τὸ
      φυλακτὸν τῆς
      \col(1)Λεπίδος τῶν
      Ζώρα\col(0)!
      Ναί, τοῦτο κατα-
      πραΰνει τὴν
      \col(3)Θάλασ-
      σαν Καταιγίδων\col(0)!
      Τί λέγεις;
      Δώσεις
      μοι ἐκείνην τὴν
      \col(1)Λεπίδα τῶν Ζώρα\col(0);
        \opt()Εἶεν
      \opt()Σύγγνωθι

  - name: TX_3603
    index: 0x03
    text: |-
      Εὐχαριστῶ!
      Ἀγαθὸς ἀνὴρ εἶ!
      Ὦ ναῦται!

  - name: TX_3604
    index: 0x04
    text: |-
      \call(TX_3603)
      Πλέομεν εἰς τὸ
      \col(3)Ὁλόδρουμ\col(0), τὴν
      γῆν τῶν καιρῶν!

  - name: TX_3605
    index: 0x05
    text: |-
      \call(TX_3603)
      Ἴδε τὸ πνεῦμα
      τοῦ θαλασσοπόρου
      ἀνδρός!

  - name: TX_3606
    index: 0x06
    text: |-
      Εὐχαριστῶ! Νῦν
      δυνάμεθα φυγεῖν!
      Λάβε τοῦτο εἰς
      ἔνδειξιν
      χάριτος!
      Ἔστι τὸ
      κειμήλιον
      τὸ καλούμενον
      \col(1)Ὀφθαλμὸς Τοκάι\col(0)!
      Λέγεται ὅτι
      ἀνοίγει
      τὴν ὁδὸν πρὸς
      τὸν
      \col(3)ἀρχαῖον τάφον\col(0).
      Οὐκ οἶδα δὲ εἰ
      ἀληθές ἐστιν ἢ
      οὔ.

  - name: TX_3607
    index: 0x07
    text: |-
      Ναί, ναί, κύριε!

  - name: TX_3608
    index: 0x08
    text: |-
      Πόσον χρόνον
      πλανώμεθα;

  - name: TX_3609
    index: 0x09
    text: |-
      Ὁ \col(3)Ναύαρχος\col(0) οὐδὲν
      σκέπτεται.

  - name: TX_360a
    index: 0x0a
    text: |-
      Μῦθοι λέγουσι
      περὶ
      γιγαντιαίων
      ἐρει-
      πίων ἀνατολικῶς
      ἐν
      τῇ \col(3)Θαλάσσῃ τῆς
      Ἀνοστίας\col(0).

  - name: TX_360b
    index: 0x0b
    text: |-
      Ἐὰν ὑπάγῃς εἰς
      τὰ
      ἐρείπια ἀνατολι-
      κῶς, οὐδέποτε
      ἐπιστρέψεις.

  - name: TX_360c
    index: 0x0c
    text: |-
      Ὄντως ἐβοήθησας
      ἡμῖν. Ναί,
      εὕρομεν
      τὸν \col(1)Ὀφθαλμὸν
      Τοκάι\col(0)
      ἐν τῇ \col(3)Μηνοειδεῖ
      Νήσῳ\col(0). Ἴσως δεῖ
      σε
      πλεῦσαι ἐκεῖσε;\stop
      Ἀναγόμεθα νῦν!
      Ὦ ναῦται!\stop
      Ναί, ναί, κύριε!

  - name: TX_360d
    index: 0x0d
    text: |-
      Ἡ κόγχη τοῦ
      ὀφθαλ-
      μοῦ κοίλη ἐστίν,
      ἀλλὰ τί ἁρμόζει
      ἐκεῖ..;

- group: 0x37
  data:
  - name: TX_3700
    index: 0x00
    text: |-
      Εἰμὶ ὁ \col(3)Πλέν\col(0), ὁ
      δήμαρχος ὧδε ἐν
      τῇ \col(3)Πόλει Λύννης\col(0).\stop
      Χρειάζῃ μου διὰ
      τί;
        \opt()Ναί \opt()Οὔ

  - name: TX_3701
    index: 0x01
    text: |-
      Νοῶ...

  - name: TX_3702
    index: 0x02
    text: |-
      Ἔστι παρὰ τοῦ
      ξένως
      ἐνδεδυμένου
      ὁδοιπόρου.
      Εὐχαριστῶ διὰ
      τὴν
      καλοσύνην σου.
      Δέξαι δὴ τοῦτο.

  - name: TX_3703
    index: 0x03
    text: |-
      Τί ἐστι τοῦτο;

  - name:
    - TX_3704
    - TX_3705
    - TX_3706
    - TX_3707
    - TX_3708
    - TX_3709
    - TX_370a
    - TX_370b
    - TX_370c
    - TX_370d
    - TX_370e
    - TX_370f
    index:
    - 0x04
    - 0x05
    - 0x06
    - 0x07
    - 0x08
    - 0x09
    - 0x0a
    - 0x0b
    - 0x0c
    - 0x0d
    - 0x0e
    - 0x0f
    text: |-
      Μνήσθητι--χρῄζει
      ἐκτιμήσεως.

  - name: TX_3710
    index: 0x10
    text: |-
      Εἰμὶ ὁ \col(3)Ἀδλάρ\col(0).\stop
      Ἐπὶ πεντήκοντα
      ἔτη ἤμην σύμβου-
      λος τοῦ
      παλατίου,
      ἀλλ' ἐξεβλήθην
      καὶ νῦν
      ἀπεχώρησα.
      Οἶδα τὴν
      Βασίλισ-
      σαν ἐκ νεότητος.
      Πάντοτε εἶχε τὸν
      λαὸν πρῶτον ἐν
      τῇ
      καρδίᾳ αὐτῆς.
      Ἀλλ' ἀφ' οὗ ἐδέ-
      ξατο τὴν κόρην
      \col(3)Ναϋροῦ\col(0), ἤλλαξε
      παντελῶς...
      Ἔπαυσεν ἀκούειν
      τῶν βουλῶν
      μου...
      Ἡ κόρη ἐκείνη
      προέτεινε τὴν
      ἐξορίαν μου,
      ἀλλ'...

  - name: TX_3711
    index: 0x11
    text: |-
      Τίς ἐστιν αὕτη ἡ
      \col(3)Ναϋροῦ\col(0)..;\stop
      Βλέπω αὐτὴν
      μόνον
      ὡς τέρας ἐν
      ἀνθρωπίνῃ μορφῇ.\stop
      Ἀρά γε καλῶς
      ἔχει
      ἡ Βασίλισσα...

  - name: TX_3712
    index: 0x12
    text: |-
      Ἐνόμιζον ὅτι ἡ
      \col(3)Ναϋροῦ\col(0) ἔφυγεν,
      ἀλλὰ νῦν τι
      κακὸν
      ἔχει ἡ
      Βασίλισσα.
      Δίδωσί μοι τὴν
      αὐτὴν πονηρὰν
      αἴσθησιν ἣν
      εἶχεν
      ἡ \col(3)Ναϋροῦ\col(0).
      Ὡς εἰ ἡ
      Βασίλισσά
      ἐστι νῦν τὸ
      θηρίον
      ἐν μορφῇ
      ἀνθρώπου...\stop
      Ἐλπίζω τὴν Βασί-
      λισσαν καλῶς
      ἔχειν.

  - name: TX_3713
    index: 0x13
    text: |-
      Ἡ Βασίλισσα ἐπα-
      νῆλθεν εἰς τὸν
      ἀγαθὸν ἑαυτόν
      της.
      Καλὸν τοῦτο,
      ἀλλὰ
      λέγει ὅτι
      πορεύε-
      ται εἰς
      ὁδοιπορίαν
      ἀνὰ ξένας χώρας.\stop
      ...Ἐλπίζω αὐτὴν
      καλῶς ἔχειν...

  - name: TX_3714
    index: 0x14
    text: |-
      Εἰμὶ ὁ \col(3)Πλέν\col(0), ὁ
      δήμαρχος ὧδε ἐν
      τῇ \col(3)Πόλει Λύννης\col(0).\stop
      Ἡ \col(3)Λύννα\col(0) ἔχει μα-
      κρὰν ἱστορίαν
      ἑκατοντάδων
      ἐτῶν.
      Τότε ἦν ἡ \col(3)Κώμη
      Λύννης\col(0)--οὐ
      πόλις.

  - name: TX_3715
    index: 0x15
    text: |-
      Εἰμὶ ὁ \col(3)Πλέν\col(0), ὁ
      δήμαρχος ὧδε ἐν
      τῇ \col(3)Πόλει Λύννης\col(0).\stop
      Πάλαι, ἡ
      \col(3)Βασίλισσα
      Ἄμβι\col(0), ἡ ἄρχουσα
      τῶνδε τῶν χωρῶν,
      αἰφνιδίως
      ἤλλαξεν
      εἰς σκληρὰν καὶ
      ἄσπλαγχνον.
      Τὰ χρονικὰ
      λέγου-
      σιν ὅτι συνέβη
      ἐπεὶ κόρη ὑπηρε-
      τοῦσα αὐτῇ
      ἡρπάγη
      ὑπό τινος.\stop
      Ἀπορῶ... Τί
      ὄντως
      συνέβη;

  - name: TX_3716
    index: 0x16
    text: |-
      Ἔα; Φαίνεται ὅτι
      ἡ Βασίλισσα οὐκ
      ἐπανῆλθεν εἰς τὸ
      παλάτιον. Ἴσως
      τι
      συνέβη ἐν τῷ
      πύργῳ.

- group: 0x38
  data:
  - name: TX_3800
    index: 0x00
    text: |-
      Τί γίγνεται;
      Ὁ υἱωνός μου
      ἀπελιθώθη!
      Πῶς;;; Διὰ τί;;;
      Ἔγερθητι!
      Κάλεσόν
      με Μάμμην
      πάλιν...

  - name: TX_3801
    index: 0x01
    text: |-
      Τὸ βλέπειν τὸν
      υἱωνόν μου ὑγιᾶ
      τηρεῖ κἀμὲ ὑγιᾶ!

- group: 0x39
  data:
  - name: TX_3900
    index: 0x00
    text: |-
      Φέρε πάντα πρός
      με.

  - name: TX_3901
    index: 0x01
    text: |-
      Ἡ καλὴ ἄμυνα
      κρα-
      τίστη ἐπίθεσίς
      ἐστι κατ'
      ἀκανθῶν.

  - name: TX_3902
    index: 0x02
    text: |-
      Ὁδοὶ ἀνοίγονται
      ὅταν ἀρχαῖοι
      λόγοι
      κατανοηθῶσιν.

  - name: TX_3903
    index: 0x03
    text: |-
      Τῇ κυανῇ πτέρυγι
      πέτα ὑπὲρ τὰ
      χρωματιστὰ ὕψη.

  - name:
    - TX_3904
    - TX_3905
    index:
    - 0x04
    - 0x05
    text: |-
      Ἡ ῥοὴ τοῦ χρόνου
      ἀλλάσσει τὴν
      γῆν.

  - name: TX_3906
    index: 0x06
    text: |-
      Μὴ ἐπιλάθῃ
      θρέψαι
      με Σπέρμασι
      Μυστηρίου.

  - name: TX_3907
    index: 0x07
    text: |-
      Τὸ ἐρυθρὸν
      πρόσω-
      πον φοβεῖται
      καπνόν.

  - name: TX_3908
    index: 0x08
    text: |-
      Αἱ ὀσμαὶ
      θέλγουσι
      τὰ ἄγρια θηρία.

  - name: TX_3909
    index: 0x09
    text: |-
      Φυλάσσου τὰ
      βαθέα
      ὕδατα.

  - name: TX_390a
    index: 0x0a
    text: |-
      Ἄνοιξον τὰ ὦτά
      σου
      εἰς τὸν ἦχον
      ξίφους
      ἐπὶ τοῦ τοίχου.

  - name: TX_390b
    index: 0x0b
    text: |-
      Δοκίμασον τὴν
      τύχην σου.

  - name: TX_390c
    index: 0x0c
    text: |-
      Λίθινοι
      στρατιῶται
      οὐ φοβοῦνται
      ξίφη.

  - name: TX_390d
    index: 0x0d
    text: |-
      Οἱ τέσσαρες κρύ-
      σταλλοι
      συνδέουσι
      τὰ πάντα.

  - name: TX_390e
    index: 0x0e
    text: |-
      Ἡ ἀλήθεια βλέπει
      τὰ νῶτά σου.

  - name: TX_390f
    index: 0x0f
    text: |-
      Μεῖζον τάχος
      δίδωσι
      μεῖζον διάστημα.

  - name: TX_3910
    index: 0x10
    text: |-
      Ἡ ἐσωτερικὴ ῥοὴ
      πλημμυρεῖ τῷ
      κυανῷ
      καὶ ὑποχωρεῖ
      ἐρυθρῷ.

  - name: TX_3911
    index: 0x11
    text: |-
      Τὸ χρῶμα
      δεικνύει
      τὴν ἀσθένειαν.

  - name: TX_3912
    index: 0x12
    text: |-
      Ἡ Χρυσῆ Νῆσός
      ἐστιν
      ἐπὶ τοῦ ὕδατος.

  - name:
    - TX_3913
    - TX_3914
    - TX_3915
    - TX_3916
    - TX_3917
    - TX_3918
    - TX_3919
    - TX_391a
    - TX_391b
    - TX_391c
    - TX_391d
    index:
    - 0x13
    - 0x14
    - 0x15
    - 0x16
    - 0x17
    - 0x18
    - 0x19
    - 0x1a
    - 0x1b
    - 0x1c
    - 0x1d
    text: |-
      Ὁ θρῦλος τῆς
      γορ-
      γόνος παρεδόθη
      ἐκ
      τοῦ παρελθόντος
      εἰς τὸ παρόν.

- group: 0x3d
  data:
  - name:
    - TX_3d00
    - TX_3d01
    - TX_3d02
    - TX_3d03
    - TX_3d04
    - TX_3d05
    - TX_3d0d
    index:
    - 0x00
    - 0x01
    - 0x02
    - 0x03
    - 0x04
    - 0x05
    - 0x0d
    text: |-
      \pos(2)Ααχ... \Link!\stop
      ...Ἐτελέσθη.
      Εὐχαριστῶ σοι,
      \Link.
      Ἔπαυσας τὴν
      τέλεσιν τῶν
      τελετῶν αἳ
      ἔμελλον
      ἀναστῆσαι
      \col(3)Γάνωνα\col(0)!\stop
      Ἐπεὶ οὐκ
      ἠδυνήθη-
      σαν θυσιάσαι με
      ἐν τῇ ἐσχάτῃ
      τελε-
      τῇ, αἱ δυνάμεις
      τοῦ σκότους ἀνέ-
      στησαν μόνον
      ἄνουν,
      αινόμενον
      \col(3)Γάνωνα\col(0).\stop
      Ἡ δύναμις, ἡ
      σοφία
      καὶ τὸ θάρρος
      σου
      ἐκώλυσαν τὴν ὑπὸ
      τῆς \col(3)Τουινρόβας\col(0)
      σχεδιασθεῖσαν
      ἀνάστασιν τοῦ
      \col(3)Γάνονος\col(0).\stop
      Νῦν ἐλπὶς καὶ
      εἰρήνη ἐπιστρέ-
      φουσιν εἰς τὰς
      καρδίας τοῦ
      λαοῦ.
      Εὐχαριστῶ!
      Ἀληθὴς
      ἥρως εἶ!
      Ἐπιστρέ-
      ψωμεν πρὸς τοὺς
      ἄλλους!

  - name:
    - TX_3d06
    - TX_3d07
    - TX_3d08
    - TX_3d10
    - TX_3d11
    - TX_3d12
    - TX_3d14
    - TX_3d15
    index:
    - 0x06
    - 0x07
    - 0x08
    - 0x10
    - 0x11
    - 0x12
    - 0x14
    - 0x15
    text: |-
      \pos(0)\col(3)Ζέλδα\col(0)! Χαίρω
      βλέπων σε
      ἐπιστρέ-
      φουσαν
      ἀσφαλῶς...
      \Link!
      Εἶ πᾶν ὅπερ
      ἤλπι-
      ζον! Πάντοτε
      ἐπίστευον εἰς
      σέ!

  - name:
    - TX_3d09
    - TX_3d13
    index:
    - 0x09
    - 0x13
    text: |-
      \pos(0)ᾔδειν ὅτι
      εὑρήσεις
      τρόπον, \Link!\stop
      Χορεύσωμεν ὁμοῦ
      πάλιν!

  - name:
    - TX_3d0a
    - TX_3d0b
    index:
    - 0x0a
    - 0x0b
    text: |-
      \pos(0)Καλῶς ἐπανῆλθες,
      \col(3)Ζέλδα\col(0), καὶ σύ,
      \Link.\stop
      Πάντα ἐτελέσθη,
      οὐχί;

  - name:
    - TX_3d0c
    - TX_3d16
    index:
    - 0x0c
    - 0x16
    text: |-
      \pos(0)\Link...\stop
      Τὰ τρία \sym(0x57) ἐπὶ
      τῆς ἀριστερᾶς
      σου
      χειρὸς
      συμβολίζου-
      σι δύναμιν,
      σοφίαν
      καὶ
      θάρρος--ταῦτά
      ἐστι τὸ σημεῖον
      τοῦ ἥρωος τοῦ
      πεπρωμένου
      φανῆναι
      ὅταν ἡ εἰρήνη
      καταρρέῃ ἐν
      \col(3)Ὑρούλ\col(0).\stop
      Μετὰ τῶν \col(1)Οὐσιῶν
      τῆς Φύσεως καὶ
      τοῦ Χρόνου\col(0)\stop
      καὶ τοῦ θάρρους
      σου, ἀπώθησας
      τὰς
      δυνάμεις τοῦ
      κακοῦ!
      Ἡ ὁδηγία τοῦ
      Τρι-
      δυνάμου ἐποίησέ
      σε
      τὸν θρυλικὸν
      ἥρωα!
      Εὐχαριστῶ σοι,
      \Link.

  - name: TX_3d0e
    index: 0x0e
    text: |-
      \pos(2)Ὤ, οὔ!!!\stop
      Τὸ κάστρον
      καταρ-
      ρέει νῦν ὅτε αἱ
      δυνάμεις τῆς
      σκιᾶς
      φθίνουσιν!\stop
      Δεῖ ἡμᾶς
      ἐξελθεῖν
      ἐντεῦθεν!

  - name: TX_3d0f
    index: 0x0f
    text: |-
      \pos(2)! ! !
      Τί ποιήσομεν..;

- group: 0x41
  data:
  - name: TX_4100
    index: 0x00
    text: |-
      \pos(2)Ἄφες με
      ἀναπαῦσαι
      τὸν κάματόν σου.
      Κλεῖσον τὰ
      ὄμματα...

  - name:
    - TX_4101
    - TX_4102
    - TX_4103
    - TX_4104
    - TX_4105
    index:
    - 0x01
    - 0x02
    - 0x03
    - 0x04
    - 0x05
    text: |-
      \pos(2)Ἐλθὲ πρός με
      ὁσάκις ὁ ἆθλός
      σου σὲ
      καταπονεῖ.

  - name: TX_4106
    index: 0x06
    text: |-
      Ἄκουσον δή, νέε!
      Ἴσως οὐ
      πιστεύσεις
      τοῦτο, ἀλλ' εἰμὶ
      ἡ
      \col(3)Βασίλισσα
      Νυμφῶν\col(0),
      φύλαξ τῆσδε τῆς
      θαλάσσης! Ἡ
      κατάρα
      τῆς πονηρᾶς
      \col(3)Βεράν\col(0)
      μὲ ἐποίησε
      φανῆναι
      οὕτως!
      Ἡ μαγεία τῆς
      \col(1)Κόνεως Νυμφῶν\col(0)
      δύναται ἀποκατα-
      στῆσαί με.\stop
      Ἡ \col(3)Βερὰν\col(0) ἐδηλητη-
      ρίασε τὴν θάλασ-
      σαν. Ταχέως
      πάντα
      τὰ ζῶντα ἐν αὐτῇ
      ἀπολοῦνται!\n
    null_terminator: False

  - name: TX_4107
    index: 0x07
    text: |-
      Ὕπαγε δὴ καὶ
      εὑρὲ
      \col(1)Κόνιν Νυμφῶν\col(0)!

  - name: TX_4108
    index: 0x08
    text: |-
      Ἤνεγκάς μοι
      \col(1)Κόνιν Νυμφῶν\col(0)!
      Νῦν δύναμαι ἐπα-
      νελθεῖν εἰς τὸ
      κανονικόν!
      Ῥάντισον
      τὴν \col(1)κόνιν\col(0) ἐπ'
      ἐμέ!

  - name: TX_4109
    index: 0x09
    text: |-
      Εὐχαριστῶ σοι,
      νέε!\stop
      Νῦν δύναμαι
      καθα-
      ρίσαι τὰς
      θαλάσσας
      ἀπὸ τοῦ κακοῦ!

- group: 0x42
  data:
  - name: TX_4200
    index: 0x00
    text: |-
      Ἐ... Ἐγὼ
      καλοῦμαι
      \col(3)\Child\col(0)...\stop
      ! ! ! ! ! !
      Ὤ! Ἐλάλησα ξένῳ!

  - name: TX_4201
    index: 0x01
    text: |-
      Σὺ εἶ ὁ \Link;\stop
      Εἰμὶ ὁ \col(3)\Child\col(0)!
      Ἀδύνατον!

  - name: TX_4202
    index: 0x02
    text: |-
      Ἰσχυρὸς εἶ;
        \opt()Ναί \opt()Οὔ

  - name: TX_4203
    index: 0x03
    text: |-
      Ἔσομαι ἰσχυρὸς
      κἀγώ, ἵνα
      φυλάσσω
      τὴν μητέρα καὶ
      τὸν πατέρα μου!

  - name: TX_4204
    index: 0x04
    text: |-
      Ἔα;;;
      Καὶ οὐ μέλει
      σοι;!;

  - name: TX_4205
    index: 0x05
    text: |-
      Ἀνυπομονῶ γενέ-
      σθαι ἀνήρ.

- group: 0x43
  data:
  - name: TX_4300
    index: 0x00
    text: |-
      Εἰμὶ ὁ \col(3)Βιπίν\col(0), ὁ
      ἔμπειρος δενδρο-
      κόμος! Οἶδα
      πολλὰ
      περὶ δένδρων.
      Ἄκουσον δή τι!\stop
      Ἡ \col(3)Βλόσσομ\col(0) κἀγὼ
      ἀρτίως ἐσχήκαμεν
      τὸ πρῶτον
      τέκνον!
      Ναί! Ὄντως!!!\stop
      Ἴδε!

  - name: TX_4301
    index: 0x01
    text: |-
      Ἄρα τὸ ὄνομα
      ἐκρίθη!
      \col(3)\Child\col(0), ἕ;
      Καλὸν ὄνομα!
      Ἐλπίζω αὐτὸν
      αὐξηθῆναι εἰς
      ἀγαθὸν παῖδα!

  - name: TX_4302
    index: 0x02
    text: |-
      Ὦ \Link!\stop
      Ὁ παῖς μου
      νοσεῖ,
      ἀλλ' ὅμως ἔχω τι
      διδάξαι σε.

  - name: TX_4303
    index: 0x03
    text: |-
      Ὁ παῖς μου
      ὑγιαίνει,
      ὥστε ἀναπαύομαι!
      Σήμερον ἔχω
      πλείο-
      να διδάξαι!

  - name: TX_4304
    index: 0x04
    text: |-
      Ὦ \Link!
      Ὁ \col(3)\Child\col(0) αὐξάνει
      καθ' ἡμέραν, καὶ
      σήμερον ἔχω
      πλείο-
      να διδάξαι!

  - name: TX_4305
    index: 0x05
    text: |-
      \Link! Πολὺς
      χρόνος παρῆλθεν!
      Μετῴκησα εἰς
      τήνδε
      τὴν πόλιν κἀγώ.
      Χαίρω βλέπων
      γνωστὸν
      πρόσωπον!

  - name: TX_4306
    index: 0x06
    text: |-
      Ὦ \Link!
      Ὁ \col(3)\Child\col(0) καλῶς
      ἔχει!
      Καὶ δύναμαι
      διδά-
      ξαι σε πάντα
      περὶ
      δένδρων!

  - name: TX_4307
    index: 0x07
    text: |-
      Ὦ \Link!\stop
      Ὁ \col(3)\Child\col(0) ηὐξήθη
      καὶ ἀπῆλθε
      μόνος!\n
    null_terminator: False

  - name: TX_4308
    index: 0x08
    text: |-
      Διδάξω σε πάντα
      περὶ δένδρων!

  - name: TX_4309
    index: 0x09
    text: |-
      Τὸ περιεχόμενον
      \col(1)Καρύου Γασὰ\col(0)
      ἐξαρ-
      τᾶται ἐκ τοῦ ποῦ
      ἐφυτεύθη τὸ
      \col(1)σπέρμα\col(0).
      Ἐὰν εὕρῃς καλὸν
      τόπον, εἰπέ μοι!

  - name: TX_430a
    index: 0x0a
    text: |-
      Ἐντὸς \col(1)Καρύου
      Γασά\col(0); Πρὸ πάντων
      εὑρίσκεις
      \col(1)Μαγικοὺς
      Δακτυλίους\col(0), ἀλλ'
      ἐνίοτε εὑρίσκεις
      Δραχμὰς ἢ
      καρδίας.

  - name: TX_430b
    index: 0x0b
    text: |-
      Ἤκουσα ὅτι τὸ
      περιεχόμενον τοῦ
      \col(1)καρύου\col(0) ἐξαρτᾶται
      ἐκ τῶν πράξεων
      τοῦ
      φυτεύσαντος. Ὅσῳ
      πλέον ὁδοιπορεῖ
      καὶ θηρία
      φονεύει,
      τοσούτῳ κρεῖττον
      ἔσται τὸ κάρυον!

  - name: TX_430c
    index: 0x0c
    text: |-
      Τὸ εὑρίσκειν
      νέους
      τόπους πρὸς
      φύτευ-
      σιν \col(1)Σπερμάτων
      Γασὰ\col(0)
      καὶ κρυφίας
      κλίμα-
      κας ὠφελεῖ τὰ
      \col(1)Κάρυα Γασά\col(0).

  - name: TX_430d
    index: 0x0d
    text: |-
      Καὶ τὸ βοηθεῖν
      τοῖς ἐν ἀνάγκῃ
      ἀγαθόν ἐστι διὰ
      τὰ
      \col(1)Κάρυα Γασά\col(0).

  - name: TX_430e
    index: 0x0e
    text: |-
      Τὸ εὑρίσκειν
      τόπους
      διὰ \col(1)Σπέρματα
      Γασὰ\col(0)
      χαλεπόν ἐστιν.
      Σκάπτε λάκκους,
      κίνει πέτρας.

  - name: TX_430f
    index: 0x0f
    text: |-
      Ἡ πεῖρά μου
      λέγει
      ὅτι τὸ φυτεύειν
      \col(1)Σπέρματα Γασὰ\col(0) ἐν
      παραδόξοις
      τόποις
      φέρει σπανιώτερα
      ἀποτελέσματα!

  - name: TX_4310
    index: 0x10
    text: |-
      Ὁδοιπόρος τις
      εἶπέ
      μοι ποτὲ ὅτι ὁ
      χρόνος
      ὡριμάνσεως
      φυτευθέντος
      \col(1)Σπέρ-
      ματος Γασὰ\col(0) εἰς
      δένδρον
      συνδέεται
      πρὸς τὸ πόσα
      τέρα-
      τα φονεύεις.
      Ἀληθές;

  - name: TX_4311
    index: 0x11
    text: |-
      Κατάρατα
      \col(1)Σπέρματα
      Γασά\col(0)!
      Βλαστάνουσι!
      Αὐξάνουσι!
      Ποιοῦσι
      \col(1)κάρυα\col(0)!
      Καὶ πάντα τὰ νέα
      \col(1)κάρυα\col(0) ἔχουσι
      διά-
      φορα ἐντός! Χά!
      Ἀπάλλαξόν με ἀπ'
      αὐτῶν!

  - name: TX_4312
    index: 0x12
    text: |-
      Οἶδα ὅτι ἔστι
      χοῦς
      παρὰ τὸν οἶκόν
      μου,
      ἀλλὰ μὴ φύτευε
      \col(1)σπέρματα\col(0) ἐκεῖ!

  - name: TX_4313
    index: 0x13
    text: |-
      Ἔα; Τὸ ὄνομά
      μου;
      Ἔστι \col(3)Πιππίν\col(0)!
      Μὴ ἐπιλάθῃ αὐτό!

- group: 0x44
  data:
  - name: TX_4400
    index: 0x00
    text: |-
      Εἰμὶ ἡ \col(3)Βλόσσομ\col(0).\stop
      Τοῦτό ἐστι τὸ
      πρῶ-
      τόν μου τέκνον--
      ὑγιὲς ἄρρεν
      βρέφος!
      Ἀλλὰ
      δυσκολεύομαι
      ἑλέσθαι ὄνομα.
      Δύνασαι βοηθῆσαί
      μοι; Πῶς ἂν ἐκά-
      λεις αὐτόν;

  - name:
    - TX_4401
    - TX_4402
    - TX_4403
    - TX_4404
    - TX_4405
    - TX_4406
    - TX_4407
    index:
    - 0x01
    - 0x02
    - 0x03
    - 0x04
    - 0x05
    - 0x06
    - 0x07
    text: |-
      Θέλεις ὀνομάσαι
      αὐτὸν \col(3)\Child\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_4408
    index: 0x08
    text: |-
      Καλὸν ὄνομα!
      Οὕτως καλέσω
      αὐτόν!
      Φαίνεται χαίρων
      ἐπ' αὐτῷ.
      Ἐπισκέπτου ἡμᾶς
      ὁποτεδήποτε.

  - name: TX_4409
    index: 0x09
    text: |-
      Ἐλπίζω ὁ \col(3)\Child\col(0)
      αὐξηθῆναι
      ἰσχυρὸς
      καὶ ὑγιής, ὡς
      σύ.

  - name: TX_440a
    index: 0x0a
    text: |-
      Ναί, ἴσως δεῖ σε
      σκεφθῆναι πλέον.

  - name: TX_440b
    index: 0x0b
    text: |-
      Ὁ \col(3)\Child\col(0) φαίνεται
      ὀλίγον
      παράδοξος.\stop
      Θέλω ἀγαγεῖν
      αὐτὸν
      πρὸς ἰατρόν,
      ἀλλ'
      οὐκ ἔχομεν
      Δραχμάς.
      Δύνασαι δανεῖσαι
      ἡμῖν ὀλίγας;
        \opt()Ναί \opt()Οὔ

  - name: TX_440c
    index: 0x0c
    text: |-
      Ὄντως; Πόσας
      δύνα-
      σαι δανεῖσαι
      ἡμῖν;
       \opt()150 \opt()50
       \opt()10  \opt()1

  - name: TX_440d
    index: 0x0d
    text: |-
      Εὐχαριστῶ σοι,
      \Link!
      Ἀληθὴς ἐλεήμων
      εἶ!

  - name: TX_440e
    index: 0x0e
    text: |-
      Εὐχαριστῶ.
      Τοῦτο ἀρκέσει.

  - name: TX_440f
    index: 0x0f
    text: |-
      Εὐχαριστῶ...
      Φροντίσω περὶ
      τῶν
      λοιπῶν...

  - name: TX_4410
    index: 0x10
    text: |-
      \Link! Οὐκ εἶ
      πλούσιος ἀνήρ. Ἡ
      συμπάθειά σου
      ἀρκεῖ.

  - name: TX_4411
    index: 0x11
    text: |-
      Κατανοῶ...

  - name: TX_4412
    index: 0x12
    text: |-
      Ὁ \col(3)\Child\col(0) ἀνέρρω-
      σεν! Εὐχαριστῶ!

  - name: TX_4413
    index: 0x13
    text: |-
      Τὸ βρέφος μου
      οὐ-
      δέποτε καθεύδει.
      Πῶς κοιμίσω
      αὐτόν,
      \Link;
        \opt()ᾆσον
        \opt()Παῖξον

  - name: TX_4414
    index: 0x14
    text: |-
      Φιλῶ τὸ ᾄδειν!
      Δοκιμάσω αὐτό!

  - name: TX_4415
    index: 0x15
    text: |-
      Νοῶ! Ἐὰν
      παίξωμεν,
      κοπιάσει.
      Εὐχαριστῶ!

  - name: TX_4416
    index: 0x16
    text: |-
      Τί λέγεις; Οὐκ
      ἔστι
      γλυκὺ βρέφος;

  - name: TX_4417
    index: 0x17
    text: |-
      Ἴδε! Ὁ \col(3)\Child\col(0)
      ηὐξήθη!

  - name: TX_4418
    index: 0x18
    text: |-
      \Link!
      Συναντώμεθα
      πάλιν!\stop
      Μέμνησαι ὅτι
      ὠνό-
      μασας τὸν υἱόν
      μου
      \col(3)\Child\col(0);
      Καλῶς ἔχει!

  - name: TX_4419
    index: 0x19
    text: |-
      Ὁ \col(3)\Child\col(0) ἐστὶ
      λίαν ζωηρός!\stop
      Ἦσθα ζωηρὸς
      παῖς,
      \Link;
        \opt()Ναί \opt()Οὔ

  - name: TX_441a
    index: 0x1a
    text: |-
      Ὁ \col(3)\Child\col(0) ἐστὶ
      λίαν
      συνεσταλμένος.\stop
      Ποταπὸς παῖς
      ἦσθα,
      \Link;\stop
      Δραστήριος;
        \opt()Ναί \opt()Οὔ

  - name: TX_441b
    index: 0x1b
    text: |-
      Ὁ \col(3)\Child\col(0) ἐστὶ
      λίαν
      φιλοπράγμων.\stop
      Ποταπὸς παῖς
      ἦσθα,
      \Link;\stop
      Δραστήριος;
        \opt()Ναί \opt()Οὔ

  - name: TX_441c
    index: 0x1c
    text: |-
      Ὤ; Στοιχηματίζω
      ὅτι ἦσθα ἄτακτος
      παῖς.

  - name: TX_441d
    index: 0x1d
    text: |-
      Ἥσυχος ἴσως;
        \opt()Ναί \opt()Οὔ

  - name: TX_441e
    index: 0x1e
    text: |-
      Ὄντως; Πάντως
      χαρίεις ἦσθα!

  - name: TX_441f
    index: 0x1f
    text: |-
      Ἦσθα παράδοξος;
        \opt()Ναί \opt()Οὔ

  - name: TX_4420
    index: 0x20
    text: |-
      Ἦσθα; Οὐδέποτε
      ἂν
      ἐμάντευον...

  - name: TX_4421
    index: 0x21
    text: |-
      Χαλεπόν ἐστιν
      εἰπεῖν ἐν ἑνὶ
      λόγῳ.

  - name: TX_4422
    index: 0x22
    text: |-
      Ὁ \col(3)\Child\col(0) ἐστὶ
      λίαν ζωηρός!

  - name: TX_4423
    index: 0x23
    text: |-
      Ὁ \col(3)\Child\col(0) ἐστὶ
      λίαν δειλός.

  - name: TX_4424
    index: 0x24
    text: |-
      Ὁ \col(3)\Child\col(0) παράδο-
      ξος παῖς ἐστιν,
      ἀλλ' ἔσται ἀνὴρ
      μεγάλων ἔργων!

  - name:
    - TX_4425
    - TX_4426
    index:
    - 0x25
    - 0x26
    text: |-
      \Link!\stop
      Μέμνησαι ὅτι
      ὠνό-
      μασας τὸν υἱόν
      μου
      \col(3)\Child\col(0);
      Ηὐξήθη εἰς καλὸν
      ἄνδρα!

  - name: TX_4427
    index: 0x27
    text: |-
      \Link!\stop
      Μέμνησαι ὅτι
      ὠνό-
      μασας τὸν υἱόν
      μου
      \col(3)\Child\col(0); Ἔστι
      δενδροκόμος
      κἀκεῖ-
      νος!

  - name: TX_4428
    index: 0x28
    text: |-
      \Link!\stop
      Μέμνησαι ὅτι
      ὠνό-
      μασας τὸν υἱόν
      μου
      \col(3)\Child\col(0);
      Ἔστιν ὀνομαστὸς
      μουσικὸς νῦν!

  - name: TX_4429
    index: 0x29
    text: |-
      Ὁ \col(3)\Child\col(0)...
      Ηὐξήθη, ἀλλ'
      ἀργῶς
      δαπανᾷ τὸν
      χρόνον.\stop
      Τί ποιήσω;

  - name: TX_442a
    index: 0x2a
    text: |-
      Ὁ \col(3)\Child\col(0), ὁ υἱός
      μου, ἤκουσε τὰ
      ἔργα σου καὶ νῦν
      πειρᾶται
      γενέσθαι
      ἥρως!

  - name: TX_442b
    index: 0x2b
    text: |-
      Ὁ παῖς ἐκεῖνος
      ἔχει μεγάλας
      ἐλπί-
      δας καὶ
      ὀνείρους!!!

  - name: TX_442c
    index: 0x2c
    text: |-
      Ὁ \col(3)\Child\col(0) εἶπεν
      ὅτι γράφει ᾠδὴν
      περὶ τῶν ἔργων
      σου!

  - name: TX_442d
    index: 0x2d
    text: |-
      Ὁ \col(3)\Child\col(0)...
      Ηὐξήθη, ἀλλ'
      ἀργῶς
      δαπανᾷ τὸν
      χρόνον.\stop
      Τί ποιήσω;

  - name: TX_442e
    index: 0x2e
    text: |-
      Ὁ υἱός μου μέγας
      ἥρως ἐστὶ νῦν.

  - name: TX_442f
    index: 0x2f
    text: |-
      Ὁ \col(3)\Child\col(0) ἠκολού-
      θησε τοῖς ἴχνεσι
      τοῦ \col(3)Βιπίν\col(0).
      Χαίρομεν σφόδρα!

  - name: TX_4430
    index: 0x30
    text: |-
      Ἤκουσας τὰς ᾠδὰς
      τοῦ \col(3)\Child\col(0); Εἰσὶ
      λίαν καλαί.

  - name: TX_4431
    index: 0x31
    text: |-
      Εὐχαριστῶ! Νῦν
      δύναμαι ἀγαγεῖν
      αὐτὸν πρὸς
      ἰατρόν.

  - name: TX_4432
    index: 0x32
    text: |-
      Φαίνεται ὅτι οὐκ
      ἔχεις ἀρκετὰς
      Δραχμάς.

- group: 0x45
  data:
  - name:
    - TX_4500
    - TX_4501
    - TX_4502
    - TX_4503
    - TX_4504
    - TX_4505
    index:
    - 0x00
    - 0x01
    - 0x02
    - 0x03
    - 0x04
    - 0x05
    text: |-
      \sfx(0xc6)Εὐχαριστῶ!

  - name: TX_4506
    index: 0x06
    text: |-
      \sfx(0xc6)Ὕπαγε λοιπόν!

  - name: TX_4507
    index: 0x07
    text: |-
      \sfx(0xc6)Οὐκ ἔχεις
      ἀρκετὰς
      Δραχμάς!

  - name: TX_4508
    index: 0x08
    text: |-
      \sfx(0xc6)Ἔχεις αὐτὸ ἤδη!

  - name:
    - TX_4509
    - TX_450a
    index:
    - 0x09
    - 0x0a
    text: |-
      \sfx(0xc6)Ἀγόρασόν τι!
      Ἀσπίδα ἀντὶ
      \num1 Δραχμῶν;
        \opt()Εἶεν \opt()Οὔ,
      εὐχαρ.

  - name:
    - TX_450b
    - TX_450c
    index:
    - 0x0b
    - 0x0c
    text: |-
      \sfx(0xc6)Χαῖρε!
      Ἰδοὺ εὐκαιρία!
      10 Σπέρματα
      Ἀνθρα-
      κιᾶς ἀντὶ 20
      Δραχ.!
        \opt()Εἶεν \opt()Οὔ,
      εὐχαρ.

  - name: TX_450d
    index: 0x0d
    text: |-
      \sfx(0xc6)Χαῖρε!
      Ἰδοὺ εὐκαιρία!
      10 Βόμβοι ἀντὶ
      30 Δραχμῶν!
        \opt()Εἶεν \opt()Οὔ,
      εὐχαρ.

- group: 0x46
  data:
  - name: TX_4600
    index: 0x00
    text: |-
      Ἐγώ, ὁ \col(3)\Child\col(0),
      γράφω ᾠδὴν πρὸς
      ἔπαινον τοῦ
      μεγά-
      λου ἥρωος,
      \Link!

  - name: TX_4601
    index: 0x01
    text: |-
      Ἡ ᾠδή μου σχεδὸν
      ἐτελέσθη!\stop
      Εἰπέ μοι, τί
      ἐστι
      σπουδαιότερον, ἡ
      ἀγάπη ἢ τὸ
      θάρρος;
        \opt()Ἀγάπη \opt()Θάρρος

  - name: TX_4602
    index: 0x02
    text: |-
      Ἡ ᾠδή μου σχεδὸν
      ἐτελέσθη!\stop
      Νομίζω ὅτι
      ἀρέσει
      σοι.

  - name: TX_4603
    index: 0x03
    text: |-
      Τέλος! Ἡ ᾠδή μου
      ἐτελέσθη νῦν!\stop
      Θέλεις ἀκοῦσαι;
        \opt()Ναί \opt()Οὔ

  - name: TX_4604
    index: 0x04
    text: |-
      Πῶς ἐφάνη σοι;

  - name: TX_4605
    index: 0x05
    text: |-
      Ὄντως..;
      Ἐλθὲ ἀκοῦσαι
      ὁποτεδήποτε!

- group: 0x47
  data:
  - name: TX_4700
    index: 0x00
    text: |-
      Καλοῦμαι \col(3)\Child\col(0).
      Λέγουσιν ὅτι
      ὠνο-
      μάσθην ὑπὸ
      μεγάλου
      ἀνδρός. Καλόν,
      οὐχί;

  - name: TX_4701
    index: 0x01
    text: |-
      Ποῦ ἦσθα, \Link;
      Μέμνησαί μου;\stop
      Εἰμὶ ὁ \col(3)\Child\col(0)!\stop
      Ἡ μήτηρ καὶ ὁ
      πατὴρ
      καλῶς ἔχουσιν!

  - name: TX_4702
    index: 0x02
    text: |-
      Ἔχεις φίλην;
        \opt()Ναί \opt()Οὔ

  - name: TX_4703
    index: 0x03
    text: |-
      ...Τῇ ἀληθείᾳ,
      κἀγὼ ἀγαπῶ τινα,
      ἀλλὰ μὴ εἴπῃς!

  - name: TX_4704
    index: 0x04
    text: |-
      ...Εἰκάζω ὅτι
      οὐκ
      εἶ ἕτοιμος.

  - name: TX_4705
    index: 0x05
    text: |-
      Ἀνυπομονῶ αὐξη-
      θῆναι!

- group: 0x48
  data:
  - name: TX_4800
    index: 0x00
    text: |-
      Ἐγώ, ὁ \col(3)\Child\col(0),
      ἀπεφάσισα
      βαδίσαι
      τὴν αὐτὴν
      δενδρό-
      φυτον ὁδὸν τῷ
      πατρί μου!

  - name: TX_4801
    index: 0x01
    text: |-
      Ποτὲ πληρώσω τὸν
      κόσμον τοῖς δέν-
      δροις μου!\stop
      Οἶδα! Δύνασαι
      βοη-
      θῆσαί μοι!
      Ἰδού!!!

  - name: TX_4802
    index: 0x02
    text: |-
      Τούτῳ δύνασαι
      αὐξῆ-
      σαι τὴν χλόην
      καὶ
      σύ!

  - name: TX_4803
    index: 0x03
    text: |-
      Ποτὲ πληρώσω τὸν
      κόσμον τοῖς δέν-
      δροις μου!

  - name: TX_4804
    index: 0x04
    text: |-
      Δύνασαι ἐρωτῆσαί
      με πᾶν περὶ δέν-
      δρων.

  - name:
    - TX_4805
    - TX_4806
    index:
    - 0x05
    - 0x06
    text: |-
      Οἱ πλεῖστοι
      ἐχθροὶ
      παύονται
      κινούμενοι
      ὅταν βάλῃς
      αὐτοὺς
      \col(1)Σπέρμασι
      Πηγάσου\col(0),
      ἀλλ' οὐχ οἱ
      ἰσχυροί.

  - name: TX_4807
    index: 0x07
    text: |-
      Τὰ \col(1)Σπέρματα
      Μυστη-
      ρίου\col(0) θαυμαστά
      ἐστι!\stop
      Ἀφαιροῦσι τὸν
      κε-
      ραυνὸν ἐκ τῶν
      ἠλε-
      κτρικῶν θηρίων.

  - name: TX_4808
    index: 0x08
    text: |-
      Δεῖ με σκάπτειν
      λάκκους διὰ
      δένδρα,
      ἀλλ' ἐνίοτε
      εὑρίσκω
      μεγάλας Δραχμάς!

  - name:
    - TX_4809
    - TX_480a
    index:
    - 0x09
    - 0x0a
    text: |-
      Ἤκουσας περὶ τῶν
      \col(1)Σπερμάτων
      Θυέλλης\col(0);\stop
      Συνήθως
      ἐγείρουσιν
      ἀνεμοστρόβιλον,
      ἀλλὰ δύνασαι καὶ
      ἐκφυσησαι
      ἐχθροὺς
      μακράν!

  - name: TX_480b
    index: 0x0b
    text: |-
      Τὰ πλεῖστα
      τέρατα
      παύονται
      κινούμενα
      ὅταν βάλῃς αὐτὰ
      \col(1)Σπέρμασι
      Πηγάσου\col(0),
      ἀλλ' οὐ τὰ
      ἰσχυρά.

  - name: TX_480c
    index: 0x0c
    text: |-
      Τὰ \col(1)Σπέρματα
      Μυστη-
      ρίου\col(0) θαυμαστά
      ἐστι!\stop
      Ἀφαιροῦσι τὸν
      κε-
      ραυνὸν ἐκ τῶν
      ἠλε-
      κτρικῶν θηρίων.

- group: 0x49
  data:
  - name: TX_4900
    index: 0x00
    text: |-
      Τὸ ὄνομά μου
      ἐστὶ
      \col(3)\Child\col(0).
      Οὐκ ἔστι
      θαυμάσιον;

  - name: TX_4901
    index: 0x01
    text: |-
      Ὤ! \Link!\stop
      Μέμνησαί μου;
      Εἰμὶ ὁ \col(3)\Child\col(0)!
      Εὖγε!
      Συναντώμεθα
      πάλιν!

  - name: TX_4902
    index: 0x02
    text: |-
      Τί ἐγένετο
      πρῶτον,
      ἡ ὄρνις ἢ τὸ
      ᾠόν;
        \opt()Ὄρνις \opt()Ὠιόν

  - name: TX_4903
    index: 0x03
    text: |-
      Χμμ...
      Τότε πῶς
      ἐξεκολά-
      φθη ἐκείνη ἡ
      ὄρνις;

  - name: TX_4904
    index: 0x04
    text: |-
      Χμμ...
      Τότε τίς ἔτεκεν
      ἐκεῖνο τὸ ᾠόν;

  - name: TX_4905
    index: 0x05
    text: |-
      Ἀνυπομονῶ αὐξη-
      θῆναι!

- group: 0x4a
  data:
  - name: TX_4a00
    index: 0x00
    text: |-
      Τὸ ὄνομά μου
      ἐστὶ
      \col(3)\Child\col(0).
      Ἀσκοῦμαι καθ'
      ἡμέ-
      ραν ἵνα γένωμαι
      ἥρως ὡς σύ,
      \Link!

  - name: TX_4a01
    index: 0x01
    text: |-
      Ποτὲ ὁδοιπορήσω
      τὰς χώρας καὶ
      σώσω
      τοὺς λαούς, ὡς ὁ
      ἥρως μου, \Link!\stop
      Δώσεις μοι οὖν
      συμβουλήν;\stop
      Τί ποιήσει με
      ἰσχυρότερον;
      Ἡ καθημερινὴ
      ἄσκη-
      σις;
        \opt()Ναί \opt()Οὔ

  - name: TX_4a02
    index: 0x02
    text: |-
      Ἡ ἔμφυτος ἀρετή;
        \opt()Ναί \opt()Οὔ

  - name: TX_4a03
    index: 0x03
    text: |-
      Ἡ φιλόστοργος
      καρδία;
        \opt()Ναί \opt()Οὔ

  - name: TX_4a04
    index: 0x04
    text: |-
      Χμμ... Χαλεπόν
      ἐστιν, οὐχί;

  - name: TX_4a05
    index: 0x05
    text: |-
      Νοῶ! Ἔμαθον
      πολλά!

  - name: TX_4a06
    index: 0x06
    text: |-
      Τῇ βοηθείᾳ σου,
      ἔσομαι μέγας
      ἥρως!

  - name: TX_4a07
    index: 0x07
    text: |-
      Ἰδού! Δίδωμί σοι
      τοῦτο εἰς χάριν!

  - name: TX_4a08
    index: 0x08
    text: |-
      Συνεχίσω τὴν
      ἄσκησίν μου!!!

- group: 0x4b
  data:
  - name: TX_4b00
    index: 0x00
    text: |-
      Τὸ ὄνομά μου
      ἐστὶ
      \col(3)\Child\col(0)!
      Οὐκ ἔστι καλὸν
      ὄνομα;
      Ναί, ἑταῖρε!

  - name: TX_4b01
    index: 0x01
    text: |-
      Συλλέξω χρήματα
      καὶ ἐξελεύσομαι
      εἰς τὸν κόσμον!\stop
      Δώσεις μοι οὖν
      συνεισφοράν;
        \opt()Ναί \opt()Οὔ

  - name: TX_4b02
    index: 0x02
    text: |-
      Πόσα δύνασαι
      συνεισφέρειν;
       \opt()100 \opt()50
       \opt()10  \opt()0

  - name: TX_4b03
    index: 0x03
    text: |-
      Φειδωλὸς εἶ,
      ἑταῖρε.

  - name: TX_4b04
    index: 0x04
    text: |-
      Εὐχαριστῶ,
      ἑταῖρε!
      Οὐδέποτε
      ἐπιλήσο-
      μαι τούτου!

  - name: TX_4b05
    index: 0x05
    text: |-
      Τοσοῦτον μόνον;
      ...Εὐχαριστῶ!!!

  - name: TX_4b06
    index: 0x06
    text: |-
      Κρεῖττον τοῦ
      μηδε-
      νός! Εὐχαριστῶ!

  - name: TX_4b07
    index: 0x07
    text: |-
      Φειδωλὸς εἶ,
      ἑταῖρε! Χαῖρε!

  - name: TX_4b08
    index: 0x08
    text: |-
      Οὐδὲν ἀγοράζω,
      ἑταῖρε! Οἱ λόγοι
      ἀξίζουσι πλέον!

  - name: TX_4b09
    index: 0x09
    text: |-
      Ἀπορῶ τί
      γίγνεται
      ἔξω ἐν τῷ
      κόσμῳ...

  - name: TX_4b0a
    index: 0x0a
    text: |-
      \Link,
      τί νέον;
      Ἐξῆλθον εἰς τὸν
      κόσμον πλάσσων
      ἦθος! Ναί,
      ἑταῖρε!\stop
      Ἐπεὶ ἔδωκάς μοι
      δωρεάν, ἰδού!!!

  - name: TX_4b0b
    index: 0x0b
    text: |-
      Ἑταῖρε, ἀπὸ τοῦ
      νῦν
      ἐσμὲν φίλοι!

- group: 0x4d
  data:
  - name: TX_4d00
    index: 0x00
    text: |-
      Οὐκ εἶ σὺ ὁ
      \Link; ᾔδειν ὅτι
      συναντησόμεθα.
      Θέλεις ἀκοῦσαι
      ὠφέλιμον
      συμβουλήν;
        \opt()Εἶεν \opt()Οὔ,
      εὐχαρ.

  - name: TX_4d01
    index: 0x01
    text: |-
      Οὐδεμίαν
      ἐπιθυμίαν
      ἔχεις;

  - name: TX_4d02
    index: 0x02
    text: |-
      Οἶδας τὸ
      \col(3)Ὡρολογεῖον\col(0)
      ἐν τῇ \col(3)Κώμῃ Ὁρὸν\col(0)
      τοῦ \col(3)Ὁλόδρουμ\col(0),
      οὐχί;
      Σκάψον ὄπισθεν
      αὐτοῦ. Φίλος μου
      ἐστὶν ἐκεῖ. Εἰπὲ
      τῷ φίλῳ μου τόδε
      τὸ \col(1)μυστήριον\col(0) ὃ
      ἐρῶ σοι. Νοεῖς;
        \opt()Ναί \opt()Οὔ

  - name: TX_4d03
    index: 0x03
    text: |-
      Μνήσθητι τούτου:\stop
      \secret1\stop
      Ἔμαθες;
        \opt()Ναί \opt()Οὔ

  - name: TX_4d04
    index: 0x04
    text: |-
      Τοῦτό ἐστιν.

  - name: TX_4d05
    index: 0x05
    text: |-
      Χαῖρε! Πιστεύεις
      οἷς βλέπεις; Ἐὰν
      πιστεύῃς, διδάξω
      σέ τι!
      Πιστεύεις;
        \opt()Ναί \opt()Οὔ

  - name: TX_4d06
    index: 0x06
    text: |-
      Ὡς βούλῃ.

  - name: TX_4d07
    index: 0x07
    text: |-
      Ἐν τῷ κοιμητηρίῳ
      τοῦ \col(3)Ὁλόδρουμ\col(0)
      ἔστιν
      εἷς μόνος τάφος
      ἄνευ ἀνθέων. Ἐὰν
      εἴπῃς τῷ ἐντὸς
      τοῦ
      τάφου τὸ
      \col(1)μυστήριον\col(0)
      ὃ ἐρῶ σοι,
      ἀγαθόν
      τι συμβήσεται,
      νοεῖς;
        \opt()Ναί \opt()Οὔ

  - name: TX_4d08
    index: 0x08
    text: |-
      Τὸ \col(1)μυστήριόν\col(0)
      ἐστι:\stop
      \secret1\stop
      Ἔμαθες;
        \opt()Ναί \opt()Οὔ

  - name: TX_4d09
    index: 0x09
    text: |-
      Ἀγαθῇ τύχῃ!

  - name: TX_4d0a
    index: 0x0a
    text: |-
      Ὤ! Ξένος ἐλάλησέ
      μοι! Δεῖ με
      διδά-
      ξαι σέ τι
      ἀγαθόν!
      Θέλεις ἀκοῦσαι;
        \opt()Ναί \opt()Οὔ

  - name: TX_4d0b
    index: 0x0b
    text: |-
      Οὐκ ἀναγκάσω σε.

  - name: TX_4d0c
    index: 0x0c
    text: |-
      Ὁ ἀδελφός μου ζῇ
      ἐν τῷ σπηλαίῳ
      παρὰ
      τὰς τρεῖς
      κορυφὰς
      τῶν \col(3)Ἡφαιστείων
      Σουβροσίας\col(0) ἐν τῇ
      γῇ Σουβροσίᾳ τοῦ
      \col(3)Ὁλόδρουμ\col(0). Ἐὰν
      εἴπῃς
      αὐτῷ τὸ
      \col(1)μυστήριόν\col(0)
      μου, δώσει σοι
      ἀγαθόν τι! Εἶεν;
        \opt()Εἶεν \opt()Πάλιν

  - name: TX_4d0d
    index: 0x0d
    text: |-
      Ἰδού!\stop
      \secret1\stop
      Ἔμαθες τοῦτο;
        \opt()Ναί \opt()Οὔ

  - name: TX_4d0e
    index: 0x0e
    text: |-
      Χαιρέτισον τὸν
      ἀδελφόν μου!

  - name: TX_4d0f
    index: 0x0f
    text: |-
      Εἰπέ μοι, οὐκ εἶ
      μαθητὴς τοῦ
      διδα-
      σκάλου
      κολυμβητοῦ
      ἐν τῇ \col(3)Βυθισμένῃ
      Πόλει\col(0) τοῦ
      \col(3)Ὁλόδρουμ\col(0);
      Ἔχω \col(1)μυστήριον\col(0) ὃ
      θέλω εἰπεῖν σε
      τῷ
      διδασκάλῳ σου.
      Ποιήσεις αὐτό;
        \opt()Ναί \opt()Οὔ

  - name: TX_4d10
    index: 0x10
    text: |-
      Οὔ;
      Εἶεν...

  - name:
    - TX_4d11
    - TX_4d12
    index:
    - 0x11
    - 0x12
    text: |-
      Μὴ συγχέῃς αὐτό!\stop
      \secret1\stop
      Ἔμαθες τοῦτο;
        \opt()Ναί \opt()Οὔ

  - name: TX_4d13
    index: 0x13
    text: |-
      Βασίζομαι ἐπὶ
      σοί!

  - name: TX_4d14
    index: 0x14
    text: |-
      Ἡ κρατίστη ἄμυνά
      ἐστιν ἡ καλὴ
      ἐπίθεσις...
      Ὁ ἔσχατος ἑστὼς
      νικᾷ. Διδάξω σε
      τὸ ἓν ὃ χρειάζῃ
      ἵνα ἐπιβιώσῃς;
        \opt()Ναί \opt()Οὔ

  - name: TX_4d15
    index: 0x15
    text: |-
      Οὐδέποτε οἶδας
      τί
      τέξεται ὁ
      βίος...

  - name:
    - TX_4d16
    - TX_4d17
    index:
    - 0x16
    - 0x17
    text: |-
      Εἰπὲ τόδε τὸ
      \col(1)μυστήριον\col(0) τῷ
      διδασκάλῳ ἐν τῷ
      Χαλκείῳ
      Σουβροσίας:\stop
      \secret1\stop
      Νοεῖς;
        \opt()Ναί \opt()Οὔ

  - name: TX_4d18
    index: 0x18
    text: |-
      Χαιρέτισον τὸν
      διδάσκαλον!

  - name: TX_4d19
    index: 0x19
    text: |-
      Ἐπελαθόμην
      εἰπεῖν
      τὸ τυχηρόν μου
      \col(1)μυστήριον\col(0) ἐκείνῳ
      τῷ ἀπελθόντι εἰς
      τὸ \col(3)Ὁλόδρουμ\col(0).
      Λίαν ἀτυχής
      ἐστιν.
      Ἐλπίζω μὴ παθεῖν
      συμφορὰν καὶ
      γενέ-
      σθαι σάκκος
      ὀστῶν.
      Βοηθήσεις μοι;
        \opt()Ναί \opt()Σύγγνωθι

  - name: TX_4d1a
    index: 0x1a
    text: |-
      Πόσον ἀγενής!

  - name:
    - TX_4d1b
    - TX_4d1c
    index:
    - 0x1b
    - 0x1c
    text: |-
      Τὸ \col(1)μυστήριόν\col(0)
      ἐστι:\stop
      \secret1\stop
      Ἀπεμνημόνευσας
      αὐτό;
        \opt()Ναί \opt()Οὔ

  - name: TX_4d1d
    index: 0x1d
    text: |-
      Εὐχαριστῶ
      σφόδρα!

  - name: TX_4d1e
    index: 0x1e
    text: |-
      \Link!\stop
      Βλέπω ὅτι ὁ
      ἆθλός
      σου ἤγαγέ σε εἰς
      τὴν \col(3)Λαβρύνναν\col(0)!
      Δύναμαι αἰτῆσαι
      χάριν παρὰ σοῦ;
        \opt()Ναί \opt()Οὔ

  - name: TX_4d1f
    index: 0x1f
    text: |-
      Οὔ..; Ἐπίστρεψον
      ἐὰν μετανοήσῃς.

  - name: TX_4d20
    index: 0x20
    text: |-
      Δεῖ εἶναι
      \col(3)Μεγάλην
      Νύμφην\col(0) ὄπισθεν
      τῶν
      καταρρακτῶν ἐν
      τῷ
      βυθισμένῳ \col(3)Ναῷ
      τῶν
      Καιρῶν\col(0) τοῦ
      \col(3)Ὁλόδρουμ\col(0).
      Θέλω εἰπεῖν σε
      αὐτῇ τὸ
      \col(1)μυστήριόν\col(0)
      μου, νοεῖς;
        \opt()Ναί \opt()Οὔ

  - name: TX_4d21
    index: 0x21
    text: |-
      Τὸ \col(1)μυστήριόν\col(0)
      ἐστι:\stop
      \secret1\stop
      Νοεῖς;
        \opt()Ναί \opt()Οὔ

  - name: TX_4d22
    index: 0x22
    text: |-
      Εὐχαριστῶ!

  - name: TX_4d23
    index: 0x23
    text: |-
      \sym(0x1c)Φίλει, φίλει
       τὸ σπέρμα!\sym(0x1c)
      Τόδε τὸ
      \col(1)μυστήριον\col(0)
      περιβόητόν ἐστιν
      ἐν τοῖς Θάμνοις
      Δέκου νῦν!
      Θέλεις
      ἀκοῦσαι τὸ
      λοιπόν;
        \opt()Ναί \opt()Οὔ

  - name: TX_4d24
    index: 0x24
    text: |-
      Ὕπαγε λοιπόν!

  - name:
    - TX_4d25
    - TX_4d26
    index:
    - 0x25
    - 0x26
    text: |-
      \sym(0x1c)Φίλει, φίλει
       τὸ σπέρμα!\sym(0x1c)
      Εἶτα:\stop
      \secret1\stop
      Δύνασαι μνημο-
      νεῦσαι αὐτό;
        \opt()Ναί \opt()Οὔ

  - name: TX_4d27
    index: 0x27
    text: |-
      Ὁ Θάμνος Δέκου
      δυτικῶς τῆς
      \col(3)Βυθι-
      σμένης Πόλεως\col(0) ἐν
      τῷ \col(3)Ὁλόδρουμ\col(0)
      φιλεῖ
      τόδε τὸ
      \col(1)μυστήριον\col(0)!
      Κἀγὼ ὁμοίως!
      Ἐπίσκεψαι αὐτόν!

  - name: TX_4d28
    index: 0x28
    text: |-
      Οὐ πᾶς Γόρων
      δύνα-
      ται σφυρηλατῆσαι
      τὸ μέγα
      ἀμφίχειρον\stop
      \col(1)Ξίφος τοῦ
      Βιγγορόν\col(0).
      Λέγουσιν ὅτι
      ἔστι
      Γόρων μέγας ὡς
      ὄρος ἐν τῷ
      \col(3)Ὁλόδρουμ\col(0)...
      Ἀληθές ἐστι;
        \opt()Ναί \opt()Οὔ

  - name: TX_4d29
    index: 0x29
    text: |-
      Ὤ...

  - name:
    - TX_4d2a
    - TX_4d2b
    index:
    - 0x2a
    - 0x2b
    text: |-
      Εἰπὲ τόδε τὸ
      \col(1)μυστήριον\col(0) ἐκείνῳ
      τῷ ἰσομεγέθει
      ὄρει
      \col(3)Βιγγορόν\col(0)!\stop
      \secret1\stop
      Εἶεν;
        \opt()Εἶεν \opt()Πάλιν

  - name: TX_4d2c
    index: 0x2c
    text: |-
      Εἰπὲ δὴ αὐτῷ!

  - name: TX_4d2d
    index: 0x2d
    text: |-
      Σὺ εἶ ὁ \Link,
      ὁ σώσας τὸ
      \col(3)Ὁλόδρουμ\col(0), οὐχί;
      Ἡ εἱμαρμένη
      συνή-
      γαγεν ἡμᾶς ὧδε!
      Ἀκούσεις τὴν
      δέησίν μου;
        \opt()Ναί \opt()Οὔ

  - name: TX_4d2e
    index: 0x2e
    text: |-
      Οὔ..;

  - name: TX_4d2f
    index: 0x2f
    text: |-
      Μέμνησαι τοῦ
      \col(3)Δημάρχου Ῥοὺλ\col(0) ἐν
      τῇ \col(3)Κώμῃ Ὁρὸν\col(0) τοῦ
      \col(3)Ὁλόδρουμ\col(0); Θέλω
      εἰπεῖν σε τόδε
      τὸ
      \col(1)μυστήριον\col(0) τῷ
      \col(3)Δημάρχῳ Ῥούλ\col(0),
      νοεῖς;
        \opt()Ναί \opt()Οὔ

  - name: TX_4d30
    index: 0x30
    text: |-
      Τὸ \col(1)μυστήριόν\col(0)
      ἐστι:\stop
      \secret1\stop
      Εἶεν;
        \opt()Ναί \opt()Οὔ

  - name: TX_4d31
    index: 0x31
    text: |-
      Μὴ ἐπιλάθῃ!

- group: 0x51
  data:
  - name: TX_5100
    index: 0x00
    text: |-
      Χρειάζῃ \col(1)κλεῖδα\col(0)
      διὰ τήνδε τὴν
      θύραν!

  - name: TX_5101
