    index:
    - 0x00
    - 0x20
    text: |-
      \pos(2)Ἀκούω
      \col(1)οὐσίαν\col(0) ἠχοῦσαν
      ἐν τῷ \col(3)Δυτικῷ
      Δρυμῷ\col(0). Δύνασαι
      ἐξετάσαι αὐτό;

  - name:
    - TX_0501
    - TX_0502
    - TX_0521
    - TX_0522
    index:
    - 0x01
    - 0x02
    - 0x21
    - 0x22
    text: |-
      \pos(2)Ἀλλὰ βεβαίως
      ὑπόστρεψον.\heart

  - name:
    - TX_0503
    - TX_0504
    - TX_0523
    - TX_0524
    index:
    - 0x03
    - 0x04
    - 0x23
    - 0x24
    text: |-
      \pos(2)Ἴσως ἔστι τι ἐν
      τῷ \col(3)οἴκῳ Ναϋρού\col(0)
      ὃ βοηθήσει
      σοι!

  - name:
    - TX_0505
    - TX_0506
    - TX_0525
    - TX_0526
    index:
    - 0x05
    - 0x06
    - 0x25
    - 0x26
    text: |-
      \pos(2)Ἴσως δύνασαι
      ἀνοῖξαι \col(3)ὀπὰς
      χρόνου\col(0) μετὰ τῆς
      \col(1)Κινύρας τῶν
      Αἰώνων\col(0) καὶ ἰέναι
      εἰς τὸ πάλαι.

  - name:
    - TX_0507
    - TX_0508
    - TX_0527
    - TX_0528
    index:
    - 0x07
    - 0x08
    - 0x27
    - 0x28
    text: |-
      \pos(2)Αἰσθάνομαι
      \col(1)Οὐσίαν Χρόνου\col(0)
      ἐν τῇ \col(3)Μηνειδεῖ
      Νήσῳ\col(0) ἐν τῇ νοτίᾳ
      θαλάσσῃ!!!
      Ἀλλὰ φύλαξαι
      διαβαίνων τὴν
      θάλασσαν, ναί;

  - name:
    - TX_0509
    - TX_0529
    index:
    - 0x09
    - 0x29
    text: |-
      \pos(2)Ὁ \col(3)Μέλας Πύργος\col(0)
      τοῦ πάλαι ἐστὶ
      σχεδὸν τέλειος.
      Δεινὰ ἔσται ἐὰν
      μὴ σπεύσῃς!\n
    null_terminator: False

  - name:
    - TX_050a
    - TX_052a
    index:
    - 0x0a
    - 0x2a
    text: |-
      \pos(2)\col(1)Οὐσία\col(0) ἠχεῖ περὶ
      τὴν κορυφὴν
      πρὸς δυσμὰς καὶ
      βορρᾶν ἀπὸ τῆς
      \col(3)Πόλεως Λύννας\col(0).
      Δύνασαι ἰέναι;

  - name:
    - TX_050b
    - TX_050c
    - TX_052b
    - TX_052c
    index:
    - 0x0b
    - 0x0c
    - 0x2b
    - 0x2c
    text: |-
      \pos(2)Νομίζω ὅτι ὄρος
      τι πρὸς βορρᾶν
      τοῦ \col(3)οἴκου Ναϋρού\col(0)
      μετέχει τῶν
      \col(1)οὐσιῶν\col(0).
      Σύγγνωθι! Οὐ
      μέμνημαι!

  - name:
    - TX_050d
    - TX_052d
    index:
    - 0x0d
    - 0x2d
    text: |-
      \pos(2)Ἀκολούθει τῷ
      μύθῳ Γορώνων.
      Ἴσως κρύπτει
      δεῖγμά τι.

  - name:
    - TX_050e
    - TX_050f
    - TX_052e
    - TX_052f
    index:
    - 0x0e
    - 0x0f
    - 0x2e
    - 0x2f
    text: |-
      \pos(2)Ἆρα τοῦτο καὶ
      γίνεται διότι
      ἡ \col(3)Ναϋρού\col(0)
      ἥρπασται;

  - name:
    - TX_0510
    - TX_0511
    - TX_0530
    - TX_0531
    index:
    - 0x10
    - 0x11
    - 0x30
    - 0x31
    text: |-
      \pos(2)Διὰ τί ἔτι
      αἰσθάνομαι
      \col(1)οὐσίαν\col(0) ἐγγὺς τῆς
      \col(3)Κυλιούσης
      Ῥάχεως\col(0)..;

  - name:
    - TX_0512
    - TX_0532
    index:
    - 0x12
    - 0x32
    text: |-
      \pos(2)Ζηλῶ ὅτι
      τοσαῦτα ποιεῖς
      δι' ἄλλην κόρην,
      \Link,
      μήτι γε διὰ τὴν
      Προφῆτιν τῶν
      Αἰώνων!

  - name:
    - TX_0513
    - TX_0533
    index:
    - 0x13
    - 0x33
    text: |-
      \pos(2)Σπεῦσον εἰς τὸ
      \col(3)παλάτιον Ἄμβι\col(0)!\heart

  - name:
    - TX_0514
    - TX_0515
    - TX_0534
    - TX_0535
    index:
    - 0x14
    - 0x15
    - 0x34
    - 0x35
    text: |-
      \pos(2)...\col(1)Οὐσία\col(0);
      Ἐντὸς ἰχθύος;

  - name:
    - TX_0516
    - TX_0517
    - TX_0536
    - TX_0537
    index:
    - 0x16
    - 0x17
    - 0x36
    - 0x37
    text: |-
      \pos(2)Ἡ ἐσχάτη \col(1)οὐσία\col(0)
      κρύπτεταί που
      ἐν τῇ
      \col(3)Λαβρύννῃ\col(0)...
      Ἀγαθῇ τύχῃ!

  - name:
    - TX_0518
    - TX_0519
    - TX_0538
    - TX_0539
    index:
    - 0x18
    - 0x19
    - 0x38
    - 0x39
    text: |-
      \pos(2)Ἀγαθῇ τύχῃ,
      \Link!
      Ἡ \col(3)Βεράν\col(0) ἐστιν
      ἐπὶ τοῦ \col(3)Μέλανος
      Πύργου\col(0)!

  - name:
    - TX_051a
    - TX_051b
    - TX_053a
    - TX_053b
    index:
    - 0x1a
    - 0x1b
    - 0x3a
    - 0x3b
    text: |-
      \pos(2)Ὁ Ὀφθαλμὸς τῆς
      Ἀπάτης οὐ
      βλάψει σε,
      \Link.
      Πέπεισμαι
      περὶ τούτου!\heart

  - name:
    - TX_051c
    - TX_051d
    - TX_051e
    - TX_051f
    - TX_053c
    - TX_053d
    - TX_053e
    - TX_053f
    index:
    - 0x1c
    - 0x1d
    - 0x1e
    - 0x1f
    - 0x3c
    - 0x3d
    - 0x3e
    - 0x3f
    text: |-
      \pos(2)Ἆ... Ἡ εἰρήνη
      καλή ἐστιν. Νῦν
      δύναμαι φρονεῖν
      μόνον περὶ τοῦ
      \Link\heart.

  - name: TX_0540
    index: 0x40
    text: |-
      \pos(2)Ἆ...

  - name: TX_0541
    index: 0x41
    text: |-
      \pos(2)Πάσχω τι ξένον.
      Ἀφανίζομαι!
      Τι συμπίπτει μοι
      ἐν τῷ πάλαι!
      Βοήθει!

  - name: TX_0542
    index: 0x42
    text: |-
      \pos(2)Ὤ... Ἔστιν
      ξένον... Πάντα
      δοκεῖ σκοτεινά.
      Ἐπιλανθάνομαι
      τοσούτων...

  - name: TX_0543
    index: 0x43
    text: |-
      \pos(2)...Ὤ;!
      Σύ... Σὺ εἶ...
      \Link!
      \Link!\heart

  - name: TX_0544
    index: 0x44
    text: |-
      \pos(2)Διὰ τί ὧδε εἶ
      νῦν; Ἀνέμενόν σε
      τοσοῦτον
      χρόνον.\heart Οὐ
      μέμνησαι;
      Πρὸ ἑκατοντάδων
      ἐτῶν;
      \Link, σὺ
      \heartἐπηγγείλω\heart!

  - name: TX_0545
    index: 0x45
    text: |-
      \pos(2)"Ὅταν αὐξηθῶ,
      γαμήσω σε!"
      Τοῦτο εἶπας,
      \Link.\heart
      Τετρακόσια
      ἔτη ἔμεινα.\stop
      Ἀλλά...

  - name: TX_0546
    index: 0x46
    text: |-
      \pos(2)Ἤδειν ὅτι οὐκ
      ἐπιλήσῃ μου.\heart
      Αἱ καρδίαι ἡμῶν
      δέδενται διὰ τοῦ
      χρόνου νήματί
      τινι...

  - name: TX_0547
    index: 0x47
    text: |-
      \pos(2)Τί; Οὐ διὰ τοῦτο
      εἶ ὧδε;\stop
      Διὰ τί οὐκ
      ἀκούεις μου;\stop
      Εἶεν! Βούλει
      λαλεῖν περὶ τῆς
      \col(3)Βεράν\col(0), ναί;

  - name: TX_0548
    index: 0x48
    text: |-
      \pos(2)Ἴσως ἡ \col(3)Βεράν\col(0)
      χρῆται τῇ \col(3)βασιλ-
      ίσσῃ Ἄμβι\col(0) ἵνα
      ὑψώσῃ τὸν πύργον
      εἰς τὸν οὐρανόν.
      "Ἐάν τις
      ἀκαθάρτου
      καρδίας κτήσηται
      δυνάμεις
      σκιᾶς...

  - name: TX_0549
    index: 0x49
    text: |-
      \pos(2)οὗτος ὁ κόσμος
      καλυφθήσεται
      σκότει."
      Περὶ τούτου
      ἐστὶ τοῦτο...

  - name: TX_054a
    index: 0x4a
    text: |-
      \pos(2)Τὸ εἰδέναι τὸ
      πάλαι ἐστὶ τὸ
      εἰδέναι τὸ νῦν.
      Ἡ \col(3)Βεράν\col(0) δύναται
      ποιεῖν ὡς βούλε-
      ται εἰ εὕρῃ
      σκοτεινὴν
      δύναμιν ἐν τῷ
      πάλαι. Πάντα
      σκοτισθήσεται!
      \Link! Δεῖ σε
      κωλῦσαι τὴν
      \col(3)Βεράν\col(0) καὶ σῶσαι
      τὴν \col(3)Ναϋρού\col(0)!\stop
      Δεῖ με λέγειν
      τοῦτο πάλιν;
        \opt()Ναί \opt()Οὔ

  - name: TX_054b
    index: 0x4b
    text: |-
      \pos(2)Οὐ μέμνημαι,
      ἀλλὰ νομίζω ὅτι
      χρῄζεις τῶν ὀκτὼ
      \col(1)Οὐσιῶν Χρόνου\col(0)
      κρυπτῶν ἐν τῇ
      \col(3)Λαβρύννῃ\col(0) ἵνα
      νικήσῃς \col(3)Βεράν\col(0)!\stop
      Αἱ \col(1)οὐσίαι\col(0)
      ἔχουσι δύναμιν
      τοῦ ὁρᾶν τὴν
      ἀλήθειαν, καὶ
      φυλάσσουσι τὴν
      μνήμην μου!
      Οὐ νικήσεις τὴν
      \col(3)Βεράν\col(0) ἐὰν μὴ
      ὁρᾷς ἀλήθειαν!

  - name: TX_054c
    index: 0x4c
    text: |-
      \pos(2)Τοῦ ῥεύματος
      τοῦ χρόνου
      ταραχθέντος, ἡ
      μνήμη μου
      μαραίνεται...

  - name: TX_054d
    index: 0x4d
    text: |-
      \pos(2)Τί ποιήσομεν;
      Ἀποροῦμαι...

  - name: TX_054e
    index: 0x4e
    text: |-
      \pos(2)Ἀλλ' ἐὰν εὕρῃς
      τὰς \col(1)οὐσίας\col(0),
      μνησθήσομαι
      πάντων!
      Καὶ δυνήσῃ
      κωλῦσαι τὴν
      \col(3)Βεράν\col(0)!!!
      Δέομαι, ποίησον
      τοῦτο, \Link!

  - name: TX_054f
    index: 0x4f
    text: |-
      \pos(2)Πρῶτον, θέλω σε
      ἰέναι εἰς τὰ
      \col(3)Μνημεῖα Ἰώλ\col(0) πρὸς
      ἀνατολάς.
      Ἀκούω τὴν πρώτην
      \col(1)οὐσίαν\col(0) ἐκεῖ.

  - name: TX_0550
    index: 0x50
    text: |-
      \pos(2)Οὐ δύναμαι
      ποιεῖν πολλά,
      ἀλλὰ λαβὲ τοῦτο.

  - name: TX_0551
    index: 0x51
    text: |-
      \pos(2)Χαῖρε ἐλθών,
      \Link!
      Τέλος ἐνίκησας
      τὴν \col(3)Βεράν\col(0)!
      \Link, ᾔδειν
      ὅτι δυνήσῃ!\heart
      Καὶ ᾔδειν ὅτι
      ὑποστρέψεις...\heart

  - name: TX_0552
    index: 0x52
    text: |-
      \pos(2)Χαῖρε ἐλθών,
      \Link!
      Νῦν ὁ κόσμος
      εἰρηνεύει! Ἤδειν
      ὅτι ἰσχύσεις,
      \Link\heart.
      Καὶ ᾔδειν ὅτι
      ὑποστρέψεις...\heart

  - name: TX_0553
    index: 0x53
    text: |-
      \pos(2)Ἀλλά, \Link, ἡ
      \col(3)Βεράν\col(0) ἔτι ἐν τῷ
      πάλαι ἐστίν, ἦ
      γάρ;\stop
      Εἰ οὕτως, ἆρα οὐ
      δύναται ἔτι
      ποιῆσαι αἰῶνα
      σκότους ὃς μενεῖ
      ἕως τοῦ νῦν;

  - name: TX_0554
    index: 0x54
    text: |-
      \pos(2)Τί γίνεται;
      Τί σημαίνει εἰ
      αὗται ποιοῦσι τὰ
      ἔργα τῆς \col(3)Βεράν\col(0);

  - name: TX_0555
    index: 0x55
    text: |-
      \pos(2)\Link, ἡ
      ἑξῆς \col(1)οὐσία\col(0)...

  - name: TX_0556
    index: 0x56
    text: |-
      \pos(2)Τοῦτο ξένον!
      \col(1)Οὐσία\col(0) τις ἠχεῖ
      ἔσωθεν ἰχθύος.

  - name: TX_0557
    index: 0x57
    text: |-
      \pos(2)Ἡ \col(3)Διδυμορόβα\col(0)
      ὄπισθεν \col(3)Βεράν\col(0);!
      Τί ἐσήμαινε διὰ
      τοῦ Βασιλέως τοῦ
      Πονηροῦ; Τί
      γίνεται;
      \Link, τοῦτο
      δίδωσί μοι πάνυ
      κακὸν πάθος! Δεῖ
      σε παῦσαι τοῦτο!

  - name: TX_0558
    index: 0x58
    text: |-
      \pos(2)Ἀλλὰ πρῶτον, ἡ
      ἑξῆς \col(1)οὐσία\col(0),
      \Link!

  - name:
    - TX_0559
    - TX_055a
    - TX_055d
    - TX_055e
    index:
    - 0x59
    - 0x5a
    - 0x5d
    - 0x5e
    text: |-
      \pos(2)\Link!\stop
      Συνήγαγες πάσας
      τὰς ὀκτὼ \col(1)Οὐσίας
      τοῦ Χρόνου\col(0) καὶ
      οἶδας τὴν
      δύναμιν αὐτῶν!\stop
