- group: 0x55
  data:
  - name:
    - TX_5500
    - TX_5506
    index:
    - 0x00
    - 0x06
    text: |-
      Καλῶς ἦλθες,
      \Link.
      Εἰμὶ ἡ \col(3)Φαρόρε\col(0),
      \col(1)Προφῆτις τῶν
      Μυστηρίων\col(0). Αὕτη
      ἐστὶν ἡ \col(3)Αἴθουσα
      τῶν Μυστηρίων\col(0),
      οὗ
      τὰ \col(1)μυστήριά\col(0) σου
      λαμβάνουσι
      μορφήν.

  - name: TX_5501
    index: 0x01
    text: |-
      \call(TX_5500)
      Κατὰ καιροὺς καὶ
      τόπους, ἀκούσεις
      ἰσχυρὰ \col(1)μυστήρια\col(0).
      Τότε ἐλθὲ πρός
      με.
      Δύναμαι δοῦναι
      σχῆμα καὶ μορφὴν
      τοῖς \col(1)μυστηρίοις\col(0)
      σου!

  - name: TX_5502
    index: 0x02
    text: |-
      \call(TX_5500)
      Οἶδάς τινα
      \col(1)μυστήρια\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_5503
    index: 0x03
    text: |-
      Τότε ἐπίστρεψον
      ὅταν ἀκούσῃς
      τινά.

  - name: TX_5504
    index: 0x04
    text: |-
      Κἀγὼ οἶδα τόδε
      τὸ \col(1)μυστήριον\col(0).

  - name: TX_5505
    index: 0x05
    text: |-
      Ἐπίστρεψον
      ὁποτεδήποτε.

  - name: TX_5507
    index: 0x07
    text: |-
      Δύναμαι δοῦναι
      μορφὴν ἰσχυροῖς
      \col(1)μυστηρίοις\col(0) ὧν
      μέμνημαι.\stop
      Οἶδας τὸ
      \col(1)μυστήριον\col(0)
      τοῦ κινεῖσθαι
      διὰ
      τοῦ χρόνου;
        \opt()Ναί \opt()Οὔ

  - name: TX_5508
    index: 0x08
    text: |-
      Ὄντως;
      Ἐπίστρεψον
      ὁποτεδήποτε
      μάθῃς
      \col(1)μυστήριά\col(0) τινα.

  - name: TX_5509
    index: 0x09
    text: |-
      Τὰ \col(1)μυστήριά\col(0) σου
      ἐκάλεσαν νέαν
      δύναμιν! Ἐλθὲ
      πάλιν
      ὁποτεδήποτε.

  - name: TX_550a
    index: 0x0a
    text: |-
      Ἓν \col(1)μυστήριον\col(0) ἤδη
      ἔλαβε μορφήν.
      Ὕπαγε λάβε αὐτό,
      εἶτα ἐλθὲ εἰπέ
      μοι
      ἄλλο \col(1)μυστήριον\col(0).

  - name: TX_550b
    index: 0x0b
    text: |-
      Εἰπὲ ἐκεῖνο τὸ
      \col(1)μυστήριον\col(0) ἐν τῷ
      \col(3)Ὁλόδρουμ\col(0), οὐχ
      ὧδε.

  - name: TX_550c
    index: 0x0c
    text: |-
      Εἶπάς μοι τόδε
      τὸ
      \col(1)μυστήριον\col(0) ἤδη.
      \jump(TX_5505)
    null_terminator: False

  - name: TX_550d
    index: 0x0d
    text: |-
      \pos(3)Σῶσαι καὶ
      παῦσαι;
        \opt()Οὔ \opt()Ναί

  - name: TX_550e
    index: 0x0e
    text: |-
      \pos(3)Τὰ \col(1)μυστήριά\col(0) σου
      ἀπολέσουσι τὴν
      μορφὴν ἐὰν μὴ
      σώσῃς. Εἶεν;
        \opt()Οὔ \opt()Ναί

  - name: TX_550f
    index: 0x0f
    text: |-
      \slow()Πρὸς \col(3)Βασιλέα
      Ζώρα\col(0)

  - name: TX_5510
    index: 0x10
    text: |-
      \slow()Πρὸς τὰς
      πανούργους
       \col(3)Νύμφας\col(0)

  - name: TX_5511
    index: 0x11
    text: |-
      \slow()Πρὸς \col(3)Δρ. Τρόϋ\col(0) ἐν
       τῇ \col(3)Κυλιούσῃ
      Ῥάχει\col(0)

  - name: TX_5512
    index: 0x12
    text: |-
      \slow()Ἐπιστολὴ χάριτος
       πρὸς Δήμαρχ.
      \col(3)Πλέν\col(0)

  - name: TX_5513
    index: 0x13
    text: |-
      \slow()Μυστήριον
      Βιβλιοθ.

  - name: TX_5514
    index: 0x14
    text: |-
      \slow()Ἄγριος Τοκάι τῆς
       \col(3)Μηνοειδοῦς
      Νήσου\col(0)

  - name: TX_5515
    index: 0x15
    text: |-
      \slow()Παρὰ τῆς μητρὸς
       τῆς \col(3)Μαμαμοὺ
      Γιάν\col(0)

  - name: TX_5516
    index: 0x16
    text: |-
      \slow()Σημείωμα \col(3)Μεγάλης
       Νύμφης\col(0) πρὸς
      \col(3)Τίνγκλ\col(0)

  - name: TX_5517
    index: 0x17
    text: |-
      \slow()Πρὸς τὸν μέγαν
       Πρεσβύτερον
      Γόρον

  - name: TX_5518
    index: 0x18
    text: |-
      \slow()Πρὸς τοὺς
      διδύμους
       \col(3)Πόλεως
      Συμμετρίας\col(0)

  - name: TX_5519
    index: 0x19
    text: |-
      Θέλεις μαθεῖν τὸ
      \col(1)μυστήριον
      μεταβά-
      σεως εἰς
      Ὁλόδρουμ\col(0);
        \opt()Ναί \opt()Οὔ

  - name: TX_551a
    index: 0x1a
    text: |-
      \secret1
      \secret2

  - name: TX_551b
    index: 0x1b
    text: |-
      Μνήμη τῆς Φαρόρε
      Ἀναγνῶναι τόδε;
        \opt()Ναί \opt()Οὔ

  - name: TX_551c
    index: 0x1c
    text: |-
      Οὐ μέμνημαι
      ἐκεί-
      νου τοῦ
      \col(1)μυστηρίου\col(0),
      ὥστε οὐ δύναμαι
      δοῦναι μορφὴν
      αὐτῷ.

- group: 0x56
  data:
  - name: TX_5600
    index: 0x00
    text: |-
      \pos(0)Ἆ χα χα χά!

  - name: TX_5601
    index: 0x01
    text: |-
      \pos(0)Εὐχαριστῶ σοι,
      \Link!\stop
      Ἐπέτρεψάς μοι
      διελθεῖν τὸ
      ἱερὸν
      φράγμα!
      Περιέμενον
      τήνδε τὴν
      στιγμήν!\stop
      Εἰμὶ ἡ \col(3)Βεράν\col(0),
      Μάγισσα τῶν
      Σκιῶν!

  - name: TX_5602
    index: 0x02
    text: |-
      \pos(0)\col(3)Ναϋροῦ\col(0)! Προφῆτις
      τῶν Αἰώνων!
      Ποιήσω
      τὸ σῶμά σου
      ἐμόν!
      Ἆ χα χα χά!

  - name: TX_5603
    index: 0x03
    text: |-
      \pos(2)Χά! Πόσον
      γενναῖος
      εἶ! Στρέφεις
      ξίφος
      κατ' ἐμοῦ! Ἐὰν
      κόψῃς με, ἡ
      \col(3)Ναϋροῦ\col(0)
      ἀποθνήσκει!

  - name: TX_5604
    index: 0x04
    text: |-
      \pos(2)Ἡ \col(3)Ναϋροῦ\col(0) οὐκ
      ἔστιν
      ἁπλῆ ἀοιδός!
      Ἔστιν
      ἡ Προφῆτις τῶν
      Αἰώνων, ἡ
      ἄρχουσα
      τοῦ χρόνου!\stop
      Νῦν αἱ δυνάμεις
      τῆς
      προφήτιδος ἐμαί
      εἰσι. Δύναμαι
      ὁδοι-
      πορεῖν ἐν τῷ
      χρόνῳ
      ὡς βούλομαι!

  - name: TX_5605
    index: 0x05
    text: |-
      \pos(2)Νῦν νέος αἰὼν
      ἄρξεται...
      Ὁ αἰὼν τοῦ
      σκότους!!!
      Ἆ χα χα χά!

  - name: TX_5606
    index: 0x06
    text: |-
      \pos(0)Ὀρθῶς λέγεις!
      Οὐ κακὸν δι'
      ἀοι-
      δόν... Οὐ κακὸν
      διὰ τὴν \col(3)Ναϋροῦ\col(0),
      Προφῆτιν Αἰώνων!
      Δεινόν τι
      συμβήσε-
      ται εὐθὺς νῦν
      πρὸ
      τῶν ὀφθαλμῶν
      σου!

  - name: TX_5607
    index: 0x07
    text: |-
      Πορεύσομαι εἰς
      τὸ
      παρελθὸν καὶ
      ποιή-
      σω ὡς βούλομαι!

  - name: TX_5608
    index: 0x08
    text: |-
      \pos(1)\Link! Θαυμάζω
      ὅτι ἦλθες μέχρις
      ὧδε...

  - name: TX_5609
    index: 0x09
    text: |-
      \pos(1)Μεῖνον!

  - name: TX_560a
    index: 0x0a
    text: |-
      \pos(1)Θέλεις στρέψαι
      τὸ
      ξίφος σου κατ'
      ἐμοῦ;\stop
      Χα χα χα χά!
      Ἐὰν θέλῃς βλάψαι
      τὴν \col(3)Ναϋροῦ\col(0), πρό-
      σελθε δή!

  - name: TX_560b
    index: 0x0b
    text: |-
      Οὔχ...
      Οὐ κακῶς ὅλως!
      Περίμενε μέχρι
      τῆς
      ἑπομένης
      φορᾶς...

  - name: TX_560c
    index: 0x0c
    text: |-
      \pos(1)Χα χα χά!!!\stop
      Ἡ βασίλισσα
      ἔρχεται
      ἐν τῷ ἀρίστῳ
      καιρῷ!

  - name: TX_560d
    index: 0x0d
    text: |-
      \pos(0)Χαα... Τὸ σῶμα
      βασιλίσσης
      ἁρμόζει
      μοι κάλλιστα!
      Οἶδας τί μέλλω
      ποιῆσαι νῦν;
      Ἐρῶ σοι!\stop
      Συνάντησον τοὺς
      ἀπολιθωθέντας!
      Συλλήψομαι
      πάντας!

  - name: TX_560e
    index: 0x0e
    text: |-
      \pos(2)Εὖγε!
      Ἐνόμισα ὅτι
      κατα-
      λήψομαι σὲ νῦν.
      Ἴσως ἔχεις
      διάφο-
      ρον γεῦσιν ἀπὸ
      τοῦ
      μωροῦ \col(3)Ῥάλφ\col(0).

  - name: TX_560f
    index: 0x0f
    text: |-
      \pos(2)Εἶδές με οὕτως
      πρότερον, ἀλλ'
      αὕτη
      ἐστὶν ἡ ἀληθής
      μου
      μορφή.
      Μετανοήσεις
      ὅτι ἠνάγκασάς με
      δεῖξαι τὴν ἰσχύν
      μου!

  - name: TX_5610
    index: 0x10
    text: |-
      \pos(2)Δώσω σοι αἰτίας
      φοβεῖσθαι τὴν
      \col(3)Βεράν\col(0), Μάγισσαν
      τῶν Σκιῶν!!!

  - name: TX_5611
    index: 0x11
    text: |-
      Οὔχ...
      Οὐδέποτε ἤλπιζον
      νικηθῆναι ὑπὸ
      τοῦδε τοῦ
      παιδός...

  - name: TX_5612
    index: 0x12
    text: |-
      Τοῦτο οὐκ ἔδει
      συμβῆναί μοι...

  - name: TX_5613
    index: 0x13
    text: |-
      Πόσον ψυχρὸν τὸ
      φυγεῖν καὶ κατα-
      λιπεῖν με μόνην!
      Ἀλλὰ πόσον
      θαρρα-
      λέος εἶ!
      Διέφθειρας
      πάντα τὰ σχέδιά
      μου! Ἤλπιζον
      ἀπο-
      φυγεῖν δεῖξαι
      τήνδε
      τὴν μιαρὰν
      μορφήν...
      Τίσεις τὴν
      ταπεί-
      νωσίν μου τῇ ζωῇ
      σου! Νῦν, \Link,
      σὴ σειρά ἐστι
      γεύ-
      σασθαι
      ἀπογνώσεως...

  - name: TX_5614
    index: 0x14
    text: |-
      καὶ τοῦ φόβου
      τοῦ θανάτου!

  - name: TX_5615
    index: 0x15
    text: |-
      Τὸ... Τὸ σῶμά
      μου
      μαραίνεται...
      Ἀλλ' ὑστέρησας!
      Τὸ ἔργον μου...
      ἦν
      ταράξαι τὰ
      ῥεύματα
      τοῦ χρόνου...
      Βυθί-
      σαι τοὺς
      ἀνθρώπους
      εἰς θλῖψιν...
      Ἡ ἀπόγνωσις ἡ
      πλη-
      ροῦσα τήνδε τὴν
      γῆν
      ἤδη διῆλθε διὰ
      τοῦ
      πύργου τούτου
      πρὸς
      τὴν \col(3)Τουινρόβαν\col(0)!
      Βλέπω αὐτήν...
      Καιομένην
      κυανῆν...
      Τὴν Φλόγα τῆς
      Λύπης!!!\stop
      Χα χα χά...

  - name: TX_5616
    index: 0x16
    text: |-
      \call(TX_5615)
      Περιμενῶ σε,
      \Link...
      ἵνα στοιχειώσω
      σε...
      Καὶ ὁ Κακὸς
      Βασι-
      λεὺς \col(3)Γάνων\col(0)...
      βυθίσει τὸν
      κόσμον
      εἰς τὸ σκότος!

- group: 0x57
  data:
  - name: TX_5700
    index: 0x00
    text: |-
      Αὕτη ἐστὶν ἡ
      οὐτο-
      πία τῶν ζῴων!
      Ταχέως πλείονα
      ζῷα
      ἐλεύσονται!

  - name: TX_5701
    index: 0x01
    text: |-
      Πόσον καλὸς
      τόπος!
      Πόσον καθαρὸς
      ἀήρ!
      Εἴθε ἐπαύετο ὁ
      χρόνος!

  - name: TX_5702
    index: 0x02
    text: |-
      Πόσον
      θελκτικόν...

  - name: TX_5703
    index: 0x03
    text: |-
      Κάθισον ὧδε καὶ
      ἄκουε. Πόσον
      θελκτικόν...

  - name: TX_5704
    index: 0x04
    text: |-
      Ἔα;\stop
      Ἡ \col(3)Ναϋροῦ\col(0) ἐστὶν ἡ
      κρατίστη ἀοιδὸς
      ἐν
      τῇ \col(3)Λαβρύννᾳ\col(0)!

  - name: TX_5705
    index: 0x05
    text: |-
      \sym(0x1c)Λα λα λι λι λα\sym(0x1c)
      \sym(0x1c)Λα Λι λι λα\sym(0x1c)

  - name: TX_5706
    index: 0x06
    text: |-
      Οὐκ ἔστι 
      μαγευτικόν;

  - name: TX_5707
    index: 0x07
    text: |-
      Ἔσομαι
      πριγκίπισσα!

  - name: TX_5708
    index: 0x08
    text: |-
      Κτίσομεν
      παράδει-
      σον!

  - name: TX_5709
    index: 0x09
    text: |-
      Ὁ μὴ ἐργαζόμενος
      μηδὲ ἐσθιέτω!

  - name: TX_570a
    index: 0x0a
    text: |-
      Πεινῶ! Πότε ἐστὶ
      τὸ δεῖπνον;

  - name: TX_570b
    index: 0x0b
    text: |-
      Ἐὰν πιστεύῃς,
      ἔσται!

  - name: TX_570c
    index: 0x0c
    text: |-
      Θέλω γενέσθαι
      ἀλη-
      θινὴ
      πριγκίπισσα,
      ὡς ἡ \col(3)Πριγκίπισσα
      Ζέλδα\col(0)!

  - name: TX_570d
    index: 0x0d
    text: |-
      Ὁμονόει καὶ μετὰ
      τῶν ἀνθρώπων!
      Τοῦτό μοι γνώμη!

  - name: TX_570e
    index: 0x0e
    text: |-
      Ὁ κόσμος
      εἰρηνικός
      ἐστι. Κτίσω τὴν
      ἐμὴν οὐτοπίαν!

  - name: TX_570f
    index: 0x0f
    text: |-
      \sym(0x1c)Ὄνειρος
      οὐτοπίας\sym(0x1c)
      Λα λα\sym(0x1c)Οὐτοπία\sym(0x1c)

  - name: TX_5710
    index: 0x10
    text: |-
      Ὁ κόσμος
      εἰρηνεύει,
      ὁ ἀὴρ καθαρός
      ἐστι!
      Ὡς ὄνειρός
      ἐστιν!

  - name: TX_5711
    index: 0x11
    text: |-
      Μπούπ! Μπούπ!

  - name: TX_5712
    index: 0x12
    text: |-
      Ἡ \col(3)Ναϋροῦ\col(0) ἀπῆλθεν
      ὥστε οὐκ εἰσὶν
      ἔτι
      ᾠδαί...

  - name: TX_5713
    index: 0x13
    text: |-
      Ἐνόμιζον ὅτι
      ἀκου-
      σόμεθα ᾠδὰς ὅτε
      ἡ
      \col(3)Ναϋροῦ\col(0)
      ἐπανῆλθεν,
      ἀλλ' οὐκ ἔστι
      καιρός.

  - name: TX_5714
    index: 0x14
    text: |-
      Αἱ ᾠδαὶ τῆς
      \col(3)Ναϋροῦ\col(0)
      εἰσὶ θαυμασίως
      μαγευτικαί...

  - name: TX_5715
    index: 0x15
    text: |-
      Οὐ φέρω τὸ μὴ
      δύνα-
      σθαι ἀκούειν τῆς
      \col(3)Ναϋροῦ\col(0)
      ᾀδούσης!!!

  - name: TX_5716
    index: 0x16
    text: |-
      Ἄκουε ἡσύχως τῶν
      ᾠδῶν τῆς \col(3)Ναϋροῦ\col(0)!

  - name: TX_5717
    index: 0x17
    text: |-
      Ἄνευ τῶν ᾠδῶν
      τῆς
      \col(3)Ναϋροῦ\col(0), οὐ
      δύναμαι
      πηδᾶν ἐν ῥυθμῷ.

  - name: TX_5718
    index: 0x18
    text: |-
      Πόσον ἔτι ἕως οὗ
      ᾄσῃ πάλιν ἡ
      \col(3)Ναϋροῦ\col(0);

  - name: TX_5719
    index: 0x19
    text: |-
      Ποῦ ἀπῆλθεν ἡ
      \col(3)Ναϋροῦ\col(0);!;

  - name: TX_571a
    index: 0x1a
    text: |-
      Οὐ δύναμαι
      ἀναπαύ-
      εσθαι ἄνευ τῶν
      ᾠδῶν τῆς \col(3)Ναϋροῦ\col(0)!

- group: 0x58
  data:
  - name: TX_5800
    index: 0x00
    text: |-
      Οὐκ ἔσχον
      ἐπισκέ-
      πτας ἀπὸ πολλοῦ.\n
    null_terminator: False

  - name: TX_5801
    index: 0x01
    text: |-
      Εἰμὶ ὁ \col(3)Πάτς\col(0), ὁ
      διδάσκαλος
      ἐπισκευ-
      ῶν. Χρειάζῃ μου;
        \opt()Ναί \opt()Οὔ

  - name: TX_5802
    index: 0x02
    text: |-
      Πάντως ἔχεις
      χρόνον
      ἐλεύθερον ἐπεὶ
      ἦλθες μέχρις
      ὧδε.

  - name: TX_5803
    index: 0x03
    text: |-
      Οὐ φαίνῃ ἔχων τι
      ὃ δύναμαι
      ἐπισκευ-
      άσαι. Τί οὖν;

  - name: TX_5804
    index: 0x04
    text: |-
      Χέ, χέ! Νοῶ.
      Θέλεις
      ἐπισκευάσαι
      με τόδε τὸ
      \col(1)\call(0xff)\col(0).\stop
      Ἡ Τελετὴ
      Ἀποκατα-
      στάσεώς μου ἴσως
      ἰάσεται αὐτό.
      ...Θέλεις
      δοκιμάσαι;
        \opt()Ναί \opt()Οὔ

  - name: TX_5805
    index: 0x05
    text: |-
      Τότε ἐκεῖνο τὸ
      \col(1)\call(0xff)\col(0)
      οὐδέποτε
      ἀποκατα-
      σταθήσεται...

  - name: TX_5806
    index: 0x06
    text: |-
      Πρόθυμος εἶ
      δοκι-
      μάσαι; Εὖγε.
      Ἀκο-
      λούθει μοι. Χέ,
      χέ!

  - name: TX_5807
    index: 0x07
    text: |-
      Καλῶς ἦλθες εἰς
      τὴν
      Μανικὴν Ἅμαξαν
      τοῦ
      Πάτς! Μεθέξεις
      τῆς
      τελετῆς μου;
        \opt()Ναί \opt()Οὔ

  - name: TX_5808
    index: 0x08
    text: |-
      Εὖγε! Θέλεις
      ἀκοῦ-
      σαι τοὺς
      κανόνας;
        \opt()Οὔ \opt()Ναί

  - name: TX_5809
    index: 0x09
    text: |-
      Ἄκουε δὴ τὴν
      ἐξήγησιν!\stop
      Θήσω τὸ σὸν
      \col(1)\call(0xff)\col(0)
      ἐπὶ τῆς χλωρᾶς
      πλακὸς καὶ
      ἀπαγγε-
      λῶ τὰς λέξεις
      τῆς
      Τελετῆς
      Ἀποκαταστά-
      σεως. Δεῖ σε
      ὠθῆσαι
      πάντα τὰ
      φαινόμενα
      θηρία εἰς ὀπήν--
      οἱανδήποτε ὀπήν.
      Εὔκολον, οὐχί;
      ...Ὅμως!!!\stop
      Ἡ ἀποκατάστασις
      λεπτὸν ἔργον
      ἐστίν.
      Τὸ πολύτιμόν σου
      \col(1)\call(0xff)\col(0)
      κεῖται ἐπὶ τῶνδε
      τῶν τροχιῶν...
      Ἡ ἅμαξα ἄρχεται
      κινεῖσθαι ὅταν ἡ
      τελετὴ ἄρχηται.
      Ἐφ' ὅσον ἵστασαι
      ἐπὶ τοῦ μοχλοῦ,
      ἡ
      ἅμαξα οὐ πλήξει
      τὸ
      \col(1)\call(0xff)\col(0),
      ἀλλ' ἐὰν μὴ καὶ
      πληγῇ,\stop
      ΜΠΑΜ!!!\stop
      Τί λέγεις;
      Μεθέξεις
      τῆσδε τῆς
      τερπνῆς--
      ἐε, λεπτῆς
      τελετῆς;
        \opt()Ναί \opt()Οὔ

  - name: TX_580a
    index: 0x0a
    text: |-
      Ἀρχέσθω ἡ
      τελετή!

  - name: TX_580b
    index: 0x0b
    text: |-
      Δὲξ ἰφέβ!!!
      Δὲξ ἰφλλά!!!

  - name: TX_580c
    index: 0x0c
    text: |-
      Ἡ τελετὴ
      ἀπέτυχεν,
      ἀλλὰ τὸ σὸν
      \col(1)\call(0xff)\col(0)
      φαίνεται σωθέν.
      Δοκίμασον πάλιν.

  - name: TX_580d
    index: 0x0d
    text: |-
      Χμμ... Ἔ, χέ!
      Ἡ τελετή μου
      ἐπέ-
      τυχεν! Εὐφυὴς
      εἶ.
      Διῆλθες τήνδε
      τὴν
      παγίδα--ἐε,
      τελετήν.
      Ἰδοὺ τὸ σὸν
      \col(1)\call(0xff)\col(0),
      ὡς καινόν!\stop
      Ὡς συνήθως, εἰμὶ
      τέλειος!

  - name: TX_580e
    index: 0x0e
    text: |-
      Ἰδοὺ σοι.

  - name: TX_580f
    index: 0x0f
    text: |-
      Φέρε μοι πᾶν
      ἄλλο
      ὃ χρῄζει
      ἐπισκευῆς,
      καὶ ἑτοιμάσω τὴν
      παγίδα--ἐε,
      τελετήν!

  - name: TX_5810
    index: 0x10
    text: |-
      Οὐκ εἶδόν σε ἀπὸ
      πολλοῦ.\stop
      Εἰ ἀνῆλθες ὅλον
      τὸν
      τοῖχον, πάντως
      τι
      χρῄζει
      ἐπισκευῆς.
      Ἀλλ' ἡ
      τερπνή--ἐε,
      λεπτὴ τελετή μου
      χαλεπωτέρα ἐστὶ
      νῦν.
      Θέλεις
      δοκιμάσαι;
        \opt()Ναί \opt()Οὔ

  - name: TX_5811
    index: 0x11
    text: |-
      Οὐδέν ἐστιν ὃ ὁ
      διδάσκαλος
      ἐπισκευ-
      ῶν οὐκ ἰᾶται!

  - name: TX_5812
    index: 0x12
    text: |-
      Κάρυον Τούνι

  - name: TX_5813
    index: 0x13
    text: |-
      Κλασθὲν Ξίφος

  - name: TX_5814
    index: 0x14
    text: |-
      Ὀφθαλμ. Γοργόνος

- group: 0x59
  data:
  - name: TX_5900
    index: 0x00
    text: |-
      Ζητεῖς καὶ σὺ
      ὅπερ
      ἡ \col(3)Ἄμβι\col(0) ποθεῖ; Μὴ
      προχώρει πλέον!
      Εἰσὶ πλήθη
      δεινῶν
      θηρίων!

  - name: TX_5901
    index: 0x01
    text: |-
      Εὗρες ὅπερ ἡ
      \col(3)Ἄμβι\col(0)
      ποθεῖ;

  - name: TX_5902
    index: 0x02
    text: |-
      Οἱ \col(1)βόμβοι\col(0) τῆς
      \col(3)Ἄμβι\col(0)
      ἔχουσι τρομερὰν
      δύναμιν!

  - name: TX_5903
    index: 0x03
    text: |-
      \pos(2)Ἡ \col(3)Βασίλισσα Ἄμβι\col(0)
      ἀσχολεῖται! Οὐ
      δέχεται τοὺς
      κεναῖς
      χερσὶν
      ἐρχομένους!
      Φέρε αὐτῇ
      σπάνιον
      δῶρον ἐὰν θέλῃς
      ἰδεῖν αὐτήν.

  - name: TX_5904
    index: 0x04
    text: |-
      Οὐ κακῶς, παῖ!
      Εὗρες αὐτά!
      Ἐλθὲ νῦν μετ'
      ἐμοῦ
      πρὸς τὴν
      \col(3)Βασίλισσαν
      Ἄμβι\col(0)!

  - name: TX_5905
    index: 0x05
    text: |-
      \pos(0)\col(3)Βασίλισσα Ἄμβι\col(0)!
      Λέγει ὅτι θέλει
      προσενεγκεῖν
      δῶρον!
      Φέρει τὰ
      \col(1)Σπέρματα
      Μυστηρίου\col(0) ἃ ἡ
      Μεγαλειότης
      ζητεῖ!

  - name: TX_5906
    index: 0x06
    text: |-
      \pos(0)Ὁδηγήσω σε.

  - name: TX_5907
    index: 0x07
    text: |-
      \pos(0)Ναί,
      Μεγαλειοτάτη!

  - name: TX_5908
    index: 0x08
    text: |-
      \pos(2)Εὖγε, παῖ! Ἡ
      \col(3)Ἄμβι\col(0)
      ἐχάρη σφόδρα!
      Δύνασαι
      ἀπελθεῖν!

  - name: TX_5909
    index: 0x09
    text: |-
      \pos(2)Μὴ χρονοτρίβει
      ὧδε
      πολύ, παῖ!!!

  - name: TX_590a
    index: 0x0a
    text: |-
      Σύ! Οὐκ ἔξεστιν
      εἰσελθεῖν ἄνευ
      ἀδείας!

  - name: TX_590b
    index: 0x0b
    text: |-
      Ταῦτά ἐστι τὰ
      \col(1)Σπέρματα
      Μυστηρίου\col(0)
      ἃ ἡ \col(3)Βασίλισσα
      Ἄμβι\col(0)
      ἀπαιτεῖ! Εὖγε,
      παῖ!
      Ἄξω σε εἰς τὸ
      παλάτιον!

  - name: TX_590c
    index: 0x0c
    text: |-
      \pos(0)Ἴωμεν, παῖ!

  - name: TX_590d
    index: 0x0d
    text: |-
      Δεῖ ἡμᾶς τελέσαι
      τὸν πύργον διὰ
      τὴν
      \col(3)Ἄμβι\col(0) ὅτι
      τάχιστα!

  - name: TX_590e
    index: 0x0e
    text: |-
      Οἱ ὀκνηροὶ οὐκ
      ἀπαλλάξονται
      ῥᾳδίως!

  - name: TX_590f
    index: 0x0f
    text: |-
      Τί, παῖ;!;
      Ἦλθες βοηθῆσαι
      ἡμῖν κτίσαι;

  - name: TX_5910
    index: 0x10
    text: |-
      Ἡ \col(3)Ἄμβι\col(0) ἀπῆλθε
      μόνη
      εἰς ὁδοιπορίαν
      ἀναζητήσεως.
      Ἐλπίζω
      ἐπανελθεῖν αὐτὴν
      ἀσφαλῶς...

  - name: TX_5911
    index: 0x11
    text: |-
      Δεῖ φυλάσσειν τὸ
      παλάτιον ἀσφαλὲς
      ἐνῷ ἡ \col(3)Ἄμβι\col(0) ἀπου-
      σιάζει!

  - name: TX_5912
    index: 0x12
    text: |-
      Ἡ \col(3)Ἄμβι\col(0) εἶπεν ὅτι
      πορεύεται εἰς
      ὁδοι-
      πορίαν ψυχῆς,
      ἀλλ'
      ἴσως ἀπῆλθε
      ζητῆ-
      σαι τὸν ἐραστὴν
      αὐτῆς.

  - name: TX_5913
    index: 0x13
    text: |-
      Σύ! Οἱ παῖδες
      οὐκ
      ἐπιτρέπονται...
      Κύριε \Link!
      Σύγγνωθί μοι!

  - name: TX_5914
    index: 0x14
    text: |-
      Ἔργον ἡμῶν ἐστι
      φυλάσσειν τὸ
      παλά-
      τιον τῇ ζωῇ
      ἡμῶν!

  - name: TX_5915
    index: 0x15
    text: |-
      Ὁμοιάζεις
      ἀκριβῶς
      τῷ ἀγάλματι
      ἔξω...
      Εἰπέ! Σὺ εἶ ὁ
      \Link;!;
      Οὐδέποτε ἐνόμισα
      ὅτι συναντήσω
      σε!
