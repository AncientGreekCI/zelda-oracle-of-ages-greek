      παγὶς δεινή
      ἐστι
      καλουμένη
      Ὀφθαλμὸς τῆς
      Ἀπάτης...

  - name:
    - TX_05b0
    - TX_05c0
    index:
    - 0xb0
    - 0xc0
    text: |-
      Ἐγώ εἰμι, τὸ
      \col(3)Δένδρον Μακού\col(4)!
      Ἀκούω \col(2)οὐσίαν\col(4)
      ἠχοῦσαν ἐν τῷ
      \col(3)Δυτικῷ Δρυμῷ\col(4).
      Δύνασαι ἰέναι
      ἐκεῖ;

  - name:
    - TX_05b1
    - TX_05c1
    index:
    - 0xb1
    - 0xc1
    text: |-
      \Link, εἶ
      ὑγιής; Νῦν
      οὐ δύνασαι
      εἰσελθεῖν!
      Ἡ πέτρα ἣν
      ἔθραυσας
      ἐστήριζε
      τὸ σπήλαιον.
      Κακὸν ὅτι ἡ
      \col(3)Ναϋρού\col(4) οὐ
